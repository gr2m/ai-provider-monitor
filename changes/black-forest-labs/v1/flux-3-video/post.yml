- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds POST /v1/flux-3-video to submit FLUX 3 video generation jobs. Supports modes: t2v (text-to-video), i2v (image keyframes), v2v (continue from start_video), and draft_enhance (full-quality render from prior draft_cache). Accepts JSON body discriminated by ''mode'' with options like duration, aspect_ratio, resolution (hd/fhd), generate_audio, and safety_tolerance. Returns an async job handle (id plus polling_url or webhook_url). Secured via API key.'
  paths: []
  date: '2026-08-23'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/920
