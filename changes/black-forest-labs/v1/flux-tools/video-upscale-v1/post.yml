- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds POST /v1/flux-tools/video-upscale-v1: submits an async video upscaling task (1.5–3x) for the first 20s of an MP4 (URL or base64). Output frames capped at 13.75 MP; supports precise (0) or creative (1) mode via creativity, optional prompt, safety_tolerance, and webhook callbacks.'
  paths: []
  date: '2026-08-23'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/920
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional 'user' field to identify the end user making the request.
  paths:
    - path: components/schemas/Flux3VideoUpscaleInputs/properties/user
      before: 'null'
      after: '{"anyOf":[{"maxLength":256,"minLength":1,"type":"string"},{"type":"null"}],"description":"Opaque identifier for the end user supplied by the calling platform.","title":"User"}'
  date: '2026-09-10'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1013
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Expanded safety_tolerance range (max 4 -> 7) and updated moderation rules/behavior description.
  paths:
    - path: /components/schemas/Flux3VideoUpscaleInputs/properties/safety_tolerance/maximum
      before: '4'
      after: '7'
    - path: /components/schemas/Flux3VideoUpscaleInputs/properties/safety_tolerance/description
      before: Tolerance level for harm moderation, between 0 and 4 with 0 the strictest. It bounds every harm class on the prompt, which is screened before any generation, and on the delivered frames, which are withheld when their sexual-content level exceeds what the tolerance allows. Sexual is capped at level 3 and hate at level 2 regardless of the requested tolerance.
      after: Harm moderation tolerance from 0 to 7, with 0 the strictest. The route and organization determine the approved maximum and per-category ceilings. Unapproved levels return 422 with approved levels.
  date: '2026-10-12'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1099
- change: added
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: Added regex pattern to Flux3VideoUpscaleInputs.user to disallow NUL bytes (^[^\x00]*$). Requests with NULs in user will now be rejected.
  paths:
    - path: components.schemas.Flux3VideoUpscaleInputs.properties.user.anyOf[0].pattern
      before: 'null'
      after: ^[^\x00]*$
  date: '2026-10-21'
