- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/flux-tools/erase-v1 to remove objects/regions from an image using a provided mask; supports mask dilation, output format, safety tolerance, optional seed, and webhooks; returns async polling or webhook response.
  paths: []
  date: '2026-08-23'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/920
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional 'user' field to identify the end user in Flux2EraseInputs.
  paths:
    - path: components.schemas.Flux2EraseInputs.properties.user
      before: 'null'
      after: '{"anyOf":[{"maxLength":256,"minLength":1,"type":"string"},{"type":"null"}],"description":"Opaque identifier for the end user supplied by the calling platform.","title":"User"}'
  date: '2026-09-10'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1013
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Expanded safety_tolerance range (max 5 -> 7) and updated moderation behavior description.
  paths:
    - path: components.schemas.Flux2EraseInputs.properties.safety_tolerance.maximum
      before: '5'
      after: '7'
    - path: components.schemas.Flux2EraseInputs.properties.safety_tolerance.description
      before: Tolerance level for input and output moderation. Between 0 and 5, 0 being most strict, 5 being least strict.
      after: Harm moderation tolerance from 0 to 7, with 0 the strictest. The route and organization determine the approved maximum and per-category ceilings. Unapproved levels return 422 with approved levels.
  date: '2026-10-12'
