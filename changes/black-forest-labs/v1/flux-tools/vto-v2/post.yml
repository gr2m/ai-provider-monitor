- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated endpoint description to clarify edit-instruction generation and prompt fallback behavior.
  paths:
    - path: description
      before: Submits a virtual try-on task against the v2 model. Identical request shape to /vto-v1, with reference and output resolution supported up to 4MP. Person and garment images are mapped to the underlying input image slots; prompts steer attribute transfer.
      after: Submits a virtual try-on task against the v2 model. Identical request shape to /vto-v1, with reference and output resolution supported up to 4MP. Person and garment images are mapped to the underlying input image slots. An edit instruction is generated from the person and garment images, with the supplied prompt used as a fallback.
  date: '2026-08-28'
