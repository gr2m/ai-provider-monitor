- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds an async endpoint to outpaint/extend an image by placing the input image on a width×height canvas at optional x/y offsets and generating the surrounding region with a FLUX outpainting model. Supports input_image (URL or base64), width, height, mode (high|fast), optional prompt, auto_crop, output_format, safety_tolerance; returns polling URL or uses webhook.
  paths: []
  date: '2026-08-23'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/920
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional 'user' field (string 1-256 chars or null) to identify end user.
  paths:
    - path: components.schemas.FluxOutpaintingInputs.properties.user
      before: 'null'
      after: '{"anyOf":[{"maxLength":256,"minLength":1,"type":"string"},{"type":"null"}],"description":"Opaque identifier for the end user supplied by the calling platform.","title":"User"}'
  date: '2026-09-10'
