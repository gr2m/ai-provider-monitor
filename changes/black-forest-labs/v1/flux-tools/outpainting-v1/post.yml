  doc_only: true
  note: Updated description for safety_tolerance to clarify moderation scope and 422 behavior for unapproved levels.
  paths:
    - path: $.components.schemas.FluxOutpaintingInputs.properties.safety_tolerance.description
      before: Tolerance level for input and output moderation. Between 0 and 5, 0 being most strict, 5 being least strict. If you wish to increase the safety_tolerance beyond these levels please reach out to the team.
      after: Harm moderation tolerance from 0 to 7, with 0 the strictest. The route and organization determine the approved maximum and per-category ceilings. Unapproved levels return 422 with approved levels.
