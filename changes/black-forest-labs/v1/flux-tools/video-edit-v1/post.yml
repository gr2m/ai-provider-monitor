- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated safety_tolerance description to clarify 0–7 range and approval/422 behavior.
  paths:
    - path: components/schemas/Flux3VideoVE2VNamedInputs/properties/safety_tolerance/description
      before: Tolerance level for input and output harm moderation. Between 0 and 4, with 0 the strictest. Sexual content is limited to level 3 and hate content to level 2 regardless of the requested tolerance.
      after: Harm moderation tolerance from 0 to 7, with 0 the strictest. The route and organization determine the approved maximum and per-category ceilings. Unapproved levels return 422 with approved levels.
