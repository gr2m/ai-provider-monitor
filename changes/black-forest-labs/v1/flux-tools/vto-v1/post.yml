- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Expanded safety_tolerance allowed range and updated its description.
  paths:
    - path: components/schemas/Flux2KleinTryonInputs/properties/safety_tolerance/maximum
      before: '5'
      after: '7'
    - path: components/schemas/Flux2KleinTryonInputs/properties/safety_tolerance/description
      before: Tolerance level for input and output moderation. Between 0 and 5 for public use.
      after: Harm moderation tolerance from 0 to 7, with 0 the strictest. The route and organization determine the approved maximum and per-category ceilings. Unapproved levels return 422 with approved levels.
  date: '2026-10-12'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1099
