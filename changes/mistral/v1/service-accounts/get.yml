  note: Introduces GET /v1/service-accounts to list service accounts by workspace or across the org. Supports workspace_id scoping (requires workspace_admin) or org-wide listing (requires organization_admin), includes filtering by q, optional include_deleted, sorting by creation time via order (asc/desc), and required pagination with offset and limit. Returns a ListServiceAccountsResponse with an array of ServiceAccount items.
