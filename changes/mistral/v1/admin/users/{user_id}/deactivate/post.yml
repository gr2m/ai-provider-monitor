- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds POST /v1/admin/users/{user_id}/deactivate: admin-only endpoint to deactivate a user on a verified domain, removing them from all organizations, revoking their API keys, and ending their sessions. Returns a message on success.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1159
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: 'Route description updated: deactivation no longer removes users from organizations; it now ends sessions, deletes API keys, releases seats, and retains memberships/groups/roles for reactivation.'
  paths:
    - path: description
      before: |-
        Deactivate a user whose email address is on one of the Organization's verified domains: remove them from
        every organization they belong to, which revokes their API keys, and end their sessions.
      after: |-
        Deactivate a user whose email address is on one of the Organization's verified domains: end their sessions,
        delete their API keys and release their seats. Their memberships, groups and roles are kept, so that
        `POST /users/{user_id}/reactivate` can give their access back.
  date: '2026-11-17'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1239
