  note: Introduces GET /v1/audio/sessions/{session_id} to retrieve an audio agent session by ID, returning status, created_at, participant count, optional phone call info, and the conversation transcript (user/assistant/tool turns with latency and tool call details). Responds 200 with AudioSessionResponse or 422 on validation errors.
  paths: []
  date: '2026-11-04'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1177
