    - path: components/schemas/AudioSessionResponse/properties/bridge_metadata
      before: 'null'
      after: '{"anyOf":[{"$ref":"#/components/schemas/AmazonConnectContact"},{"type":"null"}]}'
  date: '2026-11-17'
- change: added
  target: response
  breaking: false
