- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces GET /v1/audio/agents/{agent_id} to retrieve an audio agent by UUID, with optional version query (defaults to latest); returns AudioAgentResponse or 422 on validation error.
  paths: []
  date: '2026-11-04'
