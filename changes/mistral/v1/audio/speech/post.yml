- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/audio/speech to generate speech from text with optional preset/custom voice (voice_id) or zero-shot voice cloning via base64 ref_audio; returns base64 audio or streams SSE chunks; supports formats pcm, wav, mp3 (default), flac, opus.
  paths: []
  date: '2026-03-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/836
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Route description updated.
  paths:
    - path: /description
      before: Generate speech from text using a saved voice or a reference audio clip.
      after: Speech
  date: '2026-11-02'
