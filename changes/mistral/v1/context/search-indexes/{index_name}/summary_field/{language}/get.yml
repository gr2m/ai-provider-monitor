- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces GET /v1/context/search-indexes/{index_name}/summary_field/{language} to retrieve the summary field for a managed index in a specified language (en, fr, es, de, it, pt_br, pl, ar, nl). Returns content, status (handwritten|generated|generated_confirmed), and translated flag; 404 if index or language summary not found.
  paths: []
