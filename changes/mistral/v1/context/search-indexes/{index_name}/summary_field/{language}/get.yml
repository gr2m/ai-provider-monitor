- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added 503 Service Unavailable response indicating temporary unavailability; clients should retry later.
  paths:
    - path: $.responses["503"]
      before: 'null'
      after: '{"description":"Temporarily unavailable; retry later"}'
  date: '2026-11-25'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1289
