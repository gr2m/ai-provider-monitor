- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/context/search-indexes/{index_name}/grep to grep for a pattern within a single source in an index, returning unranked matching chunks in reading order; supports phrase (literal, case-insensitive, whitespace-sensitive) and term (all tokens, any order) modes. 200 may be empty if no match; 404 if the source has no chunks.
