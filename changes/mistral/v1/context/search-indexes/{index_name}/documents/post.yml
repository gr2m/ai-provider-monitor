- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/context/search-indexes/{index_name}/documents to validate and persist 1–100 documents into a managed index, returning per-document accepted/rejected results; 403 when chunk limit reached, 404 if index missing, 409 if not ready.
  paths: []
  date: '2026-11-04'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1177
- change: added
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Added 503 response for temporary unavailability; clients should handle retryable errors.
  paths:
    - path: $.responses.503
      before: 'null'
      after: '{"description":"Temporarily unavailable; retry later"}'
  date: '2026-11-25'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated 403 description to also indicate permission denial.
  paths:
    - path: $.responses.403.description
      before: Index has reached its chunk limit
      after: Index has reached its chunk limit, or permission denied
  date: '2026-11-25'
