  note: 'New endpoint POST /v1/context/search-indexes reserves a managed search index and starts asynchronous backing-table provisioning. Returns 202 Accepted with a ManagedIndexResponse and a Location header pointing to the managed-index status resource to poll until the status is ready or failed. Errors: 403 when org index limit reached, 409 on duplicate name, 422 for validation errors.'
