- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds GET /v1/connectors/{connector_id_or_name}/user/credentials to list user-level credentials for a connector, with optional auth_type filter and fetch_default flag; returns AuthenticationConfiguration entries and preset auth types.
  paths: []
  date: '2026-08-23'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/921
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Path parameter connector_id_or_name schema broadened to accept UUID format in addition to string.
  paths:
    - path: parameters[name=connector_id_or_name].schema
      before: '{"title":"Connector Id Or Name","type":"string"}'
      after: '{"anyOf":[{"format":"uuid","type":"string"},{"type":"string"}],"title":"Connector Id Or Name"}'
  date: '2026-11-02'
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Query param auth_type now references AuthenticationType; allowed values expanded (added github_app, slack_app).
  paths:
    - path: parameters[name=auth_type].schema.anyOf[0].$ref
      before: '"#/components/schemas/OutboundAuthenticationType"'
      after: '"#/components/schemas/AuthenticationType"'
    - path: components.schemas.AuthenticationType.enum
      before: 'null'
      after: '["oauth2","bearer","none","github_app","slack_app"]'
  date: '2026-11-02'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: authentication_type enum in response objects expanded (may return github_app, slack_app).
  paths:
    - path: components.schemas.AuthenticationConfiguration.properties.authentication_type.$ref
      before: '"#/components/schemas/OutboundAuthenticationType"'
      after: '"#/components/schemas/AuthenticationType"'
    - path: components.schemas.CredentialsResponse.properties.connector_preset_credentials_for_auth.items.$ref
      before: '"#/components/schemas/OutboundAuthenticationType"'
      after: '"#/components/schemas/AuthenticationType"'
  date: '2026-11-02'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: connector_preset_credentials_for_auth is now marked deprecated.
  paths:
    - path: components.schemas.CredentialsResponse.properties.connector_preset_credentials_for_auth.deprecated
      before: 'null'
      after: 'true'
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'New fields added to AuthenticationConfiguration: creator_id, scope, status, title.'
  paths:
    - path: components.schemas.AuthenticationConfiguration.properties.creator_id
      before: 'null'
      after: '{"anyOf":[{"format":"uuid","type":"string"},{"type":"null"}],"title":"Creator Id"}'
    - path: components.schemas.AuthenticationConfiguration.properties.scope
      before: 'null'
      after: '{"$ref":"#/components/schemas/ConsumerType"}'
    - path: components.schemas.AuthenticationConfiguration.properties.status
      before: 'null'
      after: '{"anyOf":[{"$ref":"#/components/schemas/CredentialsStatus"},{"type":"null"}]}'
    - path: components.schemas.AuthenticationConfiguration.properties.title
      before: 'null'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Title"}'
  date: '2026-11-02'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: AuthenticationConfiguration required fields updated to include scope (now always present in responses).
  paths:
    - path: components.schemas.AuthenticationConfiguration.required
      before: '["name","authentication_type"]'
      after: '["name","authentication_type","scope"]'
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'New component schemas introduced for response typing: ConsumerType, CredentialsStatus, HTTPStatus, CredentialsStatusErrorReason, AuthStatus.'
  paths:
    - path: components.schemas.ConsumerType
      before: 'null'
      after: '{"enum":["user","org","workspace","system"],"title":"ConsumerType","type":"string"}'
    - path: components.schemas.CredentialsStatus
      before: 'null'
      after: '{"properties":{"error_http_code":{"anyOf":[{"$ref":"#/components/schemas/HTTPStatus"},{"type":"null"}]},"error_message":{"anyOf":[{"$ref":"#/components/schemas/CredentialsStatusErrorReason"},{"type":"null"}]},"last_checked_at":{"anyOf":[{"format":"date-time","type":"string"},{"type":"null"}],"title":"Last Checked At"},"status_type":{"$ref":"#/components/schemas/AuthStatus"}},"required":["status_type"],"title":"CredentialsStatus","type":"object"}'
    - path: components.schemas.HTTPStatus
      before: 'null'
      after: '{"description":"HTTP status codes and reason phrases\n\nStatus codes from the following RFCs are all observed:\n\n    * RFC 7231: Hypertext Transfer Protocol (HTTP/1.1), obsoletes 2616\n    * RFC 6585: Additional HTTP Status Codes\n    * RFC 3229: Delta encoding in HTTP\n    * RFC 4918: HTTP Extensions for WebDAV, obsoletes 2518\n    * RFC 5842: Binding Extensions to WebDAV\n    * RFC 7238: Permanent Redirect\n    * RFC 2295: Transparent Content Negotiation in HTTP\n    * RFC 2774: An HTTP Extension Framework\n    * RFC 7725: An HTTP Status Code to Report Legal Obstacles\n    * RFC 7540: Hypertext Transfer Protocol Version 2 (HTTP/2)\n    * RFC 2324: Hyper Text Coffee Pot Control Protocol (HTCPCP/1.0)\n    * RFC 8297: An HTTP Status Code for Indicating Hints\n    * RFC 8470: Using Early Data in HTTP","enum":[100,101,102,103,200,201,202,203,204,205,206,207,208,226,300,301,302,303,304,305,307,308,400,401,402,403,404,405,406,407,408,409,410,411,412,413,414,415,416,417,418,421,422,423,424,425,426,428,429,431,451,500,501,502,503,504,505,506,507,508,510,511],"title":"HTTPStatus","type":"integer"}'
    - path: components.schemas.CredentialsStatusErrorReason
      before: 'null'
      after: '{"enum":["oauth expired","oauth near expiry","empty credentials","blank bearer token","unparsable credentials","you need to reconnect","oauth refresh error","MCP server unreachable","MCP server timed out","MCP server error","unknown error"],"title":"CredentialsStatusErrorReason","type":"string"}'
    - path: components.schemas.AuthStatus
      before: 'null'
      after: '{"enum":["valid","invalid","error"],"title":"AuthStatus","type":"string"}'
  date: '2026-11-02'
- change: removed
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Component schema OutboundAuthenticationType removed and replaced by AuthenticationType.
  paths:
    - path: components.schemas.OutboundAuthenticationType
      before: '{"enum":["oauth2","bearer","none"],"title":"OutboundAuthenticationType","type":"string"}'
      after: 'null'
  date: '2026-11-02'
