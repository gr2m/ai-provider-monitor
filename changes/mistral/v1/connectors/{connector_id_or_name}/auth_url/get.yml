- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added optional query parameter method_type to choose the interactive auth method (default: oauth2).'
  paths:
    - path: parameters[?name=method_type]
      before: 'null'
      after: '{"description":"Auth method type to use for the authorization URL. Required when the connector supports multiple interactive auth methods; otherwise the sole method is selected automatically. Use this to pick a specific method (e.g. ''oauth2'' vs ''github_app'').","in":"query","name":"method_type","required":false,"schema":{"$ref":"#/components/schemas/AuthenticationType","default":"oauth2","description":"Auth method type to use for the authorization URL. Required when the connector supports multiple interactive auth methods; otherwise the sole method is selected automatically. Use this to pick a specific method (e.g. ''oauth2'' vs ''github_app'')."}}'
  date: '2026-11-02'
