- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: Request body replaced with a discriminator-based oneOf supporting MCP and HTTP connectors selected by the 'protocol' field.
  paths:
    - path: requestBody.content.application/json.schema.$ref
      before: '#/components/schemas/ConnectorMCPCreate'
      after: 'null'
    - path: requestBody.content.application/json.schema.discriminator.propertyName
      before: 'null'
      after: protocol
    - path: requestBody.content.application/json.schema.discriminator.mapping.mcp
      before: 'null'
      after: '#/components/schemas/CreateConnectorRequest'
    - path: requestBody.content.application/json.schema.discriminator.mapping.http
      before: 'null'
      after: '#/components/schemas/CreateHTTPConnectorRequest'
    - path: requestBody.content.application/json.schema.oneOf[0].$ref
      before: 'null'
      after: '#/components/schemas/CreateConnectorRequest'
    - path: requestBody.content.application/json.schema.oneOf[1].$ref
      before: 'null'
      after: '#/components/schemas/CreateHTTPConnectorRequest'
  date: '2026-11-02'
