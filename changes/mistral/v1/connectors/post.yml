  paths:
    - path: components/schemas/CreateConnectorRequest/properties/title
      before: 'null'
      after: present (string, optional)
    - path: components/schemas/CreateConnectorRequest/properties/protocol/const
      before: 'null'
      after: mcp
    - path: components/schemas/CreateHTTPConnectorRequest/properties/title
      before: 'null'
      after: present (string, optional)
    - path: components/schemas/CreateHTTPConnectorRequest/properties/protocol/const
      before: 'null'
      after: http
    - path: components/schemas/CreateHTTPConnectorRequest/required
      before: '[name, description, server]'
      after: '[name, description, server, protocol]'
  date: '2026-11-02'
