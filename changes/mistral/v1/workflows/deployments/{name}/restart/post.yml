    - path: components/schemas/DeploymentMistralCloudBackendSpec/properties/secrets/description
      before: 'Secrets to bind to the worker, as ''secret:workspace:<NAME>'' references. Each is available during build and run: as a Dockerfile build arg (declare a matching ''ARG'') and as an env var. On update, the field carries the complete set: send the full list to rebind, an empty list to unbind all, omit it to leave the bindings unchanged.'
