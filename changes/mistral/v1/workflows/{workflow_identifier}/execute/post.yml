- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added request properties for tracing and plugin data: extensions, force_new_trace, traceparent.'
  paths:
    - path: components.schemas.WorkflowExecutionRequest.properties.extensions
      before: 'null'
      after: '{"anyOf":[{"type":"object","additionalProperties":true},{"type":"null"}],"description":"Plugin-specific data to propagate into WorkflowContext.extensions at execution time.","title":"Extensions"}'
