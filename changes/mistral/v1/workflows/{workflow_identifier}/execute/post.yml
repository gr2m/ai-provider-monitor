      before: 'null'
      after: '{"type":"boolean","default":false,"description":"If true, ignore the caller''s trace context and start a new, independent trace for this execution instead of joining the caller''s trace.","title":"Force New Trace"}'
    - path: components.schemas.WorkflowExecutionRequest.properties.traceparent
      before: 'null'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"W3C trace context to join this execution to the caller''s trace. Ignored when force_new_trace is set.","title":"Traceparent"}'
  date: '2026-11-02'
