- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /v1/workflows/{workflow_identifier}/execute to run a workflow with optional synchronous result; accepts input or encoded payload, optional deployment_name, custom execution_id, and returns either execution details or the direct result depending on wait_for_result.
