- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /v1/responses to generate model responses from text or image inputs, with support for reasoning, function tool calls (client-executed), multi-turn history via input, and optional SSE streaming (stream=true).
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1159
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Description updated to mention file inputs in addition to text and image.
  paths:
    - path: description
      before: |-
        Create a response.

        Generate a model response from text or image inputs. The response can
        include text, reasoning, and function calls. Set stream to true to
        receive Server-Sent Events.

        For multi-turn conversations, send the full history in input, including
        prior output items and function results. Responses are not stored. Only
        client-executed function tools are supported.
      after: |-
        Create a response.

        Generate a model response from text, image, or file inputs. The response can
        include text, reasoning, and function calls. Set stream to true to
        receive Server-Sent Events.

        For multi-turn conversations, send the full history in input, including
        prior output items and function results. Responses are not stored. Only
        client-executed function tools are supported.
  date: '2026-11-17'
