  note: 'New POST /v1/observability/spans/evaluations/aggregate endpoint to compute aggregated metrics over span evaluations with optional time range (from/to). Accepts AggregationRequest (required metric with aggregation: count, count_distinct, sum, avg, min, max, p50, p90, p95, p99; optional dimensions, order_by, limit, search_expression, time_dimension with granularity). Returns Aggregation (rows + meta with time bounds/granularity). Errors: 400, 404, 408, 409, 422 with ObservabilityError.'
