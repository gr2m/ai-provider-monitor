- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added creator_type to EvaluationRunV2Response to indicate the principal type that created the run.
  paths:
    - path: components/schemas/EvaluationRunV2Response/properties/creator_type
      before: 'null'
      after: '{"$ref":"#/components/schemas/PrincipalType","default":"user"}'
  date: '2026-11-17'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added failed_record_count to EvaluationRunV2Response for counting records with failed tasks or scores.
  paths:
    - path: components/schemas/EvaluationRunV2Response/properties/failed_record_count
      before: 'null'
      after: '{"anyOf":[{"type":"integer"},{"type":"null"}],"description":"Records whose task or at least one score failed, out of `record_count`. Failed tasks and scores are left out of `statistics`, `goal_results` and `passed`. Null for runs created before this counter existed.","title":"Failed Record Count"}'
  date: '2026-11-17'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added record_count to EvaluationRunV2Response for counting uploaded records (failed or not).
  paths:
    - path: components/schemas/EvaluationRunV2Response/properties/record_count
      before: 'null'
      after: '{"anyOf":[{"type":"integer"},{"type":"null"}],"description":"Records whose results were uploaded so far, failed or not. Null for runs created before this counter existed.","title":"Record Count"}'
  date: '2026-11-17'
- change: added
