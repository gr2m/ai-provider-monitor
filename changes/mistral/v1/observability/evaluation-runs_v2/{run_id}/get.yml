- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds GET /v1/observability/evaluation-runs_v2/{run_id} to retrieve a specific evaluation run (v2) by UUID. Returns EvaluationRunV2Response (run details, evaluators, scores, statistics, status, system/optimization refs). Error responses (400, 404, 408, 409, 422) return ObservabilityError.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1159
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: SystemV2 now includes optional 'kind' (default 'custom') in the response 'system' object.
  paths:
    - path: components/schemas/SystemV2/properties/kind
      before: 'null'
      after: '{"default":"custom","title":"Kind","type":"string"}'
  date: '2026-11-04'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1177
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: SystemV2 now includes optional 'spec' object in the response 'system' object.
  paths:
    - path: components/schemas/SystemV2/properties/spec
      before: 'null'
      after: '{"anyOf":[{"type":"object","additionalProperties":{"$ref":"#/components/schemas/JsonValue"}},{"type":"null"}],"title":"Spec"}'
  date: '2026-11-04'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1177
- change: added
  target: response
  breaking: true
  deprecated: false
  doc_only: false
