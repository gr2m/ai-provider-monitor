- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/observability/judges/{judge_id}/live-judging to run a saved judge on a provided conversation. Path param judge_id (UUID). Request body requires messages[] with optional properties; returns JudgeOutput with analysis and answer on success, or ObservabilityError on 400/404/408/409/422.
  paths: []
  date: '2026-03-30'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/845
