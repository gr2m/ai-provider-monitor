- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /v1/observability/traces/search under beta.observability.traces to search traces over an optional time window (from, to) using an optional search_expression in the JSON body (TracesRequest). Supports pagination via page_size and cursor and returns paginated results (GetTraces with cursor/next and GetTrace items). Error responses include 400, 404, 408, 409, and 422.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1159
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Added documentation/description for TracesRequest.search_expression explaining filter semantics.
  paths:
    - path: components/schemas/TracesRequest/properties/search_expression/description
      before: 'null'
      after: 'Filter expression. Trace fields (e.g. `service_name`, `error_count`, `models_used`) are evaluated on the aggregated trace. Span attribute fields (e.g. `temporalWorkflowID`, `wf.type`, `gen_ai.provider.name`) are evaluated on the spans of the trace: a trace matches when one of its spans matches. Span attribute conditions combined with AND must hold on the same span, e.g. `temporalWorkflowID = ''wf-1'' AND wf.type = ''activity''` only matches traces with a span carrying both attributes. Results are always one row per trace.'
  date: '2026-11-04'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: New optional response field GetTrace.service_account_id (string) added.
  paths:
    - path: components/schemas/GetTrace/properties/service_account_id
      before: 'null'
      after: '{"default":"","title":"Service Account Id","type":"string"}'
  date: '2026-11-04'
