- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds GET /v1/observability/traces/{trace_id}/spans to fetch paginated spans for a given trace_id, with optional from/to time filters, page_size (max 100), and cursor-based pagination. Returns a GetSpans object with results/cursor/next or an ObservabilityError on failure.
