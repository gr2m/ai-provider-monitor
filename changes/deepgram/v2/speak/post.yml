- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v2/speak to synthesize a full block of text into a single audio output using Flux TTS batch; supports synchronous binary audio response or asynchronous delivery via callback with request_id, with options for model, encoding/container, sample_rate, bit_rate, speed, expressivity, tags, and MIP opt-out.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/926
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: Query parameter 'speed' changed from string enum to numeric with range 0.5–1.5 (step 0.05); schema inlined instead of $ref.
  paths:
    - path: parameters[name=speed].description
      before: Speaking rate multiplier that adjusts the pace of generated speech while preserving natural prosody and voice quality. Accepted values run `0.85` to `1.15` in `0.05` increments. Not yet supported in all languages.
      after: Speaking rate multiplier that adjusts the pace of generated speech while preserving natural prosody and voice quality. Accepted values run `0.5` to `1.5` in `0.05` increments. Not yet supported in all languages.
    - path: parameters[name=speed].schema.$ref
      before: '#/components/schemas/V2SpeakPostParametersSpeed'
      after: 'null'
    - path: parameters[name=speed].schema.type
      before: string
      after: number
    - path: parameters[name=speed].schema.format
      before: 'null'
      after: double
    - path: parameters[name=speed].schema.minimum
      before: 'null'
      after: '0.5'
    - path: parameters[name=speed].schema.maximum
      before: 'null'
      after: '1.5'
    - path: parameters[name=speed].schema.multipleOf
      before: 'null'
      after: '0.05'
    - path: parameters[name=speed].schema.enum
      before: '["0.85","0.9","0.95","1","1.05","1.1","1.15"]'
      after: 'null'
  date: '2026-09-02'
- change: removed
