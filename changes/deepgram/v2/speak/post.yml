  note: Updated speed parameter description to document new interaction rules with inline pause/pronunciation controls (cap at 1.15 with pause; no non-1.0 speed with pronunciation).
  paths:
    - path: parameters/10/description
      before: Speaking rate multiplier that adjusts the pace of generated speech while preserving natural prosody and voice quality. Accepted values run `0.5` to `1.5` in `0.05` increments. Not yet supported in all languages.
      after: Speaking rate multiplier that adjusts the pace of generated speech while preserving natural prosody and voice quality. Accepted values run `0.5` to `1.5` in `0.05` increments. Not yet supported in all languages. When the text contains an inline pause marker, speed is capped at `1.15` (`PAUSE_SPEED_CAP_EXCEEDED` above that). A value other than `1.0` cannot be combined with inline pronunciation controls (`CONTROL_COMBINATION_INVALID`).
  date: '2026-09-30'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1071
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Request body text description now allows inline pause and pronunciation controls with specified limits and combination rules.
  paths:
    - path: components/schemas/SpeakV2Request/properties/text/description
      before: The text content to be converted to speech. The server normalizes and preprocesses the text before synthesis. Inline pause and pronunciation controls are not yet applied; they are stripped from the text before synthesis.
      after: 'The text content to be converted to speech. The server normalizes and preprocesses the text before synthesis. May contain inline pause controls (`\{pause:500ms\}`, 500-3000 ms in 100 ms steps, at most 8 per request) and inline pronunciation controls (`\{"word": "...", "pronounce": "<IPA>"\}`, Early Access). Pronunciation cannot be combined with pause or with a `speed` other than `1.0`, and `speed` is capped at `1.15` when a pause is present. See [Speed, Pause, Pronunciation](/docs/tts-voice-controls).'
  date: '2026-09-30'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1071
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: true
  note: '400 error description updated: inline control violations now return structured errors with specific `err_code`s instead of being silently stripped. This introduces validation that can cause requests that previously succeeded to fail.'
  paths:
    - path: responses/400/description
      before: Invalid Request. Inline pause and pronunciation controls are not applied and are stripped rather than rejected.
      after: 'Invalid Request. Inline control violations return a structured error whose `err_code` names the rule: `CONTROL_COMBINATION_INVALID` (pronunciation combined with speed or pause, or all three together), `PAUSE_SPEED_CAP_EXCEEDED` (a pause marker with `speed` above `1.15`), `BREAK_OUT_OF_RANGE` (a pause outside 500-3000 ms), `BREAK_INCREMENT_INVALID` (a pause off the 100 ms grid), `BREAKS_LIMIT_EXCEEDED` (more than 8 pause markers, or two pauses with no text between them), `BREAK_SYNTAX_INVALID` (a malformed pause marker, such as a simple marker without backslashes or an escaped structured marker), plus the existing pronunciation and speed codes. A `speed` of `1.0` does not count as a speed control for the combination rules. See [Speed, Pause, Pronunciation](/docs/tts-voice-controls).'
  date: '2026-09-30'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1071
