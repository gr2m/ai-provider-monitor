- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds GET /assets/{asset_id}/lineage to retrieve an asset’s derivation lineage graph, including inputs, generation requests, and referenced entities, traversed recursively up to a depth limit (default/max 5). Deleted/expired ancestors appear as tombstones; uncaptured inputs appear as external inputs.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/925
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Expanded enum for smart entity_type on edges.entities to include prop, environment, style, scene
  paths:
    - path: responses/200/content/application/json/schema/properties/lineage/properties/edges/items/properties/entities/items/properties/entity_type/enum
      before: '["character"]'
      after: '["character","prop","environment","style","scene"]'
  date: '2026-09-01'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Expanded enum for smart entity_type on entity nodes to include prop, environment, style, scene
  paths:
    - path: responses/200/content/application/json/schema/properties/lineage/properties/nodes/items/oneOf/3/properties/entity_type/enum
      before: '["character"]'
      after: '["character","prop","environment","style","scene"]'
  date: '2026-09-01'
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Route description updated from 'referenced characters' to 'referenced smart entities'
  paths:
    - path: description
      before: 'Get the derivation lineage of an asset by asset ID: the inputs it was generated from, the generation requests along the way, and any referenced characters, traversed recursively up to `depth` levels. Deleted or expired ancestors stay in the graph flagged as tombstones; inputs that were never captured appear as external inputs.'
      after: 'Get the derivation lineage of an asset by asset ID: the inputs it was generated from, the generation requests along the way, and any referenced smart entities, traversed recursively up to `depth` levels. Deleted or expired ancestors stay in the graph flagged as tombstones; inputs that were never captured appear as external inputs.'
  date: '2026-09-01'
