- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New enterprise-only admin endpoint GET /organization/billing-events that returns paginated, organization-wide Model API billing event records across all teams with per-request USD cost breakdown. Supports filtering by team_username, endpoint_id, api_key_id, request_id, and date range (up to 90 days), cursor-based pagination (limit up to 100), and optional auth_method/auth_method_structured expansions. Requires an admin API key on the organization’s root team.
