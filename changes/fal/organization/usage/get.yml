- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds organization-wide usage endpoint (GET /organization/usage). Returns paginated time series and/or summary usage across all teams and products (model_apis, serverless, compute) with per-team and per-product attribution; filterable by team, product, endpoint, API key, date range, and auth method. Requires admin API key on the org root team; enterprise-only.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/925
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added cost breakdown fields (cost_subtotal, cost_discount, cost_total) and percent_discount to time_series results and summary items.
  paths:
    - path: responses.200.content.application/json.schema.properties.summary.items.properties.cost_subtotal
      before: 'null'
      after: '{"description":"Cost before discounts (quantity × unit_price)","example":0.4,"minimum":0,"type":"number"}'
    - path: responses.200.content.application/json.schema.properties.summary.items.properties.cost_discount
      before: 'null'
      after: '{"description":"Discount applied to this line item (cost_subtotal − cost_total)","example":0.08,"minimum":0,"type":"number"}'
    - path: responses.200.content.application/json.schema.properties.summary.items.properties.cost_total
      before: 'null'
      after: '{"description":"Amount charged after discounts (cost_subtotal − cost_discount)","example":0.32,"minimum":0,"type":"number"}'
    - path: responses.200.content.application/json.schema.properties.summary.items.properties.percent_discount
      before: 'null'
      after: '{"description":"Percentage discount applied to this line item (e.g., 20 = 20% discount). Null when no percentage discount applies.","example":20,"maximum":100,"minimum":0,"type":["number","null"]}'
    - path: responses.200.content.application/json.schema.properties.time_series.items.properties.results.items.properties.cost_subtotal
      before: 'null'
      after: '{"description":"Cost before discounts (quantity × unit_price)","example":0.4,"minimum":0,"type":"number"}'
    - path: responses.200.content.application/json.schema.properties.time_series.items.properties.results.items.properties.cost_discount
      before: 'null'
      after: '{"description":"Discount applied to this line item (cost_subtotal − cost_total)","example":0.08,"minimum":0,"type":"number"}'
    - path: responses.200.content.application/json.schema.properties.time_series.items.properties.results.items.properties.cost_total
      before: 'null'
      after: '{"description":"Amount charged after discounts (cost_subtotal − cost_discount)","example":0.32,"minimum":0,"type":"number"}'
    - path: responses.200.content.application/json.schema.properties.time_series.items.properties.results.items.properties.percent_discount
      before: 'null'
      after: '{"description":"Percentage discount applied to this line item (e.g., 20 = 20% discount). Null when no percentage discount applies.","example":20,"maximum":100,"minimum":0,"type":["number","null"]}'
  date: '2026-09-15'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Marked 'cost' as deprecated in summary items and time_series results; use cost_total instead. Description updated accordingly.
  paths:
    - path: responses.200.content.application/json.schema.properties.summary.items.properties.cost.deprecated
      before: 'null'
      after: 'true'
    - path: responses.200.content.application/json.schema.properties.summary.items.properties.cost.description
      before: Computed cost (quantity × unit_price)
      after: 'Deprecated: use cost_total. Same value as cost_total.'
    - path: responses.200.content.application/json.schema.properties.time_series.items.properties.results.items.properties.cost.deprecated
      before: 'null'
      after: 'true'
    - path: responses.200.content.application/json.schema.properties.time_series.items.properties.results.items.properties.cost.description
      before: Computed cost (quantity × unit_price)
      after: 'Deprecated: use cost_total. Same value as cost_total.'
  date: '2026-09-15'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Required properties expanded to include percent_discount, cost_subtotal, cost_discount, and cost_total for both summary items and time_series results.
  paths:
    - path: responses.200.content.application/json.schema.properties.summary.items.required
      before: '["username","product","endpoint_id","unit","quantity","unit_price","cost","currency"]'
      after: '["username","product","endpoint_id","unit","quantity","unit_price","percent_discount","cost_subtotal","cost_discount","cost_total","cost","currency"]'
    - path: responses.200.content.application/json.schema.properties.time_series.items.properties.results.items.required
      before: '["username","product","endpoint_id","unit","quantity","unit_price","cost","currency"]'
      after: '["username","product","endpoint_id","unit","quantity","unit_price","percent_discount","cost_subtotal","cost_discount","cost_total","cost","currency"]'
  date: '2026-09-15'
