- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Route description updated to generalize key usage and document required permissions (`account:users:read`) and presets (`BILLING`, `FULL`).
  paths:
    - path: description
      before: |-

        Returns the list of teams in your organization with their details.

        > **Availability:** This endpoint is available to enterprise customers with organizations enabled. Contact your account team or support@fal.ai to request access.

        Must be called with an admin API key on the organization's root team.

        **Key Features:**
        - List all teams within the organization
        - Identify the organization's root team via `is_org_root`
        - View team usernames and display names

        See [fal.ai docs](https://fal.ai/docs/documentation) for more details.
            
      after: |-

        Returns the list of teams in your organization with their details.

        > **Availability:** This endpoint is available to enterprise customers with organizations enabled. Contact your account team or support@fal.ai to request access.

        Must be called with a key on the organization's root team.

        **Key Features:**
        - List all teams within the organization
        - Identify the organization's root team via `is_org_root`
        - View team usernames and display names

        See [fal.ai docs](https://fal.ai/docs/documentation) for more details.
            

        **Required permissions:** `account:users:read`. Key presets that include them: `BILLING`, `FULL`. See [key permissions](https://fal.ai/docs/documentation/model-apis/authentication/key-based#permissions).
  date: '2026-10-09'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1095
