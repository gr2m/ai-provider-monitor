- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Description updated to document required permission account:settings:read and allowed key presets.
  paths:
    - path: description
      before: |-

        Returns the current model access controls for your organization as a CSV download.

        > **Availability:** This endpoint is available to enterprise customers with model access controls enabled. Contact your account team or support@fal.ai to request access.

        The report includes each model's endpoint ID, title, category, enterprise readiness status, and the resolved UI and API access state (ALLOWED or BLOCKED).
            
      after: |-

        Returns the current model access controls for your organization as a CSV download.

        > **Availability:** This endpoint is available to enterprise customers with model access controls enabled. Contact your account team or support@fal.ai to request access.

        The report includes each model's endpoint ID, title, category, enterprise readiness status, and the resolved UI and API access state (ALLOWED or BLOCKED).
            

        **Required permissions:** `account:settings:read`. Key presets that include them: `API`, `SERVERLESS`, `DEPLOY`, `COMPUTE`, `BILLING`, `READONLY`, `FULL`. See [key permissions](https://fal.ai/docs/documentation/model-apis/authentication/key-based#permissions).
  date: '2026-10-09'
