- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated route description to list three data sources and revised 'tagged-estimate' behavior/details.
  paths:
    - path: $.description
      before: |-

        Returns a FOCUS compliant billing report as a CSV download.

        > **Availability:** This endpoint is available to enterprise customers with FOCUS reports enabled. Contact your account team or support@fal.ai to request access.

        Supports two data sources:
        - **invoice**: Finalized invoice data for a billing month. Includes usage charges, credits, and taxes.
        - **estimate**: Real-time usage estimates for a date range. Pre-invoice data that may change once invoiced.

        The report follows the [FinOps FOCUS specification](https://focus.finops.org/) for cloud billing data interoperability.

        **Invoice reports** default to the most recently available billing month.
        **Usage estimates** default to the last 24 hours, with a maximum 90-day date range.

        **Organization roots** may pass `expand=organization` to report the whole
        organization — each team as a `BillingAccount`, plus per-team `SubAccount`
        attribution under shared (pooled) billing. Without it, the report is
        single-account, and the estimate covers only the calling account. Note: under
        pooled billing the **invoice** source already spans all pooled teams even
        without `expand` (they share one billing customer); `expand=organization` adds the
        per-team `SubAccount` breakdown.
            
      after: |-

        Returns a FOCUS compliant billing report as a CSV download.

        > **Availability:** This endpoint is available to enterprise customers with FOCUS reports enabled. Contact your account team or support@fal.ai to request access.

        Supports three data sources:
        - **invoice**: Finalized invoice data for a billing month. Includes usage charges, credits, and taxes.
        - **estimate**: Real-time usage estimates for a date range. Pre-invoice data that may change once invoiced.
        - **tagged-estimate**: Those same estimates with the `Tags` column populated from the `X-Fal-Tags` tags set on your requests. Requires tagged reporting to be enabled for the account; recent usage is delayed relative to `estimate`.

        The report follows the [FinOps FOCUS specification](https://focus.finops.org/) for cloud billing data interoperability.

        **Invoice reports** default to the most recently available billing month.
        **Usage estimates** default to the last 24 hours, with a maximum 90-day date range.

        **Organization roots** may pass `expand=organization` to report the whole
        organization — each team as a `BillingAccount`, plus per-team `SubAccount`
        attribution under shared (pooled) billing. Without it, the report is
        single-account, and the estimate covers only the calling account. Note: under
        pooled billing the **invoice** source already spans all pooled teams even
        without `expand` (they share one billing customer); `expand=organization` adds the
        per-team `SubAccount` breakdown.
            
  date: '2026-09-03'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/991
