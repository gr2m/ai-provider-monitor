      before: 'null'
      after: '{"description":"Access denied","content":{"application/json":{"schema":{"description":"Standard error response format","type":"object","required":["error"],"properties":{"error":{"description":"Error details","type":"object","required":["type","message"],"properties":{"docs_url":{"description":"Link to relevant documentation","format":"uri","type":"string"},"message":{"description":"Human-readable error message","type":"string"},"request_id":{"description":"Unique request identifier for debugging","type":"string"},"type":{"description":"The category of error that occurred","type":"string","enum":["authorization_error","validation_error","not_found","rate_limited","server_error","not_implemented"]}}}}},"example":{"error":{"type":"authorization_error","message":"Access denied"}}}}'
