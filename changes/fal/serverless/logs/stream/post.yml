- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified that the 'end' query parameter is exclusive; updated description and example.
  paths:
    - path: parameters[1].description
      before: End date in ISO8601 format (e.g., '2025-01-31T23:59:59Z' or '2025-01-31'). Defaults to current time.
      after: End date in ISO8601 format, exclusive (e.g., '2025-02-01T00:00:00Z' or '2025-02-01'). Data up to but not including this timestamp is returned. Defaults to current time.
    - path: parameters[1].schema.description
      before: End date in ISO8601 format (e.g., '2025-01-31T23:59:59Z' or '2025-01-31'). Defaults to current time.
      after: End date in ISO8601 format, exclusive (e.g., '2025-02-01T00:00:00Z' or '2025-02-01'). Data up to but not including this timestamp is returned. Defaults to current time.
    - path: parameters[1].schema.example
      before: '2025-01-31T23:59:59Z'
      after: '2025-02-01T00:00:00Z'
  date: '2026-03-16'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/787
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: Query parameter 'app_id' updated to support '<owner>/<name>' format and accept either a single string (including comma-separated values) or an array; serialization details now explicitly specified (style=form, explode=true). This type change may affect generated clients.
  paths:
    - path: parameters[2]/description
      before: Filter by app IDs
      after: 'Filter by specific app ID(s) in ''<owner>/<name>'' format (e.g. ''fal-ai/my-app''). Accepts 1-50 app IDs. Supports comma-separated values: ?app_id=fal-ai/foo,fal-ai/bar or array syntax: ?app_id=fal-ai/foo&app_id=fal-ai/bar'
    - path: parameters[2]/schema/type
      before: array
      after: 'null'
    - path: parameters[2]/schema/anyOf
      before: 'null'
      after: '[{"type":"string"},{"type":"array","items":{"type":"string"}}]'
    - path: parameters[2]/schema/example
      before: '["my-app"]'
      after: '["fal-ai/my-app"]'
    - path: parameters[2]/explode
      before: 'null'
      after: 'true'
    - path: parameters[2]/style
      before: 'null'
      after: form
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/925
