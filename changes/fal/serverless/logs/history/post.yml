- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: '''end'' query parameter description updated to clarify it is exclusive (data returned is before this timestamp).'
  paths:
    - path: $.parameters[3].description
      before: End date in ISO8601 format (e.g., '2025-01-31T23:59:59Z' or '2025-01-31'). Defaults to current time.
      after: End date in ISO8601 format, exclusive (e.g., '2025-02-01T00:00:00Z' or '2025-02-01'). Data up to but not including this timestamp is returned. Defaults to current time.
    - path: $.parameters[3].schema.description
      before: End date in ISO8601 format (e.g., '2025-01-31T23:59:59Z' or '2025-01-31'). Defaults to current time.
      after: End date in ISO8601 format, exclusive (e.g., '2025-02-01T00:00:00Z' or '2025-02-01'). Data up to but not including this timestamp is returned. Defaults to current time.
  date: '2026-03-16'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/787
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Query param 'app_id' now accepts either a single '<owner>/<name>' string or an array of strings (previously only an array).
  paths:
    - path: parameters[?name=app_id]/schema
      before: '{"type":"array","items":{"type":"string"}}'
      after: '{"anyOf":[{"type":"string"},{"type":"array","items":{"type":"string"}}]}'
  date: '2026-08-24'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added explicit serialization hints for ''app_id'' query param: style=form, explode=true.'
  paths:
    - path: parameters[?name=app_id]/style
      before: 'null'
      after: form
    - path: parameters[?name=app_id]/explode
      before: 'null'
      after: 'true'
  date: '2026-08-24'
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated 'app_id' description to require '<owner>/<name>' format, document 1–50 IDs, and supported syntaxes (comma-separated or repeated params).
  paths:
    - path: parameters[?name=app_id]/description
      before: Filter by app IDs
      after: 'Filter by specific app ID(s) in ''<owner>/<name>'' format (e.g. ''fal-ai/my-app''). Accepts 1-50 app IDs. Supports comma-separated values: ?app_id=fal-ai/foo,fal-ai/bar or array syntax: ?app_id=fal-ai/foo&app_id=fal-ai/bar'
    - path: parameters[?name=app_id]/schema/description
      before: Filter by app IDs
      after: 'Filter by specific app ID(s) in ''<owner>/<name>'' format (e.g. ''fal-ai/my-app''). Accepts 1-50 app IDs. Supports comma-separated values: ?app_id=fal-ai/foo,fal-ai/bar or array syntax: ?app_id=fal-ai/foo&app_id=fal-ai/bar'
  date: '2026-08-24'
