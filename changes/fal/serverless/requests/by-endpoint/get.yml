      before: '"Fields to expand in the response. Use payloads to include input and output payloads."'
      after: '"Fields to expand in the response. Use payloads to include input and output payloads. Use billing to include billable_units per request."'
    - path: parameters[7].schema.description
      before: '"Fields to expand in the response. Use payloads to include input and output payloads."'
      after: '"Fields to expand in the response. Use payloads to include input and output payloads. Use billing to include billable_units per request."'
  date: '2026-08-24'
