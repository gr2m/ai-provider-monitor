- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces GET /serverless/apps to list serverless applications owned by the authenticated account, with optional environment and search filters, and expand=endpoints to include route-level endpoint IDs. Requires API key authentication.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/925
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Route description updated to include required permissions and key presets.
  paths:
    - path: $.description
      before: |-
        Lists the serverless applications owned by the authenticated account, with
        the configuration needed for follow-up calls.

        Each application includes its canonical `endpoint_id` ('<owner>/<name>'),
        which is the identifier accepted by the analytics, requests, logs, and
        queue endpoints — use this endpoint to discover identifiers instead of
        asking users to paste them.

        Add `expand=endpoints` to also include each app's registered route-level
        endpoint ids (e.g. '<owner>/<name>/turbo'). Multi-route apps record their
        requests/analytics data under these route-level ids.

        **Authentication:** Required via API key. Only applications owned by the
        authenticated account are returned.
      after: |-
        Lists the serverless applications owned by the authenticated account, with
        the configuration needed for follow-up calls.

        Each application includes its canonical `endpoint_id` ('<owner>/<name>'),
        which is the identifier accepted by the analytics, requests, logs, and
        queue endpoints — use this endpoint to discover identifiers instead of
        asking users to paste them.

        Add `expand=endpoints` to also include each app's registered route-level
        endpoint ids (e.g. '<owner>/<name>/turbo'). Multi-route apps record their
        requests/analytics data under these route-level ids.

        **Authentication:** Required via API key. Only applications owned by the
        authenticated account are returned.

        **Required permissions:** `serverless:apps:read`. Key presets that include them: `SERVERLESS`, `DEPLOY`, `READONLY`, `FULL`. See [key permissions](https://fal.ai/docs/documentation/model-apis/authentication/key-based#permissions).
  date: '2026-10-09'
- change: changed
  target: route
  breaking: true
  deprecated: false
  doc_only: false
  note: Security requirement changed from apiKey to readonlyApiKey.
  paths:
    - path: $.security[0]
      before: '{"apiKey":[]}'
      after: '{"readonlyApiKey":[]}'
  date: '2026-10-09'
