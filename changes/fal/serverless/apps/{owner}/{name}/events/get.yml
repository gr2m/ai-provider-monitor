- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds GET /serverless/apps/{owner}/{name}/events to return an app's operational event history (deployments, config changes, runner lifecycle), newest first; supports time range and category filters with cursor pagination; requires API key and owner access.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/925
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: Security requirement changed from apiKey to readonlyApiKey.
  paths:
    - path: $.security[0]
      before: '{"apiKey":[]}'
      after: '{"readonlyApiKey":[]}'
  date: '2026-10-09'
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Route description updated to include required permissions details and link.
  paths:
    - path: $.description
      before: |-
        Returns the operational event history for an application: deployments,
        configuration changes, and runner lifecycle transitions (started, failed,
        draining, etc.), newest first.

        **Use cases:**
        - Incident correlation: answer "what changed around this time?" — did a
          deploy, config change, or runner failure coincide with an error spike?
        - Deployment audit: see when revisions went out and who triggered them

        **Time range:** defaults to the last 24 hours when `start`/`end` are
        omitted. Use `category` filters to narrow to specific event types.

        **Authentication:** Required via API key. Only the app owner can query it.
      after: |-
        Returns the operational event history for an application: deployments,
        configuration changes, and runner lifecycle transitions (started, failed,
        draining, etc.), newest first.

        **Use cases:**
        - Incident correlation: answer "what changed around this time?" — did a
          deploy, config change, or runner failure coincide with an error spike?
        - Deployment audit: see when revisions went out and who triggered them

        **Time range:** defaults to the last 24 hours when `start`/`end` are
        omitted. Use `category` filters to narrow to specific event types.

        **Authentication:** Required via API key. Only the app owner can query it.

        **Required permissions:** `serverless:apps:read`. Key presets that include them: `SERVERLESS`, `DEPLOY`, `READONLY`, `FULL`. See [key permissions](https://fal.ai/docs/documentation/model-apis/authentication/key-based#permissions).
  date: '2026-10-09'
