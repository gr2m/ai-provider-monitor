- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Route description updated to include required permissions, key presets, and docs link.
  paths:
    - path: /description
      before: |-

        Returns the Access Control List currently applied to a fal CDN file.

        The ACL consists of a default decision (`allow`, `forbid`, or `hide`) plus
        optional per-user rules that override the default. Rule users are returned as
        nicknames where possible.

        **Authentication:** Required. The API key must have the `assets:read` permission.
            
      after: |-

        Returns the Access Control List currently applied to a fal CDN file.

        The ACL consists of a default decision (`allow`, `forbid`, or `hide`) plus
        optional per-user rules that override the default. Rule users are returned as
        nicknames where possible.

        **Authentication:** Required. The API key must have the `assets:read` permission.
            

        **Required permissions:** `assets:read`. Key presets that include them: `API`, `SERVERLESS`, `READONLY`, `FULL`. See [key permissions](https://fal.ai/docs/documentation/model-apis/authentication/key-based#permissions).
  date: '2026-10-09'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1095
