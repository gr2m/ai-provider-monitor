  paths:
    - path: security/0
      before: '{"apiKey":[]}'
      after: '{"readonlyApiKey":[]}'
  date: '2026-10-09'
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Description updated to include explicit required permissions and link to documentation.
  paths:
    - path: description
      before: |-

        Creates a signed URL that grants temporary access to a fal CDN file,
        regardless of its ACL. Useful for sharing access-restricted files.

        The signature is valid for `expiration_seconds` (up to 7 days).

        **Authentication:** Required. The API key must have the `assets:read` permission.
            
      after: |-

        Creates a signed URL that grants temporary access to a fal CDN file,
        regardless of its ACL. Useful for sharing access-restricted files.

        The signature is valid for `expiration_seconds` (up to 7 days).

        **Authentication:** Required. The API key must have the `assets:read` permission.
            

        **Required permissions:** `assets:read`. Key presets that include them: `API`, `SERVERLESS`, `READONLY`, `FULL`. See [key permissions](https://fal.ai/docs/documentation/model-apis/authentication/key-based#permissions).
  date: '2026-10-09'
