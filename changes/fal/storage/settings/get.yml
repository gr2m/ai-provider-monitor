- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces GET /storage/settings to return account-level storage lifecycle settings—expiration_duration_seconds and default initial_acl (nullable); requires API key with account:settings:read.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/925
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: Security scheme changed from apiKey to readonlyApiKey
  paths:
    - path: $.security[0]
      before: '{"apiKey":[]}'
      after: '{"readonlyApiKey":[]}'
  date: '2026-10-09'
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Description updated to include explicit required permissions, key presets, and docs link.
  paths:
    - path: $.description
      before: |-

        Returns the account-level storage lifecycle settings applied to newly uploaded
        fal CDN files:

        - `expiration_duration_seconds`: how long files live before being
          automatically deleted (null disables auto-expiration).
        - `initial_acl`: the default ACL applied to new uploads (null means the
          system default, which is public).

        Both fields are null when the account has never saved settings.

        **Authentication:** Required. The API key must have the `account:settings:read` permission.
            
      after: |-

        Returns the account-level storage lifecycle settings applied to newly uploaded
        fal CDN files:

        - `expiration_duration_seconds`: how long files live before being
          automatically deleted (null disables auto-expiration).
        - `initial_acl`: the default ACL applied to new uploads (null means the
          system default, which is public).

        Both fields are null when the account has never saved settings.

        **Authentication:** Required. The API key must have the `account:settings:read` permission.
            

        **Required permissions:** `account:settings:read`. Key presets that include them: `API`, `SERVERLESS`, `DEPLOY`, `COMPUTE`, `BILLING`, `READONLY`, `FULL`. See [key permissions](https://fal.ai/docs/documentation/model-apis/authentication/key-based#permissions).
  date: '2026-10-09'
