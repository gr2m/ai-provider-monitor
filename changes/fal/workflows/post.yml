- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Description updated to document required permissions (workflows:write) and link to key permissions docs.
  paths:
    - path: description
      before: |-

        Create a new workflow owned by the authenticated user.

        **Authentication:** Required.

        **Common Use Cases:**
        - Save a newly built workflow
        - Programmatically provision workflows

        **Note:** Workflow names must be unique within your namespace. Creating a
        workflow with a name you already use returns a 400 validation error.
            
      after: |-

        Create a new workflow owned by the authenticated user.

        **Authentication:** Required.

        **Common Use Cases:**
        - Save a newly built workflow
        - Programmatically provision workflows

        **Note:** Workflow names must be unique within your namespace. Creating a
        workflow with a name you already use returns a 400 validation error.
            

        **Required permissions:** `workflows:write`. Key presets that include them: `SERVERLESS`, `FULL`. See [key permissions](https://fal.ai/docs/documentation/model-apis/authentication/key-based#permissions).
  date: '2026-10-09'
