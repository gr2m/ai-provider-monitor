- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: 'Description updated: removed explicit admin API key requirement; added required permissions ''auth:keys:write'' with link.'
  paths:
    - path: description
      before: |-
        Deletes an API key by its ID. This action is irreversible.

        **Requirements:**
        - Authentication required via admin API key
        - Key must belong to the authenticated user's workspace

        **Key Features:**
        - Permanently revoke API key access
        - Idempotent operation (safe to retry)
        - Optional Idempotency-Key header for safe retries

        **Important:**
        - This action cannot be undone
        - Any applications using this key will immediately lose access
        - Returns 204 even if the key doesn't exist (idempotent behavior)

        **Common Use Cases:**
        - Revoke compromised keys
        - Clean up unused keys
        - Implement key rotation (delete old, create new)
        - Offboard team members
      after: |-
        Deletes an API key by its ID. This action is irreversible.

        **Requirements:**
        - Key must belong to the authenticated user's workspace

        **Key Features:**
        - Permanently revoke API key access
        - Idempotent operation (safe to retry)
        - Optional Idempotency-Key header for safe retries

        **Important:**
        - This action cannot be undone
        - Any applications using this key will immediately lose access
        - Returns 204 even if the key doesn't exist (idempotent behavior)

        **Common Use Cases:**
        - Revoke compromised keys
        - Clean up unused keys
        - Implement key rotation (delete old, create new)
        - Offboard team members

        **Required permissions:** `auth:keys:write`. Key presets that include them: `FULL`. See [key permissions](https://fal.ai/docs/documentation/model-apis/authentication/key-based#permissions).
  date: '2026-10-09'
