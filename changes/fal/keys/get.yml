- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Route description updated to clarify listing behavior (API preset or legacy API scope) and to document required permission `auth:keys:read` and relevant presets.
  paths:
    - path: description
      before: |-
        Returns a list of all API keys belonging to the authenticated user's workspace.

        **Requirements:**
        - Authentication required via admin API key

        **Key Features:**
        - View all API keys with their aliases and creation dates
        - Optionally expand to include creator information
        - Paginated results for workspaces with many keys

        **Expansion Options:**
        - `expand=creator_info`: Include creator_nickname and creator_email for each key

        **Common Use Cases:**
        - Audit existing API keys
        - Find keys by alias
        - Monitor key creation activity
        - Build key management interfaces
      after: |-
        Returns the API keys in the authenticated user's workspace that are on the `API` preset
        or the legacy `API` scope. Keys on other presets or custom policies are not listed.

        **Key Features:**
        - View all API keys with their aliases and creation dates
        - Optionally expand to include creator information
        - Paginated results for workspaces with many keys

        **Expansion Options:**
        - `expand=creator_info`: Include creator_nickname and creator_email for each key

        **Common Use Cases:**
        - Audit existing API keys
        - Find keys by alias
        - Monitor key creation activity
        - Build key management interfaces

        **Required permissions:** `auth:keys:read`. Key presets that include them: `BILLING`, `FULL`. See [key permissions](https://fal.ai/docs/documentation/model-apis/authentication/key-based#permissions).
  date: '2026-10-09'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1095
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: 'Route description updated: now returns all workspace API keys (not limited to API preset/legacy).'
  paths:
    - path: description
      before: |-
        Returns the API keys in the authenticated user's workspace that are on the `API` preset
        or the legacy `API` scope. Keys on other presets or custom policies are not listed.

        **Key Features:**
        - View all API keys with their aliases and creation dates
        - Optionally expand to include creator information
        - Paginated results for workspaces with many keys

        **Expansion Options:**
        - `expand=creator_info`: Include creator_nickname and creator_email for each key

        **Common Use Cases:**
        - Audit existing API keys
        - Find keys by alias
        - Monitor key creation activity
        - Build key management interfaces

        **Required permissions:** `auth:keys:read`. Key presets that include them: `BILLING`, `FULL`. See [key permissions](https://fal.ai/docs/documentation/model-apis/authentication/key-based#permissions).
      after: |-
        Returns a list of all API keys belonging to the authenticated user's workspace.

        **Key Features:**
        - View all API keys with their aliases and creation dates
        - See how each key is permissioned via `mode`, `preset` and `permissions`
        - Optionally expand to include creator information
        - Paginated results for workspaces with many keys

        **Key Modes:**
        - `preset`: created from a named permission preset, reported in `preset`
        - `custom`: created with an explicit list of permissions
        - `legacy`: predates granular permissions and carries a coarse scope

        **Expansion Options:**
        - `expand=creator_info`: Include creator_nickname and creator_email for each key

        **Common Use Cases:**
        - Audit existing API keys
        - Find keys by alias
        - Monitor key creation activity
        - Build key management interfaces

        **Required permissions:** `auth:keys:read`. Key presets that include them: `BILLING`, `FULL`. See [key permissions](https://fal.ai/docs/documentation/model-apis/authentication/key-based#permissions).
  date: '2026-10-12'
