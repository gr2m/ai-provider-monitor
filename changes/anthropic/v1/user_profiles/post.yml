  doc_only: false
  note: New POST /v1/user_profiles endpoint to create a user profile. Accepts optional name, metadata, access_type, and external_user_details; returns the created UserProfile on success with standard error responses on failure.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: The request field external_user_details.country now enforces a regex pattern (^[A-Z]{2}$) for ISO 3166-1 alpha-2 codes, tightening validation.
  paths:
    - path: components/schemas/UserProfileExternalUserDetailsParams/properties/country/anyOf/0
      before: '{"type":"string"}'
      after: '{"type":"string","pattern":"^[A-Z]{2}$"}'
  date: '2026-11-04'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1181
