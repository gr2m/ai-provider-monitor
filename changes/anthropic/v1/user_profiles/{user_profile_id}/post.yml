- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/user_profiles/{user_profile_id} to update a user profile by ID. Supports changing access_type and name, merging/removing metadata (remove by empty string), and partially updating external_user_details. Returns the updated UserProfile. Optional headers anthropic-version and anthropic-workspace-id are supported.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: The request field external_user_details.country is now validated by regex ^[A-Z]{2}$ (was any string). This tightens validation to ISO 3166-1 alpha-2 uppercase codes and may reject previously accepted inputs.
  paths:
    - path: components/schemas/UserProfileExternalUserDetailsParams/properties/country/anyOf/0/pattern
      before: 'null'
      after: ^[A-Z]{2}$
    - path: components/schemas/UserProfileExternalUserDetailsParams/properties/country/anyOf/0
      before: '{"type":"string"}'
      after: '{"type":"string","pattern":"^[A-Z]{2}$"}'
  date: '2026-11-04'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1181
