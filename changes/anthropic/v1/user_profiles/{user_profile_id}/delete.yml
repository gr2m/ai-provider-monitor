  note: Introduces DELETE /v1/user_profiles/{user_profile_id} to delete a user profile by ID. On success returns DeletedUserProfile (type=user_profile_deleted). Supports optional anthropic-version and anthropic-workspace-id headers; standard error responses on failure.
