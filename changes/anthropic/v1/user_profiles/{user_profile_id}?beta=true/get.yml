    - path: components.schemas.BetaUserProfile.properties.external_id.description
      before: '"Platform''s own identifier for this user. Not enforced unique."'
      after: '"Platform''s own identifier for this user. Not enforced unique. Legacy field, present only under the `user-profiles-2026-03-24` and `user-profiles-2026-08-18` beta headers; without one of them, the value is `external_user_details.reference_id`."'
    - path: components.schemas.BetaUserProfile.properties.external_user_onboarded_at.description
      before: '"When the entity this profile represents opened its account with the platform, as stated by the platform, in RFC 3339 format (UTC). `null` until the platform supplies one. Present under the `user-profiles-2026-08-18` beta header."'
      after: '"When the entity this profile represents opened its account with the platform, as stated by the platform, in RFC 3339 format (UTC). `null` until the platform supplies one. Legacy field, present only under the `user-profiles-2026-08-18` beta header; without a legacy header, the value is `external_user_details.onboarded_at`."'
    - path: components.schemas.BetaUserProfile.properties.updated_at.description
      before: '"When this user profile was last modified, in RFC 3339 format. Trust-grant status changes also bump this timestamp."'
      after: '"When this user profile was last modified, in RFC 3339 format. It normally also updates shortly after Anthropic gives the profile an approval or withdraws one. Other changes to the statuses that Anthropic reports do not always update it, so read the status itself rather than watching this timestamp."'
  date: '2026-11-02'
