      after: '"A record of an entity that the platform serves through the API, such as an end-user of the platform''s product or a company that the platform resells Claude access to.\n\nA Messages, Message Batches or token counting request can send a profile''s `id` in the `anthropic-user-profile-id` header to attribute the request to that entity."'
