- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'POST /v1/tunnels/{tunnel_id}/certificates/{certificate_id}/archive?beta=true archives a tunnel certificate, removing it from the trusted set while retaining the record. Archiving the last non-archived certificate is allowed; the tunnel rejects MCP traffic until a new certificate is added. Requires anthropic-beta: mcp-tunnels-2026-06-22 and returns the updated tunnel_certificate.'
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/934
