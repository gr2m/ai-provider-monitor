  note: 'Adds research-preview endpoint POST /v1/tunnels/{tunnel_id}/archive?beta=true to archive an MCP tunnel. Archival is irreversible: archives all non-archived certificates, retires the hostname (never re-allocated), and invalidates the tunnel token; retrying an already-archived tunnel returns the existing record. Requires header anthropic-beta: mcp-tunnels-2026-06-22. Returns the archived Tunnel on 200.'
