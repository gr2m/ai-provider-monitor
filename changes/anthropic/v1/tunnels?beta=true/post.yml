- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds POST /v1/tunnels?beta=true to create an MCP tunnel. Requires header anthropic-beta: mcp-tunnels-2026-06-22. Allocates a unique hostname and provisions the tunnel; operation is not idempotent. Newly created tunnels reject MCP traffic until at least one CA certificate is added. Research preview; supersedes Admin API /v1/organizations/tunnels.'
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/934
