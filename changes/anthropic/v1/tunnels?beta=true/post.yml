  note: Added optional anthropic-workspace-id header to select a Workspace for the request.
  paths:
    - path: parameters[2].name
      before: 'null'
      after: anthropic-workspace-id
    - path: parameters[2].in
      before: 'null'
      after: header
    - path: parameters[2].required
      before: 'null'
      after: 'false'
    - path: parameters[2].schema.type
      before: 'null'
      after: string
    - path: parameters[2].description
      before: 'null'
      after: |-
        Optional header to select the Workspace for this request. The value is a Workspace ID (for example, `wrkspc_011CZkZaBF1tNoB5wlCeusgy`).

        Only needed for credentials that can act on more than one Workspace. A credential that belongs to a specific Workspace may omit it; if sent, it must match that Workspace.
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
