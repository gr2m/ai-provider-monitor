      before: 'null'
      after: '[{"$ref":"#/components/schemas/KeyProfileMismatchErrorDetails"},{"$ref":"#/components/schemas/UserProfileNotFoundErrorDetails"},{"$ref":"#/components/schemas/WorkspacePolicyViolationErrorDetails"},{"type":"null"}]'
