- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /v1/organizations/workspaces to create a new Workspace using WorkspaceCreateParams (name required) with optional data residency config, display_color, external_key_id (CMEK), and tags; returns a Workspace object with full details and standard error responses.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional user_profile_id to WorkspaceCreateParams to bind a user profile to the Workspace.
  paths:
    - path: components/schemas/WorkspaceCreateParams/properties/user_profile_id
      before: 'null'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"ID of a user profile to attach to the Workspace. Every inference request through the Workspace must then name this user profile; the API rejects a request that names none or a different one. The user profile can''t be replaced or removed later; only deleting the user profile clears it.","examples":["uprof_01SDCCSbTxrXDpWc1phhtcfK"],"title":"User Profile Id"}'
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Workspace objects now include user_profile_id (string|null).
  paths:
    - path: components/schemas/Workspace/properties/user_profile_id
      before: 'null'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"ID of the user profile attached to the Workspace, or null if it has none. Every inference request through a Workspace that has a user profile must name that profile.","examples":["uprof_01SDCCSbTxrXDpWc1phhtcfK"],"title":"User Profile Id"}'
  date: '2026-11-02'
