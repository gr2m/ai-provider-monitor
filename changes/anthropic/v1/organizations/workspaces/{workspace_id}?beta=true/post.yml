- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description for external_key_id in request schema to add AWS-specific CMEK details and validation behavior.
  paths:
    - path: components/schemas/BetaWorkspaceUpdateParams/properties/external_key_id/description
      before: |-
        ID of the customer-managed encryption key (CMEK) configuration to use for this
        Workspace. Setting this field requires CMEK to be enabled for your
        organization. When set, data stored for this Workspace is encrypted with the
        referenced key. Create key configurations with the External Keys API. This
        field is write-once: once a key is attached to a Workspace it cannot be
        detached or replaced. To rotate key material, rotate the underlying key on
        your cloud KMS; the `external_key_id` stays the same.
      after: |-
        ID of the customer-managed encryption key (CMEK) configuration to use for this
        Workspace. Setting this field requires CMEK to be enabled for your
        organization. When set, data stored for this Workspace is encrypted with the
        referenced key. Create key configurations with the External Keys API. On
        Claude Platform on AWS the value is the AWS KMS key ARN, and the key must be a
        single-Region key in the same AWS account and Region as the Workspace. On that
        platform the key is validated against this Workspace when it is attached, so a
        key-policy problem is reported as an error on this request. This field is write-once:
        once a key is attached to a Workspace it cannot be detached or replaced. To
        rotate key material, rotate the underlying key on your cloud KMS; the
        `external_key_id` stays the same.
  date: '2026-09-01'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/982
