- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New beta endpoint GET /v1/organizations/workspaces/{workspace_id}?beta=true to retrieve a Workspace by ID. Returns BetaWorkspace on 200 and BetaErrorResponse on 4XX. Accepts workspace_id path param and optional x-api-key and anthropic-version headers.
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified description for compartment_id regarding CMEK compartment binding and AWS-specific validation guidance.
  paths:
    - path: components/schemas/BetaWorkspace/properties/compartment_id/description
      before: |-
        Identifier for this Workspace's encryption compartment. When you configure a
        customer-managed encryption key (CMEK) on AWS, reference this value in your
        KMS key-policy condition so the key is scoped to this compartment. On GCP and
        Azure, Anthropic enforces the compartment binding automatically; you do not
        need to reference this value in your key configuration. See the CMEK integration guide for the
        required key configuration, including the value used during key validation.
      after: |-
        Identifier for this Workspace's encryption compartment. When you configure a
        customer-managed encryption key (CMEK) on AWS, reference this value in your
        KMS key-policy condition so the key is scoped to this compartment. On GCP and
        Azure, Anthropic enforces the compartment binding automatically; you do not
        need to reference this value in your key configuration. See the CMEK
        integration guide for the required key configuration; unless your organization
        is on Claude Platform on AWS, it includes a separate value used during key
        validation. On Claude Platform on AWS there is no separate validation value:
        the key is validated against this Workspace's own value when it is attached, so
        if your key policy uses the compartment condition, add this value to it before
        attaching the key.
  date: '2026-09-01'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/982
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Expanded description for external_key_id with AWS-specific details (KMS ARN, same account/Region, validation at attach time).
  paths:
    - path: components/schemas/BetaWorkspace/properties/external_key_id/description
      before: |-
        ID of the customer-managed encryption key (CMEK) configuration to use for this
        Workspace. Setting this field requires CMEK to be enabled for your
        organization. When set, data stored for this Workspace is encrypted with the
        referenced key. Create key configurations with the External Keys API. This
        field is write-once: once a key is attached to a Workspace it cannot be
        detached or replaced. To rotate key material, rotate the underlying key on
        your cloud KMS; the `external_key_id` stays the same.
      after: |-
        ID of the customer-managed encryption key (CMEK) configuration to use for this
        Workspace. Setting this field requires CMEK to be enabled for your
        organization. When set, data stored for this Workspace is encrypted with the
        referenced key. Create key configurations with the External Keys API. On
        Claude Platform on AWS the value is the AWS KMS key ARN, and the key must be a
        single-Region key in the same AWS account and Region as the Workspace. On that
        platform the key is validated against this Workspace when it is attached, so a
        key-policy problem is reported as an error on this request. This field is write-once:
        once a key is attached to a Workspace it cannot be detached or replaced. To
        rotate key material, rotate the underlying key on your cloud KMS; the
        `external_key_id` stays the same.
  date: '2026-09-01'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/982
