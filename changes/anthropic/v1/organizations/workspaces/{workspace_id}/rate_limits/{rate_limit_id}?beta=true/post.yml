- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Beta endpoint to set or clear workspace-level rate-limit overrides for a specific rate-limit group. POST /v1/organizations/workspaces/{workspace_id}/rate_limits/{rate_limit_id}?beta=true accepts limits[] items where value sets the override or null clears it, and returns the updated workspace rate-limit entry; changes take effect within about an hour.
