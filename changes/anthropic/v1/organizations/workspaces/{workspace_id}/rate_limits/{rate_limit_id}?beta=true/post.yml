      after: '{"type":"object","title":"ErrorResponse","properties":{"error":{"type":"object","title":"PermissionError","properties":{"type":{"const":"permission_error"},"message":{"type":"string"},"details":{"anyOf":[{"$ref":"#/components/schemas/BetaSandboxEgressRestrictedErrorDetails"},{"type":"null"}]}} ,"required":["message","type"]},"request_id":{"anyOf":[{"type":"string"},{"type":"null"}]},"type":{"const":"error"}},"required":["error","request_id","type"]}'
