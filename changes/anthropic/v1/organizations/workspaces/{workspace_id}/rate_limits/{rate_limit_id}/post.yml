- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/organizations/workspaces/{workspace_id}/rate_limits/{rate_limit_id} to set or clear per-workspace overrides for a rate-limit group. Only limiter types included in 'limits' are changed (integer sets override; null clears). Returns the updated workspace rate-limit entry; organization caps still apply. Changes propagate within ~1 hour.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
