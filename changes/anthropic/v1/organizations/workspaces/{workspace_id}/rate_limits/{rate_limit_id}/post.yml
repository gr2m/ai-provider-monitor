- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added machine-readable error.details to 403 response with optional sandbox_egress_restricted detail.
  paths:
    - path: responses.403.content.application/json.schema.properties.error.properties.details
      before: 'null'
      after: '{"anyOf":[{"$ref":"#/components/schemas/SandboxEgressRestrictedErrorDetails"},{"type":"null"}],"description":"Machine-readable detail about the cause of the error. `error_code` names the cause; branch on it rather than on `message`. Absent when the error has no code. Treat an unrecognized `error_code` as the bare `type`."}'
    - path: components.schemas.SandboxEgressRestrictedErrorDetails
      before: 'null'
      after: '{"description":"The request came from a Claude sandbox with restricted network access, which is not allowed to make this change. Send it from outside the sandbox, or from a sandbox with unrestricted network access.","properties":{"error_code":{"const":"sandbox_egress_restricted","title":"Error Code","type":"string"}},"required":["error_code"],"title":"SandboxEgressRestrictedErrorDetails","type":"object"}'
  date: '2026-11-09'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1190
