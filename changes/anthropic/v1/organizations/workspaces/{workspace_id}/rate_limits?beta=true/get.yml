- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated route and schema descriptions to document include_inherited behavior and clarify field meanings.
  paths:
    - path: description
      before: List rate-limit overrides configured for a workspace.\n\nReturns only the groups and limiter types that have a workspace-level\noverride. Groups without overrides inherit the organization limits and\nare not listed; use `GET /v1/organizations/rate_limits` to see those.\n\nWhen `limit` is omitted, every matching entry is returned in a single\npage; when `limit` truncates the result, follow `next_page` to fetch\nthe remaining entries.
      after: List a workspace's rate limits.\n\nBy default, returns only the groups and limiter types that have a\nworkspace-level override. With `include_inherited=true`, returns every\ngroup with organization-level limits the workspace can see, listing for\neach the values it inherits from the organization as well as its own\noverrides. Each value's `source` says which it is.\n\nWhen `limit` is omitted, every matching entry is returned in a single\npage; when `limit` truncates the result, follow `next_page` to fetch\nthe remaining entries.
    - path: components.schemas.BetaWorkspaceRateLimitListResponse.properties.data.description
      before: Rate-limit entries for the workspace, one per group that has at least one override.
      after: 'Rate-limit entries for the workspace: one per group with at least one override, or, with `include_inherited` set to `true`, one per group the workspace can see that has organization-level limits.'
    - path: components.schemas.BetaWorkspaceRateLimit.properties.limits.description
      before: The limiter values overridden for this group in this workspace. Limiter types without a workspace override are omitted and inherit the organization value.
      after: The workspace's limiter values for this group. By default only the limiter types with a workspace-level override are listed. With `include_inherited` set to `true`, the limiter types the workspace inherits from the organization are listed too, each marked by `source`.
    - path: components.schemas.BetaWorkspaceRateLimit.properties.models.description
      before: Model names this entry's limits apply to, including aliases. `null` when `group_type` is not `"model_group"`.
      after: Model names this entry's limits apply to, including aliases. `null` when `group.type` is not `"model_group"`. The list covers the models this workspace has access to, so it can differ between workspaces.
    - path: components.schemas.BetaWorkspaceRateLimit.properties.rate_limit_id.description
      before: The `id` of the RateLimit group this override applies to.
      after: The `id` of the organization's RateLimit entry this entry applies to.
    - path: components.schemas.BetaWorkspaceRateLimit.properties.workspace_id.description
      before: ID of the Workspace this override applies to.
      after: ID of the Workspace this entry applies to.
    - path: components.schemas.BetaWorkspaceRateLimitValue.properties.value.description
      before: The workspace-level override value for this limiter type.
      after: 'The workspace''s value for this limiter type: the workspace-level override when `source.type` is `workspace`, otherwise the organization''s value.'
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
