- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Beta endpoint to list workspace-level rate-limit overrides (one entry per group). Optional group_type filter. Returns only groups with overrides. Pagination fields included but currently all results are returned in a single page; follow next_page for future compatibility. Requires Admin API key.
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: Pagination is now enabled when a limit is provided; omitting limit returns all results in one page. Clients that previously set limit and assumed it was ignored may now receive paginated results and must follow next_page.
  paths:
    - path: description
      before: |-
        List rate-limit overrides configured for a workspace.

        Returns only the groups and limiter types that have a workspace-level
        override. Groups without overrides inherit the organization limits and
        are not listed; use `GET /v1/organizations/rate_limits` to see those.

        This endpoint currently returns every matching entry in a single page
        regardless of `limit`; follow `next_page` so that clients keep working
        when pagination is enabled.
      after: |-
        List rate-limit overrides configured for a workspace.

        Returns only the groups and limiter types that have a workspace-level
        override. Groups without overrides inherit the organization limits and
        are not listed; use `GET /v1/organizations/rate_limits` to see those.

        When `limit` is omitted, every matching entry is returned in a single
        page; when `limit` truncates the result, follow `next_page` to fetch
        the remaining entries.
    - path: parameters[2].description
      before: |-
        Maximum number of items to return per page. Ranges from `1` to `1000`.

        Accepted for request-shape compatibility and currently ignored: every entry is returned in a single page.
      after: |-
        Maximum number of items to return per page. Ranges from `1` to `1000`.

        When omitted, every remaining entry is returned in a single page and `next_page` is `null`.
  date: '2026-08-27'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: 'Clarified next_page description: it is an opaque cursor or null when no further results remain.'
  paths:
    - path: components.schemas.BetaWorkspaceRateLimitListResponse.properties.next_page.description
      before: Token to provide in as `page` in the subsequent request to retrieve the next page of data.
      after: Opaque cursor for the next page of results, or `null` when no entries remain beyond this response.
  date: '2026-08-27'
