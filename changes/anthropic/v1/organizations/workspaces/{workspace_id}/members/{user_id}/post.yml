- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 403 PermissionError response is now inline and includes a new `details` field that may return `sandbox_egress_restricted` details.
  paths:
    - path: responses/403/content/application/json/schema
      before: '{"$ref":"#/components/schemas/ErrorResponse"}'
      after: '{"type":"object","title":"ErrorResponse","required":["error","request_id","type"],"properties":{"error":{"type":"object","title":"PermissionError","required":["message","type"],"properties":{"type":{"type":"string","const":"permission_error","default":"permission_error","description":"The broad category of the error.","title":"Type"},"message":{"type":"string","default":"Permission denied","description":"A human-readable explanation of the error. Its wording can change, so don''t match on it.","title":"Message"},"details":{"anyOf":[{"$ref":"#/components/schemas/SandboxEgressRestrictedErrorDetails"},{"type":"null"}],"description":"Machine-readable detail about the cause of the error. `error_code` names the cause; branch on it rather than on `message`. Absent when the error has no code. Treat an unrecognized `error_code` as the bare `type`."}}},"request_id":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Request Id"},"type":{"type":"string","const":"error","default":"error","title":"Type"}}}'
    - path: responses/403/content/application/json/schema/properties/error/properties/details
      before: 'null'
      after: '{"anyOf":[{"$ref":"#/components/schemas/SandboxEgressRestrictedErrorDetails"},{"type":"null"}],"description":"Machine-readable detail about the cause of the error. `error_code` names the cause; branch on it rather than on `message`. Absent when the error has no code. Treat an unrecognized `error_code` as the bare `type`."}'
  date: '2026-11-09'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1190
