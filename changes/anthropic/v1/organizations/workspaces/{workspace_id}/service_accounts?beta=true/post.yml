- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New beta endpoint to add a service account to a workspace with a specified workspace_role. Requires OAuth access token with org:admin scope (Admin API keys not accepted). If already a member, updates the role. Archived workspaces return 400; archived service accounts are rejected.
  paths: []
