- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds beta GET /v1/organizations/workspaces/{workspace_id}/service_accounts?beta=true to list service accounts that are members of a workspace, including each account’s workspace_role, with pagination. Requires OAuth org:admin (Admin API keys not accepted). Archived workspaces return 400; implicit default-workspace membership and archived service accounts are excluded.
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
