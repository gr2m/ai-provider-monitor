- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Removes a service account from a workspace. Requires OAuth access token with org:admin scope (Admin API keys not accepted). Idempotent; deleting implicit default-workspace membership is a no-op; deleting an explicit default-workspace membership reverts to implicit workspace_user. Archived workspaces return 400.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
