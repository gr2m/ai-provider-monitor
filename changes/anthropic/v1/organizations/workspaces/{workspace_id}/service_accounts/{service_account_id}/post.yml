- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New POST /v1/organizations/workspaces/{workspace_id}/service_accounts/{service_account_id} to update a service account's role in a workspace. Requires OAuth access token with org:admin (Admin API keys not accepted). Only explicit memberships can be updated; to change the implicit default-workspace role, first add the service account explicitly. Archived workspaces return 400; archived service accounts cannot be updated. Returns ServiceAccountWorkspaceMember on success.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
