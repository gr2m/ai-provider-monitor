- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds POST /v1/organizations/workspaces/{workspace_id}/service_accounts/{service_account_id}?beta=true to update a service account''s workspace_role. Requires OAuth access token with org:admin scope (Admin API keys not accepted). Only explicit memberships can be updated; implicit default-workspace memberships require adding the service account explicitly first. Service accounts cannot hold workspace_billing. Archived workspaces return 400; archived service accounts cannot be updated. Request body: { workspace_role }. Response: ServiceAccountWorkspaceMember.'
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
