- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds a beta DELETE endpoint to remove a service account from a workspace. Requires OAuth with org:admin scope (Admin API keys not accepted). Idempotent (200 if already removed). Deleting implicit default-workspace membership is a no-op; deleting an explicit default-workspace row reverts to implicit workspace_user. Archived workspaces return 400.
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
