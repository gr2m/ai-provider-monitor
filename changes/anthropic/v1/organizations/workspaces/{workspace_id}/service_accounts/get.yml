  note: Introduces GET /v1/organizations/workspaces/{workspace_id}/service_accounts to list service accounts that are members of a workspace. Returns each member with its workspace_role, supports pagination with limit and next_page, requires an OAuth token with org:admin scope. Archived workspaces return 400, the implicit default-workspace membership is excluded, and memberships of archived service accounts are omitted.
