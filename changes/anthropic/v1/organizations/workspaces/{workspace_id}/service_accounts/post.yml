  doc_only: false
  note: New POST /v1/organizations/workspaces/{workspace_id}/service_accounts to add a service account to a workspace with a specified workspace_role. Requires OAuth access token with org:admin scope (Admin API keys not accepted). If already a member, updates its role. Archived workspaces or archived service accounts are rejected.
