- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds beta GET /v1/organizations/external_keys to list CMEK external key configs in the caller's org, ordered newest-first with cursor-based pagination (limit, page). Requires beta=true.
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description for AwsExternalKeyConfig.kms_arn to clarify AWS-specific restrictions (single-Region, same-account; no cross-account, multi-Region, or alias ARNs).
  paths:
    - path: components.schemas.BetaAwsExternalKeyConfig.properties.kms_arn.description
      before: Full ARN of the AWS KMS key.
      after: Full ARN of the AWS KMS key. On Claude Platform on AWS the key must be a single-Region key in your organization's own AWS account; cross-account keys, multi-Region keys, and alias ARNs are rejected.
  date: '2026-09-01'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description for AwsExternalKeyConfig.role_arn (still deprecated) to clarify how Anthropic accesses the KMS key, including behavior on Claude Platform on AWS.
  paths:
    - path: components.schemas.BetaAwsExternalKeyConfig.properties.role_arn.description
      before: IAM role ARN. Deprecated — Anthropic reaches the KMS key via a managed intermediate role; this field is ignored.
      after: IAM role ARN. Deprecated — Anthropic reaches the KMS key through its own intermediate role (or, on Claude Platform on AWS, with credentials AWS issues for the Workspace); this field is ignored.
  date: '2026-09-01'
