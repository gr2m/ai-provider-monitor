  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description for AwsExternalKeyConfig.kms_arn to clarify AWS-specific restrictions (single-Region, same-account; no cross-account, multi-Region, or alias ARNs).
  paths:
    - path: components.schemas.BetaAwsExternalKeyConfig.properties.kms_arn.description
      before: Full ARN of the AWS KMS key.
      after: Full ARN of the AWS KMS key. On Claude Platform on AWS the key must be a single-Region key in your organization's own AWS account; cross-account keys, multi-Region keys, and alias ARNs are rejected.
