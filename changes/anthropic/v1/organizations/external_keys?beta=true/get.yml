  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/982
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description for AwsExternalKeyConfig.role_arn (still deprecated) to clarify how Anthropic accesses the KMS key, including behavior on Claude Platform on AWS.
  paths:
    - path: components.schemas.BetaAwsExternalKeyConfig.properties.role_arn.description
      before: IAM role ARN. Deprecated — Anthropic reaches the KMS key via a managed intermediate role; this field is ignored.
      after: IAM role ARN. Deprecated — Anthropic reaches the KMS key through its own intermediate role (or, on Claude Platform on AWS, with credentials AWS issues for the Workspace); this field is ignored.
  date: '2026-09-01'
