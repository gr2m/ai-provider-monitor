- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds beta DELETE /v1/organizations/plugins/{plugin_id} to permanently delete a Plugin and all its versions. Works for organization- or member-owned Plugins; org-owned installation settings are removed, member-owned shares are withdrawn. Only Plugins in a manual marketplace can be deleted here; repo-synced Plugins must be removed from the repository (else 400). Requires Admin API key with write:plugins and header anthropic-beta: ce-plugins-2026-09-01 (missing header returns 404). Returns 200 with plugin_deleted on success.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Added descriptive documentation to the AnthropicBeta schema used by the anthropic-beta header.
  paths:
    - path: components/schemas/AnthropicBeta/description
      before: 'null'
      after: |-
        Beta names you can send in the `anthropic-beta` header.

        See [Beta headers](https://platform.claude.com/docs/en/api/beta-headers) for how to send them and where to find the name a feature needs.
  date: '2026-11-02'
