- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds beta DELETE /v1/organizations/plugins/{plugin_id} to permanently delete a Plugin and all its versions. Works for organization- or member-owned Plugins; org-owned installation settings are removed, member-owned shares are withdrawn. Only Plugins in a manual marketplace can be deleted here; repo-synced Plugins must be removed from the repository (else 400). Requires Admin API key with write:plugins and header anthropic-beta: ce-plugins-2026-09-01 (missing header returns 404). Returns 200 with plugin_deleted on success.'
  paths: []
  date: '2026-11-02'
