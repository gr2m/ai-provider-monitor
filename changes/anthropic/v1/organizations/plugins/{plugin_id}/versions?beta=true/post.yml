- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Add a version to an organization-owned Plugin by uploading files via multipart/form-data (files[] or single archive) with optional release_notes; becomes the served version unless pinned. Manual marketplace only. Requires Admin API key (write:plugins) and header anthropic-beta: ce-plugins-2026-09-01 (otherwise 404). Returns PluginVersion. Notable errors: 409 skill_name_taken (org skill name conflict), 503 registration_pending (stored but not yet usable).'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Added documentation description for the AnthropicBeta schema used by the anthropic-beta header.
  paths:
    - path: components/schemas/AnthropicBeta/description
      before: 'null'
      after: |-
        Beta names you can send in the `anthropic-beta` header.

        See [Beta headers](https://platform.claude.com/docs/en/api/beta-headers) for how to send them and where to find the name a feature needs.
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1164
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified semantics of BetaPluginVersion.description in 200 response (can exceed 500 chars and may mirror a skill description depending on truncation rules).
  paths:
    - path: components/schemas/BetaPluginVersion/properties/description/description
      before: The manifest's description; null when it declares none.
      after: The manifest's description; null when it declares none. The value can be longer than 500 characters, the limit on `description` in an uploaded manifest. A description that the manifest takes from a `SKILL.md` is cut to its first 500 characters. So if the manifest's description is the first 500 characters of exactly one distinct skill `description` in `components`, that skill `description` is returned instead.
  date: '2026-11-04'
