- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Route description clarifies 409 skill_name_taken occurs only for org skills not listed by this API.
  paths:
    - path: description
      before: 'When the Plugin is in the organization''s library marketplace, a version that adds a skill with the name of an organization skill (a skill an administrator uploaded for the whole organization in claude.ai) is refused with a 409: `error_code` `skill_name_taken`, with that name in `details.skill_name`.'
      after: 'When the Plugin is in the organization''s library marketplace, a version that adds a skill with the name of an organization skill that this API does not list is refused with a 409: `error_code` `skill_name_taken`, with that name in `details.skill_name`.'
  date: '2026-11-10'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1206
