- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds a beta endpoint to list a plugin’s versions (newest first): GET /v1/organizations/plugins/{plugin_id}/versions. Requires anthropic-beta: ce-plugins-2026-09-01 header; supports pagination (limit, page) and optional organization_id scoping. Returns BetaPluginVersionList. Accessible to CE orgs with read:plugins, read:org_audit, or read:compliance_org_data; missing beta header returns 404.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Added descriptive documentation to the AnthropicBeta schema used by the anthropic-beta header.
  paths:
    - path: components/schemas/AnthropicBeta/description
      before: 'null'
      after: |-
        Beta names you can send in the `anthropic-beta` header.

        See [Beta headers](https://platform.claude.com/docs/en/api/beta-headers) for how to send them and where to find the name a feature needs.
  date: '2026-11-02'
