- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds a beta endpoint to list a plugin’s versions (newest first): GET /v1/organizations/plugins/{plugin_id}/versions. Requires anthropic-beta: ce-plugins-2026-09-01 header; supports pagination (limit, page) and optional organization_id scoping. Returns BetaPluginVersionList. Accessible to CE orgs with read:plugins, read:org_audit, or read:compliance_org_data; missing beta header returns 404.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Added descriptive text to the AnthropicBeta schema explaining how to use the anthropic-beta header; no schema/behavior change.
  paths:
    - path: components/schemas/AnthropicBeta/description
      before: 'null'
      after: |-
        Beta names you can send in the `anthropic-beta` header.

        See [Beta headers](https://platform.claude.com/docs/en/api/beta-headers) for how to send them and where to find the name a feature needs.
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1164
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Documentation for BetaPluginVersion.description expanded to clarify length and sourcing behavior (may exceed 500 chars and may return a skill description in certain cases).
  paths:
    - path: components.schemas.BetaPluginVersion.properties.description.description
      before: The manifest's description; null when it declares none.
      after: The manifest's description; null when it declares none. The value can be longer than 500 characters, the limit on `description` in an uploaded manifest. A description that the manifest takes from a `SKILL.md` is cut to its first 500 characters. So if the manifest's description is the first 500 characters of exactly one distinct skill `description` in `components`, that skill `description` is returned instead.
  date: '2026-11-04'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1181
- change: changed
  target: request
  breaking: true
  deprecated: false
