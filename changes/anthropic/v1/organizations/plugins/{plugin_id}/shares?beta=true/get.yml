- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds a beta endpoint to list shares for a member-owned Plugin: GET /v1/organizations/plugins/{plugin_id}/shares. Returns most-recently granted shares to the whole organization, an RBAC group, or a single member. Read-only; organization-owned plugins return 404. Requires Claude Enterprise and the header anthropic-beta: ce-plugins-2026-09-01 (missing header returns 404). Supports pagination (limit, page), filtering by target_type, and cross-org reads via organization_id for parent audit/compliance keys. Accepted credentials: Admin API key with read:plugins or read:org_audit, or Compliance Access Key with read:compliance_org_data.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
