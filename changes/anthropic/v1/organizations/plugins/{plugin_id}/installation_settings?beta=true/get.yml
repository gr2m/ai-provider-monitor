- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds a beta endpoint to list an organization-owned plugin’s installation settings (organization-wide and per RBAC group), newest first. Requires Admin API key (read:plugins or read:org_audit) or Compliance key (read:compliance_org_data) and header anthropic-beta: ce-plugins-2026-09-01 (missing header returns 404). Supports pagination (limit, page), filtering by target_type, and cross-org reads via organization_id. Returns 404 for member-owned plugins and where Plugins API is unavailable.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Added a descriptive blurb to the AnthropicBeta schema used by the anthropic-beta header.
  paths:
    - path: components.schemas.AnthropicBeta.description
      before: 'null'
      after: |-
        Beta names you can send in the `anthropic-beta` header.

        See [Beta headers](https://platform.claude.com/docs/en/api/beta-headers) for how to send them and where to find the name a feature needs.
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1164
