- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds GET /v1/organizations/plugins/{plugin_id}/versions/{version}/content?beta=true to download a plugin version’s .zip archive exactly as stored; responds with application/zip attachment. Requires anthropic-beta: ce-plugins-2026-09-01 (missing header returns 404). Auth: Admin API key with read:plugins or read:org_audit, or Compliance Access Key with read:compliance_org_data; supports organization_id for parent-org audit keys. Downloads of members’ personal marketplace plugins are logged to Compliance API; org-owned plugin downloads are not.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
