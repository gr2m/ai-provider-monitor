- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds a beta endpoint for Claude Enterprise orgs to retrieve a specific plugin version (by version ID or ''latest''), returning version metadata (components, content_scan, manifest_version, reach, creator, etc.). Requires the header anthropic-beta: ce-plugins-2026-09-01 and appropriate credentials (read:plugins, read:org_audit, or read:compliance_org_data). Supports optional organization_id for parent-level audit/compliance keys.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Added description to AnthropicBeta schema explaining acceptable beta header names and linking to docs.
  paths:
    - path: $.components.schemas.AnthropicBeta.description
      before: 'null'
      after: |-
        Beta names you can send in the `anthropic-beta` header.

        See [Beta headers](https://platform.claude.com/docs/en/api/beta-headers) for how to send them and where to find the name a feature needs.
  date: '2026-11-02'
