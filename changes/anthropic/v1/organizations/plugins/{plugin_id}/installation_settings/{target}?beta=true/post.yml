- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Introduces a beta POST endpoint to set or change an organization-owned plugin''s installation setting for either the whole organization (target=''organization'') or a specific RBAC Group (target=''rbac_group_*''). Requires an Admin API key with write:plugins and the header anthropic-beta: ce-plugins-2026-09-01. Accepts installation_preference of required | auto_install | available | not_available and returns the resulting PluginInstallationSetting. Returns 404 for member-owned plugins or if the beta header is missing; may return 503 with x-should-retry: true under concurrent writes (safe to retry). Writing the organization target stops inheriting marketplace defaults.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
