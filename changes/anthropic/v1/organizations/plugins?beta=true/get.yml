- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Introduces beta endpoint GET /v1/organizations/plugins to list Plugins across an org and members’ personal marketplaces (newest first). Supports pagination and filters (limit, page, owner_type, owner_user_id, marketplace_id, created_at bounds, organization_id). Returns a Plugin list with next_page. Requires Admin API key with read:plugins or read:org_audit, or a Compliance Access Key with read:compliance_org_data. Must include header anthropic-beta: ce-plugins-2026-09-01; missing header returns 404. Available to Claude Enterprise orgs only (not Platform or HIPAA-ready).'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
