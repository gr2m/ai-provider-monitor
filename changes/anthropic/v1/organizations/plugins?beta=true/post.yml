  note: 'Beta endpoint to create an organization-owned Plugin and its first version by multipart/form-data upload of plugin files (manifest required). Optional marketplace_id and release_notes. Requires Admin API key (write:plugins) and header anthropic-beta: ce-plugins-2026-09-01. Returns Plugin; 409 on plugin_name_taken/skill_name_taken; 503 registration_pending includes stored IDs. Available to Claude Enterprise orgs only.'
