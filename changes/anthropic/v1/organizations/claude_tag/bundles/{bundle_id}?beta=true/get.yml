- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Introduces a beta GET endpoint to fetch a Claude Tag Bundle by ID, returning only bundle metadata (id, name, description, timestamps). It does not include the bundle’s granted connectors/repositories/credentials. Requires header anthropic-beta: experimental-claude-tag-2026-10-21 and path param bundle_id (capp_*).'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
