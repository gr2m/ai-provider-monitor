- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Introduces beta GET /v1/organizations/claude_tag/bundles/{bundle_id}/targets/{target_id}?beta=true to retrieve a single Bundle Target (Slack channel or workspace) for a given Bundle. Requires anthropic-beta: experimental-claude-tag-2026-10-21; returns 404 if the target belongs to another Bundle or was detached.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
