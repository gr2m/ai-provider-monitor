- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Added description to AnthropicBeta schema clarifying beta header usage.
  paths:
    - path: components/schemas/AnthropicBeta/description
      before: 'null'
      after: |-
        Beta names you can send in the `anthropic-beta` header.

