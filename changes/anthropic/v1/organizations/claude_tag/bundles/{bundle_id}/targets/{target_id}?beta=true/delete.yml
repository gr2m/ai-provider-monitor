- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Introduces beta DELETE /v1/organizations/claude_tag/bundles/{bundle_id}/targets/{target_id}?beta=true to detach a Bundle from a Slack channel or workspace by target_id (btgt_…). Repeated detach returns 404. Requires anthropic-beta: experimental-claude-tag-2026-10-21. Returns bundle_target_deleted with the detached target id on success.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: 403 response schema replaced BetaClaudeTagErrorResponse with an inline permission_error object; message and request_id are now required and details are constrained to new specific codes.
  paths:
    - path: responses.403.content.application/json.schema
      before: '{"$ref":"#/components/schemas/BetaClaudeTagErrorResponse"}'
      after: '{"type":"object","required":["error","request_id","type"],"properties":{"error":{"type":"object","required":["message","type"],"properties":{"type":{"const":"permission_error","type":"string"},"message":{"type":"string"},"details":{"anyOf":[{"$ref":"#/components/schemas/BetaClaudeTagApiKeyScopeMissingErrorDetails"},{"$ref":"#/components/schemas/BetaClaudeTagWritesNotEnabledErrorDetails"},{"$ref":"#/components/schemas/BetaClaudeTagComplianceConfigurationRestrictedErrorDetails"},{"$ref":"#/components/schemas/BetaClaudeTagOrganizationLevelScopedApiKeyRequiredErrorDetails"},{"type":"null"}]}}},"request_id":{"anyOf":[{"type":"string"},{"type":"null"}]},"type":{"const":"error","type":"string"}}'
  date: '2026-11-02'
