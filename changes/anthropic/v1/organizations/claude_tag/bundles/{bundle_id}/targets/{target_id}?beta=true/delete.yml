- change: removed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Removed Claude Tag-specific error schemas and their detail types from components.
  paths:
    - path: components.schemas.BetaClaudeTagErrorResponse
      before: '{"type":"object","required":["type","error"],"properties":{"type":{"const":"error","type":"string"},"error":{"discriminator":{"propertyName":"type","mapping":{"conflict_error":"#/components/schemas/BetaClaudeTagSettingsConflictError","invalid_request_error":"#/components/schemas/BetaClaudeTagSetUpSettingsRefusedError","not_found_error":"#/components/schemas/BetaClaudeTagEnvironmentNotFoundError","permission_error":"#/components/schemas/BetaClaudeTagCodedPermissionError"}},"oneOf":[{"$ref":"#/components/schemas/BetaClaudeTagCodedPermissionError"},{"$ref":"#/components/schemas/BetaClaudeTagSetUpSettingsRefusedError"},{"$ref":"#/components/schemas/BetaClaudeTagEnvironmentNotFoundError"},{"$ref":"#/components/schemas/BetaClaudeTagSettingsConflictError"}],"type":"object"},"request_id":{"anyOf":[{"type":"string"},{"type":"null"}],"default":null,"title":"Request Id"}}}'
      after: 'null'
    - path: components.schemas.BetaClaudeTagCodedPermissionError
      before: '{"type":"object","additionalProperties":false,"description":"Returned with status 403. `details.error_code` names the cause.","required":["type"],"properties":{"type":{"const":"permission_error","type":"string"},"message":{"type":"string"},"details":{"$ref":"#/components/schemas/BetaClaudeTagCodedPermissionError_Details"}}}'
      after: 'null'
    - path: components.schemas.BetaClaudeTagSetUpSettingsRefusedError
      before: '{"type":"object","additionalProperties":false,"description":"Returned with status 400 when the request set the channel up and `settings` was then refused. The channel stays set up with every setting unset.","required":["type"],"properties":{"type":{"const":"invalid_request_error","type":"string"},"message":{"type":"string"},"details":{"$ref":"#/components/schemas/BetaClaudeTagSetUpSettingsRefusedError_Details"}}}'
      after: 'null'
    - path: components.schemas.BetaClaudeTagEnvironmentNotFoundError
      before: '{"type":"object","additionalProperties":false,"description":"Returned with status 404 when `settings.environment_id` names no Environment within the organization''s reach. It says nothing about the `id` in the path.","required":["type"],"properties":{"type":{"const":"not_found_error","type":"string"},"message":{"type":"string"},"details":{"$ref":"#/components/schemas/BetaClaudeTagEnvironmentNotFoundError_Details"}}}'
      after: 'null'
    - path: components.schemas.BetaClaudeTagSettingsConflictError
      before: '{"type":"object","additionalProperties":false,"description":"Returned with status 409 when something else changed the resource while this request ran, or it was removed. Nothing of this request''s settings was stored. Read the resource again, then send the change again if it is still needed.","required":["type"],"properties":{"type":{"const":"conflict_error","type":"string"},"message":{"type":"string"},"details":{"allOf":[{"$ref":"#/components/schemas/BetaClaudeTagSettingsConflictError_Details"}],"description":"Set only when the request had set a channel up before the conflict."}}}'
      after: 'null'
    - path: components.schemas.BetaClaudeTagCodedPermissionError_Details
      before: '{"type":"object","additionalProperties":false,"required":["error_code"],"properties":{"error_code":{"type":"string","description":"A stable code that names the cause."}}}'
      after: 'null'
    - path: components.schemas.BetaClaudeTagSetUpSettingsRefusedError_Details
      before: '{"type":"object","additionalProperties":false,"required":["error_code","slack_channel_id"],"properties":{"error_code":{"type":"string","description":"A stable code that names the cause."},"slack_channel_id":{"type":"string","description":"The identifier of the channel the request set up, starting with `slch_`."}}}'
      after: 'null'
    - path: components.schemas.BetaClaudeTagEnvironmentNotFoundError_Details
      before: '{"type":"object","additionalProperties":false,"required":["error_code"],"properties":{"error_code":{"type":"string","description":"A stable code that names the cause."},"slack_channel_id":{"anyOf":[{"type":"string"},{"type":"null"}],"description":"On a setup request that set the channel up before the refusal: the channel''s identifier, starting with `slch_`. The channel stays set up with every setting unset."}}}'
      after: 'null'
    - path: components.schemas.BetaClaudeTagSettingsConflictError_Details
      before: '{"type":"object","additionalProperties":false,"required":["error_code","slack_channel_id"],"properties":{"error_code":{"type":"string","description":"A stable code that names the cause."},"slack_channel_id":{"type":"string","description":"The identifier of the channel the request set up, starting with `slch_`."}}}'
      after: 'null'
  date: '2026-11-02'
