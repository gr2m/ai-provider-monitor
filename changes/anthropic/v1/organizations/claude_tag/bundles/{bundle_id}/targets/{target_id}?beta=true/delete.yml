- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: 403 response replaced with an inline permission_error schema; message and request_id are now required and details accept specific claude-tag detail codes (api_key_scope_missing, claude_tag_writes_not_enabled, compliance_configuration_restricted, organization_level_scoped_api_key_required).
  paths:
    - path: responses.403.content.application/json.schema
      before: '#/components/schemas/BetaClaudeTagErrorResponse'
      after: inline permission_error object schema with required message, request_id, and details anyOf of specific claude-tag detail types
  date: '2026-11-02'
- change: added
