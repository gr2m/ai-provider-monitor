- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces a beta endpoint to list Slack channels and Slack workspaces a Bundle is attached to, ordered by created_at (newest first). Only organization-owned targets are returned. Supports pagination via limit and page, and requires the anthropic-beta header value experimental-claude-tag-2026-10-21. Response includes data[] of Bundle Targets (slack_channel or slack_workspace) and next_page.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
