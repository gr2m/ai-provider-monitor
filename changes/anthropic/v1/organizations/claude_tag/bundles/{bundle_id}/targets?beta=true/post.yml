- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added beta route POST /v1/organizations/claude_tag/bundles/{bundle_id}/targets?beta=true to attach a Bundle to a Slack channel or workspace. Requires anthropic-beta: experimental-claude-tag-2026-10-21. If already attached, returns the existing Bundle Target; attaching does not set up channels.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
