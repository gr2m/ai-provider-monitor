- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: 403 response no longer uses BetaClaudeTagErrorResponse. It is now an inline permission_error schema with specific details variants and request_id is required.
  paths:
    - path: responses/403/content/application/json/schema
      before: '#/components/schemas/BetaClaudeTagErrorResponse'
      after: (inline permission_error object schema with constrained details types)
    - path: responses/403/content/application/json/schema/required
      before: '["type","error"] (via BetaClaudeTagErrorResponse)'
      after: '["error","request_id","type"]'
    - path: responses/403/content/application/json/schema/properties/error/properties/details/anyOf
      before: (generic details with string error_code via BetaClaudeTagCodedPermissionError_Details)
      after: '[BetaClaudeTagApiKeyScopeMissingErrorDetails, BetaClaudeTagWritesNotEnabledErrorDetails, BetaClaudeTagComplianceConfigurationRestrictedErrorDetails, BetaClaudeTagOrganizationLevelScopedApiKeyRequiredErrorDetails, null]'
  date: '2026-11-02'
