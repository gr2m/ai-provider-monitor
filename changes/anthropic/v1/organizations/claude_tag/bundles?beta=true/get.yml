- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds beta endpoint GET /v1/organizations/claude_tag/bundles?beta=true to list an org’s Bundles, newest first, excluding Claude Tag’s own bundle. Requires anthropic-beta: experimental-claude-tag-2026-10-21; supports pagination with limit and page; returns data[] of Bundle objects and next_page.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
