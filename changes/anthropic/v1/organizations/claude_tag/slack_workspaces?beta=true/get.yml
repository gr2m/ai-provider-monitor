- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: 403 error response changed from BetaClaudeTagErrorResponse to an inline permission_error schema with structured details (specific claude_tag detail error codes) and now requires request_id.
  paths:
    - path: responses/403/content/application/json/schema
      before: '$ref -> #/components/schemas/BetaClaudeTagErrorResponse'
      after: 'inline object schema: { type: ''error'', error: { type: ''permission_error'', details: anyOf([...]) }, request_id: string|null }'
  date: '2026-11-02'
