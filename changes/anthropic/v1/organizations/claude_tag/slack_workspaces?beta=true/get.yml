  note: Added reply_mode setting to BetaClaudeTagSettings (nullable, channel-only)
  paths:
    - path: components/schemas/BetaClaudeTagSettings/properties/reply_mode
      before: 'null'
      after: '{"anyOf":[{"$ref":"#/components/schemas/BetaClaudeTagReplyMode"},{"type":"null"}],"description":"How Claude takes part in the channel. Only a channel stores one, and no settings level passes one on, so it is always null on a workspace. Null on a channel means the channel stores none yet: Claude then follows the reply mode chosen in Slack, if one was, else `automatic`. A stored reply mode can be changed but never cleared."}'
