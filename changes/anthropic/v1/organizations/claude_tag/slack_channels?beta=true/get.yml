- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New beta GET /v1/organizations/claude_tag/slack_channels to list Claude Tag–configured Slack channels in a Slack workspace, newest first. Supports single-channel lookup via slack_channel_id, effective settings via include_inherited (503 if a settings level can’t be read), pagination, and requires anthropic-beta=experimental-claude-tag-2026-10-21. Returns 404 for Enterprise Grid workspaces not yet set up.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
