- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified Slack channel id description (non-functional change).
  paths:
    - path: components/schemas/BetaClaudeTagSlackChannel/properties/id/description
      before: 'The channel''s identifier. Starts with `slch_`. It does not change for as long as the channel is set up, with one exception: a channel that is not configured gets a new one when claude.ai replaces its record, which happens only while the organization''s read-only mode is off. A channel that is removed and set up again also has a new one. The old one keeps returning 404; look the channel up by its Slack identifiers for the new one.'
      after: 'The channel''s identifier. Starts with `slch_`. It does not change for as long as the channel is set up, with one exception: a channel that is not configured can get a new one. A channel that is removed and set up again also has a new one. The old one keeps returning 404; look the channel up by its Slack identifiers for the new one.'
  date: '2026-11-02'
