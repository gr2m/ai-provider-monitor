- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added settings.reply_mode to request body (only channels accept it; workspace updates sending a value are refused).
  paths:
    - path: components/schemas/BetaClaudeTagSettingsUpdate/properties/reply_mode
      before: 'null'
      after: '{"anyOf":[{"$ref":"#/components/schemas/BetaClaudeTagReplyMode"},{"type":"null"}],"description":"How Claude takes part in the channel: `automatic`, `mention_only`, `always_awake` or `thread`. Only a channel takes one: an update of a workspace that sends a value is refused, and one that sends null changes nothing. Null never clears it: sent to a channel that stores none it changes nothing, and sent to a channel that stores one it is refused, because a stored reply mode can be changed but never cleared; a caller that wants Claude''s default behavior sends `automatic`."}'
  date: '2026-11-10'
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified environment_id may also be a self-hosted runner pool (ccpool_).
  paths:
    - path: components/schemas/BetaClaudeTagSettingsUpdate/properties/environment_id/description
      before: 'The environment Claude''s sessions run in: the identifier of an active environment of the organization, starting with `env_`. Null clears it.'
      after: 'The environment Claude''s sessions run in: the identifier of an active environment of the organization, starting with `env_`, or of a self-hosted runner pool of the organization that every member may use, starting with `ccpool_`. Null clears it.'
  date: '2026-11-10'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Response now includes settings.reply_mode field in BetaClaudeTagSettings (always null for workspaces).
  paths:
    - path: components/schemas/BetaClaudeTagSettings/properties/reply_mode
      before: 'null'
      after: '{"anyOf":[{"$ref":"#/components/schemas/BetaClaudeTagReplyMode"},{"type":"null"}],"description":"How Claude takes part in the channel. Only a channel stores one, and no settings level passes one on, so it is always null on a workspace. Null on a channel means the channel stores none yet: Claude then follows the reply mode chosen in Slack, if one was, else `automatic`. A stored reply mode can be changed but never cleared."}'
  date: '2026-11-10'
