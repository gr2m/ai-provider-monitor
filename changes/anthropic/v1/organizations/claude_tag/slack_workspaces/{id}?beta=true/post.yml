- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Introduced new ReplyMode schemas used by settings.reply_mode: base type and four variants.'
  paths:
    - path: components/schemas/BetaClaudeTagReplyMode
      before: 'null'
      after: '{"description":"How Claude takes part in a Slack channel. A channel alone stores one. More types can be added.","oneOf":[{"$ref":"#/components/schemas/BetaClaudeTagReplyModeAutomatic"},{"$ref":"#/components/schemas/BetaClaudeTagReplyModeMentionOnly"},{"$ref":"#/components/schemas/BetaClaudeTagReplyModeAlwaysAwake"},{"$ref":"#/components/schemas/BetaClaudeTagReplyModeThread"}]}'
    - path: components/schemas/BetaClaudeTagReplyModeAutomatic
      before: 'null'
      after: '{"properties":{"type":{"const":"automatic","type":"string"}},"description":"Claude reads along and joins in when it can help, and pauses on its own in quiet or busy channels.","type":"object"}'
    - path: components/schemas/BetaClaudeTagReplyModeMentionOnly
      before: 'null'
      after: '{"properties":{"type":{"const":"mention_only","type":"string"}},"description":"Claude replies only when it is @-mentioned.","type":"object"}'
    - path: components/schemas/BetaClaudeTagReplyModeAlwaysAwake
      before: 'null'
      after: '{"properties":{"type":{"const":"always_awake","type":"string"}},"description":"Like `automatic`, but Claude never pauses on its own. Available where it is enabled for the channel.","type":"object"}'
    - path: components/schemas/BetaClaudeTagReplyModeThread
      before: 'null'
      after: '{"properties":{"type":{"const":"thread","type":"string"}},"description":"Every new top-level message in the channel gets its own reply from Claude, in a thread under it. Available where it is enabled for the channel, and only once Claude has been used in the channel.","type":"object"}'
  date: '2026-11-10'
