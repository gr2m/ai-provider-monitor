- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduced new reply mode schemas used by settings.reply_mode.
  paths:
    - path: components/schemas/BetaClaudeTagReplyMode
      before: 'null'
      after: '{"oneOf":[{"$ref":"#/components/schemas/BetaClaudeTagReplyModeAutomatic"},{"$ref":"#/components/schemas/BetaClaudeTagReplyModeMentionOnly"},{"$ref":"#/components/schemas/BetaClaudeTagReplyModeAlwaysAwake"},{"$ref":"#/components/schemas/BetaClaudeTagReplyModeThread"}],"discriminator":{"propertyName":"type","mapping":{"always_awake":"#/components/schemas/BetaClaudeTagReplyModeAlwaysAwake","automatic":"#/components/schemas/BetaClaudeTagReplyModeAutomatic","mention_only":"#/components/schemas/BetaClaudeTagReplyModeMentionOnly","thread":"#/components/schemas/BetaClaudeTagReplyModeThread"}},"description":"How Claude takes part in a Slack channel. A channel alone stores one. More types can be added."}}'
    - path: components/schemas/BetaClaudeTagReplyModeAutomatic
      before: 'null'
      after: '{"type":"object","additionalProperties":false,"properties":{"type":{"const":"automatic","type":"string"}},"required":["type"],"description":"Claude reads along and joins in when it can help, and pauses on its own in quiet or busy channels."}'
    - path: components/schemas/BetaClaudeTagReplyModeMentionOnly
      before: 'null'
      after: '{"type":"object","additionalProperties":false,"properties":{"type":{"const":"mention_only","type":"string"}},"required":["type"],"description":"Claude replies only when it is @-mentioned."}'
    - path: components/schemas/BetaClaudeTagReplyModeAlwaysAwake
      before: 'null'
      after: '{"type":"object","additionalProperties":false,"properties":{"type":{"const":"always_awake","type":"string"}},"required":["type"],"description":"Like `automatic`, but Claude never pauses on its own. Available where it is enabled for the channel."}'
    - path: components/schemas/BetaClaudeTagReplyModeThread
      before: 'null'
      after: '{"type":"object","additionalProperties":false,"properties":{"type":{"const":"thread","type":"string"}},"required":["type"],"description":"Every new top-level message in the channel gets its own reply from Claude, in a thread under it. Available where it is enabled for the channel, and only once Claude has been used in the channel."}'
  date: '2026-11-10'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1206
