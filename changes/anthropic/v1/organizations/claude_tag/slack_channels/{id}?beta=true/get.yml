- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added reply_mode to BetaClaudeTagSettings to represent channel reply behavior.
  paths:
    - path: $.components.schemas.BetaClaudeTagSettings.properties.reply_mode
      before: 'null'
      after: '{"anyOf":[{"$ref":"#/components/schemas/BetaClaudeTagReplyMode"},{"type":"null"}],"description":"How Claude takes part in the channel. Only a channel stores one, and no settings level passes one on, so it is always null on a workspace. Null on a channel means the channel stores none yet: Claude then follows the reply mode chosen in Slack, if one was, else `automatic`. A stored reply mode can be changed but never cleared."}'
  date: '2026-11-10'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: BetaClaudeTagSettings.required now includes reply_mode.
  paths:
    - path: $.components.schemas.BetaClaudeTagSettings.required
      before: '["enabled","instructions","model","environment_id","guest_policy"]'
      after: '["enabled","instructions","model","environment_id","guest_policy","reply_mode"]'
  date: '2026-11-10'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated BetaClaudeTagSettings description to include reply_mode inheritance semantics.
  paths:
    - path: $.components.schemas.BetaClaudeTagSettings.description
      before: Claude Tag settings. Without `include_inherited`, a setting that is null is not set on the settings level and is inherited. With it, `enabled` and `guest_policy` are never null, and `instructions`, `model` and `environment_id` are null when no settings level sets them.
      after: Claude Tag settings. Without `include_inherited`, a setting that is null is not set on the settings level and is inherited. With it, `enabled` and `guest_policy` are never null, `instructions`, `model` and `environment_id` are null when no settings level sets them, and `reply_mode` is null unless the channel itself stores one.
  date: '2026-11-10'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduced ReplyMode schemas used by settings.reply_mode.
  paths:
    - path: $.components.schemas.BetaClaudeTagReplyMode
      before: 'null'
      after: '{"description":"How Claude takes part in a Slack channel. A channel alone stores one. More types can be added.","discriminator":{"mapping":{"always_awake":"#/components/schemas/BetaClaudeTagReplyModeAlwaysAwake","automatic":"#/components/schemas/BetaClaudeTagReplyModeAutomatic","mention_only":"#/components/schemas/BetaClaudeTagReplyModeMentionOnly","thread":"#/components/schemas/BetaClaudeTagReplyModeThread"},"propertyName":"type"},"oneOf":[{"$ref":"#/components/schemas/BetaClaudeTagReplyModeAutomatic"},{"$ref":"#/components/schemas/BetaClaudeTagReplyModeMentionOnly"},{"$ref":"#/components/schemas/BetaClaudeTagReplyModeAlwaysAwake"},{"$ref":"#/components/schemas/BetaClaudeTagReplyModeThread"}]}'
    - path: $.components.schemas.BetaClaudeTagReplyModeAutomatic
      before: 'null'
      after: '{"additionalProperties":false,"description":"Claude reads along and joins in when it can help, and pauses on its own in quiet or busy channels.","properties":{"type":{"const":"automatic","type":"string"}},"required":["type"],"type":"object"}'
    - path: $.components.schemas.BetaClaudeTagReplyModeMentionOnly
      before: 'null'
      after: '{"additionalProperties":false,"description":"Claude replies only when it is @-mentioned.","properties":{"type":{"const":"mention_only","type":"string"}},"required":["type"],"type":"object"}'
    - path: $.components.schemas.BetaClaudeTagReplyModeAlwaysAwake
      before: 'null'
      after: '{"additionalProperties":false,"description":"Like `automatic`, but Claude never pauses on its own. Available where it is enabled for the channel.","properties":{"type":{"const":"always_awake","type":"string"}},"required":["type"],"type":"object"}'
    - path: $.components.schemas.BetaClaudeTagReplyModeThread
      before: 'null'
      after: '{"additionalProperties":false,"description":"Every new top-level message in the channel gets its own reply from Claude, in a thread under it. Available where it is enabled for the channel, and only once Claude has been used in the channel.","properties":{"type":{"const":"thread","type":"string"}},"required":["type"],"type":"object"}'
  date: '2026-11-10'
