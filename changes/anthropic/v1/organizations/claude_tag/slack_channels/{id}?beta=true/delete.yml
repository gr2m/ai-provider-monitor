- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds a beta DELETE endpoint to remove a Slack channel from Claude Tag. Immediately deletes the channel’s settings and Bundle Targets; then asynchronously deletes sessions/transcripts, memory, routines, and published artifacts. Irreversible; Slack channel/messages remain. Requires anthropic-beta: experimental-claude-tag-2026-10-21. Returns 200 with {type:"slack_channel_deleted", id}; the id becomes 404 immediately after. Fails with 400 (error_code slack_channel_enabled) if the channel is enabled (including via inheritance)—disable first. Group DMs and channels with unmanaged config also return 400.'
  paths: []
  date: '2026-11-02'
