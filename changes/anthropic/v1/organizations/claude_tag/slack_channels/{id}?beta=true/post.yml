  note: 'Adds POST /v1/organizations/claude_tag/slack_channels/{id}?beta=true to partially update Claude Tag Slack channel settings. Null clears (inherits); if any value is refused, no changes are applied. Requires anthropic-beta: experimental-claude-tag-2026-10-21. Group DMs are not supported (400).'
