- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds a beta POST endpoint to set default_installation_preference for an organization-owned plugin marketplace. The default applies to all plugins lacking their own setting (including future ones). Requires Admin API key with write:plugins and header anthropic-beta: ce-plugins-2026-09-01. Returns the PluginMarketplace. 403 for personal marketplaces; 404 without beta header; available only to Claude Enterprise orgs.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Added descriptive documentation to the AnthropicBeta schema used by the anthropic-beta header.
  paths:
    - path: components/schemas/AnthropicBeta/description
      before: 'null'
      after: |-
        Beta names you can send in the `anthropic-beta` header.

        See [Beta headers](https://platform.claude.com/docs/en/api/beta-headers) for how to send them and where to find the name a feature needs.
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1165
