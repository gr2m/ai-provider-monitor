- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds a beta POST endpoint to set default_installation_preference for an organization-owned plugin marketplace. The default applies to all plugins lacking their own setting (including future ones). Requires Admin API key with write:plugins and header anthropic-beta: ce-plugins-2026-09-01. Returns the PluginMarketplace. 403 for personal marketplaces; 404 without beta header; available only to Claude Enterprise orgs.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: added
