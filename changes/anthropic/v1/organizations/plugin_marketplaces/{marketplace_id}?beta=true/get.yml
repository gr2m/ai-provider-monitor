- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Introduces beta GET /v1/organizations/plugin_marketplaces/{marketplace_id} to retrieve a plugin marketplace by ID. Requires header anthropic-beta: ce-plugins-2026-09-01 (missing returns 404). Auth: Admin key (read:plugins or read:org_audit) or Compliance Access Key (read:compliance_org_data). Available to Claude Enterprise orgs only.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
