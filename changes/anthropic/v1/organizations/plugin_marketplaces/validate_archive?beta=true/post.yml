- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds POST /v1/organizations/plugin_marketplaces/validate_archive?beta=true to validate a plugin marketplace uploaded as a .zip. Returns a JSON report (valid flag, manifest/plugin errors and warnings) without storing anything. Requires Admin API key (read:plugins or write:plugins) and the beta header anthropic-beta: ce-plugins-2026-09-01; accepts multipart/form-data with a single archive (max 32 MB).'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
