  note: 'Adds a beta endpoint to validate a plugin marketplace hosted in a public GitHub repo without syncing or storing it. Requires Admin API key (read:plugins or write:plugins) and header anthropic-beta: ce-plugins-2026-09-01. Returns a report on marketplace.json, plugin errors and warnings; private/missing repos are reported (valid: false).'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
