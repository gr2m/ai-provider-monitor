- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: 403 error response schema changed from generic ErrorResponse ($ref) to an inline schema with a specific PermissionError object and support for error.details.
  paths:
    - path: responses/403/content/application/json/schema
      before: '{"$ref":"#/components/schemas/ErrorResponse"}'
      after: '{"type":"object","title":"ErrorResponse","required":["error","request_id","type"],"properties":{"error":{"type":"object","title":"PermissionError","required":["message","type"],"properties":{"details":{"anyOf":[{"$ref":"#/components/schemas/SandboxEgressRestrictedErrorDetails"},{"type":"null"}]},"message":{"type":"string","default":"Permission denied","title":"Message","description":"A human-readable explanation of the error. Its wording can change, so don''t match on it."},"type":{"type":"string","const":"permission_error","default":"permission_error","title":"Type","description":"The broad category of the error."}}},"request_id":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Request Id"},"type":{"type":"string","const":"error","default":"error","title":"Type"}}}'
  date: '2026-11-09'
