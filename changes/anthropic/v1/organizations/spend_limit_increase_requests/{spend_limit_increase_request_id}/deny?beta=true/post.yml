      after: '{"type":"object","title":"ErrorResponse","required":["error","request_id","type"],"properties":{"error":{"type":"object","title":"PermissionError","required":["message","type"],"properties":{"message":{"type":"string","title":"Message","description":"A human-readable explanation of the error. Its wording can change, so don''t match on it.","default":"Permission denied"},"type":{"type":"string","title":"Type","description":"The broad category of the error.","const":"permission_error","default":"permission_error"},"details":{"anyOf":[{"$ref":"#/components/schemas/BetaSandboxEgressRestrictedErrorDetails"},{"type":"null"}],"description":"Machine-readable detail about the cause of the error. `error_code` names the cause; branch on it rather than on `message`. Absent when the error has no code. Treat an unrecognized `error_code` as the bare `type`."}}},"request_id":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Request Id"},"type":{"type":"string","title":"Type","const":"error","default":"error"}}}'
