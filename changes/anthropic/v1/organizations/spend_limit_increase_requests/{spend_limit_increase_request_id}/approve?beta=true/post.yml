  paths:
    - path: components/schemas/BetaApproveSpendLimitIncreaseRequestResponse/properties/actor
      before: '{"discriminator":{"mapping":{"scoped_api_key_actor":"#/components/schemas/BetaScopedApiKeyActorSchema","user_actor":"#/components/schemas/BetaUserActorSchema"},"propertyName":"type"},"oneOf":[{"$ref":"#/components/schemas/BetaUserActorSchema"},{"$ref":"#/components/schemas/BetaScopedApiKeyActorSchema"}],"title":"Actor"}'
      after: '{"$ref":"#/components/schemas/BetaSpendLimitIncreaseRequestActor"}'
