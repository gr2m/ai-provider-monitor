- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New beta POST endpoint to approve a pending spend limit increase request, setting the requester’s per-user spend limit to the provided amount (minor units), optionally overriding the period (daily/weekly/monthly), and allowing suppression of notification; returns the updated request with status approved and the new spend limit.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Response property spend_limit can now be null (previously always a SpendLimit object).
