- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New beta POST endpoint to approve a pending spend limit increase request, setting the requester’s per-user spend limit to the provided amount (minor units), optionally overriding the period (daily/weekly/monthly), and allowing suppression of notification; returns the updated request with status approved and the new spend limit.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added new component schema BetaSpendLimitIncreaseRequestActor used by the response 'actor' field
  paths:
    - path: components/schemas/BetaSpendLimitIncreaseRequestActor
      before: 'null'
      after: '{"description":"Who submitted the increase request.","discriminator":{"mapping":{"scoped_api_key_actor":"#/components/schemas/BetaScopedApiKeyActorSchema","user_actor":"#/components/schemas/BetaUserActorSchema"},"propertyName":"type"},"oneOf":[{"$ref":"#/components/schemas/BetaUserActorSchema"},{"$ref":"#/components/schemas/BetaScopedApiKeyActorSchema"}]}'
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added new component schema BetaSpendLimitIncreaseRequestResolvedBy used by the response 'resolved_by' field
  paths:
    - path: components/schemas/BetaSpendLimitIncreaseRequestResolvedBy
      before: 'null'
      after: '{"description":"Who approved or denied the increase request.","discriminator":{"mapping":{"scoped_api_key_actor":"#/components/schemas/BetaScopedApiKeyActorSchema","user_actor":"#/components/schemas/BetaUserActorSchema"},"propertyName":"type"},"oneOf":[{"$ref":"#/components/schemas/BetaUserActorSchema"},{"$ref":"#/components/schemas/BetaScopedApiKeyActorSchema"}]}'
  date: '2026-11-02'
