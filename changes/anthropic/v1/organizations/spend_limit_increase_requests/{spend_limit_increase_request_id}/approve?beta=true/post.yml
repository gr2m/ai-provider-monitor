- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Response 'resolved_by' now references a named schema (BetaSpendLimitIncreaseRequestResolvedBy) for its non-null variant; no functional change
  paths:
    - path: components/schemas/BetaApproveSpendLimitIncreaseRequestResponse/properties/resolved_by
      before: '{"anyOf":[{"discriminator":{"mapping":{"scoped_api_key_actor":"#/components/schemas/BetaScopedApiKeyActorSchema","user_actor":"#/components/schemas/BetaUserActorSchema"},"propertyName":"type"},"oneOf":[{"$ref":"#/components/schemas/BetaUserActorSchema"},{"$ref":"#/components/schemas/BetaScopedApiKeyActorSchema"}]},{"type":"null"}],"title":"Resolved By"}'
      after: '{"anyOf":[{"$ref":"#/components/schemas/BetaSpendLimitIncreaseRequestResolvedBy"},{"type":"null"}]}'
  date: '2026-11-02'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Response 'spend_limit' may now be null (anyOf [SpendLimit, null]) whereas previously it was always a SpendLimit object
  paths:
