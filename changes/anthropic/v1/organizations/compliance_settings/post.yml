- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /v1/organizations/compliance_settings to update an org’s Compliance Settings—enable or disable the Compliance API—and return the resulting state.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Route description updated to clarify that Access Transparency events continue to be captured while the Compliance API is disabled and will be available once re-enabled.
  paths:
    - path: description
      before: |-
        Update your organization's Compliance Settings.

        Setting `state` to `enabled` turns on the Compliance API and begins
        capturing organization activity events. Setting it to `disabled` turns
        both off. `state` reflects whether the Compliance API is enabled.

        A request that sets `state` to its current value succeeds and leaves the
        resource unchanged. A `disabled` request stays in effect until a later
        `enabled` request or the organization's next provisioning action that
        enables Access Transparency: enabling Access Transparency also enables
        the Compliance API, which serves its activity events, so such
        provisioning (including re-runs) re-enables the Compliance API even
        after a `disabled` request. Automated provisioning never disables
        compliance settings.
      after: |-
        Update your organization's Compliance Settings.

        Setting `state` to `enabled` turns on the Compliance API and begins
        capturing organization activity events. Setting it to `disabled` turns
        both off. Access Transparency events are an exception: they are still
        captured while the Compliance API is disabled, and the Compliance API
        activity feed returns them once it is enabled again. `state` reflects
        whether the Compliance API is enabled.

        A request that sets `state` to its current value succeeds and leaves the
        resource unchanged. A `disabled` request stays in effect until a later
        `enabled` request or the organization's next provisioning action that
        enables Access Transparency: enabling Access Transparency also enables
        the Compliance API, which serves its activity events, so such
        provisioning (including re-runs) re-enables the Compliance API even
        after a `disabled` request. Automated provisioning never disables
        compliance settings.
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1164
