  note: Adds POST /v1/organizations/service_accounts/{service_account_id} to update a service account’s description and organization_role (name is immutable). Requires OAuth token with org:admin scope (no Admin API keys). Archived accounts cannot be updated. Setting organization_role=admin requires an interactive credential.
