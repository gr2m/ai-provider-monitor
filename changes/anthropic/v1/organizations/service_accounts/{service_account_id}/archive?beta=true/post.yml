- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/organizations/service_accounts/{service_account_id}/archive?beta=true to archive a service account. Idempotent; returns the original archived_at if already archived. Requires OAuth token with org:admin scope (WIF ok); Admin API keys not accepted. Returns BetaServiceAccount on success. 400 if any live federation rule still targets the service account.
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
