- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New beta endpoint to remove a service account from a workspace. Requires OAuth token with org:admin scope; operation is idempotent; deleting implicit default-workspace membership is a no-op; archived workspaces return 400.
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
- change: changed
