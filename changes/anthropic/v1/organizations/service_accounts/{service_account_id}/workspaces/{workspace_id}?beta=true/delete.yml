- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added explicit error responses: 400, 401, 403, 404, 408, 409, 412, 413, 429, 431, 499, 500, 501, 503, 504, 529.'
  paths:
    - path: responses["400"]
      before: 'null'
      after: Invalid argument - The client specified an invalid argument
    - path: responses["401"]
      before: 'null'
      after: Unauthenticated - The request does not have valid authentication credentials
    - path: responses["403"]
      before: 'null'
      after: Permission denied - The caller does not have permission to execute the specified operation
    - path: responses["404"]
      before: 'null'
      after: Not found - Some requested entity was not found
    - path: responses["408"]
      before: 'null'
      after: Deadline exceeded - The deadline expired before the operation could complete
    - path: responses["409"]
      before: 'null'
      after: Aborted - The operation was aborted due to concurrency issue
    - path: responses["412"]
      before: 'null'
      after: Failed precondition - Operation was rejected because the system is not in required state
    - path: responses["413"]
      before: 'null'
      after: Out of range - Operation was attempted past the valid range
    - path: responses["429"]
      before: 'null'
      after: Resource exhausted - Some resource has been exhausted (rate limiting)
    - path: responses["431"]
      before: 'null'
      after: Request header fields too large - Request metadata was too large
    - path: responses["499"]
      before: 'null'
      after: Cancelled - The operation was cancelled by the client
    - path: responses["500"]
      before: 'null'
      after: Internal - Internal server error
    - path: responses["501"]
      before: 'null'
      after: Unimplemented - The operation is not implemented or supported
    - path: responses["503"]
      before: 'null'
      after: Unavailable - The service is currently unavailable
    - path: responses["504"]
      before: 'null'
      after: Deadline exceeded - Upstream service did not respond in time
    - path: responses["529"]
      before: 'null'
      after: Overloaded - The service is temporarily overloaded
  date: '2026-11-02'
