- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds POST /v1/organizations/service_accounts/{service_account_id}/workspaces?beta=true to create or update a service account’s explicit membership in a workspace by assigning workspace_role. Requires OAuth access token with org:admin scope (Admin API keys not accepted). Rejects archived workspaces and archived service accounts. Mirrors POST /workspaces/{workspace_id}/service_accounts. Request body: {workspace_id, workspace_role}. Returns service_account_workspace_member.'
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
