- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New beta GET /v1/organizations/service_accounts/{service_account_id}/workspaces lists all workspaces a service account belongs to, including workspace_role. Supports limit and next_page pagination and returns an implicit default-workspace membership first when no explicit default exists. Requires OAuth access token with org:admin (Admin API keys not accepted). Memberships are returned only while the service account is active.
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: Header parameter 'anthropic-beta' schema changed from a single string to an array of values (items now reference components schema AnthropicBeta).
  paths:
    - path: parameters[name=anthropic-beta].schema.type
      before: '"string"'
      after: '"array"'
    - path: parameters[name=anthropic-beta].schema.items
      before: '{"type":"string"}'
      after: '{"$ref":"#/components/schemas/AnthropicBeta"}'
    - path: parameters[name=anthropic-beta].description
      before: '"Optional header to specify the beta version(s) you want to use.\n\nTo use multiple betas, use a comma separated list like `beta1,beta2` or specify the header multiple times for each beta."'
      after: '"Optional header to specify the beta version(s) you want to use."'
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
