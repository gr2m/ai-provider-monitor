- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/organizations/service_accounts/{service_account_id}/archive to archive a service account. Requires OAuth access token with org:admin scope (no Admin API keys). Idempotent; returns the ServiceAccount (same archived_at if already archived). Returns 400 if any live federation rule still targets this service account.
