- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/organizations/service_accounts to create a service account in the caller’s organization. Requires an OAuth access token with org:admin scope (Admin API keys not accepted). Accepts name (required), optional description, and organization_role (developer default; admin requires an interactive user credential). Returns the created ServiceAccount.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
