- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 403 response schema changed from generic ErrorResponse ref to an inline ErrorResponse with PermissionError that can include machine-readable details.
  paths:
    - path: responses/403/content/application/json/schema
      before: '$ref: #/components/schemas/ErrorResponse'
      after: Inline ErrorResponse object with PermissionError (supports error.details)
  date: '2026-11-09'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: PermissionError in 403 responses may now include error.details with a sandbox_egress_restricted code.
  paths:
    - path: responses/403/content/application/json/schema/properties/error/properties/details
      before: 'null'
      after: 'anyOf: [#/components/schemas/SandboxEgressRestrictedErrorDetails, null]'
  date: '2026-11-09'
- change: added
