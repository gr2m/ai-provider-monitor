- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/organizations/federation_rules/{federation_rule_id} to partially update a federation rule. Requires OAuth token with org:admin scope. Allows updating name, description, oauth_scope, token_lifetime_seconds, workspace enablement, and replacing match/target objects; issuer_id is immutable. Archived rules cannot be updated; invalid references return 400; OAuth callers limited to workspace:developer or workspace:inference scopes.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
