- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds GET /v1/organizations/federation_rules/{federation_rule_id} to retrieve a federation rule by ID, returning a FederationRule. Requires OAuth access token with org:admin scope (Admin API keys not accepted).
