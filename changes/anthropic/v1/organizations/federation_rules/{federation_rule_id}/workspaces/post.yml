- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Introduces POST /v1/organizations/federation_rules/{federation_rule_id}/workspaces to enable a federation rule for a specified workspace. Idempotent (re-enabling returns existing enablement). Requires OAuth token with org:admin scope (Admin API keys not accepted). Archived rules rejected (400). OAuth callers may only manage rules with oauth_scope workspace:developer or workspace:inference; other scopes require a Console session. Request body: {workspace_id}. Response: FederationRuleWorkspace.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
