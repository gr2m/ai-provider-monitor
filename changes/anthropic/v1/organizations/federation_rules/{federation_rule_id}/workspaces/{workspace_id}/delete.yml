- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds DELETE /v1/organizations/federation_rules/{federation_rule_id}/workspaces/{workspace_id} to disable a federation rule for a workspace. Idempotent; requires OAuth token with org:admin (Admin API keys not accepted). OAuth callers can only manage rules with oauth_scope workspace:developer or workspace:inference.
  paths: []
