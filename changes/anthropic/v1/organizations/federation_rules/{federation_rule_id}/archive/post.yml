- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/organizations/federation_rules/{federation_rule_id}/archive to archive a federation rule. Requires an OAuth access token with org:admin scope (Admin API keys not accepted). Archiving immediately stops token exchange, is idempotent (re-archiving returns original archived_at), and clears workspace targeting (workspace_id and workspace_ids emptied). Tokens minted before archive remain valid until expiry. OAuth callers may only manage rules whose oauth_scope is workspace:developer or workspace:inference; other scopes require a Console session.
  paths: []
  date: '2026-11-02'
