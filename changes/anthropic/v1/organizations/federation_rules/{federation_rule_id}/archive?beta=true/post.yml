- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds a beta endpoint to archive a federation rule, immediately stopping token exchange. Idempotent (re-archiving returns the same archived_at) and clears workspace targeting (workspace_id/workspace_ids emptied). Tokens minted before archiving remain valid until expiry. Requires an OAuth access token with org:admin (Admin API keys not accepted). Enable via ?beta=true.
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
