- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/organizations/federation_rules to create an org-owned federation rule that binds external OIDC identities (via issuer + match conditions) to a service account. Requires OAuth access token with org:admin scope (Admin API keys not accepted). Validates issuer, target service account, and workspace enablement; returns the created FederationRule.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
