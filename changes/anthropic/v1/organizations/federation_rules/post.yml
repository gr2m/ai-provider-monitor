- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 403 response now uses an inline ErrorResponse with PermissionError and supports error.details, replacing the generic ErrorResponse $ref.
  paths:
    - path: /responses/403/content/application/json/schema
      before: '{"$ref":"#/components/schemas/ErrorResponse"}'
      after: '{"title":"ErrorResponse","type":"object","properties":{"error":{"title":"PermissionError","type":"object","properties":{"type":{"const":"permission_error"},"message":{"type":"string"},"details":{"anyOf":[{"$ref":"#/components/schemas/SandboxEgressRestrictedErrorDetails"},{"type":"null"}]}}},"request_id":{"anyOf":[{"type":"string"},{"type":"null"}]},"type":{"const":"error"}},"required":["error","request_id","type"]}'
  date: '2026-11-09'
