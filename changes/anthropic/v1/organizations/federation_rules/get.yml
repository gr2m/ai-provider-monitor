- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds GET /v1/organizations/federation_rules to list organization WIF federation rules. Requires OAuth access token with org:admin scope (Admin API keys not accepted). Supports pagination (limit, page), filtering by issuer_id, and optional inclusion of archived rules via include_archived=true. Returns FederationRuleListResponse with data and next_page; optional anthropic-version header.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
