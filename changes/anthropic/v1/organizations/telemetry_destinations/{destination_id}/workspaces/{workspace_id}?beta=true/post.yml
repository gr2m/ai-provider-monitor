- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Introduces a beta endpoint to add a workspace to a telemetry destination’s workspace list. Returns the existing entry if already present; fails for destinations with workspaces.type=all or for archived workspaces. Requires anthropic-beta: telemetry-destinations-2026-08-11.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
