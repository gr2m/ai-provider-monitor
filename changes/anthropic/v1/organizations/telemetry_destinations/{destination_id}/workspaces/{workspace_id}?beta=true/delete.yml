- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds DELETE /v1/organizations/telemetry_destinations/{destination_id}/workspaces/{workspace_id} to remove a workspace from a telemetry destination’s workspace list (include/exclude). Requires anthropic-beta: telemetry-destinations-2026-08-11. Returns 404 if the workspace isn’t on the list and 400 if the destination uses workspaces.type=all. Archived workspaces can also be removed. 200 returns a confirmation object.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
