- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds beta endpoint to test a telemetry destination by sending one ''anthropic.test'' span with registered headers, no retries. Always returns 200 with result.success or result.failure (with error). Does not change destination state/health; disabled destinations can be tested. Requires anthropic-beta: telemetry-destinations-2026-08-11. 10s cooldown per destination, else 429.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
