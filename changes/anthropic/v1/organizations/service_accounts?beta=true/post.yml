- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds beta endpoint POST /v1/organizations/service_accounts?beta=true to create a service account in the caller''s org. Requires OAuth token with org:admin scope (no Admin API keys). Body: name (required), optional description, organization_role (developer default or admin). Returns the created service account.'
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
