  note: 'Adds POST /v1/organizations/telemetry_destinations?beta=true (beta) to register an OpenTelemetry destination for an organization. Destination starts enabled, max 10 per org. Requires anthropic-beta: telemetry-destinations-2026-08-11. Accepts endpoint_url, optional headers, traces, and workspaces; returns the created telemetry_destination.'
  paths: []
