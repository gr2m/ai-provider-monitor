  note: Added a description to the AnthropicBeta schema explaining usage of the anthropic-beta header; no structural changes.
  paths:
    - path: components/schemas/AnthropicBeta/description
      before: 'null'
      after: |-
        Beta names you can send in the `anthropic-beta` header.

