  note: 'Introduces GET /v1/organizations/telemetry_destinations (beta) to list an org’s OpenTelemetry destinations, newest first, with limit/page pagination and optional workspace_ids[] filtering. Requires anthropic-beta: telemetry-destinations-2026-08-11. Returns data[] of destinations and next_page cursor, including per-destination traces settings, state, delivery_health, and workspace coverage.'
