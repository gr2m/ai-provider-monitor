- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /v1/organizations/invites to create an invite for a user by email, setting a role and optional RBAC group IDs. On seat-limited plans it consumes the next available seat and fails with 400 if none are available. Returns an InviteSchema on success.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description for RbacGroupOwnerAccessUnconfirmedErrorDetails (removed parenthetical about fixed limit).
  paths:
    - path: $.components.schemas.RbacGroupOwnerAccessUnconfirmedErrorDetails.description
      before: The API could not finish checking whether an RBAC Group in the request grants owner access (the check reached a fixed limit), so it made no change. Retrying the same request will not help. Make the change in the organization's admin settings in Claude.
      after: The API could not finish checking whether an RBAC Group in the request grants owner access, so it made no change. Retrying the same request will not help. Make the change in the organization's admin settings in Claude.
