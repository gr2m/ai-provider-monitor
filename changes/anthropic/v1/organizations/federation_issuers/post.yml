- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /v1/organizations/federation_issuers to register an external OIDC issuer trusted for workload identity federation (WIF) within an organization. Requires an OAuth access token with org:admin scope. Supports JWKS via discovery, explicit_url, or inline keys, with optional replay protection (check_jti) and max JWT lifetime controls.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
