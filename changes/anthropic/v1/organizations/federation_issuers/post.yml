- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: 403 Permission denied response changed from generic ErrorResponse to an inline PermissionError object that may include machine-readable `details` (e.g., sandbox_egress_restricted).
  paths:
    - path: $.responses.403.content.application/json.schema.$ref
      before: '#/components/schemas/ErrorResponse'
      after: 'null'
    - path: $.responses.403.content.application/json.schema.type
      before: 'null'
      after: object
    - path: $.responses.403.content.application/json.schema.properties.error.properties.details
      before: 'null'
      after: '{"anyOf":[{"$ref":"#/components/schemas/SandboxEgressRestrictedErrorDetails"},{"type":"null"}]}'
  date: '2026-11-09'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added SandboxEgressRestrictedErrorDetails schema to provide structured error details for sandbox egress restriction in 403 errors.
  paths:
    - path: $.components.schemas.SandboxEgressRestrictedErrorDetails
      before: 'null'
      after: '{"type":"object","title":"SandboxEgressRestrictedErrorDetails","description":"The request came from a Claude sandbox with restricted network access, which is not allowed to make this change. Send it from outside the sandbox, or from a sandbox with unrestricted network access.","required":["error_code"],"properties":{"error_code":{"type":"string","const":"sandbox_egress_restricted","title":"Error Code"}}}'
  date: '2026-11-09'
