- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New GET /v1/organizations/federation_issuers endpoint to list federation issuers in an org. Requires OAuth access token with org:admin scope (Admin API keys not accepted). Supports pagination via limit and page cursor; archived issuers excluded unless include_archived=true. Returns issuers with JWKS config and poll status plus next_page cursor.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
