- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds beta POST /v1/organizations/federation_issuers/{federation_issuer_id}?beta=true to partially update a federation issuer. Requires OAuth access token with org:admin scope (Admin API keys not accepted). Archived issuers cannot be updated; setting jwks replaces the entire JWKS config. Some updates require a Console session if the issuer backs rules with scopes beyond workspace:developer or workspace:inference.
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
