- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds POST /v1/organizations/webhooks?beta=true to create organization-level webhook endpoints (max 32 per org). Requires header anthropic-beta: webhooks-2026-10-07 and beta=true. Accepts url and enabled_events; returns endpoint details with a one-time signing_secret. Returns 404 without the beta header or if the feature isn’t enabled; unavailable for HIPAA-ready orgs.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
