- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: 403 response schema changed from a generic ErrorResponse $ref to an inline schema with PermissionError (enabling error.details).
  paths:
    - path: responses.403.content.application/json.schema
      before: '#/components/schemas/ErrorResponse'
      after: inline ErrorResponse object with error=PermissionError (incl. details), request_id, type
  date: '2026-11-09'
- change: added
