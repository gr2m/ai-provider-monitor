  note: 'New endpoint to add a user to an RBAC group: POST /v1/organizations/rbac_groups/{rbac_group_id}/members. Requires user_id in the body and returns the created rbac_group_member. Modifications are not allowed for SCIM-provisioned groups while SCIM is active; available to Claude Enterprise organizations only.'
