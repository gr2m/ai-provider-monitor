- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 403 error now includes optional `details` field that may contain `sandbox_egress_restricted` info.
  paths:
    - path: responses/403/content/application/json/schema/properties/error/properties/details
      before: 'null'
      after: '{"anyOf":[{"$ref":"#/components/schemas/SandboxEgressRestrictedErrorDetails"},{"type":"null"}],"description":"Machine-readable detail about the cause of the error. `error_code` names the cause; branch on it rather than on `message`. Absent when the error has no code. Treat an unrecognized `error_code` as the bare `type`."}'
  date: '2026-11-09'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: New component schema SandboxEgressRestrictedErrorDetails to describe sandbox egress restriction error detail.
