  note: 'New beta DELETE endpoint to remove a user from an RBAC Group: DELETE /v1/organizations/rbac_groups/{rbac_group_id}/members/{user_id}?beta=true. Available to Claude Enterprise orgs only; SCIM-provisioned group membership cannot be modified via API. On success returns rbac_group_member_deleted with rbac_group_id and user_id.'
