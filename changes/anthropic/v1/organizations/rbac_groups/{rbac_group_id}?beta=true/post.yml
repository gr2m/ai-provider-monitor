- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds beta endpoint POST /v1/organizations/rbac_groups/{rbac_group_id}?beta=true to update an RBAC group's name. SCIM-provisioned groups cannot be modified via API while SCIM is active. Available to Claude Enterprise orgs only. Returns the updated rbac_group object on success.
