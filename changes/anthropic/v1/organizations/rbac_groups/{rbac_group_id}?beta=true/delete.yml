- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds beta DELETE /v1/organizations/rbac_groups/{rbac_group_id} to delete an RBAC Group (Enterprise-only). SCIM-provisioned groups cannot be deleted while SCIM is enabled. Returns rbac_group_deleted; specific errors if the group grants or may grant owner access.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description for RBAC group owner-access-unconfirmed error details (removed parenthetical about a fixed limit).
  paths:
    - path: components/schemas/BetaRbacGroupOwnerAccessUnconfirmedErrorDetails/description
      before: The API could not finish checking whether an RBAC Group in the request grants owner access (the check reached a fixed limit), so it made no change. Retrying the same request will not help. Make the change in the organization's admin settings in Claude.
