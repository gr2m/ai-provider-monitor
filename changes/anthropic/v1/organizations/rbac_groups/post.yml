- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 403 Permission denied response is now inlined and may include error.details with error_code "sandbox_egress_restricted" when sent from a restricted Claude sandbox.
  paths:
    - path: responses/403/content/application/json/schema/$ref
      before: '#/components/schemas/ErrorResponse'
      after: 'null'
    - path: responses/403/content/application/json/schema/properties/error/properties/details
      before: 'null'
      after: anyOf [#/components/schemas/SandboxEgressRestrictedErrorDetails, null]
    - path: components/schemas/SandboxEgressRestrictedErrorDetails
      before: 'null'
      after: object schema with const error_code 'sandbox_egress_restricted'
  date: '2026-11-09'
