- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds beta endpoint POST /v1/organizations/users/{user_id}/sign_out?beta=true to sign a member out everywhere without removal. Ends active sessions and OAuth tokens issued for this org; returns the user object. Requires header anthropic-beta: admin-user-sign-out-2026-10-08. Cannot sign out primary owner or self; some privileged roles may be refused (400/403). 503 indicates retry to complete.'
