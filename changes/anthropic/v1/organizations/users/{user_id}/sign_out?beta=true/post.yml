- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds POST /v1/organizations/users/{user_id}/sign_out to remotely sign a member out of Claude everywhere without removing them from the org. Ends active sessions, removes trusted devices, and revokes OAuth tokens issued for this org. Requires anthropic-beta: admin-user-sign-out-2026-10-08 (returns 400 if missing or org not enrolled). In Claude Enterprise, API keys need write:members. Cannot sign out primary owner or self; may be refused for owners/membership admins (400/403). 503 indicates retry; 200 returns the User object.'
  paths: []
  date: '2026-11-05'
