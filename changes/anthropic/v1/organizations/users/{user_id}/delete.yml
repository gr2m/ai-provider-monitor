- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New endpoint DELETE /v1/organizations/users/{user_id} removes a member from the organization by user_id. Returns a user_deleted object on success; supports optional anthropic-version header and standard error responses (e.g., cannot_remove_last_member, permission/auth, not found, and 409 concurrent membership change).
  paths: []
  date: '2026-11-02'
