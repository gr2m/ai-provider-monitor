- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 403 response schema changed from a generic ErrorResponse reference to an inline schema that supports optional error.details.
  paths:
    - path: responses/403/content/application/json/schema
      before: '{"$ref":"#/components/schemas/ErrorResponse"}'
      after: '{"properties":{"error":{"properties":{"details":{"anyOf":[{"$ref":"#/components/schemas/SandboxEgressRestrictedErrorDetails"},{"type":"null"}],"description":"Machine-readable detail about the cause of the error. `error_code` names the cause; branch on it rather than on `message`. Absent when the error has no code. Treat an unrecognized `error_code` as the bare `type`."},"message":{"default":"Permission denied","description":"A human-readable explanation of the error. Its wording can change, so don''t match on it.","title":"Message","type":"string"},"type":{"const":"permission_error","default":"permission_error","description":"The broad category of the error.","title":"Type","type":"string"}},"required":["message","type"],"title":"PermissionError","type":"object"},"request_id":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Request Id"},"type":{"const":"error","default":"error","title":"Type","type":"string"}},"required":["error","request_id","type"],"title":"ErrorResponse","type":"object"}'
  date: '2026-11-09'
