- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated role field description to note that setting role to 'managed' requires the 'write:rbac_groups' scope in addition to 'write:members' for Claude Enterprise organizations.
  paths:
    - path: components/schemas/BetaUpdateUserParams/properties/role/description
      before: New role for the User.\n\nThe accepted values depend on the organization type. Console and API organizations accept `user`, `developer`, `billing`, and `claude_code_user`; `admin` cannot be assigned through the API. Claude Enterprise organizations accept `user` and `managed`.
      after: 'New role for the User.\n\nThe accepted values depend on the organization type. Console and API organizations accept `user`, `developer`, `billing`, and `claude_code_user`; `admin` cannot be assigned through the API. Claude Enterprise organizations accept `user` and `managed`; changing a User''s role to `managed` requires the `write:rbac_groups` scope in addition to `write:members`. '
  date: '2026-11-02'
