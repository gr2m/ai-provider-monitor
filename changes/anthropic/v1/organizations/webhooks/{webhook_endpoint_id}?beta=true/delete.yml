- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'New beta endpoint to delete an organization webhook endpoint: DELETE /v1/organizations/webhooks/{webhook_endpoint_id}?beta=true. Requires header ''anthropic-beta: webhooks-2026-10-07''. On success returns 200 with {id, type:''webhook_endpoint_deleted''}. Returns 404 if header missing or org not enabled; not available to HIPAA-ready orgs.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
