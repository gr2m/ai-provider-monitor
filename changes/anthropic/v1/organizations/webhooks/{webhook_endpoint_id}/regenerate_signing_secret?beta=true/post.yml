  note: 'Adds POST /v1/organizations/webhooks/{webhook_endpoint_id}/regenerate_signing_secret?beta=true to rotate an organization webhook endpoint''s signing secret. Old secret is invalid immediately; the new secret is returned only in this 200 response. Requires header anthropic-beta: webhooks-2026-10-07 or returns 404. Endpoint is org-gated (404 until enabled) and unavailable for HIPAA-ready orgs.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
