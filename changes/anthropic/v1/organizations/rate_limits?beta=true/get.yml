    - path: components.schemas.BetaRateLimit.properties.models.description
      before: Model names this entry's limits apply to, including aliases. `null` when `group_type` is not `"model_group"`.
      after: Model names this entry's limits apply to, including aliases. `null` when `group.type` is not `"model_group"`. The list covers the models your organization has access to, so it can differ between organizations.
