- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces beta GET /v1/organizations/rate_limits to list an organization’s rate limits by group (model families and API categories). Supports optional filters (model, group_type), returns per-group limiters with next_page for future pagination; 404 if model filter not found; uses Admin API key and anthropic-version headers.
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: true
  note: The limit query parameter is no longer ignored; providing it now paginates results. Omitting limit returns all remaining entries in one page.
  paths:
    - path: parameters[name=limit].description
      before: |-
        Maximum number of items to return per page. Ranges from `1` to `1000`.

        Accepted for request-shape compatibility and currently ignored: every entry is returned in a single page.
      after: |-
        Maximum number of items to return per page. Ranges from `1` to `1000`.

        When omitted, every remaining entry is returned in a single page and `next_page` is `null`.
    - path: parameters[name=limit].schema.description
      before: |-
        Maximum number of items to return per page. Ranges from `1` to `1000`.

        Accepted for request-shape compatibility and currently ignored: every entry is returned in a single page.
      after: |-
        Maximum number of items to return per page. Ranges from `1` to `1000`.

        When omitted, every remaining entry is returned in a single page and `next_page` is `null`.
  date: '2026-08-27'
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Route description updated to reflect pagination behavior when limit is omitted vs. provided.
  paths:
    - path: description
      before: |-
        List Messages API rate limits for your organization.

        Each entry corresponds to one rate-limit group (either a model family
        or an API-surface category such as the Files API or Message Batches)
        and contains the set of limiter values that apply to it.

        This endpoint currently returns every matching entry in a single page
        regardless of `limit`; follow `next_page` so that clients keep working
        when pagination is enabled.
      after: |-
        List Messages API rate limits for your organization.

        Each entry corresponds to one rate-limit group (either a model family
        or an API-surface category such as the Files API or Message Batches)
        and contains the set of limiter values that apply to it.

        When `limit` is omitted, every matching entry is returned in a single
        page; when `limit` truncates the result, follow `next_page` to fetch
        the remaining entries.
  date: '2026-08-27'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: 'Clarified next_page semantics: it''s an opaque cursor or null when no more entries remain.'
  paths:
    - path: components.schemas.BetaRateLimitListResponse.properties.next_page.description
      before: Token to provide in as `page` in the subsequent request to retrieve the next page of data.
      after: Opaque cursor for the next page of results, or `null` when no entries remain beyond this response.
  date: '2026-08-27'
