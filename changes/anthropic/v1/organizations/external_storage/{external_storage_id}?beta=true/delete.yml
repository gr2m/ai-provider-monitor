  note: 'Beta endpoint to delete an external storage by ID. Immediately deletes storage that is pending configuration, available, or active but never attached; otherwise returns 400 with next steps. On draining storage, delete may start a non-reversible removal (check status.removal_started and retry to finish). On Claude Platform on AWS, use the bucket ARN as the ID. Requires anthropic-beta: efs-2026-10-01.'
