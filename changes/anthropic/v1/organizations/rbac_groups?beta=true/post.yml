- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/organizations/rbac_groups?beta=true to create an RBAC Group in a Claude Enterprise tenant. Accepts JSON body with name and returns the RBAC group object. Groups created via API have source_type "direct". Available to Claude Enterprise organizations only.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
