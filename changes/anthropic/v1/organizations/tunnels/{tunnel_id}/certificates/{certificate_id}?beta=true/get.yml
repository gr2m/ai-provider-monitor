  note: 'New deprecated Admin API route to retrieve a single tunnel certificate by ID: GET /v1/organizations/tunnels/{tunnel_id}/certificates/{certificate_id}?beta=true. Superseded by /v1/tunnels on the Claude API; new integrations should use anthropic-beta: mcp-tunnels-2026-06-22 with a WIF token (workspace:manage_tunnels). Existing integrations may continue with mcp-tunnels-2026-05-19 and org:manage_tunnels during the migration window.'
