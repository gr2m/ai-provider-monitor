- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds a deprecated Admin API endpoint to archive a tunnel certificate for a given tunnel, removing it from the tunnel’s trusted set. Returns the certificate object; archiving the last active cert causes the tunnel to reject MCP traffic until a new cert is added. Superseded by /v1/tunnels (use anthropic-beta: mcp-tunnels-2026-06-22).'
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
