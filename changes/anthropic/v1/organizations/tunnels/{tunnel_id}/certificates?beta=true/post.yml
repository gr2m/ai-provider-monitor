- change: added
  target: route
  breaking: false
  deprecated: true
  doc_only: false
  note: 'Deprecated Admin API endpoint to register a public CA certificate for a tunnel. Anthropic verifies the inner TLS session against this CA. Accepts a single PEM-encoded X.509 certificate (no private key); a tunnel may hold at most two non-archived certificates. Superseded by /v1/tunnels on the Claude API with anthropic-beta: mcp-tunnels-2026-06-22; existing integrations may use mcp-tunnels-2026-05-19 during migration. Returns the registered certificate on 201; 4XX returns an error object.'
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: The anthropic-beta header is now required and must be provided.
  paths:
    - path: parameters[name=anthropic-beta].required
      before: 'false'
      after: 'true'
  date: '2026-09-01'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/982
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated anthropic-beta header description to require value `mcp-tunnels-2026-05-19`.
  paths:
    - path: parameters[name=anthropic-beta].description
      before: |-
        Optional header to specify the beta version(s) you want to use.

        To use multiple betas, use a comma separated list like `beta1,beta2` or specify the header multiple times for each beta.
      after: 'This endpoint is in beta: requests must send `mcp-tunnels-2026-05-19` in this header.'
  date: '2026-09-01'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/982
