- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Deprecated Admin API endpoint to archive a tunnel. Archival is irreversible; all active certificates are archived, the hostname is permanently retired, and the tunnel token is invalidated. Safe to retry on already-archived tunnels (idempotent). Superseded by /v1/tunnels with anthropic-beta: mcp-tunnels-2026-06-22 and a WIF token scoped to workspace:manage_tunnels.'
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
