- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added deprecated Admin API endpoint POST /v1/organizations/tunnels/{tunnel_id}/reveal_token?beta=true to reveal a tunnel''s current connection token (fetched live; stable until rotation). Superseded by /v1/tunnels with anthropic-beta: mcp-tunnels-2026-06-22 and a WIF token (workspace:manage_tunnels); legacy header mcp-tunnels-2026-05-19 with org:manage_tunnels allowed during migration.'
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: '''anthropic-beta'' header is now required for this endpoint.'
  paths:
    - path: parameters[1].required
      before: 'false'
      after: 'true'
  date: '2026-09-01'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/982
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated 'anthropic-beta' header description to require `mcp-tunnels-2026-05-19`.
  paths:
    - path: parameters[1].description
      before: |-
        Optional header to specify the beta version(s) you want to use.

        To use multiple betas, use a comma separated list like `beta1,beta2` or specify the header multiple times for each beta.
      after: 'This endpoint is in beta: requests must send `mcp-tunnels-2026-05-19` in this header.'
    - path: parameters[1].schema.description
      before: |-
        Optional header to specify the beta version(s) you want to use.

        To use multiple betas, use a comma separated list like `beta1,beta2` or specify the header multiple times for each beta.
      after: 'This endpoint is in beta: requests must send `mcp-tunnels-2026-05-19` in this header.'
  date: '2026-09-01'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/982
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: Header anthropic-beta changed from a single string to an array of AnthropicBeta values.
  paths:
    - path: parameters[1].schema.type
      before: string
      after: array
    - path: parameters[1].schema.items.type
      before: string
      after: 'null'
    - path: parameters[1].schema.items.$ref
      before: 'null'
      after: '#/components/schemas/AnthropicBeta'
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added explicit error responses replacing the generic 4XX entry: 400, 401, 403, 404, 408, 409, 412, 413, 429, 431, 499, 500, 501, 503, 504, 529.'
  paths:
    - path: responses.400.description
      before: 'null'
      after: Invalid argument - The client specified an invalid argument
    - path: responses.401.description
      before: 'null'
      after: Unauthenticated - The request does not have valid authentication credentials
    - path: responses.403.description
      before: 'null'
      after: Permission denied - The caller does not have permission to execute the specified operation
    - path: responses.404.description
      before: 'null'
      after: Not found - Some requested entity was not found
    - path: responses.408.description
      before: 'null'
      after: Deadline exceeded - The deadline expired before the operation could complete
    - path: responses.409.description
      before: 'null'
      after: Aborted - The operation was aborted due to concurrency issue
    - path: responses.412.description
      before: 'null'
      after: Failed precondition - Operation was rejected because the system is not in required state
    - path: responses.413.description
      before: 'null'
      after: Out of range - Operation was attempted past the valid range
    - path: responses.429.description
      before: 'null'
      after: Resource exhausted - Some resource has been exhausted (rate limiting)
    - path: responses.431.description
      before: 'null'
      after: Request header fields too large - Request metadata was too large
    - path: responses.499.description
      before: 'null'
      after: Cancelled - The operation was cancelled by the client
    - path: responses.500.description
      before: 'null'
      after: Internal - Internal server error
    - path: responses.501.description
      before: 'null'
      after: Unimplemented - The operation is not implemented or supported
    - path: responses.503.description
      before: 'null'
      after: Unavailable - The service is currently unavailable
    - path: responses.504.description
      before: 'null'
      after: Deadline exceeded - Upstream service did not respond in time
    - path: responses.529.description
      before: 'null'
      after: Overloaded - The service is temporarily overloaded
  date: '2026-11-02'
- change: removed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Removed catch-all 4XX error response in favor of explicit status codes.
  paths:
    - path: responses.4XX.description
      before: |-
        Error response.

        See our [errors documentation](https://platform.claude.com/docs/en/api/errors) for more details.
      after: 'null'
  date: '2026-11-02'
