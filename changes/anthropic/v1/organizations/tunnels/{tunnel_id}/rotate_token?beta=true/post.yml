- change: added
  target: route
  breaking: false
  deprecated: true
  doc_only: false
  note: 'Added deprecated Admin API endpoint POST /v1/organizations/tunnels/{tunnel_id}/rotate_token?beta=true to rotate a tunnel token. Invalidates the current token for new connections and returns a new token; existing connections remain active. Accepts optional reason for audit. Superseded by /v1/tunnels with anthropic-beta: mcp-tunnels-2026-06-22 and WIF token (workspace:manage_tunnels). Existing integrations may continue using mcp-tunnels-2026-05-19 and org:manage_tunnels during migration.'
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: anthropic-beta header is now required; it was previously optional
  paths:
    - path: parameters[1].required
      before: 'false'
      after: 'true'
  date: '2026-09-01'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/982
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated anthropic-beta header description to require sending mcp-tunnels-2026-05-19
  paths:
    - path: parameters[1].description
      before: |-
        Optional header to specify the beta version(s) you want to use.

        To use multiple betas, use a comma separated list like `beta1,beta2` or specify the header multiple times for each beta.
      after: 'This endpoint is in beta: requests must send `mcp-tunnels-2026-05-19` in this header.'
    - path: parameters[1].schema.description
      before: |-
        Optional header to specify the beta version(s) you want to use.

        To use multiple betas, use a comma separated list like `beta1,beta2` or specify the header multiple times for each beta.
      after: 'This endpoint is in beta: requests must send `mcp-tunnels-2026-05-19` in this header.'
  date: '2026-09-01'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/982
