- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 400 error response schema changed from generic ErrorResponse ref to inline schema and now includes structured error.details.
  paths:
    - path: responses/400/content/application/json/schema
      before: '{"$ref":"#/components/schemas/BetaErrorResponse"}'
      after: '{"type":"object","title":"ErrorResponse"}'
    - path: responses/400/content/application/json/schema/properties/error/properties/details
      before: 'null'
      after: '{"anyOf":[{"$ref":"#/components/schemas/BetaOrganizationTypeNotSupportedErrorDetails"},{"$ref":"#/components/schemas/BetaParentOrganizationRequiredErrorDetails"},{"type":"null"}],"description":"Machine-readable detail about the cause of the error. `error_code` names the cause; branch on it rather than on `message`. Absent when the error has no code. Treat an unrecognized `error_code` as the bare `type`."}'
  date: '2026-11-16'
