  note: Introduces POST /v1/organizations/federation_rules?beta=true to create an organization-owned federation rule. Requires OAuth access token with org:admin (Admin API keys not accepted). Validates issuer and target service account existence; supports enabling per workspace or all workspaces; enforces tenant constraints for well-known issuers; OAuth callers may only set oauth_scope to workspace:developer or workspace:inference. Returns the created federation rule.
