- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces a beta GET endpoint to list permissions granted by a specified RBAC role (Claude Enterprise only). Supports pagination via limit and page and returns a BetaRbacRolePermissionList. Requires beta=true query flag.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated the description of BetaRbacRolePermission.action to clarify that capability_access_all excludes inference_hooks_inspection unless granted explicitly.
  paths:
    - path: components/schemas/BetaRbacRolePermission/properties/action/description
      before: |-
        Action the permission grants on the resource.

        The vocabulary follows the resource: an `organization` grant carries a
        product-feature entitlement (for example `chat`), an admin-panel
        permission entitlement (`permission_*`), or a blanket capability-access
        mode — `capability_access_all` grants every product-feature entitlement,
        and `capability_access_all_ga` grants the generally-available subset as
        it stands at permission-check time; neither mode grants model-access
        entitlements. A consumer enumerating a role's per-feature grants should
        treat a blanket row as granting every product-feature entitlement it
        covers, or it will under-report the role's effective access. A `connector_tool` grant carries
        a tool-access action (`use` or `always_allow`); a `connector_scope` grant
        carries the scope action `grant` (the role may receive the named OAuth
        scope when tokens are minted for the connector); `connector` and
        `all_connectors` grants carry a tool-access action, the scope action, or
        an authentication-method action (`interactive` or `managed`).
      after: |-
        Action the permission grants on the resource.

        The vocabulary follows the resource: an `organization` grant carries a
        product-feature entitlement (for example `chat`), an admin-panel
        permission entitlement (`permission_*`), or a blanket capability-access
        mode — `capability_access_all` grants every product-feature entitlement
        except `inference_hooks_inspection`, which a role holds only through its
        own row, and `capability_access_all_ga` grants the generally-available
        subset of those as it stands at permission-check time; neither mode grants
        model-access entitlements. A consumer enumerating a role's per-feature grants should
        treat a blanket row as granting every product-feature entitlement it
        covers, or it will under-report the role's effective access. A `connector_tool` grant carries
        a tool-access action (`use` or `always_allow`); a `connector_scope` grant
        carries the scope action `grant` (the role may receive the named OAuth
        scope when tokens are minted for the connector); `connector` and
        `all_connectors` grants carry a tool-access action, the scope action, or
        an authentication-method action (`interactive` or `managed`).
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1165
