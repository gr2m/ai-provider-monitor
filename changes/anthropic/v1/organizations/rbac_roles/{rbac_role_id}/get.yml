- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated RbacRole.display_name description to clarify it's Anthropic's name for the access granted and may change; recommend storing role id for stable reference.
  paths:
    - path: components/schemas/RbacRole/properties/display_name/description
      before: Name of the RBAC Role. For a role created by Anthropic, this name can differ from the label claude.ai shows, and Anthropic may change the name. To keep a lasting reference to a role, store its `id`.
      after: Name of the RBAC Role. For a role created by Anthropic, this is Anthropic's name for the access that the role grants. Anthropic may change this name, so to keep a lasting reference to a role, store its `id`.
  date: '2026-11-10'
