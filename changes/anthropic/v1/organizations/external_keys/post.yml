- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/organizations/external_keys to create an organization-scoped external key (CMEK) config using AWS/GCP/Azure KMS settings; returns ExternalKey.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional user_profile_id to ExternalKeyCreateParams to bind a key to a user profile.
  paths:
    - path: components/schemas/ExternalKeyCreateParams/properties/user_profile_id
      before: 'null'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"ID of a user profile to bind the key to. Omit this field for a key that isn''t bound to a user profile. Such a key can be attached to a Workspace whatever its user profile. The binding cannot be changed later. A key bound to a user profile can only be attached to a Workspace that has the same user profile.","examples":["uprof_01SDCCSbTxrXDpWc1phhtcfK"],"title":"User Profile Id"}'
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: ExternalKey now includes user_profile_id (always present; null if key is not bound).
  paths:
    - path: components/schemas/ExternalKey/properties/user_profile_id
      before: 'null'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"ID of the user profile the key is bound to, or null if the key is not bound to one. A key bound to a user profile can only be attached to a Workspace that has the same user profile. A key that isn''t bound can be attached to a Workspace whatever its user profile.","examples":["uprof_01SDCCSbTxrXDpWc1phhtcfK"],"title":"User Profile Id"}'
    - path: components/schemas/ExternalKey/required
      before: '["attachment","created_at","display_name","geo","id","provider_config","type","updated_at"]'
      after: '["attachment","created_at","display_name","geo","id","provider_config","type","updated_at","user_profile_id"]'
  date: '2026-11-02'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 400 response schema now inlines InvalidRequestError and may include error.details with error_code 'user_profile_not_found'.
  paths:
    - path: responses/400/content/application/json/schema
      before: '#/components/schemas/ErrorResponse'
      after: Inline ErrorResponse schema with error.type=invalid_request_error and optional error.details
    - path: responses/400/content/application/json/schema/properties/error/properties/details
      before: 'null'
      after: '{"anyOf":[{"$ref":"#/components/schemas/UserProfileNotFoundErrorDetails"},{"type":"null"}],"description":"Machine-readable detail about the cause of the error. `error_code` names the cause; branch on it rather than on `message`. Absent when the error has no code. Treat an unrecognized `error_code` as the bare `type`."}'
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added UserProfileNotFoundErrorDetails error detail object for user_profile_not_found code.
  paths:
    - path: components/schemas/UserProfileNotFoundErrorDetails
      before: 'null'
      after: '{"description":"The request depends on a user profile that does not exist in the organization or is no longer active. The request either names this user profile by ID, or names a resource, such as an External Key, that is bound to it.","properties":{"error_code":{"const":"user_profile_not_found","title":"Error Code","type":"string"}},"required":["error_code"],"title":"UserProfileNotFoundErrorDetails","type":"object"}'
  date: '2026-11-02'
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: 'Documentation clarifications only: updated descriptions for AwsExternalKeyConfig.kms_arn and role_arn, and ExternalKey.id.'
  paths:
    - path: components/schemas/AwsExternalKeyConfig/properties/kms_arn/description
      before: Full ARN of the AWS KMS key. On Claude Platform on AWS the key must be a single-Region key in your organization's own AWS account; cross-account keys, multi-Region keys, and alias ARNs are rejected.
      after: Full ARN of the AWS KMS key. On Claude Platform on AWS, alias ARNs are rejected, and your organization's own key must be a single-Region key in your organization's AWS account.
    - path: components/schemas/AwsExternalKeyConfig/properties/role_arn/description
      before: IAM role ARN. Deprecated — Anthropic reaches the KMS key through its own intermediate role (or, on Claude Platform on AWS, with credentials AWS issues for the Workspace); this field is ignored.
      after: IAM role ARN. Deprecated; this field is ignored.
    - path: components/schemas/ExternalKey/properties/id/description
      before: Identifier of the external key config. A tagged ID prefixed `ekey_`, or — for organizations on the Claude Platform on AWS — the AWS KMS key ARN.
      after: 'Identifier of the external key config: a tagged ID prefixed `ekey_`, or, on Claude Platform on AWS, an AWS KMS key''s ARN.'
  date: '2026-11-02'
