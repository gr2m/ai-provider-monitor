- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces GET /v1/organizations/external_keys/{external_key_id} to fetch a single organization-scoped CMEK external key config by its ID. Returns ExternalKey on success; supports optional anthropic-version header and standard error responses.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added user_profile_id to ExternalKey and marked it required.
  paths:
    - path: components/schemas/ExternalKey/properties/user_profile_id
      before: 'null'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"ID of the user profile the key is bound to, or null if the key is not bound to one. A key bound to a user profile can only be attached to a Workspace that has the same user profile. A key that isn''t bound can be attached to a Workspace whatever its user profile.","examples":["uprof_01SDCCSbTxrXDpWc1phhtcfK"],"title":"User Profile Id"}'
    - path: components/schemas/ExternalKey/required
      before: '["attachment","created_at","display_name","geo","id","provider_config","type","updated_at"]'
      after: '["attachment","created_at","display_name","geo","id","provider_config","type","updated_at","user_profile_id"]'
  date: '2026-11-02'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified wording of ExternalKey.id description.
  paths:
    - path: components/schemas/ExternalKey/properties/id/description
      before: Identifier of the external key config. A tagged ID prefixed `ekey_`, or — for organizations on the Claude Platform on AWS — the AWS KMS key ARN.
      after: 'Identifier of the external key config: a tagged ID prefixed `ekey_`, or, on Claude Platform on AWS, an AWS KMS key''s ARN.'
  date: '2026-11-02'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated AWS KMS ARN constraints and simplified deprecated role_arn note.
  paths:
    - path: components/schemas/AwsExternalKeyConfig/properties/kms_arn/description
      before: Full ARN of the AWS KMS key. On Claude Platform on AWS the key must be a single-Region key in your organization's own AWS account; cross-account keys, multi-Region keys, and alias ARNs are rejected.
      after: Full ARN of the AWS KMS key. On Claude Platform on AWS, alias ARNs are rejected, and your organization's own key must be a single-Region key in your organization's AWS account.
    - path: components/schemas/AwsExternalKeyConfig/properties/role_arn/description
      before: IAM role ARN. Deprecated — Anthropic reaches the KMS key through its own intermediate role (or, on Claude Platform on AWS, with credentials AWS issues for the Workspace); this field is ignored.
      after: IAM role ARN. Deprecated; this field is ignored.
  date: '2026-11-02'
