  note: Updated description of ExternalKey.geo to clarify region usage.
  paths:
    - path: components/schemas/ExternalKey/properties/geo/description
      before: Data residency geo. Selects the region that handles this key's encrypt/decrypt roundtrips.
      after: Data residency geo. Selects the region this key is used in.
