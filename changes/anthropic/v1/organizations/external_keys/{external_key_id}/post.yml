- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/organizations/external_keys/{external_key_id} to partially update an external key config by ID. Omitted fields remain unchanged; display_name always editable; geo and provider_config immutable once any workspace references the config. Returns the updated ExternalKey.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added user_profile_id to ExternalKey; keys can be bound to a user profile.
  paths:
    - path: components/schemas/ExternalKey/properties/user_profile_id
      before: 'null'
      after: 'anyOf[string,null]; description: ID of the bound user profile or null; examples include ''uprof_…'''
  date: '2026-11-02'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: ExternalKey 'required' list updated to include user_profile_id.
  paths:
    - path: components/schemas/ExternalKey/required
      before: '["attachment","created_at","display_name","geo","id","provider_config","type","updated_at"]'
      after: '["attachment","created_at","display_name","geo","id","provider_config","type","updated_at","user_profile_id"]'
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 400 InvalidRequestError now includes error.details with code external_key_in_workspace_policy when the key is listed in the Workspace Policy.
  paths:
    - path: responses/400/content/application/json/schema/properties/error/properties/details
      before: 'null'
      after: anyOf[ExternalKeyInWorkspacePolicyErrorDetails, null]; machine-readable error details with error_code
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: New schema ExternalKeyInWorkspacePolicyErrorDetails added for detailed 400 errors.
  paths:
    - path: components/schemas/ExternalKeyInWorkspacePolicyErrorDetails
      before: 'null'
      after: '{ error_code: "external_key_in_workspace_policy" }'
  date: '2026-11-02'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Documentation wording clarified for ExternalKey.id and AWS KMS config fields.
  paths:
    - path: components/schemas/ExternalKey/properties/id/description
      before: Identifier of the external key config. A tagged ID prefixed `ekey_`, or — for organizations on the Claude Platform on AWS — the AWS KMS key ARN.
      after: 'Identifier of the external key config: a tagged ID prefixed `ekey_`, or, on Claude Platform on AWS, an AWS KMS key''s ARN.'
    - path: components/schemas/AwsExternalKeyConfig/properties/kms_arn/description
      before: Full ARN of the AWS KMS key. On Claude Platform on AWS the key must be a single-Region key in your organization's own AWS account; cross-account keys, multi-Region keys, and alias ARNs are rejected.
      after: Full ARN of the AWS KMS key. On Claude Platform on AWS, alias ARNs are rejected, and your organization's own key must be a single-Region key in your organization's AWS account.
    - path: components/schemas/AwsExternalKeyConfig/properties/role_arn/description
      before: IAM role ARN. Deprecated — Anthropic reaches the KMS key through its own intermediate role (or, on Claude Platform on AWS, with credentials AWS issues for the Workspace); this field is ignored.
      after: IAM role ARN. Deprecated; this field is ignored.
  date: '2026-11-02'
