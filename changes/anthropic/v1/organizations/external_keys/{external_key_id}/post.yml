      before: 'null'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"ID of the user profile the key is bound to, or null if the key is not bound to one. A key bound to a user profile can only be attached to a Workspace that has the same user profile. A key that isn''t bound can be attached to a Workspace whatever its user profile.","title":"User Profile Id"}'
