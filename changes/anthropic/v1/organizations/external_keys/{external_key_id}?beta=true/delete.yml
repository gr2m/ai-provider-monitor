- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 400 response schema changed from generic BetaErrorResponse to an inline ErrorResponse with InvalidRequestError.
  paths:
    - path: responses/400/content/application/json/schema
      before: '{"$ref":"#/components/schemas/BetaErrorResponse"}'
      after: '{"type":"object","title":"ErrorResponse","required":["error","request_id","type"],"properties":{"type":{"type":"string","const":"error"},"request_id":{"anyOf":[{"type":"string"},{"type":"null"}],"title":"Request Id"},"error":{"type":"object","title":"InvalidRequestError","required":["message","type"],"properties":{"details":{"anyOf":[{"$ref":"#/components/schemas/BetaExternalKeyInWorkspacePolicyErrorDetails"},{"type":"null"}],"description":"Machine-readable detail about the cause of the error. `error_code` names the cause; branch on it rather than on `message`. Absent when the error has no code. Treat an unrecognized `error_code` as the bare `type`."},"message":{"type":"string","default":"Invalid request"},"type":{"type":"string","const":"invalid_request_error"}}}}}'
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1164
