- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds a beta POST endpoint to partially update an external key config by ID. You can always edit display_name; geo and provider_config are only editable before any workspace attaches. Path param: external_key_id. Optional anthropic-version header. Returns the updated ExternalKey on success.'
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated AWS KMS ARN field description with AWS-specific constraints (single-Region, same account, no aliases/cross-account).
  paths:
    - path: components/schemas/BetaAwsExternalKeyConfig/properties/kms_arn/description
      before: Full ARN of the AWS KMS key.
      after: Full ARN of the AWS KMS key. On Claude Platform on AWS the key must be a single-Region key in your organization's own AWS account; cross-account keys, multi-Region keys, and alias ARNs are rejected.
  date: '2026-09-01'
