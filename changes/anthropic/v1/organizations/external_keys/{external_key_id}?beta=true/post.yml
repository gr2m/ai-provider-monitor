- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added explicit error responses for many status codes (400, 401, 403, 404, 408, 409, 412, 413, 429, 431, 499, 500, 501, 503, 504, 529) with BetaErrorResponse schema.
  paths:
    - path: $.responses['400']
      before: 'null'
      after: '{"description":"Invalid argument - The client specified an invalid argument","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BetaErrorResponse"}}}}'
    - path: $.responses['401']
      before: 'null'
      after: '{"description":"Unauthenticated - The request does not have valid authentication credentials","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BetaErrorResponse"}}}}'
    - path: $.responses['403']
      before: 'null'
      after: '{"description":"Permission denied - The caller does not have permission to execute the specified operation","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BetaErrorResponse"}}}}'
    - path: $.responses['404']
      before: 'null'
      after: '{"description":"Not found - Some requested entity was not found","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BetaErrorResponse"}}}}'
    - path: $.responses['408']
      before: 'null'
      after: '{"description":"Deadline exceeded - The deadline expired before the operation could complete","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BetaErrorResponse"}}}}'
    - path: $.responses['409']
      before: 'null'
      after: '{"description":"Aborted - The operation was aborted due to concurrency issue","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BetaErrorResponse"}}}}'
    - path: $.responses['412']
      before: 'null'
      after: '{"description":"Failed precondition - Operation was rejected because the system is not in required state","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BetaErrorResponse"}}}}'
    - path: $.responses['413']
      before: 'null'
      after: '{"description":"Out of range - Operation was attempted past the valid range","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BetaErrorResponse"}}}}'
    - path: $.responses['429']
      before: 'null'
      after: '{"description":"Resource exhausted - Some resource has been exhausted (rate limiting)","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BetaErrorResponse"}}}}'
    - path: $.responses['431']
      before: 'null'
      after: '{"description":"Request header fields too large - Request metadata was too large","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BetaErrorResponse"}}}}'
    - path: $.responses['499']
      before: 'null'
      after: '{"description":"Cancelled - The operation was cancelled by the client","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BetaErrorResponse"}}}}'
    - path: $.responses['500']
      before: 'null'
      after: '{"description":"Internal - Internal server error","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BetaErrorResponse"}}}}'
    - path: $.responses['501']
      before: 'null'
      after: '{"description":"Unimplemented - The operation is not implemented or supported","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BetaErrorResponse"}}}}'
    - path: $.responses['503']
      before: 'null'
      after: '{"description":"Unavailable - The service is currently unavailable","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BetaErrorResponse"}}}}'
    - path: $.responses['504']
      before: 'null'
      after: '{"description":"Deadline exceeded - Upstream service did not respond in time","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BetaErrorResponse"}}}}'
    - path: $.responses['529']
      before: 'null'
      after: '{"description":"Overloaded - The service is temporarily overloaded","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BetaErrorResponse"}}}}'
  date: '2026-11-02'
