  note: 'Adds beta endpoint POST /v1/organizations/claude_code/managed_settings/rbac_group_default?beta=true to set, replace, or clear (with null) the organization’s default Claude Code RBAC group managed settings. Requires an org-level Admin API key with scope write:claude_code_managed_settings and header anthropic-beta: ce-claude-code-managed-settings-2026-10-06. Missing header or org not in beta returns 404; 503 writes may have applied and are safe to retry.'
