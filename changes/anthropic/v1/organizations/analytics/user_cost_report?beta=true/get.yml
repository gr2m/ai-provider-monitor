- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds legacy endpoint GET /v1/organizations/analytics/user_cost_report?beta=true to retrieve per-user USD cost over a date range, ranked by spend, with rich filters, grouping (e.g., product, model, context window, region, speed, Slack, RBAC, Claude Tag), optional time buckets, and pagination. Requires Claude Enterprise and a key with read:analytics. Superseded for new integrations by GET /v1/organizations/analytics/cost.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Route description clarified user-account attribution and that Claude Tag 1:1 DMs are included (as product `claude-tag`) only for members who connected a Claude account.
  paths:
    - path: description
      before: |-
        [Legacy] Get per-user cost in USD across a date range.

        Returns cost per user, ranked by spend; `group_by[]` or `bucket_width` splits a user across several rows. Use this to see which users account for the most cost. Only cost attributed to a user account is included; cost with no user attributed to it, such as Code Review usage and Claude Tag usage in Slack channels, is left out. Available to organizations on a Claude Enterprise plan. Requires an API key with the `read:analytics` scope.

        This endpoint is one of the legacy Claude Enterprise usage and cost reports. For new integrations, use [`GET /v1/organizations/analytics/cost`](/docs/en/api/beta/organization/analytics/cost/list) in the Usage and Cost Analytics API instead. To move an existing integration, see [Migrate from the Claude Enterprise usage and cost reports](/docs/en/manage-claude/usage-cost-analytics-api#migrate-from-enterprise-analytics-reports).
      after: |-
        [Legacy] Get per-user cost in USD across a date range.

        Returns cost per user, ranked by spend; `group_by[]` or `bucket_width` splits a user across several rows. Use this to see which users account for the most cost. Only cost attributed to a user account is included, so cost with no user account, such as Code Review usage and Claude Tag usage in Slack channels, is left out. Claude Tag one-to-one direct messages are included, with product `claude-tag`, only for members who have connected a Claude account. Available to organizations on a Claude Enterprise plan. Requires an API key with the `read:analytics` scope.

        This endpoint is one of the legacy Claude Enterprise usage and cost reports. For new integrations, use [`GET /v1/organizations/analytics/cost`](/docs/en/api/beta/organization/analytics/cost/list) in the Usage and Cost Analytics API instead. To move an existing integration, see [Migrate from the Claude Enterprise usage and cost reports](/docs/en/manage-claude/usage-cost-analytics-api#migrate-from-enterprise-analytics-reports).
  date: '2026-11-04'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1181
