- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New beta endpoint GET /v1/organizations/analytics/users?beta=true that lists per-user activity for a given day or date range. Supports cursor-based pagination, sorting, filtering (project_id, rbac_group_id, user_id), and grouping by rbac_group_id. Returns chat, Cowork, Code, Design, Office, and Science metrics (plus others where available). Enterprise only; requires API key with read:analytics scope.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
