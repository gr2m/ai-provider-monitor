- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduced new schema BetaAnalyticsClaudeTagMetrics defining per-user Claude Tag metrics.
  paths:
    - path: components/schemas/BetaAnalyticsClaudeTagMetrics
      before: 'null'
      after: '{"type":"object","title":"AnalyticsClaudeTagMetrics","description":"Claude Tag activity metrics for a single linked user on a given day.","properties":{"active_day_count":{"anyOf":[{"type":"integer"},{"type":"null"}],"description":"1 on a day the user was active in Claude Tag in Slack, otherwise 0. Summed over the window in date-range mode, so it is the number of active days; on grouped rows, the total of each member''s active days. Null when Claude Tag data cannot be read for the request. Otherwise, 0 on a row filtered by project, and null on any other row when no covered day was measured.","title":"Active Day Count"},"active_message_count":{"anyOf":[{"type":"integer"},{"type":"null"}],"description":"Number of the user''s Slack messages that made them active: @-mentions, direct messages, group direct message asks, and thread posts Claude answered. Other messages are not counted. Null when Claude Tag data cannot be read for the request. Otherwise, 0 on a row filtered by project, and null on any other row when no covered day was measured.","title":"Active Message Count"}},"required":["active_day_count","active_message_count"]}'
  date: '2026-11-10'
