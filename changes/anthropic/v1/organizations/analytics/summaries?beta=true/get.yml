- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Beta endpoint to retrieve org-wide per-day activity summaries over a date range (starting_date required; optional ending_date up to 366 days, ~1-day data lag). Supports RBAC scoping via filter[]=rbac_group_id; returns DAU/WAU/MAU, adoption rates, Cowork and product metrics when enabled; single page (next_page=null). Requires Claude Enterprise and read:analytics scope.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified wording about availability for Chat & Cowork unified activity fields; no schema changes.
  paths:
    - path: components.schemas.BetaAnalyticsSingleDayActivitySummary.properties.chat_cowork_unified_daily_active_user_count.description
      before: Number of users with activity in Chat and Cowork unified on the requested day. Omitted from the response on deployments that do not offer Chat and Cowork unified.
      after: Number of users with activity in Chat and Cowork unified on the requested day. Omitted from the response where Chat and Cowork unified is not available.
    - path: components.schemas.BetaAnalyticsSingleDayActivitySummary.properties.chat_cowork_unified_monthly_active_user_count.description
      before: Number of users with activity in Chat and Cowork unified in the 28-day rolling window (30 days when the request filters by `rbac_group_id`). Omitted from the response on deployments that do not offer Chat and Cowork unified.
      after: Number of users with activity in Chat and Cowork unified in the 28-day rolling window (30 days when the request filters by `rbac_group_id`). Omitted from the response where Chat and Cowork unified is not available.
    - path: components.schemas.BetaAnalyticsSingleDayActivitySummary.properties.chat_cowork_unified_weekly_active_user_count.description
      before: Number of users with activity in Chat and Cowork unified in the 7-day rolling window. Omitted from the response on deployments that do not offer Chat and Cowork unified.
      after: Number of users with activity in Chat and Cowork unified in the 7-day rolling window. Omitted from the response where Chat and Cowork unified is not available.
