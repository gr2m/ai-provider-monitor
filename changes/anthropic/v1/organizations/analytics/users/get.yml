- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New analytics endpoint to list per-user daily activity (single day or date range) across Claude products with cursor-based pagination, sorting, filtering (project_id, rbac_group_id, user_id), and optional grouping by rbac_group_id. Available to Enterprise orgs; requires API key with read:analytics scope.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1164
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified when chat_cowork_unified_metrics is omitted from responses.
  paths:
    - path: components/schemas/AnalyticsUserActivity/properties/chat_cowork_unified_metrics/description
      before: Activity recorded while the member had Chat and Cowork unified (Cowork's features inside claude.ai chat) turned on, split into `chat` (chat activity) and `sessions` (Cowork activity). Omitted from the response on deployments that do not offer Chat and Cowork unified.
      after: Activity recorded while the member had Chat and Cowork unified (Cowork's features inside claude.ai chat) turned on, split into `chat` (chat activity) and `sessions` (Cowork activity). Omitted from the response where Chat and Cowork unified is not available.
  date: '2026-11-04'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1181
