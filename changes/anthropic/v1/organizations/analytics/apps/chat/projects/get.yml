- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds GET /v1/organizations/analytics/apps/chat/projects to retrieve per-project chat activity metrics with cursor pagination. Supports single-day or date-range queries, optional grouping by user or RBAC group, filtering, and ordering. Available to Enterprise orgs; requires read:analytics scope.
