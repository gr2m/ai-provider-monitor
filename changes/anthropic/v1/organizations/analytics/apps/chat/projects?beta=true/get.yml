- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces a beta analytics endpoint to retrieve per-project Chat app activity for an organization for a specific day or aggregated date range, with cursor-based pagination. Supports grouping by user_id or rbac_group_id and filtering by project_id, user_id, or rbac_group_id; sortable. Returns metrics like distinct_user_count, message_count, and optional distinct_conversation_count, plus project metadata and optional creator/group fields. Available to Claude Enterprise; requires an API key with read:analytics scope.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Request enums moved to shared component schemas: group_by[] items now reference BetaAnalyticsProjectGroupBy; order now references BetaAnalyticsOrder.'
  paths:
    - path: parameters[name=group_by[]]/schema/anyOf/0/items
      before: '{"enum":["rbac_group_id","user_id"],"type":"string"}'
      after: '{"$ref":"#/components/schemas/BetaAnalyticsProjectGroupBy"}'
    - path: parameters[name=order]/schema/anyOf/0
      before: '{"enum":["asc","desc"],"type":"string"}'
      after: '{"$ref":"#/components/schemas/BetaAnalyticsOrder"}'
  date: '2026-11-02'
- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Added reusable component schemas for request enums.
  paths:
    - path: components/schemas/BetaAnalyticsProjectGroupBy
      before: 'null'
      after: '{"description":"A dimension to group chat project activity by.","enum":["rbac_group_id","user_id"],"type":"string"}'
    - path: components/schemas/BetaAnalyticsOrder
      before: 'null'
      after: '{"description":"Sort direction: `asc` or `desc`. Defaults to `asc` for the endpoint''s sort column and to `desc` when `order_by` names a metric (a top-N ranking). Applies to `order_by`, or to the endpoint''s default sort field when `order_by` is omitted.","enum":["asc","desc"],"type":"string"}'
  date: '2026-11-02'
- change: removed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Removed the optional 'product' field from AnalyticsProjectActivity response objects.
  paths:
    - path: components/schemas/BetaAnalyticsProjectActivity/properties/product
      before: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"Product that produced this row''s activity: one of `chat`, `claude_code`, `cowork`, `office_agent`, or `chat_cowork_unified` (Chat and Cowork unified). These are the canonical Cost & Usage product names; an `office_agent` row''s per-surface breakdown is in its `office_metrics`. On `/plugins` only `cowork`, `claude_code` and `chat_cowork_unified` occur (the only surfaces with plugin attribution); on `/artifacts` only `chat`, `claude_code`, `cowork` and `chat_cowork_unified` occur (the surfaces that create artifacts); `/apps/chat/projects` does not support the product dimension (a `product` entry in `group_by[]` or `filter[]` there is rejected). Present only when the request grouped by `product`.","title":"Product"}'
      after: 'null'
  date: '2026-11-02'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Made several fields in AnalyticsProjectActivity required (still nullable where applicable): created_at, created_by, distinct_conversation_count.'
  paths:
