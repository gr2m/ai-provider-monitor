- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds GET /v1/organizations/analytics/summaries to fetch org-wide daily activity summaries over a date range (up to 366 days). Supports optional RBAC group scoping via filter[]=rbac_group_id:{id}. Returns one entry per day with DAU/WAU/MAU, Cowork activity, adoption rates, and seat/invite counts (org-wide fields null when scoped). Data has ~1-day lag; next_page is always null. Requires Claude Enterprise and an API key with read:analytics scope.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1164
