  note: Added claude_tag_daily_active_user_count to AnalyticsSingleDayActivitySummary response schema.
  paths:
    - path: $.components.schemas.AnalyticsSingleDayActivitySummary.properties.claude_tag_daily_active_user_count
      before: 'null'
      after: '{"anyOf":[{"type":"integer"},{"type":"null"}],"description":"Number of Slack users active in Claude Tag on the requested day. Counts distinct Slack users, including users who have not linked a Claude account, so it can exceed `daily_active_user_count` and `assigned_seat_count`. Null on a day with no measured value, when Claude Tag data cannot be read for the request, and when the response is scoped to an RBAC group, because an unlinked user belongs to no group. Omitted from the response on deployments that do not offer Claude Tag reporting.","title":"Claude Tag Daily Active User Count"}'
  date: '2026-11-10'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1206
