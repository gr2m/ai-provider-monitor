- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds GET /v1/organizations/analytics/summaries to fetch org-wide daily activity summaries over a date range (up to 366 days). Supports optional RBAC group scoping via filter[]=rbac_group_id:{id}. Returns one entry per day with DAU/WAU/MAU, Cowork activity, adoption rates, and seat/invite counts (org-wide fields null when scoped). Data has ~1-day lag; next_page is always null. Requires Claude Enterprise and an API key with read:analytics scope.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1164
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Wording updated for when the Chat and Cowork unified daily metric may be omitted.
  paths:
    - path: components/schemas/AnalyticsSingleDayActivitySummary/properties/chat_cowork_unified_daily_active_user_count/description
      before: Number of users with activity in Chat and Cowork unified on the requested day. Omitted from the response on deployments that do not offer Chat and Cowork unified.
      after: Number of users with activity in Chat and Cowork unified on the requested day. Omitted from the response where Chat and Cowork unified is not available.
  date: '2026-11-04'
