- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces beta GET /v1/organizations/analytics/artifacts?beta=true to fetch org artifact-creation activity for a specified UTC date, broken out by MIME type and shared status. Supports group_by (product, user_id, rbac_group_id), filter[], limit/page for grouped queries, and returns counts with next_page when grouped. Requires read:analytics scope.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
