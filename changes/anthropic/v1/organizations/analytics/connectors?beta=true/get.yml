  note: Updated description of chat_cowork_unified_metrics to reference availability wording; no schema change.
  paths:
    - path: components.schemas.BetaAnalyticsConnectorActivity.properties.chat_cowork_unified_metrics.description
      before: Connector use recorded while members had Chat and Cowork unified (Cowork's features inside claude.ai chat) turned on, split into chat conversations and Cowork sessions. A count is null in date-range mode where it cannot be computed. Omitted from the response on deployments that do not offer Chat and Cowork unified.
      after: Connector use recorded while members had Chat and Cowork unified (Cowork's features inside claude.ai chat) turned on, split into chat conversations and Cowork sessions. A count is null in date-range mode where it cannot be computed. Omitted from the response where Chat and Cowork unified is not available.
