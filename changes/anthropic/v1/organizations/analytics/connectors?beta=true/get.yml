  note: Introduces beta GET /V1/organizations/analytics/connectors to retrieve per-connector usage metrics for an organization with cursor pagination. Supports single-day or date-range rollups, grouping by product/rbac_group_id/user_id, filtering on connector_name/product/rbac_group_id/user_id, and sorting. Requires Claude Enterprise and an API key with read:analytics scope.
