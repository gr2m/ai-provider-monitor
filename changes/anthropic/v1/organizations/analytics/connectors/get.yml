- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces GET /v1/organizations/analytics/connectors to retrieve per-connector usage metrics for an organization by day or date range with cursor-based pagination. Supports grouping by product, rbac_group_id, or user_id; filtering and sorting; normalized connector names; and includes read/write/unclassified call counts plus per-surface metrics (Chat, Claude Code, Cowork, Office, and Chat–Cowork unified). Available to Enterprise; requires API key with read:analytics scope.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1164
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Reworded filter[] parameter note about chat_cowork_unified availability (no schema change).
  paths:
    - path: parameters[6].description
      before: 'Filters as `dimension:value`, e.g. `filter[]=rbac_group_id:{id}`. Repeat the param for OR within a dimension and across dimensions for AND. Supported dimensions on this endpoint: `connector_name`, `product`, `rbac_group_id`, `user_id`. Value forms: `connector_name` matches case-insensitively, a display name such as ''GitHub MCP'' also matches its normalized stored form (''github''), and for rows whose `connector_name` is an opaque connector id the connector''s display name (`connector_display_name`) also matches; `product` is one of `chat_cowork_unified`, `chat`, `claude_code`, `cowork`, or `office_agent`; `rbac_group_id` takes the tagged id (`rbac_group_...`, as emitted in responses and by the spend-limits API) or a bare group UUID, and matches users who held the group at any point during each covered UTC day (time-of-usage attribution); `user_id` takes a tagged user id (`user_...`), as emitted in responses. An unsupported dimension returns 400. At most 100 entries. `chat_cowork_unified` is accepted as a `product` value only on deployments that offer Chat and Cowork unified.'
      after: 'Filters as `dimension:value`, e.g. `filter[]=rbac_group_id:{id}`. Repeat the param for OR within a dimension and across dimensions for AND. Supported dimensions on this endpoint: `connector_name`, `product`, `rbac_group_id`, `user_id`. Value forms: `connector_name` matches case-insensitively, a display name such as ''GitHub MCP'' also matches its normalized stored form (''github''), and for rows whose `connector_name` is an opaque connector id the connector''s display name (`connector_display_name`) also matches; `product` is one of `chat_cowork_unified`, `chat`, `claude_code`, `cowork`, or `office_agent`; `rbac_group_id` takes the tagged id (`rbac_group_...`, as emitted in responses and by the spend-limits API) or a bare group UUID, and matches users who held the group at any point during each covered UTC day (time-of-usage attribution); `user_id` takes a tagged user id (`user_...`), as emitted in responses. An unsupported dimension returns 400. At most 100 entries. `chat_cowork_unified` is accepted as a `product` value only where Chat and Cowork unified is available.'
