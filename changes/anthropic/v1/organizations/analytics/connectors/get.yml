  note: Introduces GET /v1/organizations/analytics/connectors to retrieve per-connector usage metrics for an organization by day or date range with cursor-based pagination. Supports grouping by product, rbac_group_id, or user_id; filtering and sorting; normalized connector names; and includes read/write/unclassified call counts plus per-surface metrics (Chat, Claude Code, Cowork, Office, and Chat–Cowork unified). Available to Enterprise; requires API key with read:analytics scope.
