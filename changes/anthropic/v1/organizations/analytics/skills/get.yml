  note: Introduces GET /v1/organizations/analytics/skills to retrieve organization-wide per-skill usage analytics for a specific day or a date range with cursor-based pagination. Supports grouping by product, rbac_group_id, and user_id, and filtering by product, rbac_group_id, share_status, skill_name, and user_id. Returns usage counts, distinct users, optional enable/invocation counts, and spend attribution metrics (estimated_overage_spend, attributed_list_price). Available to Claude Enterprise organizations; requires an API key with read:analytics scope.
