- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Introduces a beta GET /v1/organizations/analytics/usage endpoint to retrieve token usage over a date range, optionally grouped by up to five dimensions and/or time buckets, with rich filtering and pagination. Requires starting_at, supports ending_at (mandatory with time_bucket_width), and needs an API key with read:analytics scope or an Admin key. Requests must send anthropic-beta: analytics-usage-cost-2026-08-24.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
