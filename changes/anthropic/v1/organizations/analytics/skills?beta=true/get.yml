- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified description of chat_cowork_unified_metrics omission to reference availability rather than deployments.
  paths:
    - path: components.schemas.BetaAnalyticsSkillActivity.properties.chat_cowork_unified_metrics.description
      before: Skill use recorded while members had Chat and Cowork unified (Cowork's features inside claude.ai chat) turned on, split into chat conversations and Cowork sessions. A count is null in date-range mode where it cannot be computed. Omitted from the response on deployments that do not offer Chat and Cowork unified.
      after: Skill use recorded while members had Chat and Cowork unified (Cowork's features inside claude.ai chat) turned on, split into chat conversations and Cowork sessions. A count is null in date-range mode where it cannot be computed. Omitted from the response where Chat and Cowork unified is not available.
  date: '2026-11-04'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1181
