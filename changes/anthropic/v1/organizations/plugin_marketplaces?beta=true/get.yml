- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Documentation for the organization_id query parameter clarified that keys without their own organization must always pass organization_id. No schema changes.
  paths:
    - path: parameters[4].description
      before: 'For a `read:org_audit` or `read:compliance_org_data` key created for all of a parent organization''s linked organizations: a child organization of that parent to read instead of the organization the key was created in, given as the organization''s UUID or its `org_`-prefixed ID. A value that is neither returns a 400; an organization that is not a child of the key''s parent, or where the Plugins API is not available, returns a 404. Any other key may pass only its own organization''s ID here; another organization returns a 404.'
      after: 'For a `read:org_audit` or `read:compliance_org_data` key created for all of a parent organization''s linked organizations: a child organization of that parent to read instead of the organization the key was created in, given as the organization''s UUID or its `org_`-prefixed ID. A value that is neither returns a 400; an organization that is not a child of the key''s parent, or where the Plugins API is not available, returns a 404. Any other key may pass only its own organization''s ID here; another organization returns a 404. A key with no organization of its own must always pass `organization_id`. '
    - path: parameters[4].schema.description
      before: 'For a `read:org_audit` or `read:compliance_org_data` key created for all of a parent organization''s linked organizations: a child organization of that parent to read instead of the organization the key was created in, given as the organization''s UUID or its `org_`-prefixed ID. A value that is neither returns a 400; an organization that is not a child of the key''s parent, or where the Plugins API is not available, returns a 404. Any other key may pass only its own organization''s ID here; another organization returns a 404.'
      after: 'For a `read:org_audit` or `read:compliance_org_data` key created for all of a parent organization''s linked organizations: a child organization of that parent to read instead of the organization the key was created in, given as the organization''s UUID or its `org_`-prefixed ID. A value that is neither returns a 400; an organization that is not a child of the key''s parent, or where the Plugins API is not available, returns a 404. Any other key may pass only its own organization''s ID here; another organization returns a 404. A key with no organization of its own must always pass `organization_id`. '
