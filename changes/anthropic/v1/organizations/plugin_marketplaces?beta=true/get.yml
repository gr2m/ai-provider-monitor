  note: 'Introduces a beta endpoint to list plugin marketplaces (organization and members’ personal), newest first, with pagination and filters (limit, page, owner_type, source, organization_id). Requires Claude Enterprise access, appropriate read scopes, and the anthropic-beta: ce-plugins-2026-09-01 header.'
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
