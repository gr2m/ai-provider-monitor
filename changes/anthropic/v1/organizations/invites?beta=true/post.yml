- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Introduces a beta endpoint to invite a user to an organization by email. On seat-limited plans, the invite automatically consumes the lowest-tier available seat and fails with 400 if none are free. Supports role assignment (no admin via API; Enterprise: user/managed) and optional rbac_group_ids for Enterprise with write:rbac_groups scope. Returns invite details on success; standard 4XX error types on failure. Optional anthropic-version header.'
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
