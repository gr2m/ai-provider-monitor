- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces beta GET /v1/organizations/spend_limits/effective?beta=true for Claude Enterprise orgs to list each member’s effective spend limit and period-to-date spend, paginated by member with optional filters (user_ids[], period[]); returns rows with actor, amount, currency, period, period_to_date_spend, scope, source, spend_limit_id, and next_page.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: changed
