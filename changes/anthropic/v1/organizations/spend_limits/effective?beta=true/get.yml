      before: '{"type":"string","enum":["daily","monthly","weekly"]}'
      after: '{"$ref":"#/components/schemas/BetaSpendLimitPeriod"}'
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1164
