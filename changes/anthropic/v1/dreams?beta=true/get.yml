      before: 'null'
      after: '"The version of the Claude API you want to use. Read more about versioning and our version history here."'
    - path: parameters[name=anthropic-beta].description
      before: 'null'
      after: '"This endpoint is in beta: requests must send dreaming-2026-04-21 in this header."'
