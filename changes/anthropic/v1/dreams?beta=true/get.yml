  note: Expanded route and parameter documentation (descriptions clarified, paging and filtering explained).
  paths:
    - path: description
      before: 'null'
      after: '"List the dreams in the workspace, newest first. Archived dreams are left out unless include_archived is true. See the Dreams guide for how to page through dreams."'
    - path: parameters[name=limit].description
      before: '"Query parameter for limit"'
      after: '"The maximum number of dreams to return, from 1 to 100. Defaults to 20."'
    - path: parameters[name=page].description
      before: '"Query parameter for page"'
      after: '"The cursor for the page to return, taken from next_page in a previous response. Leave it out to get the first page."'
    - path: parameters[name=include_archived].description
      before: '"Query parameter for include_archived"'
      after: '"Whether to include archived dreams. Defaults to false."'
    - path: parameters[name=statuses[]].description
      before: '"Filter by lifecycle status. Repeat the parameter to match any of multiple statuses. Empty applies no status filter."'
      after: '"Return only dreams that have one of these statuses. Repeat the parameter to give more than one status. Leave it out to return dreams of every status."'
    - path: parameters[name=created_at[gt]].description
      before: '"Return dreams with created_at strictly after this timestamp (exclusive lower bound, RFC 3339). Unset applies no lower bound."'
