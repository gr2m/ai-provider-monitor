- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Expanded and clarified descriptions across BetaDream and related schemas (fields, behavior, and examples).
  paths:
    - path: components/schemas/BetaDream/description
      before: 'An asynchronous memory-consolidation job that reads a memory store plus a set of session transcripts and writes consolidated memories into an output memory store — a new store by default, or an existing store chosen via output_behavior. The Dreams API is in research preview: the request and response shapes are volatile and may change without the deprecation period that applies to generally-available endpoints.'
      after: 'An asynchronous job that reads a memory store and past sessions, then writes a reorganized version of that memory store.\n\nBy default the dream writes its result to a new memory store and doesn''t change the input memory store. With `output_behavior` set to `update_existing`, it writes its result into the input memory store instead.\n\nThe Dreams API is in research preview: the request and response shapes are volatile and may change without the deprecation period that applies to generally-available endpoints.\n\nSee the [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#how-it-works) for what a dream reads and produces.'
    - path: components/schemas/BetaDream/properties/archived_at/description
      before: 'null'
      after: When the dream was archived, in RFC 3339, or `null` if it hasn't been archived.
    - path: components/schemas/BetaDream/properties/created_at/description
      before: 'null'
      after: When the dream was created, in RFC 3339.\n\nLists of dreams are sorted by this time, newest first.
    - path: components/schemas/BetaDream/properties/ended_at/description
      before: 'null'
      after: When the dream reached `completed`, `failed`, or `canceled`, in RFC 3339, or `null` if it is still `pending` or `running`.
    - path: components/schemas/BetaDream/properties/error/description
      before: 'null'
      after: Why the dream failed, or `null` if `status` isn't `failed`.
    - path: components/schemas/BetaDream/properties/id/description
      before: 'null'
      after: The unique ID of the dream (`drm_...`).
    - path: components/schemas/BetaDream/properties/inputs/description
      before: 'null'
      after: The sources that the dream reads, from the request that created it.
    - path: components/schemas/BetaDream/properties/instructions/description
      before: 'null'
      after: The guidance given when the dream was created, or `null` if none was given.
    - path: components/schemas/BetaDream/properties/output_behavior/description
      before: 'null'
      after: Where the dream writes its result, as set in the request that created the dream. If that request left out `output_behavior`, the dream used the `create_new` behavior.
    - path: components/schemas/BetaDream/properties/outputs/description
      before: 'null'
      after: The memory store that holds the dream's result, as a one-item array, or an empty array until the dream records that memory store.\n\nThe array is empty while the dream is `pending` and for a short time after it starts `running`. It can stay empty if the dream fails or is canceled before then. The memory store holds the complete result only once `status` is `completed`.\n\nSee the [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#use-the-output) for how to review and use the result.
    - path: components/schemas/BetaDream/properties/session_id/description
      before: 'null'
      after: The ID of the session that runs the dream (`sesn_...`), or `null` if that session hasn't started.\n\nStream that session's events to follow what the dream reads and writes.\n\nSee the [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#watch-the-pipeline-run) for how to watch a running dream.
    - path: components/schemas/BetaDream/properties/usage/description
      before: 'null'
      after: The dream's token counts, which stop changing once its `status` is `completed` or `failed`. After a cancel, they can keep changing.
    - path: components/schemas/BetaDreamInput/description
      before: 'null'
      after: A source that a dream reads, such as a memory store or a set of sessions.
    - path: components/schemas/BetaDreamModelConfig/description
      before: Model identifier and configuration applied to every pipeline stage. Same wire shape as the Agents API ModelConfig.
      after: The model that runs a dream, from the request that created it.\n\nThe dream uses this model for all of its work. The response always gives the model as an object, even if the request gave only a model ID.
    - path: components/schemas/BetaDreamModelConfig/properties/speed/description
      before: Inference speed mode. Defaults to `standard`.
      after: How fast the model generates output for the dream. Always `standard`.
    - path: components/schemas/BetaDreamOutput/description
      before: 'null'
      after: An entry in a dream's `outputs` that references the memory store holding its result.
    - path: components/schemas/BetaDreamStatus/description
      before: Lifecycle status of a Dream.
      after: 'Where a dream is in its lifecycle.\n\n`completed`, `failed`, and `canceled` are final: once a dream has one of these statuses, its status doesn''t change again.\n\nSee the [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#lifecycle) for what each status means.'
    - path: components/schemas/BetaDreamUsage/description
      before: Cumulative token usage for the dream across every pipeline stage.
      after: The tokens that a dream has used so far.\n\nThe counts are zero while the dream is `pending` and update while it is `running`. They can keep changing after a cancel.\n\nSee the [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#billing) for how dreams are billed. See the [prompt caching guide](https://platform.claude.com/docs/en/build-with-claude/prompt-caching#tracking-cache-performance) for how the input token counts add up.
    - path: components/schemas/BetaDreamError/properties/message/description
      before: 'null'
      after: A human-readable explanation of why the dream failed.
    - path: components/schemas/BetaDreamError/properties/type/description
      before: 'null'
      after: A code for why the dream failed, such as `timeout` or `internal_error`.\n\nThe [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#errors) lists common error codes and when they occur.
    - path: components/schemas/BetaDreamMemoryStoreInput/description
      before: 'An input memory store the dream reads from. The dream never mutates this store unless it is also the destination: with output_behavior {type: "update_existing"} the job consolidates this store in place.'
      after: The memory store that a dream reads, given as an entry in `inputs`.\n\nWith `output_behavior` set to `update_existing`, the dream writes its result into this memory store. Otherwise the dream doesn't change it.
    - path: components/schemas/BetaDreamMemoryStoreInput/properties/memory_store_id/description
      before: 'null'
      after: The ID of the memory store for the dream to read (`memstore_...`).\n\nThe memory store must be in the same workspace as the dream and must not be archived.
    - path: components/schemas/BetaDreamSessionsInput/description
      before: Input session transcripts the dream reads.
      after: The sessions that a dream reads, given as an entry in `inputs`.
    - path: components/schemas/BetaDreamSessionsInput/properties/session_ids/description
      before: 'null'
      after: The IDs of the sessions whose transcripts the dream reads (`sesn_...`).\n\nGive 1 to 100 IDs, with no duplicates. Each session must be in the same workspace as the dream. Responses list the IDs in sorted order.\n\nThe [limits table in the Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#limits) lists all the limits on a dream.
    - path: components/schemas/BetaOutputBehavior/description
      before: 'null'
      after: Which memory store a dream writes its result to. Defaults to `create_new` when left out of a create request.
    - path: components/schemas/BetaOutputBehaviorCreateNew/description
      before: 'The default destination: the job creates a new output memory store as a clone of the memory_store input and writes the consolidated memories into it. The input store is never mutated.'
      after: Write the result to a new memory store that starts as a copy of the input memory store. This is the default.\n\nThe new memory store is in the same workspace as the dream. The dream doesn't change the input memory store.
    - path: components/schemas/BetaOutputBehaviorUpdateExisting/description
      before: The job writes the consolidated memories into this existing memory store instead of creating one. In EAP the store must be the job's own memory_store input, so the job consolidates the store in place.
      after: Write the result into the input memory store instead of a new memory store.\n\nThe credential must be allowed to write memory stores, or the request returns a 403 error. While another `update_existing` dream on the same memory store hasn't fully stopped, the request returns a 409 error.
    - path: components/schemas/BetaOutputBehaviorUpdateExisting/properties/memory_store_id/description
      before: 'null'
      after: The ID of the memory store for the dream to write its result to (`memstore_...`). It must be the memory store in the `memory_store` entry of `inputs`.
    - path: components/schemas/BetaDreamMemoryStoreOutput/description
      before: An output memory store the dream writes consolidated memories into.
      after: The memory store that holds a dream's result, as an entry in `outputs`.
    - path: components/schemas/BetaDreamMemoryStoreOutput/properties/memory_store_id/description
      before: 'null'
      after: The ID of the memory store that the dream writes its result to (`memstore_...`).\n\nWith `output_behavior` set to `create_new`, this is a new memory store. With `update_existing`, it is the input memory store.
    - path: components/schemas/BetaTargetStoreHeldError/description
      before: 'The `output_behavior.memory_store_id` target is still held by a prior `{type: "update_existing"}` dream — one that is `pending` or `running`, or was canceled with its final writes still landing. Rarely the named dream has just finished (`completed`/`failed`) and its execution is still closing; an immediate retry then almost always succeeds. The message names the holding dream when the server can identify it (rarely omitted); poll it to a terminal state or cancel it, then retry. Carried with `x-should-retry: false`.'
      after: Returned with status 409 when a request to create a dream sets `output_behavior` to `update_existing` and another dream that writes into the same memory store hasn't fully stopped.\n\nThe other dream is `pending` or `running`, or it has just stopped and is still finishing its last writes. `message` gives the ID of the other dream when the server can identify it. If that dream has already reached `completed`, `failed`, or `canceled`, retry after a short wait. Otherwise, wait for the other dream to end or cancel it, then retry. The response sets the `x-should-retry` header to `false`.
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
