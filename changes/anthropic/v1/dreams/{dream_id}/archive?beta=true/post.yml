- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Expanded and clarified documentation for the BetaDream schema and its properties.
  paths:
    - path: components/schemas/BetaDream/description
      before: '"An asynchronous memory-consolidation job that reads a memory store plus a set of session transcripts and writes consolidated memories into an output memory store — a new store by default, or an existing store chosen via output_behavior. The Dreams API is in research preview: the request and response shapes are volatile and may change without the deprecation period that applies to generally-available endpoints."'
      after: '"An asynchronous job that reads a memory store and past sessions, then writes a reorganized version of that memory store.\n\nBy default the dream writes its result to a new memory store and doesn''t change the input memory store. With `output_behavior` set to `update_existing`, it writes its result into the input memory store instead.\n\nThe Dreams API is in research preview: the request and response shapes are volatile and may change without the deprecation period that applies to generally-available endpoints.\n\nSee the [Dreams guide](https://platform.claude.com/docs/en/managed-agents/dreams#how-it-works) for what a dream reads and produces."'
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
