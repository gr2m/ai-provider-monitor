      before: Input session transcripts the dream reads.
      after: The sessions that a dream reads, given as an entry in `inputs`.
    - path: components/schemas/BetaDreamSessionsInput/properties/session_ids/description
      before: 'null'
      after: The IDs of the sessions whose transcripts the dream reads (`sesn_...`)...
    - path: components/schemas/BetaDreamStatus/description
      before: Lifecycle status of a Dream.
      after: Where a dream is in its lifecycle... final statuses...
    - path: components/schemas/BetaDreamUsage/description
