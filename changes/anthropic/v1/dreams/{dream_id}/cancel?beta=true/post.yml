      before: 'null'
      after: A source that a dream reads, such as a memory store or a set of sessions.
    - path: components/schemas/BetaDreamOutput/description
      before: 'null'
      after: An entry in a dream's `outputs` that references the memory store...
    - path: components/schemas/BetaDreamMemoryStoreInput/description
      before: An input memory store the dream reads from...
      after: The memory store that a dream reads, given as an entry in `inputs`...
    - path: components/schemas/BetaDreamMemoryStoreInput/properties/memory_store_id/description
      before: 'null'
      after: The ID of the memory store for the dream to read (`memstore_...`)...
