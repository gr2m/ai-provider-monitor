  note: 'Introduces a beta POST endpoint to archive a session thread within a Managed Agents session. Archives the specified thread (sets archived_at) and returns the updated BetaManagedAgentsSessionThread object. Route: POST /v1/sessions/{session_id}/threads/{thread_id}/archive?beta=true. Supports optional anthropic-version and anthropic-beta headers and standard error responses.'
