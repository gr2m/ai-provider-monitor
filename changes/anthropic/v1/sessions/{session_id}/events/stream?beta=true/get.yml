- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: 'Clarified routing guidance: session_thread_id on several events is now informational only and set by the server; clients should not echo it back.'
  paths:
    - path: components.schemas.BetaManagedAgentsAgentCustomToolUseEvent.properties.session_thread_id.description
      before: When set, this event was cross-posted... Echo this on a `user.custom_tool_result` event to route the result back.
      after: 'When set, this event was cross-posted... Informational only: the server routes the matching `user.custom_tool_result` by `custom_tool_use_id`, so clients do not send it back.'
    - path: components.schemas.BetaManagedAgentsAgentMcpToolUseEvent.properties.session_thread_id.description
      before: When set, this event was cross-posted... Echo this on a `user.tool_confirmation` event to route the approval back.
      after: 'When set, this event was cross-posted... Informational only: the server routes the matching `user.tool_confirmation` by `tool_use_id`, so clients do not send it back.'
    - path: components.schemas.BetaManagedAgentsUserToolConfirmationEvent.properties.session_thread_id.description
      before: When set, the confirmation routes to this subagent's thread rather than the primary. Echo this from the `session_thread_id`...
      after: Set by the server to the subagent thread this confirmation was routed to. Omitted when it was routed to the primary thread.
    - path: components.schemas.BetaManagedAgentsUserCustomToolResultEvent.properties.session_thread_id.description
      before: Routes this result to a subagent thread. Copy from the `agent.custom_tool_use` event's `session_thread_id`.
      after: Set by the server to the subagent thread this result was routed to. Omitted when it was routed to the primary thread.
    - path: components.schemas.BetaManagedAgentsUserToolResultEvent.properties.session_thread_id.description
      before: Routes this result to a subagent thread. Copy from the `agent.tool_use` event's `session_thread_id`.
      after: Set by the server to the subagent thread this result was routed to. Omitted when it was routed to the primary thread.
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
