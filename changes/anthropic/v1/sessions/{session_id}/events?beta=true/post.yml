  note: 'Documentation updates: added detailed descriptions for anthropic-version and anthropic-beta headers; removed session_id description; clarified that session_thread_id on certain output events is server-set; minor wording tweaks in parameter/event field descriptions.'
  paths:
    - path: /parameters/0/description
      before: 'null'
      after: The version of the Claude API you want to use.\n\nRead more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning).
    - path: /parameters/1/description
      before: 'null'
      after: 'This endpoint is in beta: requests must send `managed-agents-2026-04-01` in this header.'
    - path: /parameters/1/schema/description
      before: 'null'
      after: 'This endpoint is in beta: requests must send `managed-agents-2026-04-01` in this header.'
    - path: /parameters/2/description
      before: Path parameter session_id
      after: 'null'
    - path: /components/schemas/BetaManagedAgentsUserToolConfirmationEvent/properties/session_thread_id/description
      before: When set, the confirmation routes to this subagent's thread rather than the primary. Echo this from the `session_thread_id` on the `agent.tool_use` or `agent.mcp_tool_use` event that prompted the approval.
      after: Set by the server to the subagent thread this confirmation was routed to. Omitted when it was routed to the primary thread.
    - path: /components/schemas/BetaManagedAgentsUserCustomToolResultEvent/properties/session_thread_id/description
      before: Routes this result to a subagent thread. Copy from the `agent.custom_tool_use` event's `session_thread_id`.
      after: Set by the server to the subagent thread this result was routed to. Omitted when it was routed to the primary thread.
    - path: /components/schemas/BetaManagedAgentsUserToolResultEvent/properties/session_thread_id/description
      before: Routes this result to a subagent thread. Copy from the `agent.tool_use` event's `session_thread_id`.
      after: Set by the server to the subagent thread this result was routed to. Omitted when it was routed to the primary thread.
    - path: /components/schemas/BetaManagedAgentsUserCustomToolResultEventParams/properties/custom_tool_use_id/description
      before: The id of the `agent.custom_tool_use` event this result corresponds to, which can be found in the last `session.status_idle` [event's](https://platform.claude.com/docs/en/api/beta/sessions/events/list#beta_managed_agents_session_requires_action.event_ids) `stop_reason.event_ids` field.
      after: The id of the `agent.custom_tool_use` event this result corresponds to. It is also listed in the last `session.status_idle` [event's](https://platform.claude.com/docs/en/api/beta/sessions/events/list#beta_managed_agents_session_requires_action.event_ids) `stop_reason.event_ids` field.
  date: '2026-11-02'
