- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /v1/sessions/{session_id}/resources/{resource_id}?beta=true to update a session resource. Accepts JSON with authorization_token to rotate credentials (currently only for github_repository). Returns the updated resource (type github_repository or file).
  paths: []
  date: '2026-04-08'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/879
- change: added
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Added new 'memory_store' resource type to 200 response (discriminator mapping and oneOf). Clients must handle this new type.
  paths:
    - path: components/schemas/BetaManagedAgentsUpdateSessionResource/discriminator/mapping/memory_store
      before: 'null'
      after: '#/components/schemas/BetaManagedAgentsMemoryStoreResource'
    - path: components/schemas/BetaManagedAgentsUpdateSessionResource/oneOf/2/$ref
      before: 'null'
      after: '#/components/schemas/BetaManagedAgentsMemoryStoreResource'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'GitHubRepositoryResource.checkout nullability representation changed from ''nullable: true'' to anyOf [RepositoryCheckout, null]. No functional change expected.'
  paths:
    - path: components/schemas/BetaManagedAgentsGitHubRepositoryResource/properties/checkout/nullable
      before: 'true'
      after: 'null'
    - path: components/schemas/BetaManagedAgentsGitHubRepositoryResource/properties/checkout/anyOf
      before: 'null'
      after: '[{"$ref":"#/components/schemas/BetaManagedAgentsRepositoryCheckout"},{"type":"null"}]'
  date: '2026-08-24'
