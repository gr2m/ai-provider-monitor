  doc_only: false
  note: Adds beta endpoint POST /v1/sessions/{session_id}?beta=true to update a Managed Agents session. Supports patch-style updates to title and metadata (metadata keys can be set or deleted via null). 'vault_ids' is reserved and requests setting it are rejected. Returns the updated session object on success.
