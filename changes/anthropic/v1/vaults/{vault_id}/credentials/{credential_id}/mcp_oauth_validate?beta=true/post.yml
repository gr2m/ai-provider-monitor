  note: Clarified descriptions for mcp_probe and MCP probe http_response in response schemas.
  paths:
    - path: components/schemas/BetaManagedAgentsCredentialValidation/properties/mcp_probe/description
      before: Details of the failing MCP probe step. Null when the probe succeeded.
      after: Details of the MCP probe step that failed, or `null` if the probe succeeded or there was no access token to test.
    - path: components/schemas/BetaManagedAgentsMcpProbe/properties/http_response/description
      before: The captured HTTP error response. Null when no HTTP response was received (timeout, DNS, TLS).
      after: The HTTP error response from the MCP server, or `null` if the MCP server didn't return one for the failing step, for example after a timeout or a DNS or TLS failure.
  date: '2026-11-02'
