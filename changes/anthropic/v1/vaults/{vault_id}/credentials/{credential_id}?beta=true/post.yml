- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds a beta POST endpoint to update an existing vault credential by ID, allowing changes to display_name, metadata (patch semantics), and auth configuration (type immutable; supports static_bearer and mcp_oauth). Returns the updated credential on success.
  paths: []
  date: '2026-04-08'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/879
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Increased max length of OAuth refresh 'scope' in request body from 2048 to 8192 characters.
  paths:
    - path: components.schemas.BetaManagedAgentsMcpOauthRefreshUpdateParams.properties.scope.maxLength
      before: '2048'
      after: '8192'
  date: '2026-04-16'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/904
- change: added
