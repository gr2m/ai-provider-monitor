- change: added
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Added 'environment_variable' as a new credential auth type with supporting networking/injection schemas.
  paths:
    - path: components.schemas.BetaManagedAgentsCredentialAuth.discriminator.mapping.environment_variable
      before: 'null'
      after: '#/components/schemas/BetaManagedAgentsEnvironmentVariableAuthResponse'
    - path: components.schemas.BetaManagedAgentsCredentialAuth.oneOf[2]
      before: 'null'
      after: '$ref -> #/components/schemas/BetaManagedAgentsEnvironmentVariableAuthResponse'
    - path: components.schemas.BetaManagedAgentsEnvironmentVariableAuthResponse
      before: 'null'
      after: '{ "type": "object", "properties": { "type": "environment_variable", "secret_name": ..., "networking": ..., "injection_location": ... } }'
    - path: components.schemas.BetaManagedAgentsInjectionLocationResponse
      before: 'null'
      after: '{ "type": "object", "properties": { "header": boolean, "body": boolean } }'
    - path: components.schemas.BetaManagedAgentsCredentialNetworkingResponse
      before: 'null'
      after: '{ "type": "object", "oneOf": [ Unrestricted, Limited ], discriminator: type }'
    - path: components.schemas.BetaManagedAgentsUnrestrictedCredentialNetworkingResponse
      before: 'null'
      after: '{ "type": "object", "properties": { "type": "unrestricted" } }'
    - path: components.schemas.BetaManagedAgentsLimitedCredentialNetworkingResponse
      before: 'null'
      after: '{ "type": "object", "properties": { "type": "limited", "allowed_hosts": [string] } }'
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/934
