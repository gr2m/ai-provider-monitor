- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces beta GET /v1/vaults/{vault_id}/credentials?beta=true to list credentials in a vault. Supports pagination via limit and page, and include_archived filter. Returns a paginated list of credential metadata (no secrets).
  paths: []
  date: '2026-04-08'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/879
