- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Added beta endpoint POST /v1/vaults/{vault_id}?beta=true to update an existing vault by ID. Accepts JSON body with optional display_name (1–255 chars) and a metadata patch (set string to upsert, null to delete). Returns the updated vault object. Supports optional headers anthropic-version and anthropic-beta.
  paths: []
  date: '2026-04-08'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/879
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: display_name nullability representation changed from nullable:true to anyOf [string|null]; behavior unchanged
  paths:
    - path: components/schemas/BetaManagedAgentsUpdateVaultRequestBody/properties/display_name
      before: '{"type":"string","minLength":1,"maxLength":255,"nullable":true}'
      after: '{"anyOf":[{"type":"string","minLength":1,"maxLength":255},{"type":"null"}]}'
  date: '2026-08-24'
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: metadata schema now uses anyOf [object|null], and its additionalProperties allow string|null via anyOf; behavior unchanged
  paths:
    - path: components/schemas/BetaManagedAgentsUpdateVaultRequestBody/properties/metadata
      before: '{"type":"object","nullable":true,"additionalProperties":{"type":"string","nullable":true}}'
      after: '{"anyOf":[{"type":"object","additionalProperties":{"anyOf":[{"type":"string"},{"type":"null"}]}},{"type":"null"}]}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: archived_at nullability representation changed from nullable:true + allOf to anyOf [timestamp|null]; behavior unchanged
  paths:
    - path: components/schemas/BetaManagedAgentsVault/properties/archived_at
      before: '{"allOf":[{"$ref":"#/components/schemas/BetaTimestamp"}],"nullable":true}'
      after: '{"anyOf":[{"$ref":"#/components/schemas/BetaTimestamp"},{"type":"null"}]}'
  date: '2026-08-24'
