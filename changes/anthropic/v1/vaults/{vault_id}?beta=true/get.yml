- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: BetaManagedAgentsVault.archived_at schema now models null via anyOf [Timestamp|null] instead of allOf + nullable.
  paths:
    - path: components/schemas/BetaManagedAgentsVault/properties/archived_at
      before: '{"allOf":[{"$ref":"#/components/schemas/BetaTimestamp"}],"description":"When the vault was archived. Null if not archived.","examples":[null],"nullable":true}'
      after: '{"anyOf":[{"$ref":"#/components/schemas/BetaTimestamp"},{"type":"null"}],"description":"When the vault was archived. Null if not archived.","examples":[null]}'
  date: '2026-08-24'
