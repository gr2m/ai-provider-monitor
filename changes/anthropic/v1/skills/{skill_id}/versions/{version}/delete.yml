    - path: responses.401
      before: 'null'
      after: '{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}},"description":"Unauthenticated - The request does not have valid authentication credentials"}'
    - path: responses.403
      before: 'null'
      after: '{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}},"description":"Permission denied - The caller does not have permission to execute the specified operation"}'
    - path: responses.404
      before: 'null'
      after: '{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}},"description":"Not found - Some requested entity was not found"}'
    - path: responses.408
      before: 'null'
      after: '{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}},"description":"Deadline exceeded - The deadline expired before the operation could complete"}'
    - path: responses.409
      before: 'null'
      after: '{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}},"description":"Aborted - The operation was aborted due to concurrency issue"}'
    - path: responses.412
      before: 'null'
      after: '{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}},"description":"Failed precondition - Operation was rejected because the system is not in required state"}'
    - path: responses.413
      before: 'null'
      after: '{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}},"description":"Out of range - Operation was attempted past the valid range"}'
    - path: responses.429
      before: 'null'
      after: '{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}},"description":"Resource exhausted - Some resource has been exhausted (rate limiting)"}'
    - path: responses.431
