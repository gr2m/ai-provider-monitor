- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds beta GET endpoint to download a specific skill version''s content as a ZIP archive. Path params: skill_id (string) and version (Unix epoch string). Requires beta access (e.g., ?beta=true) and supports headers anthropic-beta, anthropic-version, and x-api-key. Returns application/zip on success; 4XX returns a BetaErrorResponse.'
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/934
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated the description of the 'version' path parameter to clarify version ID usage and epoch timestamp behavior when the 'skills-2025-10-02' beta header is present.
  paths:
    - path: parameters[1].description
      before: |-
        Version identifier for the skill.

        Each version is identified by a Unix epoch timestamp (e.g., "1759178010641129").
      after: |-
        Identifies the skill version by its version ID.

        Requests carrying the `skills-2025-10-02` beta header address versions by their Unix epoch timestamp instead (e.g., "1759178010641129").
    - path: parameters[1].schema.description
      before: |-
        Version identifier for the skill.

        Each version is identified by a Unix epoch timestamp (e.g., "1759178010641129").
      after: |-
        Identifies the skill version by its version ID.

        Requests carrying the `skills-2025-10-02` beta header address versions by their Unix epoch timestamp instead (e.g., "1759178010641129").
  date: '2026-08-27'
