- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces beta GET /v1/deployments/{deployment_id}?beta=true to fetch a Managed Agents deployment by ID, returning deployment details on 200 or BetaErrorResponse on errors; supports x-api-key, anthropic-version, and anthropic-beta headers.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/934
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description of paused_reason to use backticks around values; no schema/behavior change.
  paths:
    - path: components.schemas.BetaManagedAgentsDeployment.properties.paused_reason.description
      before: Why the deployment is paused. Non-null exactly when status is paused; null otherwise.
      after: Why the deployment is `paused`. Non-null exactly when `status` is `paused`; null otherwise.
  date: '2026-09-01'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/982
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified memory store access description with backticks around enum values; no schema change.
  paths:
    - path: components.schemas.BetaManagedAgentsMemoryStoreResourceConfig.properties.access.description
      before: Access mode for the mounted store. Defaults to read_write. read_only mounts the store as a read-only filesystem.
      after: Access mode for the mounted store. Defaults to `read_write`. `read_only` mounts the store as a read-only filesystem.
  date: '2026-09-01'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/982
- change: removed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: Removed x-api-key header parameter from this endpoint.
  paths:
    - path: parameters[x-api-key]
      before: '{"in":"header","name":"x-api-key","schema":{"type":"string"},"required":false}'
      after: 'null'
  date: '2026-11-02'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional anthropic-workspace-id header to select the Workspace for the request.
  paths:
    - path: parameters[anthropic-workspace-id]
      before: 'null'
      after: '{"in":"header","name":"anthropic-workspace-id","schema":{"type":"string"},"required":false}'
  date: '2026-11-02'
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: anthropic-beta header changed from a single string to an array of values; items now reference the AnthropicBeta schema. Docs specify this endpoint requires including managed-agents-2026-04-01.
  paths:
    - path: parameters[anthropic-beta].schema.type
      before: string
      after: array
    - path: parameters[anthropic-beta].schema.items.type
      before: string
      after: 'null'
    - path: parameters[anthropic-beta].schema.items.$ref
      before: 'null'
      after: '#/components/schemas/AnthropicBeta'
  date: '2026-11-02'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added AnthropicBeta schema enumerating known beta flags (still allows any string).
  paths:
    - path: components.schemas.AnthropicBeta
      before: 'null'
      after: present
  date: '2026-11-02'
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: 'Updated parameter descriptions: anthropic-version, anthropic-beta, and deployment_id.'
  paths:
    - path: parameters[anthropic-version].description
      before: 'null'
      after: 'The version of the Claude API you want to use. Read more about versioning and our version history here: https://platform.claude.com/docs/en/api/versioning.'
    - path: parameters[anthropic-beta].description
      before: 'null'
      after: 'This endpoint is in beta: requests must send managed-agents-2026-04-01 in this header.'
    - path: parameters[deployment_id].description
      before: Path parameter deployment_id
      after: Unique identifier of the deployment.
  date: '2026-11-02'
