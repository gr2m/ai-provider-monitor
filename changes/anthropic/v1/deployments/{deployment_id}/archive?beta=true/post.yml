- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds a beta endpoint to archive a Managed Agents deployment by ID. POST /v1/deployments/{deployment_id}/archive?beta=true returns the updated deployment (BetaManagedAgentsDeployment) with archived_at set; standard BetaErrorResponse on errors.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/934
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description for paused_reason to add inline code formatting and clarify linkage to status.
  paths:
    - path: components.schemas.BetaManagedAgentsDeployment.properties.paused_reason.description
      before: Why the deployment is paused. Non-null exactly when status is paused; null otherwise.
      after: Why the deployment is `paused`. Non-null exactly when `status` is `paused`; null otherwise.
  date: '2026-09-01'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description for memory_store access mode to add inline code formatting for values.
  paths:
    - path: components.schemas.BetaManagedAgentsMemoryStoreResourceConfig.properties.access.description
      before: Access mode for the mounted store. Defaults to read_write. read_only mounts the store as a read-only filesystem.
      after: Access mode for the mounted store. Defaults to `read_write`. `read_only` mounts the store as a read-only filesystem.
  date: '2026-09-01'
