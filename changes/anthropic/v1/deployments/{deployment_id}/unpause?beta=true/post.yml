- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces a beta endpoint to unpause a Managed Agents deployment. Call POST /v1/deployments/{deployment_id}/unpause?beta=true to transition a paused deployment to active. Returns the updated BetaManagedAgentsDeployment on 200. Supports optional anthropic-version and anthropic-beta headers; requires deployment_id path param.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/934
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified description of BetaManagedAgentsDeployment.paused_reason with inline code formatting.
  paths:
    - path: $.components.schemas.BetaManagedAgentsDeployment.properties.paused_reason.description
      before: Why the deployment is paused. Non-null exactly when status is paused; null otherwise.
      after: Why the deployment is `paused`. Non-null exactly when `status` is `paused`; null otherwise.
  date: '2026-09-01'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description of memory_store access to use inline code formatting for values.
  paths:
    - path: $.components.schemas.BetaManagedAgentsMemoryStoreResourceConfig.properties.access.description
      before: Access mode for the mounted store. Defaults to read_write. read_only mounts the store as a read-only filesystem.
      after: Access mode for the mounted store. Defaults to `read_write`. `read_only` mounts the store as a read-only filesystem.
  date: '2026-09-01'
