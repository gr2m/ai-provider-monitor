  note: Adds beta POST /v1/deployments/{deployment_id}/pause to manually pause a managed agent deployment. Returns the updated BetaManagedAgentsDeployment (status paused with paused_reason). Requires deployment_id path param; supports optional anthropic-version/anthropic-beta headers; standard error responses included.
