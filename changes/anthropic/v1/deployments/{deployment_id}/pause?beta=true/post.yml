- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds beta POST /v1/deployments/{deployment_id}/pause to manually pause a managed agent deployment. Returns the updated BetaManagedAgentsDeployment (status paused with paused_reason). Requires deployment_id path param; supports optional anthropic-version/anthropic-beta headers; standard error responses included.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/934
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified paused_reason description to explicitly reference `status` and `paused` states.
  paths:
    - path: components/schemas/BetaManagedAgentsDeployment/properties/paused_reason/description
      before: Why the deployment is paused. Non-null exactly when status is paused; null otherwise.
      after: Why the deployment is `paused`. Non-null exactly when `status` is `paused`; null otherwise.
  date: '2026-09-01'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/982
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Improved description for memory_store access to format default and option names with backticks.
  paths:
    - path: components/schemas/BetaManagedAgentsMemoryStoreResourceConfig/properties/access/description
      before: Access mode for the mounted store. Defaults to read_write. read_only mounts the store as a read-only filesystem.
      after: Access mode for the mounted store. Defaults to `read_write`. `read_only` mounts the store as a read-only filesystem.
  date: '2026-09-01'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/982
