- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds a beta endpoint to record a heartbeat for a work item and maintain/extend its lease. Supports desired_ttl_seconds and optimistic concurrency via expected_last_heartbeat; returns last_heartbeat, lease_extended, state, and ttl_seconds. Intended for SDK/CLI self-hosted workers.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/934
