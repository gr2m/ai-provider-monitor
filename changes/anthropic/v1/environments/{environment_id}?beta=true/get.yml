- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces beta endpoint GET /v1/environments/{environment_id}?beta=true to retrieve an environment by ID. Returns BetaEnvironment on 200 success and BetaErrorResponse on 4XX. Supports anthropic-beta and anthropic-version headers; accepts x-api-key or sessionKey for auth.
  paths: []
  date: '2026-04-08'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/879
