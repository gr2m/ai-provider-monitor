- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Environment.description can now be null (was string only). Clients must handle null.
  paths:
    - path: components/schemas/BetaEnvironment/properties/description
      before: '{"description":"User-provided description for the environment","examples":["Python environment with data-analysis packages."],"title":"Description","type":"string"}'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"User-provided description for the environment; null when unset","examples":["Python environment with data-analysis packages."],"title":"Description"}'
  date: '2026-08-24'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional Environment.scope property with enum [organization, account].
  paths:
    - path: components/schemas/BetaEnvironment/properties/scope
      before: 'null'
      after: '{"description":"The visibility scope for this environment. ''organization'' means visible to all accounts. ''account'' means visible only to the owning account.","enum":["organization","account"],"title":"Scope","type":"string"}'
  date: '2026-08-24'
- change: added
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Added self-hosted environment config variant. config.type may now be "self_hosted" and config may follow BetaSelfHostedConfig.
  paths:
    - path: components/schemas/BetaEnvironment/properties/config/discriminator/mapping/self_hosted
      before: 'null'
      after: '#/components/schemas/BetaSelfHostedConfig'
    - path: components/schemas/BetaEnvironment/properties/config/oneOf/1
      before: 'null'
      after: '{"$ref":"#/components/schemas/BetaSelfHostedConfig"}'
    - path: components/schemas/BetaSelfHostedConfig
      before: 'null'
      after: '{"additionalProperties":false,"description":"Configuration for self-hosted environments.","properties":{"type":{"const":"self_hosted","description":"Environment type","title":"Type","type":"string"}},"required":["type"],"title":"SelfHostedConfig","type":"object"}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Terminology updated from BYOC to self-hosted in Environment docs.
  paths:
    - path: components/schemas/BetaEnvironment/description
      before: Unified Environment resource for both cloud and BYOC environments.
      after: Unified Environment resource for both cloud and self-hosted environments.
    - path: components/schemas/BetaEnvironment/properties/config/description
      before: Environment configuration (either Anthropic Cloud or BYOC)
      after: Environment configuration (either Anthropic Cloud or self-hosted)
  date: '2026-08-24'
