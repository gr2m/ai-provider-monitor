- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds beta endpoint POST /v1/user_profiles?beta=true to create a user profile. Accepts JSON body with optional external_id and metadata; returns a user_profile object (id, timestamps, metadata, external_id, trust_grants). Supports optional anthropic-version and anthropic-beta headers; returns 200 on success with standard error responses.
  paths: []
  date: '2026-04-16'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/904
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional access_type to creation request.
  paths:
    - path: $.components.schemas.BetaCreateUserProfileRequest.properties.access_type
      before: 'null'
      after: '{"allOf":[{"$ref":"#/components/schemas/BetaUserProfileAccessType"}],"description":"How the platform uses the API for this entity. `application` (default): the profile represents an individual end-user of the platform''s product. `passthrough`: the profile identifies a company the platform resells Claude access to."}'
  date: '2026-08-24'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional name to creation request.
  paths:
    - path: $.components.schemas.BetaCreateUserProfileRequest.properties.name
      before: 'null'
      after: '{"anyOf":[{"maxLength":255,"minLength":1,"type":"string"},{"type":"null"}],"description":"Optional for all profiles. Real-world name of the entity this profile represents (company or individual); for a resold-to company (`relationship` `resold` / `access_type` `passthrough`), that company''s name where known. Maximum 255 characters."}'
  date: '2026-08-24'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional relationship to creation request.
  paths:
    - path: $.components.schemas.BetaCreateUserProfileRequest.properties.relationship
      before: 'null'
      after: '{"allOf":[{"$ref":"#/components/schemas/BetaUserProfileRelationship"}],"description":"How the entity relates to the platform. `external` (default): an individual end-user. `resold`: a company the platform resells Claude access to. `internal`: the platform''s own usage."}'
  date: '2026-08-24'
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: external_id schema changed from nullable string to anyOf [string|null] with same constraints.
  paths:
    - path: $.components.schemas.BetaCreateUserProfileRequest.properties.external_id
      before: '{"description":"Platform''s own identifier for this user. Not enforced unique. Maximum 255 characters.","examples":["user_12345"],"maxLength":255,"minLength":1,"nullable":true,"type":"string"}'
      after: '{"anyOf":[{"maxLength":255,"minLength":1,"type":"string"},{"type":"null"}],"description":"Platform''s own identifier for this user. Not enforced unique. Maximum 255 characters.","examples":["user_12345"]}'
  date: '2026-08-24'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional access_type field to user profile response.
  paths:
    - path: $.components.schemas.BetaUserProfile.properties.access_type
      before: 'null'
      after: '{"allOf":[{"$ref":"#/components/schemas/BetaUserProfileAccessType"}],"description":"How the platform uses the API for this entity: `application` (default) or `passthrough`. Present under the `user-profiles-2026-08-18` beta header."}'
  date: '2026-08-24'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional name field to user profile response.
  paths:
    - path: $.components.schemas.BetaUserProfile.properties.name
      before: 'null'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"Real-world name of the entity this profile represents (company or individual). For a resold-to company (`access_type` `passthrough`, or `relationship` `resold` under the `user-profiles-2026-03-24` header) this is that company''s name.","examples":["Example User"]}'
  date: '2026-08-24'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional relationship field to user profile response.
  paths:
    - path: $.components.schemas.BetaUserProfile.properties.relationship
      before: 'null'
      after: '{"allOf":[{"$ref":"#/components/schemas/BetaUserProfileRelationship"}],"description":"How the entity relates to the platform. `external` (default), `resold`, or `internal`. Present under the `user-profiles-2026-03-24` beta header.","examples":["external"]}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: external_id in response changed from nullable string to anyOf [string|null].
  paths:
    - path: $.components.schemas.BetaUserProfile.properties.external_id
      before: '{"description":"Platform''s own identifier for this user. Not enforced unique.","examples":["user_12345"],"nullable":true,"type":"string"}'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"Platform''s own identifier for this user. Not enforced unique.","examples":["user_12345"]}'
  date: '2026-08-24'
