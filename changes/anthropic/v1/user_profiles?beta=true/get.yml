      before: '"Platform''s own identifier for this user. Not enforced unique."'
      after: '"Platform''s own identifier for this user. Not enforced unique. Legacy field, present only under the `user-profiles-2026-03-24` and `user-profiles-2026-08-18` beta headers; without one of them, the value is `external_user_details.reference_id`."'
