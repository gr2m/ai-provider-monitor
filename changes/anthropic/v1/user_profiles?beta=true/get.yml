    - path: $.components.schemas.BetaUserProfileExternalUserDetails
      before: 'null'
      after: '{"additionalProperties":false,"description":"Details about the entity this profile represents, as the platform states them. Anthropic does not verify them. Every field is present, `null` until the platform supplies a value.","properties":{"account_status":{"anyOf":[{"$ref":"#/components/schemas/BetaUserProfileExternalUserAccountStatus"},{"type":"null"}],"description":"The status of the entity''s account on the platform: `active`, `suspended` or `blocked`. `null` until the platform supplies one."},"country":{"anyOf":[{"type":"string"},{"type":"null"}],"description":"The country the platform associates with the entity, as an ISO 3166-1 alpha-2 code. `null` until the platform supplies one."},"email_hash":{"anyOf":[{"type":"string"},{"type":"null"}],"description":"The platform-computed hash of the entity''s email address. `null` until the platform supplies one."},"entity_type":{"anyOf":[{"$ref":"#/components/schemas/BetaUserProfileExternalUserEntityType"},{"type":"null"}],"description":"What kind of entity the profile represents: `individual`, `business`, `non_profit` or `government`. `null` until the platform supplies one."},"name_hash":{"anyOf":[{"type":"string"},{"type":"null"}],"description":"The platform-computed hash of the entity''s name. `null` until the platform supplies one."},"onboarded_at":{"anyOf":[{"$ref":"#/components/schemas/BetaTimestamp"},{"type":"null"}],"description":"When the entity opened its account with the platform, as stated by the platform, in RFC 3339 format (UTC). `null` until the platform supplies one."},"reference_id":{"anyOf":[{"type":"string"},{"type":"null"}],"description":"The platform''s own reference for the entity. `null` until the platform supplies one."}},"required":["reference_id","onboarded_at","account_status","entity_type","country","name_hash","email_hash"],"type":"object"}'
