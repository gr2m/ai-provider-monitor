- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces beta-only GET /v1/user_profiles to list user profiles with pagination (limit, page) and ordering (asc|desc); returns a page of profiles and next_page cursor.
  paths: []
  date: '2026-04-16'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/904
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: next_page in list response is now required and always present (string or null) instead of an optional nullable string.
  paths:
    - path: components/schemas/BetaListUserProfilesResponse/required
      before: '["data"]'
      after: '["data","next_page"]'
    - path: components/schemas/BetaListUserProfilesResponse/properties/next_page
      before: '{"type":"string","nullable":true}'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}]}'
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/934
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added optional fields to UserProfile: access_type, name, relationship.'
  paths:
    - path: components/schemas/BetaUserProfile/properties/access_type
      before: 'null'
      after: '{"allOf":[{"$ref":"#/components/schemas/BetaUserProfileAccessType"}],"description":"How the platform uses the API for this entity: `application` (default) or `passthrough`. Present under the `user-profiles-2026-08-18` beta header."}'
    - path: components/schemas/BetaUserProfile/properties/name
      before: 'null'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"Real-world name of the entity this profile represents (company or individual). For a resold-to company (`access_type` `passthrough`, or `relationship` `resold` under the `user-profiles-2026-03-24` header) this is that company''s name."}'
    - path: components/schemas/BetaUserProfile/properties/relationship
      before: 'null'
      after: '{"allOf":[{"$ref":"#/components/schemas/BetaUserProfileRelationship"}],"description":"How the entity relates to the platform. `external` (default), `resold`, or `internal`. Present under the `user-profiles-2026-03-24` beta header."}'
