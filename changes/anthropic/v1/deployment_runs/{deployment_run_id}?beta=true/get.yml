- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Descriptions updated to add backticks around field names; no schema or behavior changes.
  paths:
    - path: components/schemas/BetaManagedAgentsDeploymentRun/properties/error/description
      before: Populated on creation failure. Null on success. Exactly one of session_id or error is non-null.
      after: Populated on creation failure. Null on success. Exactly one of `session_id` or `error` is non-null.
    - path: components/schemas/BetaManagedAgentsDeploymentRun/properties/session_id/description
      before: Populated on success. Null on creation failure. Exactly one of session_id or error is non-null.
      after: Populated on success. Null on creation failure. Exactly one of `session_id` or `error` is non-null.
    - path: components/schemas/BetaManagedAgentsScheduleTriggerContext/properties/scheduled_at/description
      before: The UTC instant at which the cron expression matched in the configured timezone, before jitter is applied. At most one run is recorded per (deployment_id, scheduled_at) pair.
      after: The UTC instant at which the cron expression matched in the configured timezone, before jitter is applied. At most one run is recorded per (`deployment_id`, `scheduled_at`) pair.
  date: '2026-09-01'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/982
