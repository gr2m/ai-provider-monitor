- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /v1/vaults?beta=true to create a vault storing credentials for managed agents. Accepts display_name and optional metadata; returns a vault object (id, display_name, metadata, timestamps). Includes standard error responses.
  paths: []
  date: '2026-04-08'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/879
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Response schema for BetaManagedAgentsVault.archived_at now models nullability via anyOf [Timestamp, null] instead of nullable:true with allOf; may affect validators/codegen relying on nullable.
  paths:
    - path: components/schemas/BetaManagedAgentsVault/properties/archived_at/anyOf
      before: 'null'
      after: '[{"$ref":"#/components/schemas/BetaTimestamp"},{"type":"null"}]'
    - path: components/schemas/BetaManagedAgentsVault/properties/archived_at/allOf
      before: '[{"$ref":"#/components/schemas/BetaTimestamp"}]'
      after: 'null'
    - path: components/schemas/BetaManagedAgentsVault/properties/archived_at/nullable
      before: 'true'
      after: 'null'
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/934
