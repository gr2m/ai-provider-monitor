      before: '"New path for the memory (a rename). Must start with `/`, contain at least one non-empty segment, and be at most 1,024 bytes. Must not contain empty segments, `.` or `..` segments, control or format characters, or the Unicode line and paragraph separators (U+2028, U+2029), and must be NFC-normalized. Paths are case-sensitive. The memory''s `id` is preserved across renames. Omit to leave the path unchanged."'
      after: '"The new path of the memory, which renames it. Omit it to keep the current path.\n\nThe memory keeps its `id`. A path starts with `/` and has 1 to 20 segments. A segment can''t be empty and can''t be `.` or `..`. A path can''t contain control characters, format characters, or the line and paragraph separators U+2028 and U+2029. It must be in Unicode Normalization Form C and at most 1,024 bytes long. Paths are case-sensitive."'
  date: '2026-11-02'
