  doc_only: true
  note: Expanded docs for UpdateMemory request body (conflicts on ancestor/descendant paths, archived stores, no-op behavior).
  paths:
    - path: components.schemas.BetaManagedAgentsUpdateMemoryParams.description
      before: '"Request parameters for [Update a memory](/en/api/beta/memory_stores/memories/update). At least one of `content` or `path` must be provided. Renaming onto a path occupied by a different memory returns `memory_path_conflict_error` (HTTP 409). Rename never overwrites; delete or rename the blocking memory first. An update where every supplied field already matches the stored value is a no-op: it returns 200 with the existing memory and writes no new version."'
      after: '"The request body for [Update a Memory](https://platform.claude.com/docs/en/api/beta/memory_stores/memories/update). Set `content`, `path`, or both.\n\nChanging `path` renames the memory and never replaces another one. The request fails with HTTP status 409 if another memory uses the new path, or if the new path is an ancestor or descendant of another memory''s path. Delete or rename the other memory first. The request also fails if the memory store is archived.\n\nIf every field you set already matches the memory, nothing changes. The response is the current memory, which doesn''t get a new version.\n\nSee the [memory guide](https://platform.claude.com/docs/en/managed-agents/memory#update-a-memory) to learn more about updating memories."'
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
