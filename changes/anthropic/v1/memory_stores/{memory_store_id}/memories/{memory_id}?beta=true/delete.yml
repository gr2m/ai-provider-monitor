- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces beta DELETE endpoint to remove a specific memory from a memory store, returning a memory_deleted tombstone. Supports optional expected_content_sha256 to enforce conditional deletion.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/934
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated BetaManagedAgentsDeletedMemory description to clarify version history retention after deletion.
  paths:
    - path: $.components.schemas.BetaManagedAgentsDeletedMemory.description
      before: Tombstone returned by [Delete a memory](/en/api/beta/memory_stores/memories/delete). The memory's version history persists and remains listable via [List memory versions](/en/api/beta/memory_stores/memory_versions/list) until the store itself is deleted.
      after: 'Tombstone returned by [Delete a memory](/en/api/beta/memory_stores/memories/delete). Deleting a memory does not erase its version history: its versions remain listable via [List memory versions](/en/api/beta/memory_stores/memory_versions/list) while they are retained (each version is kept for at least the version retention period after it was written, unless the store itself is deleted).'
  date: '2026-08-26'
