- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: 'Updated MemoryPathConflictError docs: moved handling guidance from `message` property to the schema description.'
  paths:
    - path: components/schemas/BetaManagedAgentsMemoryPathConflictError/description
      before: |-
        The error returned with HTTP status 409 when you create or rename a memory and the path you give is already used by another memory or overlaps another memory's path.

        Two paths overlap when one is an ancestor of the other, such as `/notes` and `/notes/todo.md`. To free the path, rename or delete the memory that `conflicting_memory_id` references, then retry. To change that memory instead of creating a new one, update it.
      after: |-
        The error returned with HTTP status 409 when you create or rename a memory and the path you give is already used by another memory or overlaps another memory's path.

        Two paths overlap when one is an ancestor of the other, such as `/notes` and `/notes/todo.md`. To free the path, rename or delete the memory that `conflicting_memory_id` references, then retry. To change that memory instead of creating a new one, update it.

        To handle the error in code, use `conflicting_path` and `conflicting_memory_id` instead of `message`.
    - path: components/schemas/BetaManagedAgentsMemoryPathConflictError/properties/message/description
      before: A human-readable explanation of the conflict. To handle the error in code, use `conflicting_path` and `conflicting_memory_id` instead.
      after: 'null'
  date: '2026-11-05'
