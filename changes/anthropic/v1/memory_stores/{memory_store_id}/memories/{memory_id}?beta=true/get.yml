- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Documentation updates for BetaManagedAgentsMemoryView description.
  paths:
    - path: components.schemas.BetaManagedAgentsMemoryView.description
      before: '"Selects which projection of a `memory` or `memory_version` the server returns. `basic` returns the object with `content` set to `null`; `full` populates `content`. When omitted, the default is endpoint-specific: retrieve operations default to `full`; list, create, and update operations default to `basic`. Listing with `view=full` caps `limit` at 20."'
      after: '"Whether a `memory` or `memory_version` in the response includes its `content`. Defaults to `full` on retrieve operations and to `basic` on list, create, and update operations.\n\nWith `full`, list operations return at most 20 items per page."'
  date: '2026-11-02'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Documentation updates for BetaManagedAgentsMemory and several property descriptions.
  paths:
    - path: components.schemas.BetaManagedAgentsMemory.description
      before: '"A `memory` object: a single text document at a hierarchical path inside a memory store. The `content` field is populated when `view=full` and `null` when `view=basic`; the `content_size_bytes` and `content_sha256` fields are always populated so sync clients can diff without fetching content. Memories are addressed by their `mem_...` ID; the path is the create key and can be changed via update."'
      after: '"A text document at a path inside a memory store.\n\n`content` is `null` when the response uses `view=basic`. `content_size_bytes` and `content_sha256` are always set, so you can detect changes without fetching the content. To retrieve, update, or delete a memory, pass its ID, which stays the same when its path changes.\n\nSee the [memory guide](https://platform.claude.com/docs/en/managed-agents/memory#view-and-edit-memories) to learn more about working with memories."'
    - path: components.schemas.BetaManagedAgentsMemory.properties.content.description
      before: '"The memory''s UTF-8 text content. Populated when `view=full`; `null` when `view=basic`. Maximum 100 kB (102,400 bytes)."'
      after: '"The memory''s UTF-8 text content, or `null` when the response uses `view=basic`.\n\nThe maximum size is 100 kB (102,400 bytes)."'
    - path: components.schemas.BetaManagedAgentsMemory.properties.content_size_bytes.description
      before: '"Size of `content` in bytes (the UTF-8 plaintext length). Always populated, regardless of `view`."'
      after: '"The size of the memory''s `content` in UTF-8 bytes. It is set regardless of `view`."'
    - path: components.schemas.BetaManagedAgentsMemory.properties.id.description
      before: '"Unique identifier for this memory (a `mem_...` value). Stable across renames; use this ID, not the path, to read, update, or delete the memory."'
      after: '"The unique ID of the memory (`mem_...`). It stays the same when the memory''s path changes.\n\nTo retrieve, update, or delete the memory, pass this ID."'
    - path: components.schemas.BetaManagedAgentsMemory.properties.memory_version_id.description
      before: '"ID of the `memory_version` representing this memory''s current content (a `memver_...` value). This is the authoritative head pointer; `memory_version` objects do not carry an `is_latest` flag, so compare against this field instead. Enumerate the history via [List memory versions](/en/api/beta/memory_stores/memory_versions/list)."'
      after: '"The ID of the memory version that holds the memory''s current content (`memver_...`).\n\nMemory versions don''t have a flag that marks the latest one. Compare their IDs with this field instead.\n\nSee the [memory guide](https://platform.claude.com/docs/en/managed-agents/memory#audit-memory-changes) to learn more about memory versions."'
    - path: components.schemas.BetaManagedAgentsMemory.properties.updated_at.description
      before: '"When this memory was last modified, in RFC 3339 format. Use this as a cheap freshness signal; for who made the change, look up the head version''s `created_by` via [List memory versions](/en/api/beta/memory_stores/memory_versions/list)."'
      after: '"When the memory was last changed, in RFC 3339.\n\nTo find out who made the change, look at `created_by` on the memory version that `memory_version_id` references."'
  date: '2026-11-02'
