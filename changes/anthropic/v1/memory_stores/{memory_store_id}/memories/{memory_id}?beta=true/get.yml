  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/934
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description of BetaManagedAgentsMemory.memory_version_id (removed the word 'full' from 'Enumerate the full history'). No schema or behavior change.
  paths:
    - path: components/schemas/BetaManagedAgentsMemory/properties/memory_version_id/description
      before: ID of the `memory_version` representing this memory's current content (a `memver_...` value). This is the authoritative head pointer; `memory_version` objects do not carry an `is_latest` flag, so compare against this field instead. Enumerate the full history via [List memory versions](/en/api/beta/memory_stores/memory_versions/list).
      after: ID of the `memory_version` representing this memory's current content (a `memver_...` value). This is the authoritative head pointer; `memory_version` objects do not carry an `is_latest` flag, so compare against this field instead. Enumerate the history via [List memory versions](/en/api/beta/memory_stores/memory_versions/list).
  date: '2026-08-26'
