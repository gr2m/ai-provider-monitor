- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces beta GET /v1/memory_stores/{memory_store_id}/memories/{memory_id} to retrieve a single memory by ID within a memory store. Supports optional view=basic|full (default full) to control whether content is returned; responds with a BetaManagedAgentsMemory.
  paths: []
