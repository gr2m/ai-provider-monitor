- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Refined documentation for actor and error schemas (semantics and guidance links).
  paths:
    - path: /components/schemas/BetaManagedAgentsActor/description
      before: Identifies who performed a write or redact operation. Captured at write time on the `memory_version` row. The API key that created a session is not recorded on agent writes; attribution answers who made the write, not who is ultimately responsible. Look up session provenance separately via the [Sessions API](/en/api/sessions-retrieve).
      after: Identifies who performed an operation. Recorded when the operation happens and not updated afterwards...
    - path: /components/schemas/BetaManagedAgentsSessionActor/description
      before: Attribution for a write made by an agent during a session, through the mounted filesystem at `/mnt/memory/`.
      after: An agent acting during a session, for example through the session's mounted filesystem. It names the session itself...
    - path: /components/schemas/BetaManagedAgentsApiActor/description
      before: Attribution for a write made directly via the public API (outside of any session).
      after: A direct caller of the public API, identified by the API key that authenticated the request.
    - path: /components/schemas/BetaManagedAgentsUserActor/description
      before: Attribution for a write made by a human user through the Anthropic Console.
      after: A human user, for example acting through the Anthropic Console.
    - path: /components/schemas/BetaManagedAgentsMemoryPreconditionFailedError/description
      before: 'null'
      after: The error returned with HTTP status 409 when a request's precondition doesn't hold for the memory's current state...
    - path: /components/schemas/BetaManagedAgentsMemoryPathConflictError/description
      before: 'null'
      after: The error returned with HTTP status 409 when you create or rename a memory and the path you give is already used or overlaps...
    - path: /components/schemas/BetaManagedAgentsMemoryVersionOperation/description
      before: The kind of mutation a `memory_version` records. Every non-no-op mutation to a memory appends exactly one version row with one of these values.
      after: The kind of change that a memory version records. Every change to a memory adds one version. If you update a memory and nothing changes, no new version.
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
