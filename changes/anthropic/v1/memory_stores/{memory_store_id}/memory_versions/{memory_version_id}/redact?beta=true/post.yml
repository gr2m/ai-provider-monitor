- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated BetaManagedAgentsMemoryVersion schema description to clarify version retention policy and conditions.
  paths:
    - path: components/schemas/BetaManagedAgentsMemoryVersion/description
      before: 'A `memory_version` object: one immutable, attributed row in a memory''s append-only history. Every non-no-op mutation to a memory produces a new version. Versions belong to the store (not the individual memory) and persist after the memory is deleted. Retrieving a redacted version returns 200 with `content`, `path`, `content_size_bytes`, and `content_sha256` set to `null`; branch on `redacted_at`, not HTTP status.'
      after: 'A `memory_version` object: one immutable, attributed row in a memory''s append-only history. Every non-no-op mutation to a memory produces a new version. Versions belong to the store (not the individual memory) and are not deleted with the memory; each version is retained for at least the version retention period after it was written, unless the store itself is deleted. Retrieving a redacted version returns 200 with `content`, `path`, `content_size_bytes`, and `content_sha256` set to `null`; branch on `redacted_at`, not HTTP status.'
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified memory_id property description about retrieving retained versions and lineage retention.
  paths:
    - path: components/schemas/BetaManagedAgentsMemoryVersion/properties/memory_id/description
      before: ID of the memory this version snapshots (a `mem_...` value). Remains valid after the memory is deleted; pass it as `memory_id` to [List memory versions](/en/api/beta/memory_stores/memory_versions/list) to retrieve the full lineage including the `deleted` row.
      after: ID of the memory this version snapshots (a `mem_...` value). Remains valid after the memory is deleted; pass it as `memory_id` to [List memory versions](/en/api/beta/memory_stores/memory_versions/list) to retrieve the memory's retained versions, including the `deleted` row while the lineage is retained.
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
