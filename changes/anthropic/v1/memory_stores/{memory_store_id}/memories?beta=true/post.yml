- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New beta endpoint to create a memory in a specified memory store. Clients provide path and content in the request body; optional view=basic|full controls whether content is returned. Responds with a memory object; returns 409 memory_path_conflict_error if the path conflicts.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/934
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description of memory_version_id in response schema (removed the word 'full'); no schema/behavior change.
  paths:
    - path: components/schemas/BetaManagedAgentsMemory/properties/memory_version_id/description
      before: ID of the `memory_version` representing this memory's current content (a `memver_...` value). This is the authoritative head pointer; `memory_version` objects do not carry an `is_latest` flag, so compare against this field instead. Enumerate the full history via [List memory versions](/en/api/beta/memory_stores/memory_versions/list).
      after: ID of the `memory_version` representing this memory's current content (a `memver_...` value). This is the authoritative head pointer; `memory_version` objects do not carry an `is_latest` flag, so compare against this field instead. Enumerate the history via [List memory versions](/en/api/beta/memory_stores/memory_versions/list).
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/959
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: 'Clarified path validation: explicitly disallows Unicode line/paragraph separators (U+2028, U+2029) in the request''s path field.'
  paths:
    - path: $.components.schemas.BetaManagedAgentsCreateMemoryParams.properties.path.description
      before: Hierarchical path for the new memory, e.g. `/projects/foo/notes.md`. Must start with `/`, contain at least one non-empty segment, and be at most 1,024 bytes. Must not contain empty segments, `.` or `..` segments, control or format characters, and must be NFC-normalized. Paths are case-sensitive.
      after: Hierarchical path for the new memory, e.g. `/projects/foo/notes.md`. Must start with `/`, contain at least one non-empty segment, and be at most 1,024 bytes. Must not contain empty segments, `.` or `..` segments, control or format characters, or the Unicode line and paragraph separators (U+2028, U+2029), and must be NFC-normalized. Paths are case-sensitive.
  date: '2026-09-01'
