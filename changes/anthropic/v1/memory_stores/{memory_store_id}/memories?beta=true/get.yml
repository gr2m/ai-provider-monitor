- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated parameter descriptions and guidance.
  paths:
    - path: parameters[anthropic-version].description
      before: 'null'
      after: The version of the Claude API you want to use...
    - path: parameters[anthropic-beta].description
      before: 'null'
      after: 'This endpoint is in beta: requests must send ...'
    - path: parameters[memory_store_id].description
      before: Path parameter memory_store_id
      after: The ID of the memory store to list memories from (`memstore_...`).
    - path: parameters[path_prefix].description
      before: Optional path prefix filter. Must end with `/`...
      after: Return only memories whose path starts with this prefix... Must end with `/`...
    - path: parameters[depth].description
      before: '`0` (or omitted) returns all descendants...'
      after: How far below `path_prefix` to list... Pass `1` to list only the direct children.
    - path: parameters[limit].description
      before: Maximum number of items to return per page...
      after: The maximum number of items to return per page... With `view=full`, a page holds at most 20 items.
    - path: parameters[page].description
      before: Opaque pagination cursor (a `page_...` value).
      after: The `next_page` value from a previous response, to get the next page.
    - path: parameters[view].description
      before: Which projection of each `memory` to return...
      after: Whether each memory in the response includes `content`...
  date: '2026-11-02'
