- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated descriptions for several BetaManagedAgentsMemoryStore fields.
  paths:
    - path: components.schemas.BetaManagedAgentsMemoryStore.properties.archived_at.description
      before: Timestamp when the store was archived, or `null` if active. Set once and never cleared; archiving is one-way. Archived stores are read-only and cannot be attached to new sessions.
      after: When the memory store was archived, in RFC 3339, or `null` if it hasn't been. Archiving can't be undone. An archived store can't be attached to new sessions. You can't create or update its memories or update the store. You can still read and delete its memories, redact their versions, and delete the store. See the [memory guide](https://platform.claude.com/docs/en/managed-agents/memory#archive-a-store) to learn more about archiving.
    - path: components.schemas.BetaManagedAgentsMemoryStore.properties.created_at.description
      before: Timestamp when the store was created.
      after: When the memory store was created, in RFC 3339.
    - path: components.schemas.BetaManagedAgentsMemoryStore.properties.description.description
      before: Free-text description of what the store contains, up to 1024 characters. Included in the agent's system prompt when the store is attached, so word it to be useful to the agent. Empty string when unset.
      after: Free-text description of what the store contains, up to 1,024 characters. Included in the agent's system prompt when the store is attached, so word it to be useful to the agent. Empty string when unset.
    - path: components.schemas.BetaManagedAgentsMemoryStore.properties.id.description
      before: Unique identifier for the memory store (a `memstore_...` tagged ID). Use this when attaching the store to a session, or in the `{memory_store_id}` path parameter of subsequent calls.
      after: The unique ID of the memory store (`memstore_...`). Use it to attach the store to a session.
    - path: components.schemas.BetaManagedAgentsMemoryStore.properties.metadata.description
      before: Arbitrary key-value tags for your own bookkeeping (such as the end user a store belongs to). Up to 16 pairs; keys 1–64 characters; values up to 512 characters. Returned on retrieve/list but not filterable.
      after: Key-value pairs for your own use, such as the end user that the store belongs to. A store has at most 16 pairs. Keys are 1 to 64 characters long and values at most 512 characters. You can't filter lists by metadata.
    - path: components.schemas.BetaManagedAgentsMemoryStore.properties.updated_at.description
      before: Timestamp when the store's `name`, `description`, or `metadata` was last modified. Memory writes inside the store do not advance this.
      after: When the memory store was last changed, in RFC 3339. Changing its `name`, `description`, or `metadata` updates it. Archiving the store does too. Changes to the store's memories don't.
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
