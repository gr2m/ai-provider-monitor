- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New beta endpoint to cancel a Message Batch before processing ends. Initiates cancellation (batch enters canceling), allows non-interruptible in-flight requests to complete, and returns the updated MessageBatch with status and request_counts.
