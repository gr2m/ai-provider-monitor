- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds DELETE /v1/messages/batches/{message_batch_id}?beta=true to delete a Message Batch by ID. Batches can be deleted only after processing completes; in‑progress batches must be canceled first. Returns a confirmation object with id and type=message_batch_deleted.
