- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Documentation updates in BetaManagedAgentsCreateMemoryStoreRequest property descriptions (no structural changes).
  paths:
    - path: components/schemas/BetaManagedAgentsCreateMemoryStoreRequest/properties/description/description
      before: '"Free-text description of what the store contains, up to 1024 characters. Included in the agent''s system prompt when the store is attached, so word it to be useful to the agent."'
      after: '"Free-text description of what the store contains, up to 1,024 characters. Included in the agent''s system prompt when the store is attached, so word it to be useful to the agent."'
    - path: components/schemas/BetaManagedAgentsCreateMemoryStoreRequest/properties/metadata/description
      before: '"Arbitrary key-value tags for your own bookkeeping (such as the end user a store belongs to). Up to 16 pairs; keys 1–64 characters; values up to 512 characters. Not visible to the agent."'
      after: '"Key-value pairs for your own use, such as the end user that the store belongs to. The agent doesn''t see them.\n\nA store has at most 16 pairs. Keys are 1 to 64 characters long and values at most 512 characters."'
    - path: components/schemas/BetaManagedAgentsCreateMemoryStoreRequest/properties/name/description
      before: '"Human-readable name for the store. Required; 1–255 characters; no control characters. The mount-path slug under `/mnt/memory/` is derived from this name (lowercased, non-alphanumeric runs collapsed to a hyphen). Names need not be unique within a workspace."'
      after: '"The name of the memory store, 1 to 255 characters long, without control characters. Names don''t have to be unique in a workspace.\n\nIn a session, the store''s directory under `/mnt/memory/` is based on this name. The name is lowercased and every run of characters other than ASCII letters and digits becomes one hyphen. The session''s memory store resource gives the exact path in `mount_path`.\n\nSee the [memory guide](https://platform.claude.com/docs/en/managed-agents/memory#how-the-agent-accesses-memory) to learn more about how agents access memory stores."'
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
