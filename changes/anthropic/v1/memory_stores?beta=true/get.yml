- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified parameter descriptions (versioning, beta header requirement, pagination, and created_at filters).
  paths:
    - path: $.parameters[name=anthropic-version].description
      before: 'null'
      after: '"The version of the Claude API you want to use.\n\nRead more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning)."'
    - path: $.parameters[name=anthropic-beta].description
      before: 'null'
      after: '"This endpoint is in beta: requests must send `agent-memory-2026-07-22` or `managed-agents-2026-04-01` in this header."'
    - path: $.parameters[name=page].description
      before: '"Opaque pagination cursor (a `page_...` value). Pass the `next_page` value from a previous response to fetch the next page; omit for the first page."'
      after: '"The `next_page` value from a previous response, to get the next page. Omit it to get the first page."'
    - path: $.parameters[name=created_at[gte]].description
      before: '"Return only stores whose `created_at` is at or after this time (inclusive). Sent on the wire as `created_at[gte]`."'
      after: '"Return only memory stores created at or after this time (inclusive)."'
    - path: $.parameters[name=created_at[lte]].description
      before: '"Return only stores whose `created_at` is at or before this time (inclusive). Sent on the wire as `created_at[lte]`."'
      after: '"Return only memory stores created at or before this time (inclusive)."'
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Documentation updates to response schemas (next_page wording; field descriptions in MemoryStore).
  paths:
    - path: $.components/schemas/BetaManagedAgentsListMemoryStoresResponse.properties.next_page.description
      before: '"Opaque cursor for the next page (a `page_...` value). Pass as `page` on the next request. `null` when there are no more results."'
      after: '"The value to pass as `page` to get the next page, or `null` if there are no more results."'
    - path: $.components/schemas/BetaManagedAgentsMemoryStore.properties.archived_at.description
      before: '"Timestamp when the store was archived, or `null` if active. Set once and never cleared; archiving is one-way. Archived stores are read-only and cannot be attached to new sessions."'
      after: '"When the memory store was archived, in RFC 3339, or `null` if it hasn''t been.\n\nArchiving can''t be undone. An archived store can''t be attached to new sessions. You can''t create or update its memories or update the store. You can still read and delete its memories, redact their versions, and delete the store.\n\nSee the [memory guide](https://platform.claude.com/docs/en/managed-agents/memory#archive-a-store) to learn more about archiving."'
    - path: $.components/schemas/BetaManagedAgentsMemoryStore.properties.created_at.description
      before: '"Timestamp when the store was created."'
      after: '"When the memory store was created, in RFC 3339."'
    - path: $.components/schemas/BetaManagedAgentsMemoryStore.properties.description.description
      before: '"Free-text description of what the store contains, up to 1024 characters. Included in the agent''s system prompt when the store is attached, so word it to be useful to the agent. Empty string when unset."'
      after: '"Free-text description of what the store contains, up to 1,024 characters. Included in the agent''s system prompt when the store is attached, so word it to be useful to the agent. Empty string when unset."'
    - path: $.components/schemas/BetaManagedAgentsMemoryStore.properties.id.description
      before: '"Unique identifier for the memory store (a `memstore_...` tagged ID). Use this when attaching the store to a session, or in the `{memory_store_id}` path parameter of subsequent calls."'
      after: '"The unique ID of the memory store (`memstore_...`). Use it to attach the store to a session."'
    - path: $.components/schemas/BetaManagedAgentsMemoryStore.properties.metadata.description
      before: '"Arbitrary key-value tags for your own bookkeeping (such as the end user a store belongs to). Up to 16 pairs; keys 1–64 characters; values up to 512 characters. Returned on retrieve/list but not filterable."'
      after: '"Key-value pairs for your own use, such as the end user that the store belongs to.\n\nA store has at most 16 pairs. Keys are 1 to 64 characters long and values at most 512 characters. You can''t filter lists by metadata."'
    - path: $.components/schemas/BetaManagedAgentsMemoryStore.properties.updated_at.description
      before: '"Timestamp when the store''s `name`, `description`, or `metadata` was last modified. Memory writes inside the store do not advance this."'
      after: '"When the memory store was last changed, in RFC 3339.\n\nChanging its `name`, `description`, or `metadata` updates it. Archiving the store does too. Changes to the store''s memories don''t."'
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1162
