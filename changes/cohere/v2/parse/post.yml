- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Introduces Parse API v2: POST /v2/parse parses document images into structured output (markdown default or blocks); supports image_url inputs only.'
  paths: []
  date: '2026-08-26'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/961
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional finish_reason field to ParseResponse indicating why parsing ended (uses ChatFinishReason; for Parse only COMPLETE or MAX_TOKENS will occur).
  paths:
    - path: components/schemas/ParseResponse/properties/finish_reason
      before: 'null'
      after: '{"$ref":"#/components/schemas/ChatFinishReason","description":"The reason parsing finished. For Parse, this is only ever `COMPLETE` or `MAX_TOKENS`; `MAX_TOKENS` indicates the output was truncated because it exceeded the maximum output token limit."}'
  date: '2026-09-25'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduced ChatFinishReason enum schema used by ParseResponse.finish_reason.
  paths:
    - path: components/schemas/ChatFinishReason
      before: 'null'
      after: '{"type":"string","enum":["COMPLETE","STOP_SEQUENCE","MAX_TOKENS","TOOL_CALL","ERROR","TIMEOUT"],"description":"The reason a chat request has finished."}'
  date: '2026-09-25'
