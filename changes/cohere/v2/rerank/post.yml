- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description for RerankRelevantSpans to clarify feature behavior/support.
  paths:
    - path: $.components.schemas.RerankRelevantSpans.description
      before: Configures context compression, which reports the spans of each document that are most relevant to the query instead of treating the whole document as relevant. Only supported by Rerank v5 and newer models (for example, `rerank-v5.0-pro`).
      after: When enabled, the API response will include the relevant spans of each document that contributed to its rank. This feature is only supported for Rerank v5 and newer models.
  date: '2026-10-20'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1125
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Reworded max_spans description; no functional change to constraints.
  paths:
    - path: $.components.schemas.RerankRelevantSpans.properties.max_spans.description
      before: Optional. The most spans to return per document, out of the spans scoring above `threshold`. Must be greater than `0`. If not set, all of them are returned. Can only be set when `mode` is `enabled`.
      after: The maximum number of relevant spans to include per document. If not set, all relevant spans will be returned.
  date: '2026-10-20'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1125
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Reworded mode description to explicitly list allowed values and clarify behavior.
  paths:
    - path: $.components.schemas.RerankRelevantSpans.properties.mode.description
      before: 'Whether the model prunes each document down to its relevant spans. Pruning is off unless `relevant_spans` is passed with `"mode": "enabled"`.'
      after: One of `"enabled"` or `"disabled"`. Controls whether relevant spans will be returned in the API response.
  date: '2026-10-20'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1125
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Reworded threshold description; defaults and bounds unchanged.
  paths:
    - path: $.components.schemas.RerankRelevantSpans.properties.threshold.description
      before: The score a span must reach to be considered relevant. A higher value prunes more of each document. Defaults to `0.1`. Can only be set when `mode` is `enabled`.
