- change: removed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Removed the maxItems=1 constraint for images, allowing more than one image (model/version-dependent per docs).
  paths:
    - path: requestBody.content.application/json.schema.properties.images.maxItems
      before: '1'
      after: 'null'
  date: '2026-08-23'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/919
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: 'Updated images description: clarified support for v3.x (max 1 image, 5MB each) vs v4.0+ (no per-call image count limit; total size ≤20MB).'
  paths:
    - path: requestBody.content.application/json.schema.properties.images.description
      before: |-
        An array of image data URIs for the model to embed. Maximum number of images per call is `1`.

        The image must be a valid [data URI](https://developer.mozilla.org/en-US/docs/Web/URI/Schemes/data). The image must be in either `image/jpeg`, `image/png`, `image/webp`, or `image/gif` format and has a maximum size of 5MB.

        Images are only supported with Embed v3.0 and newer models.
      after: |-
        An array of image data URIs for the model to embed.

        The image must be a valid [data URI](https://developer.mozilla.org/en-US/docs/Web/URI/Schemes/data). The image must be in either `image/jpeg`, `image/png`, `image/webp`, or `image/gif` format.

        Image embeddings are supported with Embed v3.0 and newer models.

        For **Embed v3.x** models, the maximum number of images per call is `1`, and each image has a maximum size of `5MB`.

        For **Embed v4.0 and newer** models, there is no limit on the number of images per call. The combined size of all images in the request must be at most `20MB`.
  date: '2026-08-23'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/919
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added billed_units.pages to ApiMeta for reporting number of pages parsed.
  paths:
    - path: components.schemas.ApiMeta.properties.billed_units.properties.pages
      before: 'null'
      after: '{"description":"The number of billed pages parsed.\n","type":"number"}'
  date: '2026-08-23'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/919
