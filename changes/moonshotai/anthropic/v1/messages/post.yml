- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added POST /anthropic/v1/messages: Anthropic-compatible Messages API to call Kimi models with support for streaming (SSE), tool use, image input, thinking, and structured JSON output.'
  paths: []
