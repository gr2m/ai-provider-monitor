- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added cache_control to request to enable context cache writes with ephemeral 5m/1h TTL tiers.
  paths:
    - path: components/schemas/MessagesRequest/properties/cache_control
      before: 'null'
      after: '{"type":"object","description":"Context cache write options. Only effective when passed at the top level; cache_control markers inside the messages array are ignored. When omitted, the request only attempts to read the cache (5m tier) and does not write","required":["type"],"properties":{"ttl":{"type":"string","enum":["5m","1h"],"default":"5m","description":"Lifetime of the written cache. The 5m and 1h tiers are independent of each other. When a request with the same prefix hits the cache within its lifetime, the cache entry is refreshed with its original TTL"},"type":{"type":"string","enum":["ephemeral"],"description":"Cache type, fixed as ephemeral"}}}'
  date: '2026-09-18'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added usage.cache_creation breakdown (ephemeral_5m_input_tokens, ephemeral_1h_input_tokens) to standard response.
  paths:
    - path: components/schemas/MessagesResponse/properties/usage/properties/cache_creation
      before: 'null'
      after: '{"type":"object","description":"Cache write breakdown by TTL tier","required":["ephemeral_5m_input_tokens","ephemeral_1h_input_tokens"],"properties":{"ephemeral_1h_input_tokens":{"type":"integer","description":"Input tokens written to the 1-hour cache tier"},"ephemeral_5m_input_tokens":{"type":"integer","description":"Input tokens written to the 5-minute cache tier"}}}'
  date: '2026-09-18'
