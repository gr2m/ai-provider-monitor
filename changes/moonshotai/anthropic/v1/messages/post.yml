- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional X-Msh-Request-Nonce request header to enable request signature verification.
  paths:
    - path: parameters[0].name
      before: 'null'
      after: X-Msh-Request-Nonce
    - path: parameters[0].in
      before: 'null'
      after: header
    - path: parameters[0].required
      before: 'null'
      after: 'false'
    - path: parameters[0].schema.type
      before: 'null'
      after: string
    - path: parameters[0].schema.minLength
      before: 'null'
      after: '1'
  date: '2026-09-01'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 200 response may include Msh-Request-Signature and Msh-Request-Timestamp headers when a valid nonce is supplied.
  paths:
    - path: responses.200.headers.Msh-Request-Signature.schema.type
      before: 'null'
      after: string
    - path: responses.200.headers.Msh-Request-Timestamp.schema.type
      before: 'null'
      after: integer
    - path: responses.200.headers.Msh-Request-Timestamp.schema.format
      before: 'null'
      after: int64
  date: '2026-09-01'
