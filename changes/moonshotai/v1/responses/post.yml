      after: '["#/components/schemas/ResponsesOutputReasoningItem","#/components/schemas/ResponsesOutputMessageItem","#/components/schemas/ResponsesOutputFunctionCallItem","#/components/schemas/ResponsesOutputCustomToolCallItem","#/components/schemas/ResponsesOutputWebSearchCallItem"]'
    - path: components/schemas/ResponsesOutputCustomToolCallItem
      before: 'null'
      after: '{"description":"A custom tool call initiated by the model.","properties":{"call_id":{"description":"Use this value in `custom_tool_call_output` when returning the result.","type":"string"},"id":{"example":"ctc_68f0c1c2d3e4f5a6b7c8d9e0","type":"string"},"input":{"description":"Free-form text input generated by the model.","type":"string"},"name":{"type":"string"},"namespace":{"description":"Returned for namespace tool calls.","type":"string"},"status":{"enum":["in_progress","completed"],"type":"string"},"type":{"enum":["custom_tool_call"],"type":"string"}},"title":"Custom tool call","type":"object"}'
    - path: components/schemas/ResponsesOutputWebSearchCallItem
      before: 'null'
      after: '{"description":"A web search call executed on the server side. Returned only when the request includes the `web_search` tool and the server decides a search is needed. It appears first in the output array.","properties":{"action":{"description":"The action performed by this search.","properties":{"query":{"description":"The search query actually used.","type":"string"},"sources":{"description":"Web pages the search hit. Returned only when `include` contains `web_search_call.action.sources`.","items":{"properties":{"title":{"type":"string"},"type":{"enum":["url"],"type":"string"},"url":{"type":"string"}},"type":"object"},"type":"array"},"type":{"enum":["search"],"type":"string"}},"type":"object"},"id":{"example":"ws_68f0c1c2d3e4f5a6b7c8d9e0","type":"string"},"results":{"description":"Image search results. Returned only when `include` contains `web_search_call.results` and `search_content_types` includes `image`.","items":{"properties":{"caption":{"description":"Image caption. Returned only when `image_settings.caption` is enabled.","type":"string"},"image_url":{"type":"string"},"source_website_url":{"type":"string"},"thumbnail_url":{"type":"string"},"type":{"enum":["image_result"],"type":"string"}},"type":"object"},"type":"array"},"status":{"enum":["in_progress","completed"],"type":"string"},"type":{"enum":["web_search_call"],"type":"string"}},"title":"Web search call","type":"object"}'
  date: '2026-09-03'
