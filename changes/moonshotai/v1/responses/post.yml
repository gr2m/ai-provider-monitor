- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /v1/responses to create model responses from text/images, optionally call developer-defined tools, and stream results via SSE when stream=true; supports JSON-schema-constrained outputs and returns response objects or SSE events.
  paths: []
  date: '2026-08-31'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/975
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional X-Msh-Request-Nonce request header to enable request signature verification.
  paths:
    - path: parameters[0]
      before: 'null'
      after: '{"description":"A client-generated random nonce (a UUID v4 is recommended). Sending it enables Request Signature: the Kimi API returns `Msh-Request-Timestamp` and `Msh-Request-Signature` in the response headers, which can later be used to prove that the request was handled by the Kimi API. Exactly one non-empty header value is allowed; if the value is invalid, the request proceeds normally but the headers above are not returned. See [Verify Request Signature](/api/signatures-verify).","in":"header","name":"X-Msh-Request-Nonce","required":false,"schema":{"example":"7d929748-0ae6-41c2-ab5d-a186498ad721","minLength":1,"type":"string"}}'
  date: '2026-09-01'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/980
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added optional response headers returned when X-Msh-Request-Nonce is valid: Msh-Request-Signature and Msh-Request-Timestamp.'
  paths:
    - path: responses.200.headers.Msh-Request-Signature
      before: 'null'
      after: '{"description":"Signature token prefixed with `reqsigv1_`, issued by the Kimi API over the nonce, timestamp, and the request''s `model`; verify it with `POST /v1/signatures/verify`. Only returned when the request carries a valid `X-Msh-Request-Nonce`.","schema":{"example":"reqsigv1_<opaque-token>","type":"string"}}'
    - path: responses.200.headers.Msh-Request-Timestamp
      before: 'null'
      after: '{"description":"Unix timestamp in milliseconds at which the Kimi API accepted this request. Only returned when the request carries a valid `X-Msh-Request-Nonce`.","schema":{"example":1786338000123,"format":"int64","type":"integer"}}'
  date: '2026-09-01'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/980
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional 'include' to request to return web search sources and/or image results when using the web_search tool.
  paths:
    - path: components/schemas/ResponsesRequest/properties/include
      before: 'null'
      after: '{"description":"Additional fields to return. Only effective when the `web_search` tool is used. `web_search_call.action.sources` returns the web pages the search hit; `web_search_call.results` returns image search results.","items":{"enum":["web_search_call.results","web_search_call.action.sources"],"type":"string"},"type":"array"}'
  date: '2026-09-03'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: 'New tool types supported: custom (only `apply_patch`) and server-side `web_search`; namespace tool can now contain custom tools.'
  paths:
    - path: components/schemas/ResponsesTool/discriminator/mapping/custom
      before: 'null'
      after: '#/components/schemas/ResponsesCustomTool'
    - path: components/schemas/ResponsesTool/discriminator/mapping/web_search
      before: 'null'
      after: '#/components/schemas/ResponsesWebSearchTool'
    - path: components/schemas/ResponsesTool/oneOf
      before: '["#/components/schemas/ResponsesFunctionTool","#/components/schemas/ResponsesNamespaceTool"]'
      after: '["#/components/schemas/ResponsesFunctionTool","#/components/schemas/ResponsesCustomTool","#/components/schemas/ResponsesNamespaceTool","#/components/schemas/ResponsesWebSearchTool"]'
    - path: components/schemas/ResponsesCustomTool
      before: 'null'
      after: '{"description":"A custom tool that takes free-form text input. Only the custom tool named `apply_patch` is supported, and it must define a `grammar` + `lark` format; when the model calls it, a `custom_tool_call` item is returned in the output.","properties":{"description":{"type":"string"},"format":{"description":"Input format constraint. Only the `grammar` type with `lark` syntax is supported.","properties":{"definition":{"description":"The Lark grammar definition.","type":"string"},"syntax":{"enum":["lark"],"type":"string"},"type":{"enum":["grammar"],"type":"string"}},"required":["type","syntax","definition"],"type":"object"},"name":{"description":"Tool name. Only `apply_patch` is supported.","enum":["apply_patch"],"type":"string"},"type":{"enum":["custom"],"type":"string"}},"required":["type","name","format"],"title":"Custom tool","type":"object"}'
    - path: components/schemas/ResponsesWebSearchTool
      before: 'null'
      after: '{"description":"A web search tool executed on the server side. When present, the server first decides from the input whether a search is needed; if so, it runs the search, injects the results into the model context, and returns a `web_search_call` item in the output. At most one `web_search` tool is allowed per request. `search_context_size`, `blocked_domains`, and `filters.blocked_domains` are not supported and return `invalid_request_error`; `user_location`, `external_web_access`, and `indexed_web_access` are ignored.","properties":{"filters":{"description":"Search scope filters.","properties":{"allowed_domains":{"description":"Restrict the search to these domains, up to 100.","items":{"type":"string"},"maxItems":100,"type":"array"}},"type":"object"},"image_settings":{"description":"Image search settings. Only effective when `search_content_types` includes `image`.","properties":{"caption":{"default":false,"description":"Whether to generate a caption for each image.","type":"boolean"},"max_results":{"default":3,"description":"Maximum number of images to return.","maximum":10,"minimum":1,"type":"integer"}},"type":"object"},"search_content_types":{"default":["text"],"description":"Result types to search for. Defaults to `text` only. Including `image` additionally runs an image search.","items":{"enum":["text","image"],"type":"string"},"type":"array"},"type":{"enum":["web_search"],"type":"string"}},"required":["type"],"title":"Web search tool","type":"object"}'
    - path: components/schemas/ResponsesNamespaceTool/properties/tools/items
      before: '{"$ref":"#/components/schemas/ResponsesFunctionTool"}'
      after: '{"oneOf":[{"$ref":"#/components/schemas/ResponsesFunctionTool"},{"$ref":"#/components/schemas/ResponsesCustomTool"}]}'
  date: '2026-09-03'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: 'New input item types supported for history replay: `custom_tool_call`, `custom_tool_call_output`, and `web_search_call`.'
  paths:
    - path: components/schemas/ResponsesInputItem/oneOf
      before: '["ResponsesMessageItem","ResponsesReasoningItem","ResponsesFunctionCallItem","ResponsesFunctionCallOutputItem","ResponsesAdditionalToolsItem"]'
      after: '["ResponsesMessageItem","ResponsesReasoningItem","ResponsesFunctionCallItem","ResponsesFunctionCallOutputItem","ResponsesCustomToolCallItem","ResponsesCustomToolCallOutputItem","ResponsesWebSearchCallItem","ResponsesAdditionalToolsItem"]'
    - path: components/schemas/ResponsesCustomToolCallItem
      before: 'null'
      after: '{"description":"Replays a custom tool call.","properties":{"call_id":{"description":"Call ID paired with the matching `custom_tool_call_output`.","type":"string"},"id":{"type":"string"},"input":{"description":"Free-form text input generated by the model.","type":"string"},"name":{"type":"string"},"namespace":{"description":"Namespace the tool belongs to, returned for namespace tool calls.","type":"string"},"status":{"enum":["completed"],"type":"string"},"type":{"enum":["custom_tool_call"],"type":"string"}},"required":["type","call_id","name","input"],"title":"Custom tool call","type":"object"}'
    - path: components/schemas/ResponsesCustomToolCallOutputItem
      before: 'null'
      after: '{"description":"Result of executing a custom tool call.","properties":{"call_id":{"description":"Same call ID as the matching `custom_tool_call`.","type":"string"},"output":{"description":"Content returned by the tool.","oneOf":[{"type":"string"},{"items":{"$ref":"#/components/schemas/ResponsesInputContentPart"},"type":"array"}]},"status":{"enum":["completed"],"type":"string"},"type":{"enum":["custom_tool_call_output"],"type":"string"}},"required":["type","call_id","output"],"title":"Custom tool call output","type":"object"}'
    - path: components/schemas/ResponsesWebSearchCallItem
      before: 'null'
      after: '{"description":"Replays a previous web search call. Kept for history only and ignored during conversion; the search results are already carried by the assistant message that follows.","properties":{"action":{"properties":{"query":{"type":"string"},"type":{"enum":["search"],"type":"string"}},"type":"object"},"id":{"type":"string"},"status":{"enum":["completed"],"type":"string"},"type":{"enum":["web_search_call"],"type":"string"}},"required":["type"],"title":"Web search call","type":"object"}'
  date: '2026-09-03'
- change: added
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: 'New response output item types: `custom_tool_call` and `web_search_call` (the latter may appear first in the output).'
  paths:
    - path: components/schemas/ResponsesOutputItem/discriminator/mapping/custom_tool_call
      before: 'null'
      after: '#/components/schemas/ResponsesOutputCustomToolCallItem'
    - path: components/schemas/ResponsesOutputItem/discriminator/mapping/web_search_call
      before: 'null'
      after: '#/components/schemas/ResponsesOutputWebSearchCallItem'
