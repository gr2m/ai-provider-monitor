- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: 'Tool function name regex tightened: max length reduced from 256 to 128 characters. Requests with longer tool names may now be rejected.'
  paths:
    - path: $.components.schemas.ToolDefinition.properties.function.properties.name.pattern
      before: ^[a-zA-Z_][a-zA-Z0-9-_]{0,255}$
      after: ^[a-zA-Z_][a-zA-Z0-9-_]{0,127}$
    - path: $.components.schemas.ToolDefinition.properties.function.properties.name.description
      before: 'Function name. Must follow the regex: ^[a-zA-Z_][a-zA-Z0-9-_]{0,255}$'
      after: 'Function name. Must follow the regex: ^[a-zA-Z_][a-zA-Z0-9-_]{0,127}$'
  date: '2026-08-28'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/968
