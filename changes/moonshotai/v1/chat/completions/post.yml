- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added two 200-response headers for request signature verification: Msh-Request-Signature and Msh-Request-Timestamp (returned only when a valid X-Msh-Request-Nonce is sent).'
  paths:
    - path: responses.200.headers.Msh-Request-Signature
      before: 'null'
      after: '{"description":"Signature token prefixed with reqsigv1_","schema":{"type":"string","example":"reqsigv1_<opaque-token>"}}'
    - path: responses.200.headers.Msh-Request-Timestamp
      before: 'null'
      after: '{"description":"Unix timestamp in ms when the request was accepted","schema":{"type":"integer","format":"int64","example":1786338000123}}'
  date: '2026-09-01'
