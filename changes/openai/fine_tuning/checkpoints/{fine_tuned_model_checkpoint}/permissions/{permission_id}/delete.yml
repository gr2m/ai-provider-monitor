- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added error responses: 400 (cannot remove), 404 (not found/cannot share), 429 (rate limit).'
  paths:
    - path: $.responses.400
      before: 'null'
      after: '{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}},"description":"The checkpoint permission cannot be removed for the requested project or job state."}'
    - path: $.responses.404
      before: 'null'
      after: '{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}},"description":"The checkpoint, permission, associated project, or fine-tuning job was not found, or the checkpoint cannot be shared."}'
    - path: $.responses.429
      before: 'null'
      after: '{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}},"description":"The request rate limit has been exceeded."}'
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added error schema components used by new error responses.
  paths:
    - path: $.components.schemas.ErrorResponse
      before: 'null'
      after: '{"properties":{"error":{"$ref":"#/components/schemas/Error"}},"required":["error"],"type":"object"}'
    - path: $.components.schemas.Error
      before: 'null'
      after: '{"properties":{"code":{"anyOf":[{"type":"string"},{"type":"null"}]},"message":{"type":"string"},"misalignment":{"$ref":"#/components/schemas/MisalignmentErrorDetailsResource"},"param":{"anyOf":[{"type":"string"},{"type":"null"}]},"type":{"type":"string"}},"required":["type","message","param","code"],"type":"object"}'
    - path: $.components.schemas.MisalignmentErrorDetailsResource
      before: 'null'
      after: '{"properties":{"detailed_explanation":{"description":"The public explanation for this block.","type":"string"},"error_type":{"$ref":"#/components/schemas/_MisalignmentErrorType","description":"An optional classification; clients must accept additional values."},"review_target":{"anyOf":[{"description":"An opaque target for explicitly continuing this review, or null when unavailable.","maxLength":96,"minLength":1,"not":{"pattern":"[^A-Za-z0-9._~:-]"},"pattern":"^[A-Za-z0-9._~:-]+$","type":"string"},{"type":"null"}]},"steer":{"$ref":"#/components/schemas/_MisalignmentSteer","description":"An optional public continuation instruction."}},"required":[],"type":"object"}'
    - path: $.components.schemas._MisalignmentErrorType
      before: 'null'
      after: '{"anyOf":[{"type":"string"},{"enum":["potentially_unintended_data_transfer","potentially_unintended_data_access","potentially_unintended_destructive_activity","other"],"type":"string"}]}'
    - path: $.components.schemas._MisalignmentSteer
      before: 'null'
      after: '{"properties":{"message":{"description":"The public continuation instruction.","type":"string"}},"required":["message"],"type":"object"}'
  date: '2026-11-02'
