- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Summary updated to a short title; admin key note moved to description.
  paths:
    - path: $.summary
      before: |
        **NOTE:** This endpoint requires an [admin API key](../admin-api-keys).

        Organization owners can use this endpoint to delete a permission for a fine-tuned model checkpoint.
