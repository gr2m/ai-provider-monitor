- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /fine_tuning/alpha/graders/run to execute a grader (string_check, text_similarity, python, score_model, or multi) on a model_sample with optional item context, returning a reward, sub_rewards, and detailed metadata including token usage, timing, and error flags.
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: InputTextContent now supports an optional prompt_cache_breakpoint to mark a prompt cache boundary.
  paths:
    - path: components.schemas.InputTextContent.properties.prompt_cache_breakpoint
      before: 'null'
      after: '$ref: #/components/schemas/PromptCacheBreakpointConfig'
  date: '2026-08-24'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: New PromptCacheBreakpointConfig schema introduced for defining explicit prompt cache breakpoints.
  paths:
    - path: components.schemas.PromptCacheBreakpointConfig
      before: 'null'
      after: 'object schema: Prompt cache breakpoint (mode: explicit)'
  date: '2026-08-24'
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: EvalItemInputImage.image_url is now constrained to URI format, tightening validation.
  paths:
    - path: components.schemas.EvalItemInputImage.properties.image_url.format
