- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /fine_tuning/jobs/{fine_tuning_job_id}/resume to resume a fine-tuning job by ID and return the updated fine_tuning.job object.
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added ''unixtime'' format to FineTuningJob timestamps: created_at, estimated_finish, finished_at.'
  paths:
    - path: components/schemas/FineTuningJob/properties/created_at/format
      before: 'null'
      after: '"unixtime"'
    - path: components/schemas/FineTuningJob/properties/estimated_finish/anyOf/0/format
      before: 'null'
      after: '"unixtime"'
    - path: components/schemas/FineTuningJob/properties/finished_at/anyOf/0/format
      before: 'null'
      after: '"unixtime"'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: ReasoningEffort enum extended to include 'max'.
