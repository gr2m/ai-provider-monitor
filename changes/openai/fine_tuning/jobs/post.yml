- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /fine_tuning/jobs to create and enqueue fine-tuning jobs for supported base models. Accepts training_file (JSONL), optional validation_file, seed, suffix, metadata, integrations (W&B), and method configs (supervised, DPO, reinforcement) with hyperparameters. Returns a fine_tuning.job object with job details, status, model info, result files, and errors if any.
