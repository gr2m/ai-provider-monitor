- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds POST /responses/input_tokens?beta=true, a beta endpoint that returns the number of input tokens for a prospective Responses request. It accepts the same request shape as the Responses API (e.g., input, instructions, model, tools, etc.) and optionally the openai-beta header (responses_multi_agent=v1). On success it returns { object: ''response.input_tokens'', input_tokens: <int> }.'
  paths: []
  date: '2026-08-24'
