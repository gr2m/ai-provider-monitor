  note: 'Introduces POST /responses/input_tokens?beta=true, a beta endpoint that returns the input token count for a provided Responses-style request body as { object: "response.input_tokens", input_tokens: <int> }.'
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/941
- change: changed
  target: route
  breaking: false
