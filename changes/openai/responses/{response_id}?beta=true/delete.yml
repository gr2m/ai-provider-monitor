      before: 'null'
      after: '{"type":"object","required":["error"],"properties":{"error":{"$ref":"#/components/schemas/BetaError"}}}'
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
