      before: 'null'
      after: '{"type":"object","properties":{"detailed_explanation":{"type":"string","description":"The public explanation for this block."},"error_type":{"$ref":"#/components/schemas/Beta_MisalignmentErrorType","description":"An optional classification; clients must accept additional values."},"review_target":{"anyOf":[{"type":"string","minLength":1,"maxLength":96,"pattern":"^[A-Za-z0-9._~:-]+$","not":{"pattern":"[^A-Za-z0-9._~:-]"},"description":"An opaque target for explicitly continuing this review, or null when unavailable."},{"type":"null"}]},"steer":{"$ref":"#/components/schemas/Beta_MisalignmentSteer","description":"An optional public continuation instruction."}}}'
