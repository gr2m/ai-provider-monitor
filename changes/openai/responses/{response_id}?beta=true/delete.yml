- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds DELETE /responses/{response_id}?beta=true to delete a model response by ID. Returns 200 on success; 404 returns a BetaError object. Supports optional openai-beta header (e.g., responses_multi_agent=v1).
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/941
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added JSON response body for 200 OK with id, deleted, and object=response.deleted.
  paths:
    - path: responses/200/content/application/json/schema
      before: 'null'
      after: '{"type":"object","required":["object","deleted","id"],"properties":{"object":{"type":"string","enum":["response.deleted"],"default":"response.deleted"},"deleted":{"type":"boolean"},"id":{"type":"string"}}}'
  date: '2026-11-02'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: 404 error response is now wrapped in {"error":{...}} (BetaErrorResponse) instead of BetaError directly.
  paths:
    - path: responses/404/content/application/json/schema/$ref
      before: '#/components/schemas/BetaError'
      after: '#/components/schemas/BetaErrorResponse'
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added 429 TooManyRequests response with Retry-After header and ErrorResponse payload.
  paths:
    - path: responses/429/$ref
      before: 'null'
      after: '#/components/responses/TooManyRequests'
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added reusable TooManyRequests response component.
  paths:
    - path: components/responses/TooManyRequests
      before: 'null'
      after: '{"description":"The request was rejected because a rate limit was exceeded.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}},"headers":{"Retry-After":{"description":"The minimum number of seconds to wait before retrying. This header is returned when the server has computed a retry delay and may be omitted for 429 responses that require user action.","schema":{"type":"integer","minimum":1}}}}'
  date: '2026-11-02'
- change: added
