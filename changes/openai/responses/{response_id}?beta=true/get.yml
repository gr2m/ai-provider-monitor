- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Adds beta endpoint GET /responses/{response_id}?beta=true to retrieve a model response by ID. Supports optional query params: include[] (to return extra data such as web_search_call.results, code_interpreter_call.outputs, message.output_text.logprobs, reasoning.encrypted_content, etc.), stream (enable Server‑Sent Events), starting_after (resume stream after a given event sequence), include_obfuscation (toggle obfuscation fields for streaming). Optional openai-beta header can enable responses_multi_agent=v1. Returns 200 with a BetaResponse object.'
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/941
