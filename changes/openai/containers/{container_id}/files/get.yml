      before: 'null'
      after: '#/components/responses/TooManyRequests'
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added reusable TooManyRequests response component with Retry-After header.
  paths:
    - path: components/responses/TooManyRequests/description
      before: 'null'
      after: The request was rejected because a rate limit was exceeded.
    - path: components/responses/TooManyRequests/content/application/json/schema/$ref
      before: 'null'
      after: '#/components/schemas/ErrorResponse'
    - path: components/responses/TooManyRequests/headers/Retry-After/description
      before: 'null'
      after: The minimum number of seconds to wait before retrying. This header is returned when the server has computed a retry delay and may be omitted for 429 responses that require user action.
    - path: components/responses/TooManyRequests/headers/Retry-After/schema/type
      before: 'null'
      after: integer
    - path: components/responses/TooManyRequests/headers/Retry-After/schema/minimum
      before: 'null'
      after: '1'
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added error schemas used by new error responses (ErrorResponse, Error, Misalignment* types).
  paths:
    - path: components/schemas/ErrorResponse
      before: 'null'
      after: 'object with property `error`: Error'
    - path: components/schemas/Error
      before: 'null'
      after: error object with fields code, message, misalignment, param, type
    - path: components/schemas/MisalignmentErrorDetailsResource
      before: 'null'
      after: object with optional detailed_explanation, error_type, review_target, steer
    - path: components/schemas/_MisalignmentErrorType
      before: 'null'
      after: string or enum {potentially_unintended_* , other}
    - path: components/schemas/_MisalignmentSteer
      before: 'null'
      after: object with message
  date: '2026-11-02'
