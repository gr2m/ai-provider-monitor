- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /images/edits to edit/extend images from one or more sources using a prompt. Accepts multipart (binary image/mask) or JSON (image/file references), supports GPT image models and dall-e-2, optional masks, background/size/quality/format controls, n variants, and SSE streaming of partial/final images.
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: CreateImageEditRequest.size now accepts arbitrary WIDTHxHEIGHT strings (anyOf), enabling flexible resolutions for newer models; description updated with gpt-image-2 and DALL·E 3 sizing rules.
  paths:
    - path: components.schemas.CreateImageEditRequest.properties.size
      before: '{"type":"string","enum":["256x256","512x512","1024x1024","1536x1024","1024x1536","auto"],"default":"1024x1024","nullable":true,"description":"The size of the generated images. Must be one of `1024x1024`, `1536x1024` (landscape), `1024x1536` (portrait), or `auto` (default value) for the GPT image models, and one of `256x256`, `512x512`, or `1024x1024` for `dall-e-2`."}'
      after: '{"anyOf":[{"type":"string"},{"enum":["256x256","512x512","1024x1024","1536x1024","1024x1536","auto"],"type":"string"}],"default":"1024x1024","nullable":true,"description":"The size of the generated images. For `gpt-image-2` and `gpt-image-2-2026-04-21`, arbitrary resolutions are supported as `WIDTHxHEIGHT` strings, for example `1536x864`. Width and height must both be divisible by 16 and the requested aspect ratio must be between 1:3 and 3:1. Resolutions above `2560x1440` are experimental, and the maximum supported resolution is `3840x2160`. The requested size must also satisfy the model''s current pixel and edge limits. The standard sizes `1024x1024`, `1536x1024`, and `1024x1536` are supported by the GPT image models; `auto` is supported for models that allow automatic sizing. For `dall-e-2`, use one of `256x256`, `512x512`, or `1024x1024`. For `dall-e-3`, use one of `1024x1024`, `1792x1024`, or `1024x1792`."}'
  date: '2026-08-24'
