- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Added POST /images/generations to create images from a prompt with GPT image or DALL-E models. Supports background transparency, size, quality, output format and compression, number of images, and moderation; GPT image models support streaming partial/final images (base64); DALL-E can return URLs or base64 via response_format.
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: CreateImageRequest.size now allows arbitrary WxH strings (anyOf with free-form string) and docs expanded for gpt-image-2 constraints.
  paths:
    - path: components/schemas/CreateImageRequest/properties/size
      before: '{"default":"auto","description":"The size of the generated images. Must be one of `1024x1024`, `1536x1024` (landscape), `1024x1536` (portrait), or `auto` (default value) for the GPT image models, one of `256x256`, `512x512`, or `1024x1024` for `dall-e-2`, and one of `1024x1024`, `1792x1024`, or `1024x1792` for `dall-e-3`.","enum":["auto","1024x1024","1536x1024","1024x1536","256x256","512x512","1792x1024","1024x1792"],"example":"1024x1024","nullable":true,"type":"string"}'
      after: '{"anyOf":[{"type":"string"},{"enum":["auto","1024x1024","1536x1024","1024x1536","256x256","512x512","1792x1024","1024x1792"],"type":"string"}],"default":"auto","description":"The size of the generated images. For `gpt-image-2` and `gpt-image-2-2026-04-21`, arbitrary resolutions are supported as `WIDTHxHEIGHT` strings, for example `1536x864`. Width and height must both be divisible by 16 and the requested aspect ratio must be between 1:3 and 3:1. Resolutions above `2560x1440` are experimental, and the maximum supported resolution is `3840x2160`. The requested size must also satisfy the model''s current pixel and edge limits. The standard sizes `1024x1024`, `1536x1024`, and `1024x1536` are supported by the GPT image models; `auto` is supported for models that allow automatic sizing. For `dall-e-2`, use one of `256x256`, `512x512`, or `1024x1024`. For `dall-e-3`, use one of `1024x1024`, `1792x1024`, or `1024x1792`.","example":"1024x1024","nullable":true}'
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/941
