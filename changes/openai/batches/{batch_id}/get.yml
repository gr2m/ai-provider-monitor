- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces GET /batches/{batch_id} to retrieve a batch by ID, returning its status, timestamps, input/output file IDs, request counts, model, metadata, and usage (when available).
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: added
