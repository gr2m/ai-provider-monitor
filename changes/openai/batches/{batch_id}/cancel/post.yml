- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /batches/{batch_id}/cancel to cancel an in-progress batch. The batch enters cancelling (up to 10 minutes) before becoming cancelled, potentially with partial results; responds with the cancelling batch's details.
