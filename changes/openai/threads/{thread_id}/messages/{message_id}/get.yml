- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces GET /threads/{thread_id}/messages/{message_id} to fetch a specific message in a thread, returning the full message object (content, role, status, attachments, timestamps, metadata, etc.).
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Added 'unixtime' format to timestamp fields (created_at, completed_at, incomplete_at) in MessageObject response.
  paths:
    - path: responses/200/content/application/json/schema/components/schemas/MessageObject/properties/created_at/format
      before: 'null'
      after: unixtime
    - path: responses/200/content/application/json/schema/components/schemas/MessageObject/properties/completed_at/anyOf/0/format
      before: 'null'
      after: unixtime
    - path: responses/200/content/application/json/schema/components/schemas/MessageObject/properties/incomplete_at/anyOf/0/format
      before: 'null'
      after: unixtime
  date: '2026-08-24'
