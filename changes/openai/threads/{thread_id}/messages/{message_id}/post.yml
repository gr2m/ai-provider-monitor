- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated various schema descriptions to developers.openai.com links (no structural changes).
  paths:
    - path: $.components.schemas.MessageObject.description
      before: Represents a message within a [thread](/docs/api-reference/threads).
      after: Represents a message within a [thread](https://developers.openai.com/api/docs/assistants/migration).
    - path: $.components.schemas.MessageObject.properties.assistant_id.anyOf[0].description
      before: If applicable, the ID of the [assistant](/docs/api-reference/assistants) that authored this message.
      after: If applicable, the ID of the [assistant](https://developers.openai.com/api/docs/assistants/migration) that authored this message.
    - path: $.components.schemas.MessageObject.properties.run_id.anyOf[0].description
      before: The ID of the [run](/docs/api-reference/runs) associated with the creation of this message. Value is `null` when messages are created manually using the create message or create thread endpoints.
      after: The ID of the [run](https://developers.openai.com/api/docs/assistants/migration) associated with the creation of this message. Value is `null` when messages are created manually using the create message or create thread endpoints.
    - path: $.components.schemas.MessageObject.properties.thread_id.description
      before: The [thread](/docs/api-reference/threads) ID that this message belongs to.
      after: The [thread](https://developers.openai.com/api/docs/assistants/migration) ID that this message belongs to.
    - path: $.components.schemas.MessageContentImageFileObject.description
      before: References an image [File](/docs/api-reference/files) in the content of a message.
      after: References an image [File](https://developers.openai.com/api/reference/resources/files) in the content of a message.
    - path: $.components.schemas.MessageContentImageFileObject.properties.image_file.properties.file_id.description
      before: The [File](/docs/api-reference/files) ID of the image in the message content. Set `purpose=\"vision\"` when uploading the File if you need to later display the file content.
      after: The [File](https://developers.openai.com/api/reference/resources/files) ID of the image in the message content. Set `purpose=\"vision\"` when uploading the File if you need to later display the file content.
  date: '2026-11-02'
