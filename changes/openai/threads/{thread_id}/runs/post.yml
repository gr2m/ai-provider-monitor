- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /threads/{thread_id}/runs to start an assistant execution on a thread. Requires assistant_id and supports adding messages, instruction/model/tool overrides, streaming, and response/usage details in the returned run object (including tool call actions).
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
