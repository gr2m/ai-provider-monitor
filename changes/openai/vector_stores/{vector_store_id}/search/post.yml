- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /vector_stores/{vector_store_id}/search to retrieve relevant content chunks from a vector store using a query (string or list), optional attribute filters, ranking options, and optional query rewriting; returns scored chunks with file metadata plus pagination.
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added 'in' and 'nin' operators to ComparisonFilter.type for request filter comparisons.
  paths:
    - path: /components/schemas/ComparisonFilter/properties/type/enum
      before: '["eq","ne","gt","gte","lt","lte"]'
      after: '["eq","ne","gt","gte","lt","lte","in","nin"]'
  date: '2026-03-16'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/788
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added 400 error response for invalid search input/filters or expired vector store, returning ErrorResponse.
  paths:
    - path: responses/400/content/application/json/schema/$ref
      before: 'null'
      after: '#/components/schemas/ErrorResponse'
    - path: responses/400/description
      before: 'null'
      after: The search input or filters are invalid, or the vector store has expired.
    - path: components/schemas/ErrorResponse/type
      before: 'null'
      after: object
    - path: components/schemas/Error/type
      before: 'null'
      after: object
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added 404 error response when the vector store is not found, returning ErrorResponse.
  paths:
    - path: responses/404/content/application/json/schema/$ref
      before: 'null'
      after: '#/components/schemas/ErrorResponse'
    - path: responses/404/description
      before: 'null'
      after: The vector store was not found.
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added 429 TooManyRequests response with Retry-After header and ErrorResponse body.
  paths:
    - path: responses/429/$ref
      before: 'null'
      after: '#/components/responses/TooManyRequests'
    - path: components/responses/TooManyRequests/description
      before: 'null'
      after: The request was rejected because a rate limit was exceeded.
    - path: components/responses/TooManyRequests/content/application/json/schema/$ref
      before: 'null'
      after: '#/components/schemas/ErrorResponse'
    - path: components/responses/TooManyRequests/headers/Retry-After/schema/type
      before: 'null'
      after: integer
    - path: components/responses/TooManyRequests/headers/Retry-After/schema/minimum
      before: 'null'
      after: '1'
  date: '2026-11-02'
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: 'Updated route metadata: added top-level description and shortened summary text.'
  paths:
    - path: summary
      before: Search a vector store for relevant chunks based on a query and file attributes filter.
      after: Search vector store
    - path: description
      before: 'null'
      after: Search a vector store for relevant chunks based on a query and file attributes filter.
  date: '2026-11-02'
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: CompoundFilter schema now uses a standard self $ref instead of $recursiveRef; removed $recursiveAnchor. Behavior unchanged.
  paths:
    - path: components/schemas/CompoundFilter/$recursiveAnchor
      before: 'true'
      after: 'null'
    - path: components/schemas/CompoundFilter/properties/filters/items/oneOf/1/$recursiveRef
      before: '#'
      after: 'null'
    - path: components/schemas/CompoundFilter/properties/filters/items/oneOf/1/$ref
      before: 'null'
      after: '#/components/schemas/CompoundFilter'
  date: '2026-11-02'
