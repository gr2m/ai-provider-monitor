- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added moderation field to ChatCompletion response with input/output moderation results and related schemas.
  paths:
    - path: components/schemas/CreateChatCompletionResponse/properties/moderation
      before: 'null'
      after: '{"anyOf":[{"$ref":"#/components/schemas/ChatCompletionModeration","description":"Moderation results for the request input and generated output, if moderated\ncompletions were requested.\n"},{"type":"null"}]}'
    - path: components/schemas/ChatCompletionModeration
      before: 'null'
      after: '{"type":"object","required":["input","output"],"properties":{"input":{"oneOf":[{"$ref":"#/components/schemas/ChatCompletionModerationResults"},{"$ref":"#/components/schemas/ChatCompletionModerationError"}],"discriminator":{"propertyName":"type"},"description":"Moderation for the request input."},"output":{"oneOf":[{"$ref":"#/components/schemas/ChatCompletionModerationResults"},{"$ref":"#/components/schemas/ChatCompletionModerationError"}],"discriminator":{"propertyName":"type"},"description":"Moderation for the generated output."}},"description":"Moderation results or errors for the request input and generated output."}'
    - path: components/schemas/ChatCompletionModerationResults
      before: 'null'
      after: '{"type":"object","required":["type","model","results"],"properties":{"type":{"type":"string","enum":["moderation_results"],"description":"The object type, which is always `moderation_results`."},"model":{"type":"string","description":"The moderation model used to generate the results."},"results":{"type":"array","items":{"$ref":"#/components/schemas/ModerationResultBody"},"description":"A list of moderation results."}},"description":"Successful moderation results for the request input or generated output."}'
    - path: components/schemas/ChatCompletionModerationError
      before: 'null'
      after: '{"type":"object","required":["type","code","message"],"properties":{"type":{"type":"string","enum":["error"],"description":"The object type, which is always `error`."},"code":{"type":"string","description":"The error code."},"message":{"type":"string","description":"The error message."}},"description":"An error produced while attempting moderation."}'
    - path: components/schemas/ModerationResultBody
      before: 'null'
      after: '{"type":"object","title":"Moderation result","required":["type","model","flagged","categories","category_scores","category_applied_input_types"],"properties":{"categories":{"type":"object","additionalProperties":{"type":"boolean"},"description":"A dictionary of moderation categories to booleans, True if the input is flagged under this category."},"category_applied_input_types":{"type":"object","additionalProperties":{"type":"array","items":{"$ref":"#/components/schemas/ModerationInputType"}},"description":"Which modalities of input are reflected by the score for each category."},"category_scores":{"type":"object","additionalProperties":{"type":"number"},"description":"A dictionary of moderation categories to scores."},"flagged":{"type":"boolean","description":"A boolean indicating whether the content was flagged by any category."},"model":{"type":"string","description":"The moderation model that produced this result."},"type":{"type":"string","enum":["moderation_result"],"default":"moderation_result","description":"The object type, which was always `moderation_result` for successful moderation results."}},"description":"A moderation result produced for the response input or output."}'
    - path: components/schemas/ModerationInputType
      before: 'null'
      after: '{"type":"string","enum":["text","image"]}'
  date: '2026-08-24'
