- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated finish_reason description to reference the Model Spec.
  paths:
    - path: components/schemas/CreateChatCompletionResponse/properties/choices/items/properties/finish_reason/description
      before: The reason the model stopped generating tokens. This will be `stop` if the model hit a natural stop point or a provided stop sequence, `length` if the maximum number of tokens specified in the request was reached, `content_filter` if content was omitted due to a flag from our content filters, `tool_calls` if the model called a tool, or `function_call` (deprecated) if the model called a function.
      after: The reason the model stopped generating tokens. This will be `stop` if the model hit a natural stop point or a provided stop sequence, `length` if the maximum number of tokens specified in the request was reached, `content_filter` if content was omitted due to a flag from our content filters, `tool_calls` if the model called a tool, or `function_call` (deprecated) if the model called a function. Read the [Model Spec](https://model-spec.openai.com/2025-12-18.html) for more.
  date: '2026-08-24'
