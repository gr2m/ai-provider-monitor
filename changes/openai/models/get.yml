- change: added
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Added 403 Forbidden error response for insufficient permissions, with PermissionErrorResponse and supporting Error schemas.
  paths:
    - path: responses/403
      before: 'null'
      after: '#/components/schemas/PermissionErrorResponse'
    - path: components/schemas/PermissionErrorResponse
      before: 'null'
      after: object with required 'error' (Error|string)
    - path: components/schemas/Error
      before: 'null'
      after: object with code,message,param,type,misalignment
    - path: components/schemas/MisalignmentErrorDetailsResource
      before: 'null'
      after: object with optional detailed_explanation,error_type,review_target,steer
    - path: components/schemas/_MisalignmentErrorType
      before: 'null'
      after: enum includes potentially_unintended_* | other (extensible)
    - path: components/schemas/_MisalignmentSteer
      before: 'null'
      after: object with required message
  date: '2026-11-02'
