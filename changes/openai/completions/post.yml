- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated documentation links/text in property descriptions.
  paths:
    - path: components/schemas/CreateCompletionRequest/properties/frequency_penalty/description
      before: |
        Number between -2.0 and 2.0. Positive values penalize new tokens based on their existing frequency in the text so far, decreasing the model's likelihood to repeat the same line verbatim.

        [See more information about frequency and presence penalties.](/docs/guides/text-generation)
      after: |
        Number between -2.0 and 2.0. Positive values penalize new tokens based on their existing frequency in the text so far, decreasing the model's likelihood to repeat the same line verbatim.

        [See more information about frequency and presence penalties.](https://developers.openai.com/api/docs/guides/text)
    - path: components/schemas/CreateCompletionRequest/properties/presence_penalty/description
      before: |
        Number between -2.0 and 2.0. Positive values penalize new tokens based on whether they appear in the text so far, increasing the model's likelihood to talk about new topics.

        [See more information about frequency and presence penalties.](/docs/guides/text-generation)
      after: |
        Number between -2.0 and 2.0. Positive values penalize new tokens based on whether they appear in the text so far, increasing the model's likelihood to talk about new topics.

        [See more information about frequency and presence penalties.](https://developers.openai.com/api/docs/guides/text)
    - path: components/schemas/CreateCompletionRequest/properties/max_tokens/description
      before: |
        The maximum number of [tokens](/tokenizer) that can be generated in the completion.

        The token count of your prompt plus `max_tokens` cannot exceed the model's context length. [Example Python code](https://cookbook.openai.com/examples/how_to_count_tokens_with_tiktoken) for counting tokens.
      after: |
        The maximum number of [tokens](https://platform.openai.com/tokenizer) that can be generated in the completion.

        The token count of your prompt plus `max_tokens` cannot exceed the model's context length. [Example Python code](https://cookbook.openai.com/examples/how_to_count_tokens_with_tiktoken) for counting tokens.
    - path: components/schemas/CreateCompletionRequest/properties/logit_bias/description
      before: |
        Modify the likelihood of specified tokens appearing in the completion.

        Accepts a JSON object that maps tokens (specified by their token ID in the GPT tokenizer) to an associated bias value from -100 to 100. You can use this [tokenizer tool](/tokenizer?view=bpe) to convert text to token IDs. Mathematically, the bias is added to the logits generated by the model prior to sampling. The exact effect will vary per model, but values between -1 and 1 should decrease or increase likelihood of selection; values like -100 or 100 should result in a ban or exclusive selection of the relevant token.

        As an example, you can pass `{"50256": -100}` to prevent the <|endoftext|> token from being generated.
      after: |
        Modify the likelihood of specified tokens appearing in the completion.

        Accepts a JSON object that maps tokens (specified by their token ID in the GPT tokenizer) to an associated bias value from -100 to 100. You can use this [tokenizer tool](https://platform.openai.com/tokenizer?view=bpe) to convert text to token IDs. Mathematically, the bias is added to the logits generated by the model prior to sampling. The exact effect will vary per model, but values between -1 and 1 should decrease or increase likelihood of selection; values like -100 or 100 should result in a ban or exclusive selection of the relevant token.

        As an example, you can pass `{"50256": -100}` to prevent the <|endoftext|> token from being generated.
    - path: components/schemas/CreateCompletionRequest/properties/model/description
      before: |
        ID of the model to use. You can use the [List models](/docs/api-reference/models/list) API to see all of your available models, or see our [Model overview](/docs/models) for descriptions of them.
      after: |
        ID of the model to use. You can use the [List models](https://developers.openai.com/api/reference/resources/models/methods/list) API to see all of your available models, or see our [Model overview](https://developers.openai.com/api/docs/models) for descriptions of them.
    - path: components/schemas/CreateCompletionRequest/properties/user/description
      before: |
        A unique identifier representing your end-user, which can help OpenAI to monitor and detect abuse. [Learn more](/docs/guides/safety-best-practices#end-user-ids).
      after: |
        A unique identifier representing your end-user, which can help OpenAI to monitor and detect abuse. [Learn more](https://developers.openai.com/api/docs/guides/safety-best-practices#implement-safety-identifiers).
