  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: added
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: Added security requirement AdminApiKeyAuth for this route.
  paths:
    - path: security
      before: 'null'
      after: '[{"AdminApiKeyAuth":[]}]'
  date: '2026-08-24'
