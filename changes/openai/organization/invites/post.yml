- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Added POST /organization/invites to create an organization invite for a user; can optionally include project memberships granted upon acceptance.
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: added
  target: route
  breaking: true
  deprecated: false
  doc_only: false
  note: Added AdminApiKeyAuth security; requests now require an Admin API key.
  paths:
    - path: $.security
      before: 'null'
      after: '[{"AdminApiKeyAuth": []}]'
  date: '2026-08-24'
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified projects behavior when an empty list is provided (no projects invited, including default).
  paths:
    - path: $.components.schemas.InviteRequest.properties.projects.description
      before: An array of projects to which membership is granted at the same time the org invite is accepted. If omitted, the user will be invited to the default project for compatibility with legacy behavior.
      after: An array of projects to which membership is granted at the same time the org invite is accepted. If omitted, the user will be invited to the default project for compatibility with legacy behavior. If empty list is passed, the user will not be invited to any projects, including the default one.
  date: '2026-08-24'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added created_at (unixtime) to Invite; this replaces invited_at and is required.
  paths:
    - path: $.components.schemas.Invite.properties.created_at
      before: 'null'
      after: '{"description":"The Unix timestamp (in seconds) of when the invite was sent.","format":"unixtime","type":"integer"}'
  date: '2026-08-24'
- change: removed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Removed invited_at from Invite; use created_at instead.
  paths:
    - path: $.components.schemas.Invite.properties.invited_at
      before: '{"description":"The Unix timestamp (in seconds) of when the invite was sent.","type":"integer"}'
      after: 'null'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: 'Invite required fields updated: removed invited_at and expires_at; added created_at and projects.'
  paths:
    - path: $.components.schemas.Invite.required
      before: '["object","id","email","role","status","invited_at","expires_at"]'
      after: '["object","id","email","role","status","created_at","projects"]'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: accepted_at may now be null; integer uses unixtime format.
  paths:
    - path: $.components.schemas.Invite.properties.accepted_at
      before: '{"description":"The Unix timestamp (in seconds) of when the invite was accepted.","type":"integer"}'
      after: '{"anyOf":[{"format":"unixtime","type":"integer"},{"type":"null"}],"description":"The Unix timestamp (in seconds) of when the invite was accepted."}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: expires_at may now be null and is no longer required; integer uses unixtime format.
  paths:
    - path: $.components.schemas.Invite.properties.expires_at
      before: '{"description":"The Unix timestamp (in seconds) of when the invite expires.","type":"integer"}'
      after: '{"anyOf":[{"format":"unixtime","type":"integer"},{"type":"null"}],"description":"The Unix timestamp (in seconds) of when the invite expires."}'
  date: '2026-08-24'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: In Invite.projects items, fields id and role are now required.
  paths:
    - path: $.components.schemas.Invite.properties.projects.items.required
      before: 'null'
      after: '["id","role"]'
  date: '2026-08-24'
