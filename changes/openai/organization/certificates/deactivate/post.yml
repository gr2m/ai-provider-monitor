  note: Introduces POST /organization/certificates/deactivate to atomically and idempotently deactivate up to 10 organization-level certificates and return their details in a list response.
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: added
  target: route
  breaking: true
  deprecated: false
  doc_only: false
  note: Added AdminApiKeyAuth security requirement to this operation.
  paths:
    - path: security[0].AdminApiKeyAuth
      before: 'null'
      after: '[]'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: 200 response schema changed from ListCertificatesResponse to OrganizationCertificateDeactivationResponse (no pagination, different object type).
  paths:
    - path: responses.200.content.application/json.schema.$ref
      before: '#/components/schemas/ListCertificatesResponse'
      after: '#/components/schemas/OrganizationCertificateDeactivationResponse'
  date: '2026-08-24'
- change: removed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Removed pagination fields from 200 response.
  paths:
    - path: components.schemas.ListCertificatesResponse.properties.has_more
      before: boolean
      after: 'null'
    - path: components.schemas.ListCertificatesResponse.properties.first_id
      before: string
      after: 'null'
    - path: components.schemas.ListCertificatesResponse.properties.last_id
      before: string
      after: 'null'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Response item type changed from Certificate to OrganizationCertificate; removed certificate_details.content; name can be null; object enum narrowed; active now required.
  paths:
    - path: components.schemas.ListCertificatesResponse.properties.data.items.$ref
      before: '#/components/schemas/Certificate'
      after: 'null'
    - path: components.schemas.OrganizationCertificateDeactivationResponse.properties.data.items.$ref
      before: 'null'
      after: '#/components/schemas/OrganizationCertificate'
    - path: components.schemas.Certificate.properties.certificate_details.properties.content
      before: string
      after: 'null'
    - path: components.schemas.OrganizationCertificate.properties.name.anyOf
      before: string
      after: '["string","null"]'
    - path: components.schemas.Certificate.properties.object.enum
      before: '["certificate","organization.certificate","organization.project.certificate"]'
      after: 'null'
    - path: components.schemas.OrganizationCertificate.properties.object.enum
      before: 'null'
      after: '["organization.certificate"]'
    - path: components.schemas.Certificate.required
      before: '["object","id","name","created_at","certificate_details"]'
      after: 'null'
    - path: components.schemas.OrganizationCertificate.required
      before: '["object","id","name","created_at","certificate_details"]'
      after: '["object","id","name","created_at","certificate_details","active"]'
  date: '2026-08-24'
