- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds GET /organization/certificates/{certificate_id} to retrieve an uploaded organization certificate by ID. Optionally include=content to return PEM content; response includes id, name, created_at, and certificate_details (valid_at, expires_at, and optionally content).
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
