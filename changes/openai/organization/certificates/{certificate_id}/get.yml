  doc_only: false
  note: Certificate.name is now nullable (anyOf string or null) instead of string only.
  paths:
    - path: $.components.schemas.Certificate.properties.name
      before: '{"type":"string","description":"The name of the certificate."}'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"The name of the certificate."}'
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/941
