- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds GET /organization/certificates/{certificate_id} to retrieve an uploaded organization certificate by ID. Optionally include=content to return PEM content; response includes id, name, created_at, and certificate_details (valid_at, expires_at, and optionally content).
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: added
  target: route
  breaking: true
  deprecated: false
  doc_only: false
  note: Added AdminApiKeyAuth security requirement; route now requires Admin API key.
  paths:
    - path: $.security
      before: 'null'
      after: '[{"AdminApiKeyAuth":[]} ]'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Certificate.name is now nullable (anyOf string or null) instead of string only.
  paths:
    - path: $.components.schemas.Certificate.properties.name
      before: '{"type":"string","description":"The name of the certificate."}'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"The name of the certificate."}'
  date: '2026-08-24'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added ''unixtime'' format to timestamp fields: created_at, certificate_details.valid_at, and certificate_details.expires_at.'
  paths:
    - path: $.components.schemas.Certificate.properties.created_at.format
      before: 'null'
      after: '"unixtime"'
    - path: $.components.schemas.Certificate.properties.certificate_details.properties.valid_at.format
      before: 'null'
      after: '"unixtime"'
    - path: $.components.schemas.Certificate.properties.certificate_details.properties.expires_at.format
      before: 'null'
      after: '"unixtime"'
  date: '2026-08-24'
