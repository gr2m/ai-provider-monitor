- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds GET /organization/certificates to list uploaded organization certificates with pagination and ordering.
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: added
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: Added AdminApiKeyAuth security requirement for this endpoint.
  paths:
    - path: $.security
      before: 'null'
      after: '[{"AdminApiKeyAuth": []}]'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: List item schema changed from Certificate to OrganizationCertificate.
  paths:
    - path: $.components.schemas.ListCertificatesResponse.properties.data.items.$ref
      before: '"#/components/schemas/Certificate"'
      after: '"#/components/schemas/OrganizationCertificate"'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: first_id and last_id now allow null (string|null) instead of only string.
  paths:
    - path: $.components.schemas.ListCertificatesResponse.properties.first_id
      before: '{"type":"string","example":"cert_abc"}'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"example":"cert_abc"}'
    - path: $.components.schemas.ListCertificatesResponse.properties.last_id
      before: '{"type":"string","example":"cert_abc"}'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"example":"cert_abc"}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: first_id and last_id added to ListCertificatesResponse.required.
  paths:
    - path: $.components.schemas.ListCertificatesResponse.required
      before: '["object","data","has_more"]'
      after: '["object","data","has_more","first_id","last_id"]'
  date: '2026-08-24'
- change: removed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Removed certificate_details.content from item schema.
  paths:
    - path: $.components.schemas.Certificate.properties.certificate_details.properties.content
      before: '{"description":"The content of the certificate in PEM format.","type":"string"}'
      after: 'null'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: OrganizationCertificate.name is now nullable (string|null) instead of string.
  paths:
    - path: $.components.schemas.Certificate.properties.name.type
      before: '"string"'
      after: 'null'
    - path: $.components.schemas.OrganizationCertificate.properties.name.anyOf
      before: 'null'
      after: '[{"type":"string"},{"type":"null"}]'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: active is now required on OrganizationCertificate items.
  paths:
    - path: $.components.schemas.Certificate.required
      before: '["object","id","name","created_at","certificate_details"]'
      after: 'null'
    - path: $.components.schemas.OrganizationCertificate.required
      before: 'null'
      after: '["object","id","name","created_at","certificate_details","active"]'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: object enum narrowed to only 'organization.certificate'.
  paths:
    - path: $.components.schemas.Certificate.properties.object.enum
      before: '["certificate","organization.certificate","organization.project.certificate"]'
      after: 'null'
    - path: $.components.schemas.OrganizationCertificate.properties.object.enum
      before: 'null'
      after: '["organization.certificate"]'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added unixtime format to created_at, certificate_details.expires_at, and valid_at.
  paths:
    - path: $.components.schemas.OrganizationCertificate.properties.created_at.format
      before: 'null'
      after: '"unixtime"'
    - path: $.components.schemas.OrganizationCertificate.properties.certificate_details.properties.expires_at.format
      before: 'null'
      after: '"unixtime"'
    - path: $.components.schemas.OrganizationCertificate.properties.certificate_details.properties.valid_at.format
      before: 'null'
      after: '"unixtime"'
  date: '2026-08-24'
