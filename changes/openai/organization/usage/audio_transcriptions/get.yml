- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Completions result expanded with new token counters (cache write, cached per-modality, uncached, and per-modality input/output tokens).
  paths:
    - path: /components/schemas/UsageCompletionsResult/properties/input_cache_write_tokens
      before: 'null'
      after: '{"description":"The aggregated number of input tokens written to the cache.","type":"integer"}'
    - path: /components/schemas/UsageCompletionsResult/properties/input_cached_audio_tokens
      before: 'null'
      after: '{"description":"The aggregated number of cached audio input tokens used.","type":"integer"}'
    - path: /components/schemas/UsageCompletionsResult/properties/input_cached_image_tokens
      before: 'null'
      after: '{"description":"The aggregated number of cached image input tokens used.","type":"integer"}'
    - path: /components/schemas/UsageCompletionsResult/properties/input_cached_text_tokens
      before: 'null'
      after: '{"description":"The aggregated number of cached text input tokens used.","type":"integer"}'
    - path: /components/schemas/UsageCompletionsResult/properties/input_image_tokens
      before: 'null'
      after: '{"description":"The aggregated number of uncached image input tokens used.","type":"integer"}'
    - path: /components/schemas/UsageCompletionsResult/properties/input_text_tokens
      before: 'null'
      after: '{"description":"The aggregated number of uncached text input tokens used, excluding cache-write tokens.","type":"integer"}'
    - path: /components/schemas/UsageCompletionsResult/properties/input_uncached_tokens
      before: 'null'
      after: '{"description":"The aggregated number of uncached input tokens used across text, audio, and image inputs, excluding cache-write tokens.","type":"integer"}'
    - path: /components/schemas/UsageCompletionsResult/properties/output_image_tokens
      before: 'null'
      after: '{"description":"The aggregated number of image output tokens used.","type":"integer"}'
    - path: /components/schemas/UsageCompletionsResult/properties/output_text_tokens
      before: 'null'
      after: '{"description":"The aggregated number of text output tokens used.","type":"integer"}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Completions token field descriptions updated to clarify cached/uncached and multimodal accounting.
  paths:
    - path: /components/schemas/UsageCompletionsResult/properties/input_audio_tokens/description
      before: '"The aggregated number of audio input tokens used, including cached tokens."'
      after: '"The aggregated number of uncached audio input tokens used."'
    - path: /components/schemas/UsageCompletionsResult/properties/input_cached_tokens/description
      before: '"The aggregated number of text input tokens that has been cached from previous requests. For customers subscribe to scale tier, this includes scale tier tokens."'
      after: '"The aggregated number of cached input tokens used across text, audio, and image inputs. For customers subscribed to Scale Tier, this includes Scale Tier tokens."'
    - path: /components/schemas/UsageCompletionsResult/properties/input_tokens/description
      before: '"The aggregated number of text input tokens used, including cached tokens. For customers subscribe to scale tier, this includes scale tier tokens."'
      after: '"The aggregated number of input tokens used, including cached and cache-write tokens. This includes text, audio, and image tokens. For customers subscribed to Scale Tier, this includes Scale Tier tokens."'
    - path: /components/schemas/UsageCompletionsResult/properties/output_tokens/description
      before: '"The aggregated number of text output tokens used. For customers subscribe to scale tier, this includes scale tier tokens."'
      after: '"The aggregated number of output tokens used across text, audio, and image outputs. For customers subscribed to Scale Tier, this includes Scale Tier tokens."'
  date: '2026-08-24'
