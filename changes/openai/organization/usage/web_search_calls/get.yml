  note: Adds GET /organization/usage/web_search_calls to retrieve organization-wide web search calls usage over a time range, bucketed by minute/hour/day. Supports filters (project_ids, user_ids, api_key_ids, models, context_levels), grouping (project_id, user_id, api_key_id, model, context_level), pagination via limit/page, and returns paged time buckets with web search usage metrics (num_requests, num_model_requests). Secured with AdminApiKeyAuth.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/941
