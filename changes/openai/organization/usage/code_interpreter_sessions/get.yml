- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces GET /organization/usage/code_interpreter_sessions to retrieve organization-level, time-bucketed code interpreter sessions usage (num_sessions) over a specified time range, with bucket widths (1m/1h/1d), optional project_id filtering/grouping, limits, and pagination.
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
