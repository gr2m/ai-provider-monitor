- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces GET /organization/usage/completions to retrieve organization-level completions usage aggregated into time buckets (1m/1h/1d) over a time range, with optional filters (projects, users, API keys, models, batch), grouping (project_id, user_id, api_key_id, model, batch, service_tier), limits, and pagination; each bucket includes token counts and request counts.
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
