  doc_only: false
  note: Introduces GET /organization/usage/audio_speeches to fetch organization audio-speech usage over time, bucketed (1m/1h/1d) with filters (projects, users, API keys, models), optional grouping, and pagination; returns per-bucket characters processed and request counts.
