- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added standardized error responses: 400, 403, 404, and 429 (TooManyRequests).'
  paths:
    - path: responses/400
      before: 'null'
      after: '{"description":"The request parameters are invalid or the requested operation cannot be performed.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}}}'
    - path: responses/403
      before: 'null'
      after: '{"description":"The caller does not have permission to perform this operation.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/PermissionErrorResponse"}}}}'
    - path: responses/404
      before: 'null'
      after: '{"description":"The endpoint is unavailable or a requested resource was not found in this organization or project.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}}}'
    - path: responses/429
      before: 'null'
      after: '{"$ref":"#/components/responses/TooManyRequests"}'
  date: '2026-11-02'
- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Added reusable error-related component schemas and TooManyRequests response definition.
  paths:
    - path: components/schemas/ErrorResponse
      before: 'null'
      after: '{"type":"object","required":["error"],"properties":{"error":{"$ref":"#/components/schemas/Error"}}}'
    - path: components/schemas/PermissionErrorResponse
      before: 'null'
      after: '{"type":"object","required":["error"],"properties":{"error":{"anyOf":[{"$ref":"#/components/schemas/Error"},{"type":"string","description":"An explanation of the missing API permissions."}],"description":"Details about the permission error."}}}'
    - path: components/schemas/Error
      before: 'null'
      after: '{"type":"object","required":["type","message","param","code"],"properties":{"code":{"anyOf":[{"type":"string"},{"type":"null"}]},"message":{"type":"string"},"misalignment":{"$ref":"#/components/schemas/MisalignmentErrorDetailsResource"},"param":{"anyOf":[{"type":"string"},{"type":"null"}]},"type":{"type":"string"}}}'
    - path: components/schemas/MisalignmentErrorDetailsResource
      before: 'null'
      after: '{"type":"object","required":[],"properties":{"detailed_explanation":{"type":"string","description":"The public explanation for this block."},"error_type":{"$ref":"#/components/schemas/_MisalignmentErrorType","description":"An optional classification; clients must accept additional values."},"review_target":{"anyOf":[{"type":"string","minLength":1,"maxLength":96,"pattern":"^[A-Za-z0-9._~:-]+$","not":{"pattern":"[^A-Za-z0-9._~:-]"},"description":"An opaque target for explicitly continuing this review, or null when unavailable."},{"type":"null"}]},"steer":{"$ref":"#/components/schemas/_MisalignmentSteer","description":"An optional public continuation instruction."}}}'
    - path: components/schemas/_MisalignmentErrorType
      before: 'null'
      after: '{"anyOf":[{"type":"string"},{"type":"string","enum":["potentially_unintended_data_transfer","potentially_unintended_data_access","potentially_unintended_destructive_activity","other"]}]}'
    - path: components/schemas/_MisalignmentSteer
      before: 'null'
      after: '{"type":"object","required":["message"],"properties":{"message":{"type":"string","description":"The public continuation instruction."}}}'
    - path: components/responses/TooManyRequests
      before: 'null'
      after: '{"description":"The request was rejected because a rate limit was exceeded.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}},"headers":{"Retry-After":{"description":"The minimum number of seconds to wait before retrying. This header is returned when the server has computed a retry delay and may be omitted for 429 responses that require user action.","schema":{"type":"integer","minimum":1}}}}'
  date: '2026-11-02'
