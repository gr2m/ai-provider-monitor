- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces GET /organization/projects to return a paginated list of organization projects. Supports limit (1-100, default 20), after cursor pagination, and include_archived (default false). Returns a list object with project items (id, object='organization.project', name, created_at, status, archived_at) plus pagination fields (first_id, last_id, has_more).
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
