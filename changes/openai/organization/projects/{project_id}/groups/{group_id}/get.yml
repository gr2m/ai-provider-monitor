- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New GET /organization/projects/{project_id}/groups/{group_id} endpoint to retrieve a project's group membership details by project_id and group_id, with optional group_type (group or tenant_group). Returns a ProjectGroup object.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/941
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added explicit error responses: 400, 403, 404, and 429 (TooManyRequests).'
  paths:
    - path: responses/400
      before: 'null'
      after: '{"description":"The request parameters are invalid or the requested operation cannot be performed.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}}}'
    - path: responses/403
      before: 'null'
      after: '{"description":"The caller does not have permission to perform this operation.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/PermissionErrorResponse"}}}}'
    - path: responses/404
      before: 'null'
      after: '{"description":"The endpoint is unavailable or a requested group, user, or project was not found.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}}}'
    - path: responses/429
      before: 'null'
      after: '{"$ref":"#/components/responses/TooManyRequests"}'
  date: '2026-11-02'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added reusable error schemas and TooManyRequests response (with Retry-After header).
  paths:
    - path: components/schemas/ErrorResponse
      before: 'null'
      after: '{"type":"object","required":["error"],"properties":{"error":{"$ref":"#/components/schemas/Error"}}}'
    - path: components/schemas/PermissionErrorResponse
      before: 'null'
      after: '{"type":"object","required":["error"],"properties":{"error":{"description":"Details about the permission error.","anyOf":[{"$ref":"#/components/schemas/Error"},{"description":"An explanation of the missing API permissions.","type":"string"}]}}}'
    - path: components/schemas/Error
      before: 'null'
      after: '{"type":"object","required":["type","message","param","code"],"properties":{"code":{"anyOf":[{"type":"string"},{"type":"null"}]},"message":{"type":"string"},"misalignment":{"$ref":"#/components/schemas/MisalignmentErrorDetailsResource"},"param":{"anyOf":[{"type":"string"},{"type":"null"}]},"type":{"type":"string"}}}'
    - path: components/schemas/MisalignmentErrorDetailsResource
      before: 'null'
      after: '{"type":"object","required":[],"properties":{"detailed_explanation":{"description":"The public explanation for this block.","type":"string"},"error_type":{"$ref":"#/components/schemas/_MisalignmentErrorType","description":"An optional classification; clients must accept additional values."},"review_target":{"anyOf":[{"description":"An opaque target for explicitly continuing this review, or null when unavailable.","type":"string","minLength":1,"maxLength":96,"pattern":"^[A-Za-z0-9._~:-]+$","not":{"pattern":"[^A-Za-z0-9._~:-]"}},{"type":"null"}]},"steer":{"$ref":"#/components/schemas/_MisalignmentSteer","description":"An optional public continuation instruction."}}}'
    - path: components/schemas/_MisalignmentErrorType
      before: 'null'
      after: '{"anyOf":[{"type":"string"},{"type":"string","enum":["potentially_unintended_data_transfer","potentially_unintended_data_access","potentially_unintended_destructive_activity","other"]}]}'
    - path: components/schemas/_MisalignmentSteer
      before: 'null'
      after: '{"type":"object","required":["message"],"properties":{"message":{"description":"The public continuation instruction.","type":"string"}}}'
    - path: components/responses/TooManyRequests
      before: 'null'
      after: '{"description":"The request was rejected because a rate limit was exceeded.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}},"headers":{"Retry-After":{"description":"The minimum number of seconds to wait before retrying. This header is returned when the server has computed a retry delay and may be omitted for 429 responses that require user action.","schema":{"type":"integer","minimum":1}}}}'
  date: '2026-11-02'
