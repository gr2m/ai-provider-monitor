- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds GET /organization/projects/{project_id}/api_keys to return a paginated list of API keys in a project, including id, name, owner, created_at, last_used_at, and redacted_value.
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: added
  target: route
  breaking: true
  deprecated: false
  doc_only: false
  note: Added security requirement AdminApiKeyAuth for this endpoint.
  paths:
    - path: $.security
      before: 'null'
      after: '[{"AdminApiKeyAuth":[]}]'
  date: '2026-08-24'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional owner_project_access query parameter to filter by owner's project access.
  paths:
    - path: $.parameters[?(@.name=='owner_project_access')]
      before: 'null'
      after: '{"description":"Filter API keys by whether the owner currently has effective access to the project. Use `active` for owners with access, `inactive` for owners without access, or `any` for all enabled project API keys. If omitted, the endpoint applies its existing membership-based visibility rules, which may exclude some enabled keys.\n","in":"query","name":"owner_project_access","required":false,"schema":{"enum":["active","inactive","any"],"type":"string"}}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: List pagination fields first_id and last_id are now optional and nullable.
  paths:
    - path: $.components.schemas.ProjectApiKeyListResponse.properties.first_id
      before: '{"type":"string"}'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}]}'
    - path: $.components.schemas.ProjectApiKeyListResponse.properties.last_id
      before: '{"type":"string"}'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}]}'
    - path: $.components.schemas.ProjectApiKeyListResponse.required
      before: '["object","data","first_id","last_id","has_more"]'
      after: '["object","data","has_more"]'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: ProjectApiKey.last_used_at can now be null and includes unixtime format.
  paths:
    - path: $.components.schemas.ProjectApiKey.properties.last_used_at
      before: '{"type":"integer"}'
      after: '{"anyOf":[{"format":"unixtime","type":"integer"},{"type":"null"}],"description":"The Unix timestamp (in seconds) of when the API key was last used."}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: ProjectApiKey.created_at now declares unixtime format.
  paths:
    - path: $.components.schemas.ProjectApiKey.properties.created_at.format
      before: 'null'
      after: '"unixtime"'
  date: '2026-08-24'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added owner_project_access field to ProjectApiKey (values: active|inactive).'
  paths:
    - path: $.components.schemas.ProjectApiKey.properties.owner_project_access
      before: 'null'
      after: '{"description":"Whether the API key''s owner currently has effective access to the project.","enum":["active","inactive"],"type":"string"}'
  date: '2026-08-24'
