- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces GET /organization/projects/{project_id}/api_keys/{api_key_id} to retrieve a specific project API key, returning its metadata (owner, timestamps, redacted value). Requires AdminApiKeyAuth.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/941
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added error responses: 400 (archived), 403 (permission), 404 (not found), 429 (rate limiting).'
  paths:
    - path: responses/400
      before: 'null'
      after: The project is archived.
    - path: responses/400/content/application/json/schema/$ref
      before: 'null'
      after: '#/components/schemas/ErrorResponse'
    - path: responses/403
      before: 'null'
      after: The caller does not have permission to perform this operation.
    - path: responses/403/content/application/json/schema/$ref
      before: 'null'
      after: '#/components/schemas/PermissionErrorResponse'
    - path: responses/404
      before: 'null'
      after: The project or API key was not found.
    - path: responses/404/content/application/json/schema/$ref
      before: 'null'
      after: '#/components/schemas/ErrorResponse'
    - path: responses/429
      before: 'null'
      after: Too many management requests. Reduce the request rate and try again later.
    - path: responses/429/content/application/json/schema/$ref
      before: 'null'
      after: '#/components/schemas/ErrorResponse'
  date: '2026-11-02'
