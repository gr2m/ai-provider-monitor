    - path: security
      before: 'null'
      after: '[{"AdminApiKeyAuth":[]}]'
  date: '2026-08-24'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added external_key_id (string|null) to Project.
