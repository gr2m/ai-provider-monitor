      before: 'null'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"The external key associated with the project."}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Project.name is now nullable (string|null) instead of always string.
