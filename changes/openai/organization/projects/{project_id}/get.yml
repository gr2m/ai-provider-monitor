    - path: components.schemas.Project.properties.name
      before: '{"type":"string","description":"The name of the project. This appears in reporting."}'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"The name of the project. This appears in reporting."}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
