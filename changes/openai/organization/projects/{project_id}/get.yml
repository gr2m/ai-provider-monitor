- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New route GET /organization/projects/{project_id} retrieves a project by ID and returns its details (id, name, status, created_at, archived_at).
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: added
  target: route
  breaking: true
  deprecated: false
  doc_only: false
  note: Added AdminApiKeyAuth security requirement to the route
  paths:
    - path: security
      before: 'null'
      after: '[{"AdminApiKeyAuth":[]}]'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Added unixtime format to created_at and archived_at timestamps
  paths:
    - path: components.schemas.Project.properties.created_at.format
      before: 'null'
      after: '"unixtime"'
    - path: components.schemas.Project.properties.archived_at.anyOf[0].format
      before: 'null'
      after: '"unixtime"'
  date: '2026-08-24'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added new optional field external_key_id (string or null) to Project
  paths:
    - path: components.schemas.Project.properties.external_key_id
      before: 'null'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"The external key associated with the project."}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Project.name now allows null instead of always being a string
  paths:
    - path: components.schemas.Project.properties.name
      before: '{"description":"The name of the project. This appears in reporting.","type":"string"}'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"The name of the project. This appears in reporting."}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Project.status no longer constrained to enum and may be null
  paths:
    - path: components.schemas.Project.properties.status
      before: '{"description":"`active` or `archived`","enum":["active","archived"],"type":"string"}'
      after: '{"anyOf":[{"type":"string"},{"type":"null"}],"description":"`active` or `archived`"}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: 'Project.required updated: removed name and status from required fields'
  paths:
    - path: components.schemas.Project.required
      before: '["id","object","name","created_at","status"]'
      after: '["id","object","created_at"]'
  date: '2026-08-24'
