- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /organization/projects/{project_id}/certificates/activate to atomically and idempotently activate 1–10 certificates for a project and return the resulting project certificate list.
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: 200 response body replaced with OrganizationProjectCertificateActivationResponse (non-paginated wrapper and new item schema).
  paths:
    - path: $.responses.200.content.application/json.schema.$ref
      before: '#/components/schemas/ListCertificatesResponse'
      after: '#/components/schemas/OrganizationProjectCertificateActivationResponse'
  date: '2026-08-24'
- change: added
  target: request
  breaking: true
