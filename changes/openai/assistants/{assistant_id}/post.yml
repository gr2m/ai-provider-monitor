- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: ReasoningEffort enum widened to include new value "max".
  paths:
    - path: /components/schemas/ReasoningEffort/anyOf/0/enum
      before: '["none","minimal","low","medium","high","xhigh"]'
      after: '["none","minimal","low","medium","high","xhigh","max"]'
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/941
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: ReasoningEffort description updated with guidance and model-specific support note.
  paths:
    - path: /components/schemas/ReasoningEffort/anyOf/0/description
      before: |
        Constrains effort on reasoning for
        [reasoning models](https://platform.openai.com/docs/guides/reasoning).
        Currently supported values are `none`, `minimal`, `low`, `medium`, `high`, and `xhigh`. Reducing
        reasoning effort can result in faster responses and fewer tokens used
        on reasoning in a response.

        - `gpt-5.1` defaults to `none`, which does not perform reasoning. The supported reasoning values for `gpt-5.1` are `none`, `low`, `medium`, and `high`. Tool calls are supported for all reasoning values in gpt-5.1.
        - All models before `gpt-5.1` default to `medium` reasoning effort, and do not support `none`.
        - The `gpt-5-pro` model defaults to (and only supports) `high` reasoning effort.
        - `xhigh` is supported for all models after `gpt-5.1-codex-max`.
      after: |
        Constrains effort on reasoning for reasoning models. Currently supported
        values are `none`, `minimal`, `low`, `medium`, `high`, `xhigh`, and `max`.
        Reducing reasoning effort can result in faster responses and fewer tokens
        used on reasoning in a response. Not all reasoning models support every
        value. See the
        [reasoning guide](https://platform.openai.com/docs/guides/reasoning)
        for model-specific support.
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/941
