- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: true
  note: 'Background compaction default flipped: async now defaults to false; null/empty compaction uses blocking.'
  paths:
    - path: components/schemas/CompactionParam/properties/async/description
      before: Whether to compact context in the background. Omission or null defaults to true. Set to false to use blocking compaction. Background compaction may increase token usage.
      after: Whether to compact context in the background. Omission or null defaults to false. Set to true to enable background compaction. Background compaction may increase token usage.
    - path: components/schemas/SessionAgentConfigParam/properties/compaction/description
      before: Context compaction settings. Omit to keep the current settings. A supplied object replaces the settings; null or an empty object enables background compaction.
      after: Context compaction settings. Omit to keep the current settings. A supplied object replaces the settings; null or an empty object uses blocking compaction.
  date: '2026-11-13'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: true
  note: Background compaction default in responses flipped to false.
  paths:
    - path: components/schemas/CompactionResource/properties/async/description
      before: Whether context is compacted in the background. Defaults to true.
      after: Whether context is compacted in the background. Defaults to false.
  date: '2026-11-13'
