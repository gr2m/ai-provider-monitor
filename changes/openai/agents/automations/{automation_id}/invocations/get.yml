  note: Added GET /agents/automations/{automation_id}/invocations to list delivery records (invocation history) for a specific automation. Supports pagination via limit (1–100, default 20), order (asc|desc, default desc), and after cursor. Returns a list object with AutomationInvocationResource items including status, source (manual or automation), scheduled_at, session_id, skip_reason, and error.
