- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces GET /agents/sessions/{session_id}/events to stream live agent session events via Server-Sent Events (text/event-stream). Returns SessionEvent objects covering turn lifecycle, output deltas, errors, subagent and environment status for real-time monitoring.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1161
- change: added
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Added new enum value max_output_tokens to SessionTurnErrorCodeResource for turn failure codes returned in streamed session events.
  paths:
    - path: components.schemas.SessionTurnErrorCodeResource.enum
      before: 'null'
      after: max_output_tokens
  date: '2026-11-03'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1174
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional query parameter include_obfuscation (boolean, default true) to control inclusion of obfuscation padding in streamed events.
  paths:
    - path: parameters[1]
      before: 'null'
      after: '{ name: "include_obfuscation", in: "query", required: false, schema: { type: "boolean", default: true }, description: "Whether to include obfuscation padding in events on this connection. Defaults to `true`." }'
  date: '2026-11-04'
