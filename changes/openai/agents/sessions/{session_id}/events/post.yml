- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Expanded and clarified Idempotency-Key header behavior (24-hour replay window, replay semantics, potential 409 after expiry, and retry guidance).
  paths:
    - path: parameters[1].description
      before: An optional client-generated key that makes retries of submitted messages idempotent.
      after: An optional client-generated key for message submissions. Retry the same message with the same key and identical input within the 24-hour replay window; a retry replays the original outcome if it is available. After the window expires, a key whose outcome is unavailable may return 409. After a timeout or server error, inspect the session history and items before resubmitting. Use a new key for a new message, or only after confirming the earlier message did not execute.
  date: '2026-11-17'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1240
