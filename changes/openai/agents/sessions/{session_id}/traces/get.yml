- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New endpoint to list a session’s published root-turn traces as OTLP JSON, ordered and paginated (limit/order/after); skips unpublished traces; each request/response limited to 16 MiB.
  paths: []
  date: '2026-11-02'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1161
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Route description updated to clarify 16 MiB page-size behavior, pagination via last_id/has_more, and trace_too_large error when a single trace cannot fit.
  paths:
    - path: description
      before: Lists published root-turn traces as OTLP JSON, ordered by turn creation time and ID. Unpublished traces are skipped. Each page returns data available when read; it does not wait for late traces. Trace reads and the JSON response are limited to 16 MiB per request. If the limit is exceeded, request fewer traces.
      after: Lists published root-turn traces as OTLP JSON, ordered by turn creation time and ID. Unpublished traces are skipped. Each page returns data available when read; it does not wait for late traces. Pages may contain fewer traces than requested to fit the 16 MiB response limit. When `has_more` is true, pass `last_id` as `after` to continue. If the first trace exceeds 16 MiB before conversion or cannot fit on a page by itself, the API returns a `trace_too_large` error.
  date: '2026-11-20'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1264
