      after: '["whisper-1","gpt-transcribe","gpt-4o-transcribe","gpt-4o-mini-transcribe","gpt-4o-mini-transcribe-2025-12-15","gpt-4o-transcribe-diarize"]'
  date: '2026-08-24'
