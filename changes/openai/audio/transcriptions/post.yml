- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /audio/transcriptions to convert uploaded audio to text. Supports Whisper and GPT-4o transcribe models, optional diarization with speaker labels, configurable chunking (auto/server_vad), server-sent events streaming, and multiple output formats (json, diarized_json, verbose_json). Accepts multipart/form-data with file and model plus options like language, prompt, temperature, timestamps, and logprobs.
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
