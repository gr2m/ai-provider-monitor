- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /audio/transcriptions to convert uploaded audio to text. Supports Whisper and GPT-4o transcribe models, optional diarization with speaker labels, configurable chunking (auto/server_vad), server-sent events streaming, and multiple output formats (json, diarized_json, verbose_json). Accepts multipart/form-data with file and model plus options like language, prompt, temperature, timestamps, and logprobs.
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added keywords[] to guide transcription (supported by gpt-transcribe).
  paths:
    - path: components.schemas.CreateTranscriptionRequest.properties.keywords
      before: 'null'
      after: '{"description":"Words or phrases to guide transcription of the input audio. Supported by `gpt-transcribe`.\n","items":{"type":"string"},"type":"array"}'
  date: '2026-08-24'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added languages[] to specify possible input languages (supported by gpt-transcribe).
  paths:
    - path: components.schemas.CreateTranscriptionRequest.properties.languages
      before: 'null'
      after: '{"description":"Possible languages of the input audio, in [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) format. Supported by `gpt-transcribe`.\n","items":{"type":"string"},"minItems":1,"type":"array"}'
  date: '2026-08-24'
- change: added
