- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces beta Responses endpoint POST /responses?beta=true to create model responses from text, image, or file inputs, returning text or JSON. Supports tools (web search, file search, code interpreter, computer use, image generation, MCP, and custom/functions), function calling, SSE streaming, moderation, reasoning controls, multi-agent execution, conversations/context management, prompt caching, and usage reporting. Optional `openai-beta` header can enable `responses_multi_agent=v1`.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/941
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Route description and summary updated (links and text clarified).
  paths:
    - path: summary
      before: |
        Creates a model response. Provide [text](/docs/guides/text) or
        [image](/docs/guides/images) inputs to generate [text](/docs/guides/text)
        or [JSON](/docs/guides/structured-outputs) outputs. Have the model call
        your own [custom code](/docs/guides/function-calling) or use built-in
        [tools](/docs/guides/tools) like [web search](/docs/guides/tools-web-search)
        or [file search](/docs/guides/tools-file-search) to use your own data
        as input for the model's response.
      after: Create a model response
  date: '2026-11-02'
