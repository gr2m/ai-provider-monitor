- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /realtime/transcription_sessions to create a realtime transcription session and return an ephemeral client_secret for browser authentication. Supports config for input audio format, optional noise reduction, transcription model (including diarization), and server VAD turn detection. Response includes the session plus an ephemeral key.
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/578
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Response input_audio_transcription now references AudioTranscriptionResponse instead of AudioTranscription.
  paths:
    - path: $.components.schemas.RealtimeTranscriptionSessionCreateResponse.properties.input_audio_transcription.$ref
      before: '#/components/schemas/AudioTranscription'
      after: '#/components/schemas/AudioTranscriptionResponse'
  date: '2026-08-24'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added input_audio_transcription.delay option to control emission latency.
  paths:
    - path: $.components.schemas.AudioTranscription.properties.delay.type
      before: 'null'
      after: string
  date: '2026-08-24'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added input_audio_transcription.keywords to guide transcription.
  paths:
    - path: $.components.schemas.AudioTranscription.properties.keywords.type
      before: 'null'
      after: array
  date: '2026-08-24'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added input_audio_transcription.languages (array of ISO-639-1 codes).
  paths:
    - path: $.components.schemas.AudioTranscription.properties.languages.type
      before: 'null'
      after: array
  date: '2026-08-24'
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Expanded allowed models for input_audio_transcription.model to include gpt-transcribe, gpt-live-transcribe, and gpt-realtime-whisper.
  paths:
    - path: $.components.schemas.AudioTranscription.properties.model.anyOf[1].enum
      before: '["whisper-1","gpt-4o-mini-transcribe","gpt-4o-mini-transcribe-2025-12-15","gpt-4o-transcribe","gpt-4o-transcribe-diarize"]'
      after: '["whisper-1","gpt-transcribe","gpt-live-transcribe","gpt-4o-mini-transcribe","gpt-4o-mini-transcribe-2025-12-15","gpt-4o-transcribe","gpt-4o-transcribe-diarize","gpt-realtime-whisper"]'
  date: '2026-08-24'
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated prompt description to note it is not supported with gpt-realtime-whisper in GA Realtime sessions.
  paths:
    - path: $.components.schemas.AudioTranscription.properties.prompt.description
      before: |
        An optional text to guide the model's style or continue a previous audio
        segment.
        For `whisper-1`, the [prompt is a list of keywords](/docs/guides/speech-to-text#prompting).
        For `gpt-4o-transcribe` models (excluding `gpt-4o-transcribe-diarize`), the prompt is a free text string, for example "expect words related to technology".
      after: |
        An optional text to guide the model's style or continue a previous audio
        segment.
        For `whisper-1`, the [prompt is a list of keywords](/docs/guides/speech-to-text#prompting).
        For `gpt-4o-transcribe` models (excluding `gpt-4o-transcribe-diarize`), the prompt is a free text string, for example "expect words related to technology".
        Prompt is not supported with `gpt-realtime-whisper` in GA Realtime sessions.
  date: '2026-08-24'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Response input_audio_transcription may now include a languages array (ISO-639-1 codes).
  paths:
    - path: $.components.schemas.AudioTranscriptionResponse.properties.languages.type
      before: 'null'
      after: array
  date: '2026-08-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: client_secret.expires_at now declares format "unixtime" (still an integer).
  paths:
    - path: $.components.schemas.RealtimeTranscriptionSessionCreateResponse.properties.client_secret.properties.expires_at.format
      before: 'null'
      after: unixtime
  date: '2026-08-24'
