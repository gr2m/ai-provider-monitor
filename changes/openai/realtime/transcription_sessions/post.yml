- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /realtime/transcription_sessions to create a realtime transcription session and return an ephemeral client_secret for browser authentication. Supports config for input audio format, optional noise reduction, transcription model (including diarization), and server VAD turn detection. Response includes the session plus an ephemeral key.
