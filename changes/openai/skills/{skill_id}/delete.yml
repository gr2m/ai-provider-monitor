- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added 429 TooManyRequests response with Retry-After header and ErrorResponse payload.
  paths:
    - path: responses/429/$ref
      before: 'null'
      after: '#/components/responses/TooManyRequests'
    - path: components/responses/TooManyRequests/description
      before: 'null'
      after: The request was rejected because a rate limit was exceeded.
    - path: components/responses/TooManyRequests/content/application/json/schema/$ref
      before: 'null'
      after: '#/components/schemas/ErrorResponse'
    - path: components/responses/TooManyRequests/headers/Retry-After/description
      before: 'null'
      after: The minimum number of seconds to wait before retrying. This header is returned when the server has computed a retry delay and may be omitted for 429 responses that require user action.
    - path: components/responses/TooManyRequests/headers/Retry-After/schema/type
      before: 'null'
      after: integer
    - path: components/responses/TooManyRequests/headers/Retry-After/schema/minimum
      before: 'null'
      after: '1'
  date: '2026-11-02'
