- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: LiveMCPToolInputParam expanded with connection, approval, and discovery options (including deprecated connector_id; prefer server_url or tunnel_id).
  paths:
    - path: components/schemas/LiveMCPToolInputParam/properties/allowed_callers
      before: 'null'
      after: array of enum [direct, programmatic] or null
    - path: components/schemas/LiveMCPToolInputParam/properties/allowed_tools
      before: 'null'
      after: array<string> or LiveMCPToolFilterParam or null
    - path: components/schemas/LiveMCPToolInputParam/properties/authorization
      before: 'null'
      after: string or null (writeOnly)
    - path: components/schemas/LiveMCPToolInputParam/properties/connector_id
      before: 'null'
      after: string or null (deprecated; use server_url or tunnel_id)
    - path: components/schemas/LiveMCPToolInputParam/properties/defer_loading
      before: 'null'
      after: boolean or null
    - path: components/schemas/LiveMCPToolInputParam/properties/headers
      before: 'null'
      after: object<string,string> or null (writeOnly)
    - path: components/schemas/LiveMCPToolInputParam/properties/require_approval
      before: 'null'
      after: LiveMCPRequireApprovalFilterParam or enum [always, never] or null
    - path: components/schemas/LiveMCPToolInputParam/properties/server_description
      before: 'null'
      after: string or null
    - path: components/schemas/LiveMCPToolInputParam/properties/server_label
      before: 'null'
      after: string (maxLength 128, pattern ^[A-Za-z][A-Za-z0-9_-]*$)
    - path: components/schemas/LiveMCPToolInputParam/properties/server_url
      before: 'null'
      after: string (uri) or null
    - path: components/schemas/LiveMCPToolInputParam/properties/tunnel_id
      before: 'null'
      after: string (pattern ^tunnel_[a-z0-9]{32}$) or null
  date: '2026-11-16'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1234
