- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Added POST /content_provenance_checks to check uploaded image/audio for OpenAI provenance signals (C2PA, SynthID) and return detection results.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/941
- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Added top-level description for the route (moved long docs from summary into description).
  paths:
    - path: /description
      before: 'null'
      after: |-
        Check whether an image or audio file contains known OpenAI provenance signals. [Learn more about content provenance](https://developers.openai.com/api/docs/guides/content-provenance).

        If `not_detected`, it means the tool did not find supported signals in the uploaded file. The content could still have been generated by OpenAI if the metadata was stripped or has evidence of tampering, the watermark was degraded, it comes from a legacy generation model, or it was created before provenance signals were available. Content could also still be AI-generated by another company's model, which the tool currently does not detect.
  date: '2026-11-02'
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated route summary text.
  paths:
    - path: /summary
      before: |-
        Check whether an image or audio file contains known OpenAI provenance signals. [Learn more about content provenance](/api/docs/guides/content-provenance).

        If `not_detected`, it means the tool did not find supported signals in the uploaded file. The content could still have been generated by OpenAI if the metadata was stripped or has evidence of tampering, the watermark was degraded, it comes from a legacy generation model, or it was created before provenance signals were available. Content could also still be AI-generated by another company's model, which the tool currently does not detect.
      after: Create content provenance check
  date: '2026-11-02'
