  doc_only: false
  note: Expanded allowed values for reasoning_effort and updated description with model-specific support and validation behavior.
  paths:
    - path: components.schemas.CreateChatCompletionRequest.properties.reasoning_effort.enum
      before: '["none","default","low","medium","high"]'
      after: '["none","default","minimal","low","medium","high","xhigh","max"]'
    - path: components.schemas.CreateChatCompletionRequest.properties.reasoning_effort.description
      before: |
        qwen3 models support `none` to disable reasoning and `default` or null
        to use the model default.

        qwen/qwen3.8-27b additionally supports `low`, `medium`, and `high`.
        Its default is `none`; `high` selects the model's native `xhigh` mode.

        openai/gpt-oss-20b and openai/gpt-oss-120b support 'low', 'medium', or 'high'.
        'medium' is the default value.
      after: |
        qwen3 models support `none` to disable reasoning and `default` or null
        to use the model default.

        qwen/qwen3.8-27b additionally supports `low`, `medium`, and `high`.
        Its default is `none`; `high` selects the model's native `xhigh` mode.

        openai/gpt-oss-20b and openai/gpt-oss-120b support 'low', 'medium', or 'high'.
        'medium' is the default value.

        t6 models support `low`, `medium`, `high`, and `max`.

        Values outside a model's supported set are rejected with a 400.
