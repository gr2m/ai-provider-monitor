- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated reasoning_effort description to clarify model-specific support (including qwen/qwen3.8-27b defaults and modes).
  paths:
    - path: components.schemas.CreateChatCompletionRequest.properties.reasoning_effort.description
      before: |
        qwen3 models support the following values
        Set to 'none' to disable reasoning.
        Set to 'default' or null to let Qwen reason.

        openai/gpt-oss-20b and openai/gpt-oss-120b support 'low', 'medium', or 'high'.
        'medium' is the default value.
      after: |
        qwen3 models support `none` to disable reasoning and `default` or null
        to use the model default.

        qwen/qwen3.8-27b additionally supports `low`, `medium`, and `high`.
        Its default is `none`; `high` selects the model's native `xhigh` mode.

        openai/gpt-oss-20b and openai/gpt-oss-120b support 'low', 'medium', or 'high'.
        'medium' is the default value.
  date: '2026-08-25'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/943
