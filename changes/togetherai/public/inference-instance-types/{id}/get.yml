  paths:
    - path: components.schemas.DE.CompliancePolicy
      before: 'null'
      after: '{"description":"Compliance regimes required by a deployment placement policy.","properties":{"hipaa":{"description":"Restrict placement to HIPAA-attested clusters.","type":"boolean"}},"type":"object"}'
