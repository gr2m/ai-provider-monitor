- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduced new schema DE.ComplianceAvailability for compliance-specific headroom entries.
  paths:
    - path: components.schemas.DE.ComplianceAvailability
      before: 'null'
      after: '{"description":"Compliance-specific regional availability for one instance type policy.","properties":{"headroom":{"allOf":[{"$ref":"#/components/schemas/DE.Headroom"}],"description":"Best-effort replica headroom on clusters certified for at least this policy."},"policy":{"allOf":[{"$ref":"#/components/schemas/DE.CompliancePolicy"}],"description":"Compliance regimes certified by the clusters counted in this entry."}},"required":["policy","headroom"],"type":"object"}'
  date: '2026-09-25'
