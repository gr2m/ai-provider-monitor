- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified DE.Region.headroom description to specify it is across all clusters; references new compliance-scoped headroom.
  paths:
    - path: components.schemas.DE.Region.properties.headroom.description
      before: Best-effort replica headroom for this region. Omitted when unavailable.
      after: Best-effort replica headroom across every cluster in this region, attested or not. Read `compliance` for compliance-scoped headroom. Omitted when unavailable.
  date: '2026-09-25'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1058
