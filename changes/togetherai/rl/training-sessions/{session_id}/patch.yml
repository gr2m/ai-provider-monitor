- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduced RL.SessionPolicyState schema (tracks applied/target weights versions, trainer_step, pending_publish).
  paths:
    - path: components/schemas/RL.SessionPolicyState
      before: 'null'
      after: '{"description":"Session-scoped policy and weight versions. Comparable to `policy_segments[].version` on sample results. Resets if the session is resumed or its training runtime restarts.","properties":{"applied_weights_version":{"description":"Policy version successfully applied to the generator for this session.","example":"6"},"pending_publish":{"description":"True when a generator publish has been requested but has not finished.","example":true},"target_weights_version":{"description":"Policy version promised to the generator by the latest weights-sync.","example":"7"},"trainer_step":{"description":"Policy version produced by the last completed optimizer step. Distinct from `TrainingSession.step`, which is the durable optimizer-step counter.","example":"7"}},"required":["trainer_step","target_weights_version","applied_weights_version","pending_publish"],"type":"object"}'
  date: '2026-08-31'
