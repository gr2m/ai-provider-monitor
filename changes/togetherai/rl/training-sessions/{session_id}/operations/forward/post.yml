- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /rl/training-sessions/{session_id}/operations/forward to submit an async no-grad forward pass that returns per-sample per-token log-probabilities via an operation result.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/933
