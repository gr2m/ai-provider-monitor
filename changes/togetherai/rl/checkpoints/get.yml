- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional query parameter `type` to filter by checkpoint type (training or inference).
  paths:
    - path: parameters[4]
      before: 'null'
      after: '{"in":"query","name":"type","required":false,"schema":{"description":"Only return checkpoints of this type. CHECKPOINT_TYPE_TRAINING is the full training state (weights and optimizer state), for resuming a training session with its optimizer state; CHECKPOINT_TYPE_INFERENCE is a model ready for serving or download, also added to your models. When set, it must be CHECKPOINT_TYPE_TRAINING or CHECKPOINT_TYPE_INFERENCE; when omitted, checkpoints of both types are returned.","enum":["CHECKPOINT_TYPE_TRAINING","CHECKPOINT_TYPE_INFERENCE"],"type":"string"}}'
  date: '2026-10-08'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Endpoint now returns both training and inference checkpoints (previously training only) and specifies newest-first ordering.
  paths:
    - path: description
      before: Lists training checkpoints owned by the caller. Filter by session or base model to recover a checkpoint ID for resume. Inference checkpoints are not included; they remain on the training session and in the model catalog.
      after: Lists training and inference checkpoints owned by the caller, newest first. Filter by type, session, or base model, for example to recover a checkpoint ID for resume.
    - path: responses.200.description
      before: List of training checkpoints
      after: List of checkpoints
  date: '2026-10-08'
- change: added
  target: response
  breaking: false
  deprecated: false
