      before: 'null'
      after: '{"$ref":"#/components/schemas/RL.InferenceCheckpointRegistration","description":"Model registry artifacts to deploy or download this inference checkpoint from. Absent for training checkpoints and when the checkpoint was not uploaded to the registry."}'
  date: '2026-10-08'
- change: added
