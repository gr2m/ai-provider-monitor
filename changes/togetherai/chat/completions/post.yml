- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified descriptions for context length behavior, echo, logprobs, and stop.
  paths:
    - path: components.schemas.ChatCompletionRequest.properties.context_length_exceeded_behavior.description
      before: Defined the behavior of the API when max_tokens exceed the maximum context length of the model. When set to 'error', API will return 400 with appropriate error message. When set to 'truncate', override the max_tokens with maximum context length of the model.
      after: Defines the behavior of the API when max_tokens exceed the maximum context length of the model. When set to 'error', the API returns 400 with an appropriate error message. When set to 'truncate', overrides max_tokens with the maximum context length of the model.
    - path: components.schemas.ChatCompletionRequest.properties.echo.description
      before: If true, the response will contain the prompt. Can be used with `logprobs` to return prompt logprobs.
      after: If true, the response contains the prompt. Can be used with `logprobs` to return prompt logprobs.
    - path: components.schemas.ChatCompletionRequest.properties.logprobs.description
      before: An integer between 0 and 20 of the top k tokens to return log probabilities for at each generation step, instead of just the sampled token. Log probabilities help assess model confidence in token predictions.
      after: An integer between 0 and 20 of the top k tokens to return log probabilities for at each generation step, instead of only the sampled token. Log probabilities help assess model confidence in token predictions.
    - path: components.schemas.ChatCompletionRequest.properties.stop.description
      before: A list of string sequences that will truncate (stop) inference text output. For example, "</s>" will stop generation as soon as the model generates the given token.
      after: A list of string sequences that truncate (stop) inference text output. For example, "</s>" stops generation as soon as the model generates the given token.
  date: '2026-08-24'
