- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds PATCH /projects/{projectId}/endpoints/{id} to update mutable endpoint fields (name, visibility, trafficSplit) using updateMask and etag for optimistic concurrency; returns the updated endpoint.
