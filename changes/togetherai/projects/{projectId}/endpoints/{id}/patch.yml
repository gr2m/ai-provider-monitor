- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: ScalingMetric.name is now restricted to an enum allowlist of valid metrics; previously any string was allowed.
  paths:
    - path: components/schemas/DE.ScalingMetric/properties/name/enum
      before: 'null'
      after: '["cache_hit_rate","decoding_speed","e2e_latency","gpu_utilization","inflight_requests","throughput_per_replica","token_utilization","ttft"]'
    - path: components/schemas/DE.ScalingMetric/properties/name/description
      before: Metric name, such as `gpu_utilization`, `ttft`, `inflight_requests`, `e2e_latency`, `throughput_per_replica`, or `decoding_speed`.
      after: Autoscaling metric name from the server allowlist.
  date: '2026-08-31'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/977
