- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /projects/{projectId}/endpoints/{endpointId}/rollouts/{id}/pause to request pausing a running or stabilizing rollout with optional etag and reason; returns a DE.Rollout in PAUSING and clients should poll GetRollout until PAUSED.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/933
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: DE.Rollout schema description clarified to include runtime progress and pause/abort reason.
  paths:
    - path: components/schemas/DE.Rollout/description
      before: Public view of a rollout resource and its embedded runtime status.
      after: Public view of a rollout resource, including runtime progress and any pause or abort reason.
  date: '2026-08-31'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/977
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: pauseInfo description now notes it is cleared after resume or abort.
  paths:
    - path: components/schemas/DE.Rollout/properties/pauseInfo/description
      before: Output only. Why and when the rollout was paused. Set while a pause is pending or effective (PAUSING, PAUSED, or SYSTEM_PAUSED); while PAUSING, pausedAt records when the pause was requested.
      after: Output only. Why and when the rollout was paused. Set while a pause is pending or effective (PAUSING, PAUSED, or SYSTEM_PAUSED) and cleared after resume or abort; while PAUSING, pausedAt records when the pause was requested.
  date: '2026-08-31'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/977
