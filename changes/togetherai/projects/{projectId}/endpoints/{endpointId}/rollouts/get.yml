- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Expanded DE.RolloutStepStatus.state enum with PAUSED, CANCELED, and SKIPPED values.
  paths:
    - path: components.schemas.DE.RolloutStepStatus.properties.state.enum
      before: '["ROLLOUT_STEP_STATE_PENDING","ROLLOUT_STEP_STATE_RUNNING","ROLLOUT_STEP_STATE_PASSED","ROLLOUT_STEP_STATE_FAILED"]'
      after: '["ROLLOUT_STEP_STATE_PENDING","ROLLOUT_STEP_STATE_RUNNING","ROLLOUT_STEP_STATE_PASSED","ROLLOUT_STEP_STATE_FAILED","ROLLOUT_STEP_STATE_PAUSED","ROLLOUT_STEP_STATE_CANCELED","ROLLOUT_STEP_STATE_SKIPPED"]'
  date: '2026-09-09'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified descriptions for rollout step timestamps/state and metric results, including notes on synthesized UNAVAILABLE metrics when no observation is recorded.
  paths:
    - path: components.schemas.DE.RolloutCondition.properties.metrics.description
      before: Metrics observed at the failing gate, enriched with their criteria.
      after: Metrics observed at the failing gate, enriched with their criteria. Unmeasured rules appear as synthesized rows with verdict METRIC_VERDICT_UNAVAILABLE and no measured values.
    - path: components.schemas.DE.RolloutStepStatus.properties.completedAt.description
      before: Timestamp when this step completed.
      after: Timestamp when this step finished, was skipped over, or the rollout ended on it. Unset while in progress.
    - path: components.schemas.DE.RolloutStepStatus.properties.failureReason.description
      before: Failure reason when this step failed.
      after: Failure reason set only when this step failed.
    - path: components.schemas.DE.RolloutStepStatus.properties.metrics.description
      before: Metric gate results for this step.
      after: Metric gate results for this step, enriched with criteria and verdict. Unmeasured rules appear as synthesized rows with verdict METRIC_VERDICT_UNAVAILABLE and no measured values.
    - path: components.schemas.DE.RolloutStepStatus.properties.startedAt.description
      before: Timestamp when this step started.
      after: Timestamp when this step's first sub-step ran. Unset for steps no sub-step reached.
    - path: components.schemas.DE.RolloutStepStatus.properties.state.description
      before: Execution state of this rollout step.
      after: Outcome of this step. Finished steps are PASSED, the live step mirrors the rollout state, skipped-over steps are SKIPPED, and unreached steps are PENDING.
    - path: components.schemas.DE.MetricResult.description
      before: Observed metric value enriched with its rollout rule and verdict.
      after: Observed metric result enriched with rollout rule criteria and verdict. Unmeasured rules are synthesized with verdict METRIC_VERDICT_UNAVAILABLE and no source or target value.
    - path: components.schemas.DE.MetricResult.properties.sourceValue.description
      before: Observed source baseline. Set only for regression checks; a 0 reading serializes explicitly.
      after: Observed source baseline. Set only for regression checks with a recorded observation; a 0 reading serializes explicitly.
    - path: components.schemas.DE.MetricResult.properties.targetValue.description
      before: Observed target value. A 0 reading serializes explicitly.
      after: Observed target value. Set when the gate recorded an observation; absent on synthesized unavailable results. A 0 reading serializes explicitly.
  date: '2026-09-09'
