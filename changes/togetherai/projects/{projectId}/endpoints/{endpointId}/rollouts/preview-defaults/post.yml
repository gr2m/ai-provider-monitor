  note: Expanded DE.ThresholdCheck.value description (finite, units per metric, create-time validation).
  paths:
    - path: components/schemas/DE.ThresholdCheck/properties/value/description
      before: Required numeric threshold value.
      after: |-
        Required finite threshold value. Interpreted in the metric's unit:
        router_error_rate is a ratio in [0, 1], router_latency is
        milliseconds, and inflight_requests is a raw count. Thresholds that
        no achievable value could pass, or that every achievable value
        passes, are rejected at create.
