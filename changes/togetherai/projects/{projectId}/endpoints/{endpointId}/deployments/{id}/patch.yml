- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds PATCH /projects/{projectId}/endpoints/{endpointId}/deployments/{id} to update mutable deployment settings (model, config, autoscaling, LoRA). May trigger async reprovisioning; supports updateMask and etag.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/933
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: false
  note: Autoscaling metric name is now constrained to an enum allowlist; arbitrary names are no longer accepted.
  paths:
    - path: components/schemas/DE.ScalingMetric/properties/name
      before: '{"type":"string","description":"Metric name, such as `gpu_utilization`, `ttft`, `inflight_requests`, `e2e_latency`, `throughput_per_replica`, or `decoding_speed`."}'
      after: '{"type":"string","description":"Autoscaling metric name from the server allowlist.","enum":["cache_hit_rate","decoding_speed","e2e_latency","gpu_utilization","inflight_requests","throughput_per_replica","token_utilization","ttft"]}'
  date: '2026-08-31'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/977
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Autoscaling metric name in responses is now an enum allowlist; only listed values will appear.
  paths:
    - path: components/schemas/DE.ScalingMetric/properties/name
      before: '{"type":"string","description":"Metric name, such as `gpu_utilization`, `ttft`, `inflight_requests`, `e2e_latency`, `throughput_per_replica`, or `decoding_speed`."}'
      after: '{"type":"string","description":"Autoscaling metric name from the server allowlist.","enum":["cache_hit_rate","decoding_speed","e2e_latency","gpu_utilization","inflight_requests","throughput_per_replica","token_utilization","ttft"]}'
  date: '2026-08-31'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/977
