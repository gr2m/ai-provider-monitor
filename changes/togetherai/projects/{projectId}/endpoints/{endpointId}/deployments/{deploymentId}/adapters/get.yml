- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds GET /projects/{projectId}/endpoints/{endpointId}/deployments/{deploymentId}/adapters to list LoRA adapters on a deployment with per-cluster load state; supports pagination via limit and after.
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/933
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added new 'id' field to DE.AdapterEntry and marked it as required.
  paths:
    - path: components/schemas/DE.AdapterEntry/properties/id
      before: 'null'
      after: '{"description":"Row identifier for this adapter attachment; changes if the adapter is removed and re-added.","type":"string"}'
    - path: components/schemas/DE.AdapterEntry/required
      before: '["adapterModelId","desiredRevisionId","perCluster","etag"]'
      after: '["adapterModelId","desiredRevisionId","perCluster","etag","id"]'
  date: '2026-10-08'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: 'Added optional validation fields to DE.DeploymentAdapterStatus: ''adapterValid'' and ''adapterValidReason''.'
  paths:
    - path: components/schemas/DE.DeploymentAdapterStatus/properties/adapterValid
      before: 'null'
      after: '{"description":"Optional inference-probe verdict for this adapter on this cluster; absent until validation concludes.","type":"boolean"}'
    - path: components/schemas/DE.DeploymentAdapterStatus/properties/adapterValidReason
      before: 'null'
      after: '{"description":"Human-readable probe rejection detail when adapterValid is false.","type":"string"}'
  date: '2026-10-08'
