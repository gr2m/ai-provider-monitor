- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduced new schema DE.ScalingRules for autoscaling rate-limit configuration.
  paths:
    - path: components/schemas/DE.ScalingRules
      before: 'null'
      after: '{"description":"Rate limits applied after stabilization and before replica bounds.","example":{"policies":[{"periodSeconds":60,"type":"SCALING_POLICY_TYPE_PERCENT","value":25},{"periodSeconds":60,"type":"SCALING_POLICY_TYPE_PODS","value":10}],"selectPolicy":"SCALING_POLICY_SELECT_MIN"},"properties":{"policies":{"description":"Non-empty lists replace the existing policies. To clear policies, include\n`autoscaling.scaleDown.policies` or `autoscaling.scaleUp.policies` in the update mask\nand supply an empty scaling rules object or `policies: []`.","items":{"$ref":"#/components/schemas/DE.ScalingPolicy"},"type":"array"},"selectPolicy":{"description":"`SCALING_POLICY_SELECT_MIN` chooses the policy allowing the smallest replica change;\n`SCALING_POLICY_SELECT_MAX` chooses the largest. These are caps, not guaranteed changes.\n`SCALING_POLICY_SELECT_DISABLED` holds this direction steady while replica bounds still apply.\nOmitted preserves the existing selector on update. When no selector is configured,\nauthored policies use MAX; with no policies configured, the platform defaults apply.\nTo reset the selector, include `autoscaling.scaleDown.selectPolicy` or\n`autoscaling.scaleUp.selectPolicy` in the update mask and omit `selectPolicy`.\nClear both policies and `selectPolicy` to restore inherited defaults.","enum":["SCALING_POLICY_SELECT_MAX","SCALING_POLICY_SELECT_MIN","SCALING_POLICY_SELECT_DISABLED"],"type":"string"}},"type":"object"}'
  date: '2026-09-22'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduced new schema DE.ScalingPolicy used by DE.ScalingRules.
  paths:
    - path: components/schemas/DE.ScalingPolicy
      before: 'null'
      after: '{"description":"Replica rate-limit policy applied over a trailing window.","properties":{"periodSeconds":{"description":"Trailing rate-limit window in seconds, from 1 to 1800.","maximum":1800,"minimum":1,"type":"integer"},"type":{"description":"Whether `value` is a replica count or a percentage of the replica count at the start\nof the trailing period. Scaling events within that period count against the allowance;\npercentages are rounded to whole replicas.","enum":["SCALING_POLICY_TYPE_PODS","SCALING_POLICY_TYPE_PERCENT"],"type":"string"},"value":{"description":"Positive replica count or percentage used as the rate-limit amount.","maximum":2147483647,"minimum":1,"type":"integer"}},"required":["type","value","periodSeconds"],"type":"object"}'
  date: '2026-09-22'
