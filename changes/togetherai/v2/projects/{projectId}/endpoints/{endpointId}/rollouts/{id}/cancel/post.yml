  deprecated: false
  doc_only: false
  note: Removed POST /v2/projects/{projectId}/endpoints/{endpointId}/rollouts/{id}/cancel, which canceled a running/paused rollout by freezing the current traffic split and returned the accepted rollout snapshot.
  paths: []
  date: '2026-10-21'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1132
- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: New endpoint POST /v2/projects/{projectId}/endpoints/{endpointId}/rollouts/{id}/cancel cancels a running/pausing/paused/system-paused/stabilizing rollout by freezing the current traffic split into standing weights. Requires a reason; optional etag for concurrency; optional disposition defaults to freeze (REVERT is rejected). Returns the accepted rollout snapshot; poll GetRollout until state is CANCELED.
  paths: []
  date: '2026-10-21'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1133
