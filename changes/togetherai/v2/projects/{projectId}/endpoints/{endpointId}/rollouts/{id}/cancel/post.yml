  note: Introduces POST /v2/projects/{projectId}/endpoints/{endpointId}/rollouts/{id}/cancel to cancel an in-progress rollout (RUNNING/PAUSING/PAUSED/SYSTEM_PAUSED/STABILIZING) by freezing the current traffic split. Request requires a human-readable reason; optional etag for concurrency and optional disposition (REVERT is removed and rejected). Returns the accepted rollout snapshot; poll GetRollout until it reaches CANCELED.
