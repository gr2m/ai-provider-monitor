  paths:
    - path: components/schemas/DE.CreateRolloutRequest/properties/maxUnavailable
      before: 'null'
      after: '{"type":"integer","minimum":0,"maximum":1000,"description":"Count of source replicas that may be missing or retired ahead of their replacements at any one time..."}'
  date: '2026-11-13'
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description of finalTargetReplicas to clarify rolling behavior (ladder climbs one replica per rung).
  paths:
    - path: components/schemas/DE.CreateRolloutRequest/properties/finalTargetReplicas/description
      before: Optional target replica floor at completion. Must be at least 1 when set; defaults to the source deployment's replica count at create time, or to the source and target deployments' combined replica count when both already stand in the endpoint traffic split after a cancel. The completed target's autoscaling max lands at the landing ceiling, max(this value, the source max, the target's own max); the rollout may lift the target max at first wake, at the first step that needs it, or at completion unless an operator changes max mid-run. The lifted ceiling remains after completion, and PreviewRolloutDefaults reports a coming lift as ROLLOUT_WILL_RAISE_TARGET_MAX. A pre-existing target whose own autoscaling min is higher keeps that floor, reported as FINAL_BELOW_INHERITED_MIN. A target that starts stopped lands exactly at this value; if the source min was higher, PreviewRolloutDefaults reports FINAL_BELOW_SOURCE_MIN.
      after: Optional target replica floor at completion. For rolling, the ladder climbs to this count one replica per rung. Must be at least 1 when set; defaults to the source deployment's replica count at create time, or to the source and target deployments' combined replica count when both already stand in the endpoint traffic split after a cancel. The completed target's autoscaling max lands at the landing ceiling, max(this value, the source max, the target's own max); the rollout may lift the target max at first wake, at the first step that needs it, or at completion unless an operator changes max mid-run. The lifted ceiling remains after completion, and PreviewRolloutDefaults reports a coming lift as ROLLOUT_WILL_RAISE_TARGET_MAX. A pre-existing target whose own autoscaling min is higher keeps that floor, reported as FINAL_BELOW_INHERITED_MIN. A target that starts stopped lands exactly at this value; if the source min was higher, PreviewRolloutDefaults reports FINAL_BELOW_SOURCE_MIN.
  date: '2026-11-13'
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Reworded DE.RollingConfig description to emphasize one-replica-per-rung ramp-up.
  paths:
    - path: components/schemas/DE.RollingConfig/description
      before: Rolling strategy configuration for small batches that ramp target replicas up while shrinking source replicas to what their remaining traffic share needs.
      after: Rolling strategy configuration. The target ramps up one replica per rung while the source shrinks to what its remaining traffic share needs.
  date: '2026-11-13'
