- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional canary-only field maxSurge (int 1–1000) to limit target-replica increases per step.
  paths:
    - path: components/schemas/DE.CreateRolloutRequest/properties/maxSurge
      before: 'null'
