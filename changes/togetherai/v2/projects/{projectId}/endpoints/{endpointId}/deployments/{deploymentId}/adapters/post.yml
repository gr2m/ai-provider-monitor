- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v2/projects/{projectId}/endpoints/{endpointId}/deployments/{deploymentId}/adapters to attach a LoRA adapter to a deployment; supports optional force to evict the oldest adapter if at capacity and returns the attached adapter entry with per-cluster load state.
  paths: []
  date: '2026-10-21'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1133
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added servingState enum property to DE.AdapterEntry and made it required.
  paths:
    - path: components.schemas.DE.AdapterEntry.properties.servingState
      before: 'null'
      after: '{"description":"Whether the adapter can serve requests right now. INACTIVE means the deployment is stopped, scaled to zero, or being torn down; LOADING means a placed cluster has not finished loading it; READY means every placed cluster serves it; FAILED means a placed cluster failed to load it.","enum":["ADAPTER_SERVING_STATE_INACTIVE","ADAPTER_SERVING_STATE_LOADING","ADAPTER_SERVING_STATE_READY","ADAPTER_SERVING_STATE_FAILED"],"readOnly":true,"type":"string"}'
    - path: components.schemas.DE.AdapterEntry.required
      before: '["adapterModelId","desiredRevisionId","perCluster","etag","id"]'
      after: '["adapterModelId","desiredRevisionId","perCluster","etag","id","servingState"]'
  date: '2026-11-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Clarified DE.AdapterEntry.perCluster description about placement and empty cases.
  paths:
    - path: components.schemas.DE.AdapterEntry.properties.perCluster.description
      before: Per-cluster adapter load state reported by the controller.
      after: Per-cluster adapter load state reported by the controller for the clusters the deployment is placed on. Empty while the deployment is stopped or being torn down, and briefly after AddAdapter.
  date: '2026-11-24'
