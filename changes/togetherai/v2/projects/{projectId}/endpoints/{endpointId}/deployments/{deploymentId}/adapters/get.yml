- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description of perCluster to clarify reporting only for placed clusters and when it may be empty.
  paths:
    - path: components/schemas/DE.AdapterEntry/properties/perCluster/description
      before: Per-cluster adapter load state reported by the controller.
      after: Per-cluster adapter load state reported by the controller for the clusters the deployment is placed on. Empty while the deployment is stopped or being torn down, and briefly after AddAdapter.
