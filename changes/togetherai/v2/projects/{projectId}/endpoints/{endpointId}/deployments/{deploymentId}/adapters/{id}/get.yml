- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added servingState field to DE.AdapterEntry indicating current serving readiness/state.
  paths:
    - path: components/schemas/DE.AdapterEntry/properties/servingState
      before: 'null'
      after: '{"description":"Whether the adapter can serve requests right now. INACTIVE means the deployment is stopped, scaled to zero, or being torn down; LOADING means a placed cluster has not finished loading it; READY means every placed cluster serves it; FAILED means a placed cluster failed to load it.","enum":["ADAPTER_SERVING_STATE_INACTIVE","ADAPTER_SERVING_STATE_LOADING","ADAPTER_SERVING_STATE_READY","ADAPTER_SERVING_STATE_FAILED"],"readOnly":true,"type":"string"}'
  date: '2026-11-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1281
