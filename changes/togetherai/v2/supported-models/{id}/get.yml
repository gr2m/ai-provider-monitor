- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduced new schema DE.SupportedModelUnitPrice referenced by unitPrices.
  paths:
    - path: components/schemas/DE.SupportedModelUnitPrice
      before: 'null'
      after: '{"description":"Serverless display price in USD per one non-token unit on one request tier.","properties":{"priceUsd":{"description":"Price in USD per one unit.","format":"double","type":"number"},"tier":{"description":"Request tier the price applies to, such as synchronous HTTP, batch, or streaming realtime sessions.","enum":["PRICING_TIER_STANDARD","PRICING_TIER_BATCH","PRICING_TIER_REALTIME"],"type":"string"},"unit":{"description":"Billing unit, either one minute of input audio (speech-to-text) or one million input characters (text-to-speech).","enum":["PRICING_UNIT_AUDIO_MINUTE","PRICING_UNIT_MILLION_CHARACTERS"],"type":"string"}},"required":["unit","tier","priceUsd"],"type":"object"}'
  date: '2026-11-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1281
