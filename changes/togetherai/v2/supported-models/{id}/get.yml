  note: Added unitPrices array to DE.SupportedModel to expose non-token serverless pricing tiers/units.
  paths:
    - path: components/schemas/DE.SupportedModel/properties/unitPrices
      before: 'null'
      after: '{"description":"Serverless prices for usage not measured in tokens, such as minutes of transcribed audio or characters of synthesized speech, ordered by unit then tier. Empty when none are curated; a model priced the same on every tier lists only `PRICING_TIER_STANDARD`.","items":{"$ref":"#/components/schemas/DE.SupportedModelUnitPrice"},"readOnly":true,"type":"array"}'
