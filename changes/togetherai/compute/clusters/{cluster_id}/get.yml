      before: 'null'
      after: '{"type":"string","enum":["RESERVED","ON_DEMAND","SCHEDULED_CAPACITY"],"description":"Billing type for the cluster (RESERVED, ON_DEMAND, or SCHEDULED_CAPACITY)."}'
