      before: 'null'
      after: '{"type":"array","items":{"$ref":"#/components/schemas/GPUClusterGPUWorkerNode"},"description":"GPU worker nodes retained after they left the live data plane. These are separate from gpu_worker_nodes and must not be counted as live capacity."}'
