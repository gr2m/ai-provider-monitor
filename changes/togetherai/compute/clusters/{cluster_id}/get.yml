      after: '{"type":"integer","format":"int32","description":"Number of prepaid reserved GPUs for this cluster. A component of the overall num_gpus, alongside num_capacity_pool_gpus."}'
    - path: components/schemas/GPUClusterInfo/properties/nvidia_driver_version_id
