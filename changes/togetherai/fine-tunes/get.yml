- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated descriptions for several fields (user_id, max_seq_length, LoRA config, and SFT train_on_inputs).
  paths:
    - path: components/schemas/FinetuneResponseTruncated/properties/user_id/description
      before: Identifier for the user who created the job
      after: ID of the user who created the fine-tune job.
    - path: components/schemas/FinetuneResponseTruncated/properties/max_seq_length/description
      before: Maximum sequence length to use for training.
      after: Maximum sequence length to use for training. If not specified, uses the maximum allowed for the model and training method.
    - path: components/schemas/TrainingMethodSFT/properties/train_on_inputs/description
      before: Whether to mask the user messages in conversational data or prompts in instruction data.
      after: Whether to mask user messages in conversational data or prompts in instruction data.
    - path: components/schemas/LoRATrainingType/description
      before: 'null'
      after: LoRA training configuration for a fine-tuning job.
    - path: components/schemas/LoRATrainingType/properties/lora_alpha/description
      before: 'null'
      after: Scaling factor applied to the LoRA adapter weights.
    - path: components/schemas/LoRATrainingType/properties/lora_dropout/description
      before: 'null'
      after: Dropout probability applied to LoRA adapter inputs.
    - path: components/schemas/LoRATrainingType/properties/lora_r/description
      before: 'null'
      after: Rank of the LoRA adapter matrices.
    - path: components/schemas/LoRATrainingType/properties/lora_trainable_modules/description
      before: 'null'
      after: Comma-separated LoRA target modules. Use `all-linear` for model defaults; MoE expert modules (`w_up`, `w_gate`, `w_down`) can be combined with attention modules on compatible models. Fine-tunes that target any expert module produce adapter-only output.
    - path: components/schemas/LoRATrainingType/properties/type/description
      before: 'null'
      after: Identifies this request as a LoRA fine-tune.
  date: '2026-08-24'
