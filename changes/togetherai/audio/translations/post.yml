- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: 400 BadRequest description expanded with specific error codes and limits.
  paths:
    - path: responses/400/description
      before: BadRequest
      after: BadRequest. Possible error codes include `audio_too_long` (audio duration exceeds the 4 hour cap), `file_too_large` (URL-fetched audio exceeds the 1 GB server-side cap), `unsupported_format` (codec or container could not be decoded), and `invalid_params` (request parameters failed validation).
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/933
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added 413 Payload Too Large response for uploads exceeding 80 MB; advises using HTTPS URL instead.
  paths:
    - path: responses/413
      before: 'null'
      after: Payload Too Large. The request body exceeded the 80 MB direct-upload limit. For larger payloads, host the file and submit an HTTPS URL via the `file` field (URL-fetched audio is capped at 1 GB server-side).
    - path: responses/413/content/text/html/schema/type
      before: 'null'
      after: string
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/933
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: 'Updated `file` field docs: expanded supported formats (.ogg, .opus, .aac), documented 4h duration cap, 80 MB upload and 1 GB URL limits; clarified HTTPS for URL uploads.'
  paths:
    - path: components/schemas/AudioTranslationRequest/properties/file/description
      before: Audio file upload or public HTTP/HTTPS URL. Supported formats .wav, .mp3, .m4a, .webm, .flac.
      after: 'Audio file upload or public HTTP/HTTPS URL. Supported formats: .wav, .mp3, .m4a, .webm, .flac, .ogg, .opus, .aac. Maximum duration 4 hours; longer audio is rejected with `audio_too_long`. Binary uploads are additionally capped at 80 MB (HTTP 413); URL-fetched audio is capped at 1 GB.'
    - path: components/schemas/AudioTranslationRequest/properties/file/oneOf/0/description
      before: Audio file to translate
      after: Audio file uploaded as binary. Maximum upload size 80 MB (requests above this are rejected with HTTP 413). For larger payloads, host the file and submit a URL instead.
    - path: components/schemas/AudioTranslationRequest/properties/file/oneOf/1/description
      before: Public HTTP/HTTPS URL to audio file
      after: Public HTTPS URL the server fetches the audio from. Server-side fetch limit is 1 GB; downloads exceeding the cap fail with `file_too_large`.
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/933
