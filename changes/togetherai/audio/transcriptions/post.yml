- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Expanded 400 BadRequest description to enumerate specific error codes and causes.
  paths:
    - path: responses/400/description
      before: BadRequest
      after: BadRequest. Possible error codes include `audio_too_long` (audio duration exceeds the 4 hour cap), `file_too_large` (URL-fetched audio exceeds the 1 GB server-side cap), `unsupported_format` (codec or container could not be decoded), and `invalid_params` (request parameters failed validation).
  date: '2026-08-24'
- change: added
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Added 413 Payload Too Large response with text/html body for oversized direct uploads.
  paths:
    - path: responses/413
      before: 'null'
      after: '{"content":{"text/html":{"schema":{"type":"string"}}},"description":"Payload Too Large. The request body exceeded the 80 MB direct-upload limit. For larger payloads, host the file and submit an HTTPS URL via the `file` field (URL-fetched audio is capped at 1 GB server-side)."}'
  date: '2026-08-24'
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: 'Clarified file input: added supported formats (.ogg, .opus, .aac) and size/duration limits.'
  paths:
    - path: components/schemas/AudioTranscriptionRequest/properties/file/description
      before: Audio file upload or public HTTP/HTTPS URL. Supported formats .wav, .mp3, .m4a, .webm, .flac.
      after: 'Audio file upload or public HTTP/HTTPS URL. Supported formats: .wav, .mp3, .m4a, .webm, .flac, .ogg, .opus, .aac. Maximum duration 4 hours; longer audio is rejected with `audio_too_long`. Binary uploads are additionally capped at 80 MB (HTTP 413); URL-fetched audio is capped at 1 GB.'
  date: '2026-08-24'
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: 'Clarified prompt applicability: only Whisper-family models use it; others ignore.'
  paths:
    - path: components/schemas/AudioTranscriptionRequest/properties/prompt/description
      before: Optional text to bias decoding.
      after: Optional text to bias decoding. Supported only on Whisper-family models (e.g. `openai/whisper-large-v3`). Other STT models (e.g. `nvidia/parakeet-tdt-0.6b-v3`) accept the field for API compatibility but ignore it.
  date: '2026-08-24'
