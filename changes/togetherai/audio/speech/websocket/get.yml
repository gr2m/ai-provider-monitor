- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional 'language' query parameter (ISO 639-1 or locale; default 'en').
  paths:
    - path: $.parameters[?name=language]
      before: 'null'
      after: '{"in":"query","name":"language","required":false,"schema":{"default":"en","description":"Language or locale of input text. Accepts ISO 639-1 language codes (e.g., `en`, `fr`, `es`, `zh`) as well as locale codes for region-specific variants. Locale codes must be lowercase (e.g., `zh-hk` for Cantonese). Can also be set via `tts_session.updated` event.\n","example":"en","type":"string"}}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: true
  deprecated: false
  doc_only: false
  note: Audio chunks format changed from WAV (PCM) to raw PCM (s16le, mono); still base64 per delta.
  paths:
    - path: $.description
      before: '- Format: WAV (PCM s16le)'
      after: '- Format: Raw PCM (s16le, mono)'
    - path: $.description
      before: '- Encoding: Base64'
      after: '- Encoding: Base64 (per delta event)'
  date: '2026-08-24'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: tts_session.updated now accepts extra_params (e.g., pronunciation_dict) to fine-tune speech.
  paths:
    - path: $.description
      before: '{"type": "tts_session.updated","session": {"voice": "tara"}}'
      after: '{"type": "tts_session.updated","session": {"voice": "tara","extra_params": {"pronunciation_dict": ["omg/oh my god"]}}}'
  date: '2026-08-24'
- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Docs updated to include 'language' in the list of query parameters under Connection Setup.
  paths:
    - path: $.description
      before: '- Parameters: Sent as query parameters (model, voice, max_partial_length)'
      after: '- Parameters: Sent as query parameters (model, voice, max_partial_length, language)'
  date: '2026-08-24'
