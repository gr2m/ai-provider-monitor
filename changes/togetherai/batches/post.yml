- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Expanded description for CreateBatchRequest.endpoint with detailed supported endpoints and behavior
  paths:
    - path: $.components.schemas.CreateBatchRequest.properties.endpoint.description
      before: The endpoint to use for batch processing
      after: |
        The endpoint to use for batch processing. Each line of the uploaded input file is dispatched against this endpoint.
        - `/v1/chat/completions` — chat completion batches
        - `/v1/audio/transcriptions` — audio transcription batches (e.g. `openai/whisper-large-v3`)
        - `/v1/audio/translations` — audio translation batches
  date: '2026-08-24'
