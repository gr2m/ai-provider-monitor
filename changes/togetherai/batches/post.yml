- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /batches to create a batch job from an uploaded input file targeting a specified endpoint (/v1/chat/completions, /v1/audio/transcriptions, or /v1/audio/translations). Requires endpoint and input_file_id (optional model_id, completion_window, priority). Returns 201 with job details (and optional warning); 400/401/429/500 on errors; bearer auth.
