- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional inactive_timeout to configure auto-stop/expiry behavior for model resources.
  paths:
    - path: requestBody/content/application/json/schema/properties/inactive_timeout
      before: 'null'
      after: '{"default":3600,"description":"Seconds without activity after which the resource stops and its sessions expire, counted from when it becomes ready and from its last activity. Every operation on any of its sessions restarts the count, and an extend expiry call can keep it up longer.","example":3600,"maximum":86400,"minimum":300,"type":"integer"}'
  date: '2026-10-28'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Response now includes expires_at timestamp indicating earliest inactivity stop/expiry time.
  paths:
    - path: responses/200/content/application/json/schema/properties/expires_at
      before: 'null'
      after: '{"description":"The earliest time the resource can stop for inactivity, which also expires its sessions. It is the resource''s last activity plus `inactive_timeout` seconds. Becoming ready, a session start and every operation on any of its sessions count as activity, and the resource does not stop while an operation is running. An extend expiry call can move it later. It never moves earlier. Refreshed about once a minute. Set while the resource is ready.","example":"2026-01-02T01:00:05Z","format":"date-time","type":"string"}'
  date: '2026-10-28'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Response now includes inactive_timeout reflecting the configured inactivity auto-stop window.
  paths:
    - path: responses/200/content/application/json/schema/properties/inactive_timeout
      before: 'null'
      after: '{"description":"Seconds without activity after which the resource stops and its sessions expire. Every operation on any of its sessions restarts the count.","example":3600,"type":"integer"}'
  date: '2026-10-28'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: inactive_timeout added to the required fields of RL.ModelResources.
  paths:
    - path: responses/200/content/application/json/schema/required
      before: '["id","status","status_details","base_model","compute_config","lora_enabled","created_at","updated_at","optimizer_config","created_by"]'
      after: '["id","status","status_details","base_model","compute_config","lora_enabled","created_at","updated_at","optimizer_config","created_by","inactive_timeout"]'
  date: '2026-10-28'
