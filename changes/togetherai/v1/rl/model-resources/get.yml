  note: Added inactive_timeout to RL.ModelResources (seconds until idle stop).
  paths:
    - path: $.components.schemas.RL.ModelResources.properties.inactive_timeout
      before: 'null'
      after: '{"description":"Seconds without activity after which the resource stops and its sessions expire. Every operation on any of its sessions restarts the count.","example":3600,"type":"integer"}'
