  note: Added expires_at field to RL.ModelResources (next auto-stop time).
  paths:
    - path: components.schemas.RL.ModelResources.properties.expires_at
      before: 'null'
      after: '{"description":"The earliest time the resource can stop for inactivity, which also expires its sessions. It is the resource''s last activity plus `inactive_timeout` seconds. Becoming ready, a session start and every operation on any of its sessions count as activity, and the resource does not stop while an operation is running. An extend expiry call can move it later. It never moves earlier. Refreshed about once a minute. Set while the resource is ready.","example":"2026-01-02T01:00:05Z","format":"date-time","type":"string"}'
  date: '2026-10-28'
