- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added expires_at field to RL.ModelResources (optional date-time for inactivity stop/expiry).
  paths:
    - path: components/schemas/RL.ModelResources/properties/expires_at
      before: 'null'
      after: '{"description":"The earliest time the resource can stop for inactivity, which also expires its sessions. It is the resource''s last activity plus `inactive_timeout` seconds. Becoming ready, a session start and every operation on any of its sessions count as activity, and the resource does not stop while an operation is running. An extend expiry call can move it later. It never moves earlier. Refreshed about once a minute. Set while the resource is ready.","example":"2026-01-02T01:00:05Z","format":"date-time","type":"string"}'
  date: '2026-10-28'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1153
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added inactive_timeout field (seconds of inactivity before resource stops and sessions expire).
  paths:
    - path: components/schemas/RL.ModelResources/properties/inactive_timeout
      before: 'null'
      after: '{"description":"Seconds without activity after which the resource stops and its sessions expire. Every operation on any of its sessions restarts the count.","example":3600,"type":"integer"}'
  date: '2026-10-28'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/1153
