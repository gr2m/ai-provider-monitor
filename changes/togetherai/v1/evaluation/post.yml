  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Descriptions removed from various request schema fields (no structural impact).
  paths:
    - path: components/schemas/EvaluationTypedRequest/properties/type/description
      before: The type of evaluation to perform
      after: 'null'
    - path: components/schemas/EvaluationTypedRequest/properties/parameters/description
      before: Type-specific parameters for the evaluation
      after: 'null'
    - path: components/schemas/EvaluationClassifyParameters/properties/input_data_file_path/description
      before: Data file ID
      after: 'null'
    - path: components/schemas/EvaluationClassifyParameters/properties/labels/description
      before: List of possible classification labels
      after: 'null'
    - path: components/schemas/EvaluationClassifyParameters/properties/pass_labels/description
      before: List of labels that are considered passing
      after: 'null'
    - path: components/schemas/EvaluationScoreParameters/properties/max_score/description
      before: Maximum possible score
      after: 'null'
    - path: components/schemas/EvaluationCompareParameters/properties/disable_position_bias_correction/description
      before: |
        When false (default), the judge runs twice per sample: once with model A's response first (original order) and once with model B's response first (flipped order). The two verdicts are reconciled to cancel out position bias. When true, only the original-order pass is run, halving judge cost and latency at the expense of position-bias correction. The result file will not contain flipped-order judge fields when this is true.
      after: 'null'
    - path: components/schemas/EvaluationModelRequest/properties/model_source/description
      before: |
        Source of the model inference: - `serverless`: Together's shared serverless inference API. Default concurrency: 25 workers. - `dedicated`: A Together dedicated deployment endpoint. Default concurrency: 5 workers
          (minimum enforced even if num_workers is set lower). Authentication uses the requesting
          user's Together API token automatically.
        - `external`: An external inference API (e.g. OpenAI, Anthropic, Google, OpenRouter).
          Requires `external_api_token` and `external_base_url`. Default concurrency: 2 workers
          for first-party APIs (OpenAI, Anthropic, Google), 20 for proxy/aggregator endpoints.
      after: 'null'
    - path: components/schemas/EvaluationJudgeModelConfig/properties/model_source/description
      before: |
        Source of the judge model inference: - `serverless`: Together's shared serverless inference API. Default concurrency: 25 workers. - `dedicated`: A Together dedicated deployment endpoint. Default concurrency: 5 workers
          (minimum enforced even if num_workers is set lower).
        - `external`: An external inference API (e.g. OpenAI, Anthropic, Google, OpenRouter).
          Requires `external_api_token` and `external_base_url`. Default concurrency: 2 workers
          for first-party APIs, 20 for proxy/aggregator endpoints.
      after: 'null'
  date: '2026-11-24'
