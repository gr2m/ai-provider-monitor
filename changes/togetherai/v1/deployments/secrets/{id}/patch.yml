  note: Added ttl_seconds to UpdateSecretRequest to set/refresh secret TTL (1–14 days).
  paths:
    - path: $.components.schemas.UpdateSecretRequest.properties.ttl_seconds
      before: 'null'
      after: '{type: integer, minimum: 86400, maximum: 1209600, description: ''TTLSeconds sets a new lifetime and restarts the expiry from now, between 86400 (1 day) and 1209600 (14 days)''}'
  date: '2026-10-28'
