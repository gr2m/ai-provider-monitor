  note: Adds POST /v1/deployments/{id}/rollback to roll back a deployment to a specified previous revision (by number or UUID). Pods already on the target revision are retained; others are drained and restarted. Only the 50 most recent revisions are eligible; returns 404 if the target is not found or no longer retained. Returns the updated deployment on success.
