- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /v1/audio/transcriptions to transcribe audio to text using openai/whisper-large-v3. Accepts multipart form-data with file (binary <=80 MB or HTTPS URL <=1 GB), optional language (incl. auto), prompt, temperature, diarize (with min/max speakers), response_format (json or verbose_json), and timestamp granularity. Returns plain text or verbose JSON with segments, word timestamps, and optional speaker segments. Enforces 4-hour max duration; errors include audio_too_long, file_too_large, unsupported_format, invalid_params; 413 for oversize direct uploads.
