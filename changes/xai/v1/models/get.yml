- change: changed
  target: route
  breaking: false
  deprecated: false
  doc_only: true
  note: Route summary updated to mention pricing information.
  paths:
    - path: summary
      before: List all models available to the authenticating API key with minimalized information, including model names (ID), creation times, etc.
      after: List all models available to the authenticating API key, including model names (ID), creation times, and pricing.
  date: '2026-08-24'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added aliases field to Model objects.
  paths:
    - path: components.schemas.Model.properties.aliases
      before: 'null'
      after: '{"description":"Alias ID(s) of the model that user can use in a request''s model field.","items":{"type":"string"},"type":"array"}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Made aliases a required property of Model.
  paths:
    - path: components.schemas.Model.required
      before: '["id","created","object","owned_by"]'
      after: '["id","aliases","created","object","owned_by"]'
  date: '2026-08-24'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added pricing and context fields to Model (token prices, context length/threshold, image pricing, per-tier pricing).
  paths:
    - path: components.schemas.Model.properties.cached_prompt_text_token_price
      before: 'null'
      after: '{"description":"Price of a prompt text token (in USD cents per 100 million tokens) that was cached previously.","format":"int64","type":["integer","null"]}'
    - path: components.schemas.Model.properties.cached_prompt_text_token_price_long_context
      before: 'null'
      after: '{"description":"Price of the cached prompt text token for long context requests (USD cents per 100 million tokens).","format":"int64","type":["integer","null"]}'
    - path: components.schemas.Model.properties.completion_text_token_price
      before: 'null'
      after: '{"description":"Price of the completion text token in USD cents per 100 million tokens.","format":"int64","type":["integer","null"]}'
    - path: components.schemas.Model.properties.completion_text_token_price_long_context
      before: 'null'
      after: '{"description":"Price of the completion text token for long context requests (USD cents per 100 million tokens).","format":"int64","type":["integer","null"]}'
    - path: components.schemas.Model.properties.context_length
      before: 'null'
      after: '{"description":"The maximum context length supported by the model, in tokens.","format":"int64","type":["integer","null"]}'
    - path: components.schemas.Model.properties.image_price
      before: 'null'
      after: '{"description":"Price per image in USD cents (image generation models).\nThe default tier: medium quality at the default (1k) resolution. See\n`pricing` for the full quality/resolution matrix.","format":"int64","type":["integer","null"]}'
    - path: components.schemas.Model.properties.long_context_threshold
      before: 'null'
      after: '{"description":"Token count at or above which the long context prices apply.","format":"int64","type":["integer","null"]}'
    - path: components.schemas.Model.properties.pricing
      before: 'null'
      after: '{"description":"Per-image prices by (quality, resolution) tier (image generation\nmodels). Omitted when the model prices all qualities identically\n(see `image_price`).","items":{"$ref":"#/components/schemas/ImagePricingTier"},"type":"array"}'
    - path: components.schemas.Model.properties.prompt_image_token_price
      before: 'null'
      after: '{"description":"Price of the prompt image token in USD cents per 100 million tokens.","format":"int64","type":["integer","null"]}'
    - path: components.schemas.Model.properties.prompt_text_token_price
      before: 'null'
      after: '{"description":"Price of the prompt text token in USD cents per 100 million tokens.","format":"int64","type":["integer","null"]}'
    - path: components.schemas.Model.properties.prompt_text_token_price_long_context
      before: 'null'
      after: '{"description":"Price of the prompt text token for long context requests (USD cents per 100 million tokens).","format":"int64","type":["integer","null"]}'
  date: '2026-08-24'
- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduced ImagePricingTier schema used by Model.pricing.
  paths:
    - path: components.schemas.ImagePricingTier
      before: 'null'
      after: '{"description":"Per-image price for one (quality, resolution) tier of an image generation\nmodel.","properties":{"price_per_image":{"description":"Price per generated image, in 1/100,000,000ths of a USD cent.","format":"int64","type":"integer"},"quality":{"description":"Quality tier this price applies to: \"low\", \"medium\", or \"high\".\nMedium is the default quality a request serves at when it leaves\n`quality` unset.","type":"string"},"resolution":{"description":"Output resolution this price applies to: \"1k\" or \"2k\". 1k is the\ndefault when a request leaves `resolution` unset.","type":"string"}},"required":["quality","resolution","price_per_image"],"type":"object"}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated Model description to reflect OpenAI-compatibility and pricing fields.
  paths:
    - path: components.schemas.Model.description
      before: Same as `LanguageModel` but fully compliant with the OpenAI API.
      after: OpenAI-compatible model response returned by `/v1/models`.\nIncludes optional pricing fields populated based on the model type.
  date: '2026-08-24'
