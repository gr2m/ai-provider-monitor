- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/videos/extensions to asynchronously extend an input MP4 video by generating continuation content based on a prompt; returns a request_id for polling. Supports optional duration (1–10s, default 6), optional model and output destination, and requires a video URL (2–30s).
  paths: []
  date: '2026-03-23'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/819
- change: removed
  target: route
  breaking: true
  deprecated: false
  doc_only: false
  note: Removed POST /v1/videos/extensions, an async endpoint to extend a video by generating continuation content from a provided input video and prompt, returning a request_id for polling.
  paths: []
  date: '2026-03-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/820
- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Adds POST /v1/videos/extensions to extend an input MP4 by generating continuation content; asynchronous, returns request_id for polling. Accepts prompt, video URL, optional duration/model/output.
  paths: []
  date: '2026-03-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/822
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: true
  note: Duration minimum increased from 1s to 2s (description update).
  paths:
    - path: components.schemas.ExtendVideoRequest.properties.duration.description
      before: |-
        Duration of the extension segment to generate in seconds (1-10).
        Defaults to 6 seconds if not specified.
      after: |-
        Duration of the extension segment to generate in seconds (2-10).
        Defaults to 6 seconds if not specified.
  date: '2026-08-24'
- change: changed
  target: request
  breaking: true
  deprecated: false
  doc_only: true
  note: Maximum allowed input video length reduced from 30s to 15s (description).
  paths:
    - path: components.schemas.ExtendVideoRequest.properties.video.description
      before: |-
        Input video to extend. The extension continues from the end of this video.
        Input video must be between 2 and 30 seconds long.
      after: |-
        Input video to extend. The extension continues from the end of this video.
        Input video must be between 2 and 15 seconds long.
  date: '2026-08-24'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added optional storage_options to store output in Files API and configure public URL/TTL.
  paths:
    - path: components.schemas.ExtendVideoRequest.properties.storage_options
      before: 'null'
      after: 'oneOf [null, $ref: #/components/schemas/StorageOptions]'
    - path: components.schemas.StorageOptions
      before: 'null'
      after: Schema added
    - path: components.schemas.PublicUrlInput
      before: 'null'
      after: Schema added
    - path: components.schemas.PublicUrlOptions
      before: 'null'
      after: Schema added
  date: '2026-08-24'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Video input now accepts a file_id from the Files API in addition to URL.
  paths:
    - path: components.schemas.VideoUrl.properties.file_id
      before: 'null'
      after: 'type: [string, null]'
  date: '2026-08-24'
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: In VideoUrl, url is no longer required; either url or file_id may be provided.
  paths:
    - path: components.schemas.VideoUrl.required
      before: '["url"]'
      after: 'null'
