  note: Changed default top_p from 1 to 0.95 and updated description to note Grok default and clipping above default.
  paths:
    - path: components/schemas/MessageRequest/properties/top_p/default
      before: '1'
      after: '0.95'
    - path: components/schemas/MessageRequest/properties/top_p/description
      before: An alternative to sampling with `temperature`, called nucleus sampling, where the model considers the results of the tokens with `top_p` probability mass. So 0.1 means only the tokens comprising the top 10% probability mass are considered. It is generally recommended to alter this or `temperature` but not both.
      after: An alternative to sampling with `temperature`, called nucleus sampling, where the model considers the results of the tokens with `top_p` probability mass. So 0.1 means only the tokens comprising the top 10% probability mass are considered. It is generally recommended to alter this or `temperature` but not both. Values above the model's default top_p, 0.95 for Grok models, are sampled at that default.
  date: '2026-10-21'
- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated temperature description to clarify values above 1 are sampled at 1.
  paths:
    - path: components/schemas/MessageRequest/properties/temperature/description
      before: What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic. It may not work well with reasoning models.
      after: What sampling temperature to use, between 0 and 2. Values above 1 are sampled at 1. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic. It may not work well with reasoning models.
  date: '2026-10-21'
