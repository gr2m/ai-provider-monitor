- change: changed
  target: request
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description for logprobs to note it is ignored by models grok-4.20 and newer.
  paths:
    - path: components.schemas.SampleRequest.properties.logprobs.description
      before: Include the log probabilities on the `logprobs` most likely output tokens, as well the chosen tokens. For example, if `logprobs` is 5, the API will return a list of the 5 most likely tokens. The API will always return the logprob of the sampled token, so there may be up to `logprobs+1` elements in the response.
      after: Include the log probabilities on the `logprobs` most likely output tokens, as well the chosen tokens. For example, if `logprobs` is 5, the API will return a list of the 5 most likely tokens. The API will always return the logprob of the sampled token, so there may be up to `logprobs+1` elements in the response. Not supported by models `grok-4.20` and newer; the field will be silently ignored if set.
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/929
