      after: '["id","fingerprint","created","object","owned_by","version","input_modalities","output_modalities","prompt_text_token_price","cached_prompt_text_token_price","prompt_image_token_price","completion_text_token_price","search_price","prompt_text_token_price_long_context","cached_prompt_text_token_price_long_context","completion_text_token_price_long_context","long_context_threshold","aliases"]'
