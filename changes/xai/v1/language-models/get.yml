- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added long-context pricing and threshold fields to LanguageModel.
  paths:
    - path: /components/schemas/LanguageModel/properties/cached_prompt_text_token_price_long_context
      before: 'null'
      after: '{"type":"integer","format":"int64","description":"Price of the cached prompt text token for long context requests (USD cents per 100 million tokens). When 0, falls back to cached_prompt_text_token_price."}'
    - path: /components/schemas/LanguageModel/properties/completion_text_token_price_long_context
      before: 'null'
      after: '{"type":"integer","format":"int64","description":"Price of the completion text token for long context requests (USD cents per 100 million tokens). When 0, the standard completion_text_token_price applies."}'
    - path: /components/schemas/LanguageModel/properties/prompt_text_token_price_long_context
      before: 'null'
      after: '{"type":"integer","format":"int64","description":"Price of the prompt text token for long context requests (USD cents per 100 million tokens). When 0, the standard prompt_text_token_price applies at all context lengths."}'
    - path: /components/schemas/LanguageModel/properties/long_context_threshold
      before: 'null'
      after: '{"type":"integer","format":"int64","description":"Token count at or above which the long context prices apply. When 0, the model has no long context pricing tier."}'
  date: '2026-08-24'
