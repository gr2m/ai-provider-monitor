- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces GET /v1/video-generation-models/{model_id} to retrieve full details for a video generation model by ID (aliases, timestamps, fingerprint, input/output modalities, ownership, version). Requires bearer auth; returns 200 with model object, 400 for bad request, 404 if not found.
  paths: []
  date: '2026-02-20'
  diff_url: https://github.com/gr2m/ai-provider-api-changes/pull/571
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description of input_modalities to mention possible 'audio' modality for reference audio.
  paths:
    - path: components/schemas/VideoGenerationModel/properties/input_modalities/description
      before: The input modalities supported by the model (e.g. "text", "image").
      after: |-
        The input modalities supported by the model (e.g. "text", "image";
        "audio" for models accepting reference audio).
  date: '2026-08-24'
