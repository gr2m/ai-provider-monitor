- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added pricing tiers for image models via new optional `pricing` array on ImageGenerationModel.
  paths:
    - path: components.schemas.ImageGenerationModel.properties.pricing
      before: 'null'
      after: '{"description":"Per-image prices by (quality, resolution) tier. One entry per combination the model serves; omitted when the model prices all qualities identically (see `image_price`).","items":{"$ref":"#/components/schemas/ImagePricingTier"},"type":"array"}'
    - path: components.schemas.ImagePricingTier
      before: 'null'
      after: '{"description":"Per-image price for one (quality, resolution) tier of an image generation model.","properties":{"price_per_image":{"description":"Price per generated image, in 1/100,000,000ths of a USD cent.","format":"int64","type":"integer"},"quality":{"description":"Quality tier this price applies to: \"low\", \"medium\", or \"high\". Medium is the default quality a request serves at when it leaves `quality` unset.","type":"string"},"resolution":{"description":"Output resolution this price applies to: \"1k\" or \"2k\". 1k is the default when a request leaves `resolution` unset.","type":"string"}},"required":["quality","resolution","price_per_image"],"type":"object"}'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated description of image_price to clarify default tier and link to pricing matrix.
  paths:
    - path: components.schemas.ImageGenerationModel.properties.image_price.description
      before: Price of a single image in USD cents.
      after: 'Price of a single image in USD cents. The default tier: medium quality at the default (1k) resolution. See `pricing` for the full quality/resolution matrix.'
  date: '2026-08-24'
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Summary text updated (removed mention of pricing in the examples/summary).
  paths:
    - path: summary
      before: List all image generation models available to the authenticating API key with full information. Additional information compared to /v1/models includes modalities, pricing, fingerprint and alias(es).
      after: List all image generation models available to the authenticating API key with full information. Additional information compared to /v1/models includes modalities, fingerprint and alias(es).
  date: '2026-08-24'
