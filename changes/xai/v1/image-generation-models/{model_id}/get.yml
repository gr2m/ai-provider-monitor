- change: added
  target: response
  breaking: false
  deprecated: false
  doc_only: false
  note: Added pricing property to ImageGenerationModel and the ImagePricingTier schema for per-quality/resolution image pricing.
  paths:
    - path: components.schemas.ImageGenerationModel.properties.pricing
      before: 'null'
      after: '{"description":"Per-image prices by (quality, resolution) tier. One entry per\ncombination the model serves; omitted when the model prices all\nqualities identically (see `image_price`).","items":{"$ref":"#/components/schemas/ImagePricingTier"},"type":"array"}'
    - path: components.schemas.ImagePricingTier
      before: 'null'
      after: '{"description":"Per-image price for one (quality, resolution) tier of an image generation\nmodel.","properties":{"price_per_image":{"description":"Price per generated image, in 1/100,000,000ths of a USD cent.","format":"int64","type":"integer"},"quality":{"description":"Quality tier this price applies to: \"low\", \"medium\", or \"high\".\nMedium is the default quality a request serves at when it leaves\n\"quality\" unset.","type":"string"},"resolution":{"description":"Output resolution this price applies to: \"1k\" or \"2k\". 1k is the\ndefault when a request leaves \"resolution\" unset.","type":"string"}},"required":["quality","resolution","price_per_image"],"type":"object"}'
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/929
- change: changed
  target: response
  breaking: false
  deprecated: false
  doc_only: true
  note: Updated image_price description to clarify default tier (medium, 1k) and reference pricing matrix.
  paths:
    - path: components.schemas.ImageGenerationModel.properties.image_price.description
      before: Price of a single image in USD cents.
      after: 'Price of a single image in USD cents.\nThe default tier: medium quality at the default (1k) resolution. See\n`pricing` for the full quality/resolution matrix.'
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/929
