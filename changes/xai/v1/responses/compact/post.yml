- change: added
  target: route
  breaking: false
  deprecated: false
  doc_only: false
  note: Introduces POST /v1/responses/compact, which summarizes and compacts a full Responses input window (stripping tool-result noise) into a single encrypted compaction item to be used verbatim as the next /v1/responses input (plus the new user turn).
  paths: []
  date: '2026-08-24'
  diff_url: https://github.com/gr2m/ai-provider-monitor/pull/929
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: Added new ToolSearchCall and ToolSearchOutput schemas to support server-side tool search.
  paths:
    - path: components/schemas/ToolSearchCall
      before: 'null'
      after: object (server-side tool search call schema)
    - path: components/schemas/ToolSearchOutput
      before: 'null'
      after: object (tool search output schema)
  date: '2026-08-25'
- change: added
  target: request
  breaking: false
  deprecated: false
  doc_only: false
  note: ModelOutput union extended to accept ToolSearchCall and ToolSearchOutput in request inputs.
