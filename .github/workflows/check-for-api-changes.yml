name: Check for API Changes

on:
  # Run every hour
  schedule:
    - cron: "0 * * * *"
  # Allow manual triggering
  workflow_dispatch:
  # Run when the workflow file is changed
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-for-api-changes.yml"
      - "scripts/check-for-changes.js"
      - "scripts/lib/**"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: check-for-api-changes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source:
          - name: anthropic
            openapi_url: "https://raw.githubusercontent.com/anthropics/anthropic-sdk-typescript/main/.stats.yml"
            openapi_url_property: openapi_spec_url
            filename: "openapi.json"
          - name: cohere
            openapi_url: "https://raw.githubusercontent.com/cohere-ai/cohere-developer-experience/main/cohere-openapi.yaml"
            filename: openapi.yml
          - name: groq
            openapi_url: "https://api.groq.com/openapi"
            filename: openapi.json
          - name: mistral
            openapi_url: "https://raw.githubusercontent.com/mistralai/platform-docs-public/main/openapi.yaml"
            filename: openapi.yml
          - name: openai
            openapi_url: "https://app.stainless.com/api/spec/documented/openai/openapi.documented.yml"
            filename: openapi.yml
          - name: togetherai
            openapi_url: "https://docs.together.ai/openapi.yaml"
            filename: openapi.yml
          - name: xai
            openapi_url: "https://api.x.ai/api-docs/openapi.json"
            filename: openapi.json
          # failes due to non-existing reference "#/components/schemas/MediaResolution"
          # - name: google
          #   openapi_url: "https://generativelanguage.googleapis.com/$discovery/OPENAPI3_0?version=v1beta"
          #   filename: openapi.json
          - name: replicate
            openapi_url: "https://api.replicate.com/openapi.json"
            filename: openapi.json
          - name: black-forest-labs
            openapi_url: "https://api.bfl.ai/openapi.json"
            filename: openapi.json
          - name: luma
            openapi_url: "https://raw.githubusercontent.com/lumalabs/lumaai-api/main/openapi.yaml"
            filename: openapi.yml
          - name: fal
            openapi_url: "https://api.fal.ai/v1/openapi.json"
            filename: openapi.json
          - name: deepgram
            openapi_url: "https://raw.githubusercontent.com/deepgram/deepgram-api-specs/main/openapi.yml"
            filename: openapi.yml
          # disabled due to circular reference in the spec
          # - name: elevenlabs
          #   openapi_url: "https://api.elevenlabs.io/openapi.json"
          #   filename: openapi.json
          - name: gladia
            openapi_url: "https://api.gladia.io/openapi.json"
            filename: openapi.json
          - name: zai
            openapi_url: "https://docs.z.ai/openapi.json"
            filename: openapi.json
          # DeepSeek does not publish the OpenAPI source used to generate its docs.
          # Jentic maintains the only publicly available specification.
          - name: deepseek
            openapi_url: "https://raw.githubusercontent.com/jentic/jentic-public-apis/main/apis/openapi/deepseek.com/main/1.0.0/openapi.json"
            filename: openapi.json
          - name: moonshotai
            openapi_url: "https://platform.kimi.ai/docs/openapi.json"
            filename: openapi.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install yq
        run: |
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            --output "$RUNNER_TEMP/yq" \
            "https://github.com/mikefarah/yq/releases/download/v4.47.1/yq_linux_amd64"
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for changes
        id: check
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          SOURCE_NAME: ${{ matrix.source.name }}
          OPENAPI_URL: ${{ matrix.source.openapi_url }}
          OPENAPI_URL_PROPERTY: ${{ matrix.source.openapi_url_property }}
          FILENAME: ${{ matrix.source.filename }}
        run: |
          node scripts/check-for-changes.js "$SOURCE_NAME" "$OPENAPI_URL" "$FILENAME" "$OPENAPI_URL_PROPERTY" > result.json
          cat result.json

          echo "has_changes=$(jq -r '.has_changes' result.json)" >> $GITHUB_OUTPUT
          echo "first_run=$(jq -r '.first_run' result.json)" >> $GITHUB_OUTPUT
          echo "title=$(jq -r '.title' result.json)" >> $GITHUB_OUTPUT
          echo "changed_routes=$(jq -c '.changed_routes' result.json)" >> $GITHUB_OUTPUT

          echo "body<<EOF" >> $GITHUB_OUTPUT
          jq -r '.body' result.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # First run: create PR with the initial spec
      - name: Create initial PR
        if: steps.check.outputs.first_run == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          title: "feat: add initial ${{ matrix.source.name }} API specification"
          body: |
            The initial ${{ matrix.source.name }} API specification file for monitoring changes.

            This repository will now track changes to the ${{ matrix.source.name }} API specification and create automated pull requests when changes are detected.
          branch: update/${{ matrix.source.name }}
          delete-branch: true
          labels: |
            provider:${{ matrix.source.name }}
          commit-message: "feat: add initial ${{ matrix.source.name }} API specification"

      # Changes detected: create update PR
      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update ${{ matrix.source.name }} API specification"
          title: ${{ steps.check.outputs.title }}
          body: ${{ steps.check.outputs.body }}
          branch: update/${{ matrix.source.name }}
          delete-branch: true
          labels: |
            provider:${{ matrix.source.name }}
          assignees: ${{ github.repository_owner }}

      # Add diff_url to change records before merging
      - name: Add diff_url to change records
        if: steps.create-pr.outputs.pull-request-url != ''
        env:
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          SOURCE_NAME: ${{ matrix.source.name }}
          REPO: ${{ github.repository }}
        run: |
          git fetch origin "update/${SOURCE_NAME}"
          git checkout "update/${SOURCE_NAME}"
          node scripts/add-diff-url-to-changes.js "${SOURCE_NAME}" "${PR_NUMBER}" "${REPO}"
          if git diff --quiet; then
            echo "No diff_url changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "changes/${SOURCE_NAME}/"
            git commit -m "Add diff_url to change records"
            git push origin "update/${SOURCE_NAME}"
          fi

      - name: Merge the pull request
        if: steps.create-pr.outputs.pull-request-url != ''
        run: |
          for attempt in {1..12}; do
            read -r state mergeable <<< "$(gh pr view ${{ steps.create-pr.outputs.pull-request-number }} --repo ${{ github.repository }} --json state,mergeable --jq '[.state, .mergeable] | @tsv')"

            if [ "$state" = "MERGED" ]; then
              exit 0
            fi

            if [ "$mergeable" = "MERGEABLE" ]; then
              if gh pr merge ${{ steps.create-pr.outputs.pull-request-number }} --squash --delete-branch --repo ${{ github.repository }}; then
                exit 0
              fi

              echo "Merge raced with a base-branch update; refreshing mergeability"
            fi

            if [ "$mergeable" = "CONFLICTING" ]; then
              echo "Pull request has merge conflicts"
              exit 1
            fi

            echo "Mergeability is $mergeable; retrying in 5 seconds (attempt $attempt/12)"
            sleep 5
          done

          echo "Timed out waiting to merge the pull request"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Send notifications
        if: steps.create-pr.outputs.pull-request-url != ''
        # Provider monitoring succeeded once the update PR was merged. Keep a
        # stale notification-app credential from turning that into a failed job.
        continue-on-error: true
        env:
          APP_ID: ${{ vars.RELEASE_NOTIFIER_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_NOTIFIER_PRIVATE_KEY }}
          SOURCE_NAME: ${{ matrix.source.name }}
          CHANGED_ROUTES: ${{ steps.check.outputs.changed_routes }}
        run: |
          node scripts/send-notifications.js "$SOURCE_NAME" "$CHANGED_ROUTES"

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.first_run }}" = "true" ]; then
            echo "✅ First run completed - ${{ matrix.source.name }} API specification saved"
          elif [ "${{ steps.check.outputs.has_changes }}" = "true" ]; then
            echo "🔄 Changes detected in ${{ matrix.source.name }}"
          else
            echo "✅ No changes detected - ${{ matrix.source.name }} is up to date"
          fi
